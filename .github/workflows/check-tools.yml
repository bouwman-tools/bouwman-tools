name: Controleer tools.json

# tools.json is de enige bron van waarheid voor de toolportefeuille. Deze controle
# faalt zodra portal.html, beheer.html of access-beheer-worker.js daarvan afwijken,
# of zodra er een HTML-bestand gepubliceerd staat dat nergens is vastgelegd.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Maandelijkse bewaking: ook zonder pushes wordt zichtbaar wanneer jaarwaarden
    # verouderen (waarschuwing als annotatie, rode run zodra een controle meer dan
    # een jaar oud is). Let op: GitHub schakelt schedules uit na 60 dagen zonder
    # repo-activiteit; de eerstvolgende push zet ze weer aan.
    - cron: '0 6 1 * *'

jobs:
  test-admin-buitencontrole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetische regressies van de buitencontrole
        run: python -B -m unittest discover -s tests -p 'test_admin_routes.py' -v

  admin-buitencontrole:
    # Test productie alleen vanaf master. Een PR/voorbereidingsbranch kan code
    # bevatten die nog niet is uitgerold; die krijgt uitsluitend de mocktests.
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Onaangemelde adminroutes van buiten controleren
        run: python -B tools/check_admin_routes.py

  controleer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Zonder jsonschema slaat check_tools.py de schemavalidatie stil over, en
      # blijft een tool met een ontbrekend verplicht veld in CI onopgemerkt.
      - name: jsonschema installeren
        run: python -m pip install --quiet jsonschema

      - name: Registerschema en wettelijke verwijzingen testen
        run: python -B -m unittest discover -s tools -p "test_*.py"

      - name: Drift tussen tools.json en portal/beheer/worker
        run: python tools/check_tools.py

      - name: TOOLS.md is bijgewerkt
        run: |
          python tools/check_tools.py --schrijf-tools-md
          if ! git diff --quiet -- TOOLS.md; then
            echo "::error::TOOLS.md loopt achter op tools.json."
            echo "Draai lokaal: python tools/check_tools.py --schrijf-tools-md"
            git --no-pager diff -- TOOLS.md
            exit 1
          fi
          echo "TOOLS.md komt overeen met tools.json."
