:\n    return Balance(\n        amount=abs(running),\n        credit_debit=(\n            CreditDebitIndicator.CREDIT if running >= 0\n            else CreditDebitIndicator.DEBIT\n        ),\n        date=bal_date,\n        balance_type=btype,\n        currency=currency,\n    )\n\n\ndef _format_balance_tag(tag: str, bal: Balance) -> str:\n    return (\n        f\":{tag}:{_cd(bal.credit_debit)}\"\n        f\"{format_mt940_date(bal.date)}\"\n        f\"{bal.currency}\"\n        f\"{format_mt940_amount(bal.amount)}\"\n    )\n\n\ndef _pdf_type_code(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return the original 2-char PDF type code, or '?' if unavailable.\"\"\"\n    return (txn.transaction_codes.source_raw_code or \"?\").lower()\n\n\ndef _format_61(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return the :61: tag including the second line (counterparty account).\n\n    The 3-char bank code is always '000' for PDF-derived exports because the\n    exact Rabobank MT940 code cannot be reliably derived from the PDF type code.\n    See module-level documentation for the full mapping analysis.\n    \"\"\"\n    v_date = txn.value_date or txn.booking_date\n    b_date = txn.booking_date\n\n    val_str = format_mt940_date(v_date) if v_date else \"000101\"\n\n    # Include MMDD entry date when booking_date differs from value_date\n    entry_str = \"\"\n    if b_date and v_date and b_date != v_date:\n        entry_str = b_date.strftime(\"%m%d\")\n\n    dc = _cd(txn.debit_credit)\n    amount_str = format_mt940_amount(txn.amount)\n\n    # No EREF/MARF available from PDF \u2192 always NONREF\n    first_line = f\"{val_str}{entry_str}{dc}{amount_str}N{_MT940_GENERIC_CODE}NONREF\"\n    second_line = txn.counterparty_iban or \"9000000001\"\n    return f\":61:{first_line}\\n{second_line}\"\n\n\ndef _format_86(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return the :86: tag (multi-line if needed, max 65 chars/line).\n\n    /TRCD/ carries the original 2-char PDF type code (e.g. 'db', 'bg') rather\n    than a synthetic Rabobank 3-digit code.  This is transparent and round-trip\n    safe; see module-level documentation for why exact codes cannot be derived.\n    \"\"\"\n    pdf_code = _pdf_type_code(txn)\n    party_key = (\n        \"BENM\" if txn.debit_credit == CreditDebitIndicator.DEBIT else \"ORDP\"\n    )\n\n    name = txn.counterparty_name or \"\"\n    name, _ = sanitize_swift_x(name)\n\n    parts = [f\"/TRCD/{pdf_code}\", f\"/{party_key}//NAME/{name}\"]\n\n    if txn.description:\n        desc, _ = sanitize_swift_x(txn.description)\n        parts.append(f\"/REMI/{desc}\")\n\n    if txn.booking_date:\n        parts.append(f\"/ISDT/{txn.booking_date.isoformat()}\")\n\n    text = \"\".join(parts)\n    lines = split_into_lines(text, 65)\n    return \":86:\" + \"\\n\".join(lines)\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef write(stmt: BankBridgeStatement) -> str:\n    \"\"\"Generate a Rabobank-compatible MT940 string from a BankBridgeStatement.\n\n    Returns the complete file content (LF line endings, trailing newline).\n\n    Expected differences from an original Rabobank MT940 file\n    ----------------------------------------------------------\n    The following fields are absent because the PDF source does not carry them:\n\n    - ``/EREF/`` in :86: \u2014 end-to-end reference\n    - ``/MARF/`` in :86: \u2014 mandate reference\n    - ``/PREF/`` in :86: \u2014 payment reference\n    - Bank reference after ``//`` in :61: \u2014 Rabobank internal ref\n    - Description text uses PDF visual layout (no 35-char column padding)\n    - No :64:/:65: forward-balance lines\n\n    The following fields are approximated:\n\n    - ``/TRCD/`` \u2014 mapped from Rabobank PDF 2-char code to the most likely\n      3-digit MT940 code; exact codes are only in the original MT940\n    - ``:28C:`` \u2014 generated as YY+sequential-block-number, not the original\n      Rabobank sequential number\n\n    These gaps are structural (not parser bugs).  The generated MT940 contains\n    the same transactions with the same amounts, dates, IBANs, and directions.\n    \"\"\"\n    # Group transactions by booking_date (fallback: period_start or epoch)\n    by_date: dict[date, list[BankBridgeTransaction]] = defaultdict(list)\n    for txn in stmt.transactions:\n        key = txn.booking_date or stmt.period_start or date(2000, 1, 1)\n        by_date[key].append(txn)\n\n    sorted_dates = sorted(by_date.keys())\n    currency = stmt.currency or \"EUR\"\n\n    # Running signed balance (positive = CREDIT, negative = DEBIT)\n    # :60F: of the first block is the previous statement's closing balance and\n    # must be dated before that block's entries \u2014 see mt940_opening_balance_date().\n    first_entry_date = sorted_dates[0] if sorted_dates else None\n    if stmt.opening_balance:\n        running = stmt.opening_balance.signed_value()\n        prev_date = mt940_opening_balance_date(stmt.opening_balance.date, first_entry_date)\n    else:\n        running = Decimal(\"0\")\n        prev_date = mt940_opening_balance_date(\n            first_entry_date or date(2000, 1, 1), first_entry_date\n        )\n\n    year_prefix = (stmt.period_start.strftime(\"%y\") if stmt.period_start else \"00\")\n\n    output_lines: list[str] = [\":940:\"]\n\n    for seq, day in enumerate(sorted_dates, start=1):\n        txns = by_date[day]\n\n        # Opening balance: amount and direction from running total, date = prev_date\n        open_bal = _make_balance(running, prev_date, currency, BalanceType.OPENING_BOOKED)\n\n        # Apply this day's transactions to get closing balance\n        for txn in txns:\n            running += _signed(txn.amount, txn.debit_credit)\n\n        close_bal = _make_balance(running, day, currency, BalanceType.CLOSING_BOOKED)\n        prev_date = day\n\n        # Emit block\n        output_lines.append(f\":20:940S{format_mt940_date(day)}\")\n        output_lines.append(f\":25:{stmt.iban or 'UNKNOWN'} {currency}\")\n        output_lines.append(f\":28C:{year_prefix}{seq:03d}\")\n        output_lines.append(_format_balance_tag(\"60F\", open_bal))\n        for txn in txns:\n            output_lines.append(_format_61(txn))\n            output_lines.append(_format_86(txn))\n        output_lines.append(_format_balance_tag(\"62F\", close_bal))\n\n    return \"\\n\".join(output_lines) + \"\\n\"\n", "bankbridge/exporters/remittance.py": "\"\"\"Human-readable remittance text for exports.\n\nWhy this exists\n---------------\nMT940 packs everything a user needs to recognise a booking into one free-text\n``:86:`` blob: counterparty name, references and description all end up in the\nsame visible field.  CAMT.053 splits that same information over separate\nstructured elements (``RltdPties``, ``Refs``, ``RmtInf``), and accounting\nsoftware shows only ``RmtInf/Ustrd`` as *the* description of a booking.\n\nThe result is that a booking whose recognisable text lives in the counterparty\nname \u2014 a card payment such as \"Firezone Woudenberg WOUDENBERG\", which has no\nseparate remittance line at all \u2014 is perfectly readable in MT940 and empty in\nCAMT.053.  This module builds the human presentation of the remittance so both\nexports give the user something to recognise.\n\nDesign rules\n------------\n- Source-faithful: only canonical values that are actually present are used;\n  nothing is invented, no placeholder or sentinel text is emitted.\n- The structured fields stay authoritative.  This text is an *additional*\n  presentation, never a replacement: the writer keeps writing ``Refs``,\n  ``RltdPties`` and ``RltdAgts`` exactly as before.\n- Names before identifiers: counterparty name, description and ultimate party\n  are what a user recognises.\n- Deterministic de-duplication (plain containment on normalised text, no\n  fuzzy matching), so a name that already appears in the description is not\n  repeated.\n- Technical references are a fallback only.  They are already exported in\n  their own structured elements, and a dump of every identifier makes the\n  description harder to read, not easier.  BankBridge's own audit ids\n  (conversion_id, transaction_id) are never used.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Optional\n\n# CAMT.053 RmtInf/Ustrd is Max140Text; longer text is split over several\n# Ustrd occurrences (the element repeats) rather than being truncated.\nMAX_USTRD_LENGTH = 140\n\n# Values that carry no information for a reader.  Compared case-insensitively.\n_SENTINELS = frozenset({\n    \"notprovided\",\n    \"nonref\",\n    \"notavailable\",\n    \"unknown\",\n    \"none\",\n})\n\n\ndef _clean(value: Optional[str]) -> Optional[str]:\n    \"\"\"Collapse whitespace; return None for empty or sentinel values.\"\"\"\n    if not value:\n        return None\n    collapsed = \" \".join(str(value).split())\n    if not collapsed or collapsed.casefold() in _SENTINELS:\n        return None\n    return collapsed\n\n\ndef _normalise(value: str) -> str:\n    \"\"\"Comparison form: single spaces, case-insensitive.\"\"\"\n    return \" \".join(value.split()).casefold()\n\n\ndef build_remittance_text(txn) -> Optional[str]:\n    \"\"\"Return a readable one-line remittance text for *txn*, or None.\n\n    Parts are added in reading order \u2014 counterparty name, description, then the\n    ultimate party \u2014 and each part is skipped when its text is already covered\n    by a part that was added earlier.  A part that *contains* an earlier part\n    replaces it, so the longest form of a repeated text survives exactly once.\n\n    When neither name nor description is available, the transaction's\n    references are used so the entry is not left without any description at\n    all.  With a name or description present the references are omitted: they\n    are exported in their own structured elements.\n\n    >>> class T:\n    ...     counterparty_name = \"Hr SGH van Donselaar\"\n    ...     description = \"factuurnummer Factuurnr. 900000004\"\n    ...     payment_reference = end_to_end_id = None\n    ...     mandate_reference = creditor_id = None\n    >>> build_remittance_text(T())\n    'Hr SGH van Donselaar factuurnummer Factuurnr. 900000004'\n    \"\"\"\n    parts: list[str] = []\n\n    def add(value: Optional[str]) -> None:\n        cleaned = _clean(value)\n        if cleaned is None:\n            return\n        normalised = _normalise(cleaned)\n        # Already covered by something we kept.\n        if any(normalised in _normalise(part) for part in parts):\n            return\n        # Richer than what we kept: supersede the shorter form(s).\n        parts[:] = [p for p in parts if _normalise(p) not in normalised]\n        parts.append(cleaned)\n\n    add(getattr(txn, \"counterparty_name\", None))\n    add(getattr(txn, \"description\", None))\n    # The ultimate party is the actual counterparty behind a collecting party\n    # (e.g. \"Onesti B.V.\" behind a payment service provider).  It is a name a\n    # user recognises, not a technical identifier, and MT940 shows it in :86:\n    # as /ULTC/ \u2014 so it belongs in the readable text as well.  It also stays\n    # in RltdPties/UltmtCdtr|UltmtDbtr.\n    add(getattr(txn, \"ultimate_creditor_name\", None))\n    add(getattr(txn, \"ultimate_debtor_name\", None))\n\n    if not parts:\n        # Fallback: without name or description, a reference is all the user has.\n        add(getattr(txn, \"payment_reference\", None))\n        add(getattr(txn, \"end_to_end_id\", None))\n        add(getattr(txn, \"mandate_reference\", None))\n        add(getattr(txn, \"creditor_id\", None))\n\n    if not parts:\n        return None\n    return \" \".join(parts)\n\n\ndef split_remittance_text(\n    text: str,\n    max_length: int = MAX_USTRD_LENGTH,\n) -> list[str]:\n    \"\"\"Split *text* into chunks of at most *max_length* characters.\n\n    Splits on word boundaries where possible so each chunk stays readable; a\n    single word longer than *max_length* is split at the limit.  Nothing is\n    dropped \u2014 the chunks rejoined with a space give back the original text \u2014\n    so a long remittance is exported as repeated ``Ustrd`` elements instead of\n    being silently truncated.\n    \"\"\"\n    if max_length \u003c 1:\n        raise ValueError(f\"max_length must be >= 1, got {max_length}\")\n\n    text = \" \".join(text.split())\n    if not text:\n        return []\n\n    chunks: list[str] = []\n    remainder = text\n    while len(remainder) > max_length:\n        cut = remainder.rfind(\" \", 0, max_length + 1)\n        if cut \u003c= 0:\n            cut = max_length            # single oversized word\n            chunks.append(remainder[:cut])\n            remainder = remainder[cut:].lstrip()\n        else:\n            chunks.append(remainder[:cut])\n            remainder = remainder[cut + 1:]\n    if remainder:\n        chunks.append(remainder)\n    return chunks\n", "bankbridge/extractors/__init__.py": "", "bankbridge/extractors/pdf/__init__.py": "", "bankbridge/extractors/pdf/pdfminer_extractor.py": "\"\"\"Digital PDF extraction with pdfminer.six; no rendering/native dependency.\n\nWords use the existing 3 point horizontal/vertical tolerance. Financial meaning\nbelongs to the bank parsers; this layer only groups positioned glyphs.\n\"\"\"\nfrom __future__ import annotations\n\nimport hashlib\nfrom itertools import groupby\nfrom pathlib import Path\n\nfrom pdfminer.converter import PDFPageAggregator\nfrom pdfminer.layout import LTChar, LTContainer\nfrom pdfminer.pdfinterp import PDFPageInterpreter, PDFResourceManager\nfrom pdfminer.pdfpage import PDFPage\n\nfrom bankbridge.extractors.raw_document import RawDocument, RawPage, RawTextElement\nfrom bankbridge.models.enums import ExtractionMethod\n\n_LIGATURES = str.maketrans({\"\ufb00\": \"ff\", \"\ufb01\": \"fi\", \"\ufb02\": \"fl\", \"\ufb03\": \"ffi\",\n                           \"\ufb04\": \"ffl\", \"\ufb05\": \"st\", \"\ufb06\": \"st\"})\n\n\ndef _chars(item):\n    if isinstance(item, LTChar):\n        yield item\n    elif isinstance(item, LTContainer):\n        for child in item:\n            yield from _chars(child)\n\n\ndef _words(chars, page_number, tolerance=3):\n    \"\"\"Group glyphs in geometric reading order, retaining bottom-left bounds.\"\"\"\n    # Preserve consecutive orientation runs before grouping lines. Rotated text\n    # follows top-to-bottom within columns, normal text left-to-right in rows.\n    for upright, run in groupby(chars, key=lambda c: c.upright):\n        key = (lambda c: -c.y1) if upright else (lambda c: c.x0)\n        ordered = sorted(run, key=key)\n        lines = []\n        for char in ordered:\n            if not lines or key(char) > key(lines[-1][-1]) + tolerance:\n                lines.append([])\n            lines[-1].append(char)\n        for line in lines:\n            line.sort(key=(lambda c: c.x0) if upright else (lambda c: -c.y1))\n            word = []\n\n            def emit():\n                return RawTextElement(\n                    text=\"\".join(c.get_text() for c in word).translate(_LIGATURES),\n                    page=page_number, x0=min(c.x0 for c in word),\n                    y0=min(c.y0 for c in word), x1=max(c.x1 for c in word),\n                    y1=max(c.y1 for c in word),\n                    source=ExtractionMethod.PDF_DIGITAL,\n                )\n\n            for char in line:\n                if char.get_text().isspace():\n                    if word:\n                        yield emit()\n                        word = []\n                    continue\n                if word:\n                    prev = word[-1]\n                    new_word = (\n                        char.x0 \u003c prev.x0 or char.x0 > prev.x1 + tolerance\n                        or abs(char.y1 - prev.y1) > tolerance\n                    ) if upright else (\n                        char.y1 > prev.y1 or char.y1 \u003c prev.y0 - tolerance\n                        or abs(char.x0 - prev.x0) > tolerance\n                    )\n                    if new_word:\n                        yield emit()\n                        word = []\n                word.append(char)\n            if word:\n                yield emit()\n\n\ndef extract(path: str | Path) -> RawDocument:\n    \"\"\"Extract every page once, without opening a renderer or external service.\"\"\"\n    path = Path(path)\n    pages = []\n    manager = PDFResourceManager()\n    device = PDFPageAggregator(manager, laparams=None)\n    interpreter = PDFPageInterpreter(manager, device)\n    try:\n        with path.open(\"rb\") as stream:\n            for number, page in enumerate(PDFPage.get_pages(stream), 1):\n                interpreter.process_page(page)\n                layout = device.get_result()\n                pages.append(RawPage(number, layout.width, layout.height,\n                                     list(_words(_chars(layout), number))))\n    finally:\n        device.close()\n    return RawDocument(str(path), hashlib.sha256(path.read_bytes()).hexdigest(),\n                       ExtractionMethod.PDF_DIGITAL, pages)\n\n\ndef page_count(content: bytes) -> int:\n    \"\"\"Structural diagnostic only; no text extraction.\"\"\"\n    from io import BytesIO\n    return sum(1 for _ in PDFPage.get_pages(BytesIO(content)))\n", "bankbridge/extractors/pdf/pdfplumber_extractor.py": "\"\"\"Compatibility import for callers of the former extractor module.\n\nAll extraction now uses pdfminer.six. No pdfplumber runtime is loaded.\n\"\"\"\nfrom .pdfminer_extractor import extract\n\n__all__ = [\"extract\"]\n", "bankbridge/extractors/raw_document.py": "\"\"\"RawDocument model \u2014 the boundary between extractors and parsers.\n\nAn extractor (pdfplumber, Tesseract, CSV reader) produces a ``RawDocument``.\nA bank parser consumes a ``RawDocument``.  Neither side depends on the\nother's implementation.\n\nDesign rules\n------------\n- ``RawTextElement`` is immutable; parsers must never modify it.\n- ``confidence`` is ``None`` for digital text; 0.0\u20131.0 for OCR output.\n- Bounding box coordinates use PDF conventions (origin bottom-left, in points).\n  Extractors that use a different convention must convert on output.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Optional\n\nfrom ..models.enums import ExtractionMethod\n\n\n@dataclass(frozen=True)\nclass RawTextElement:\n    \"\"\"A single text element with positional information.\"\"\"\n\n    text: str\n    page: int            # 1-based page number\n    x0: float            # Left edge (points)\n    y0: float            # Bottom edge (points)\n    x1: float            # Right edge (points)\n    y1: float            # Top edge (points)\n    source: ExtractionMethod\n    confidence: Optional[float] = None  # None = digital; 0.0\u20131.0 = OCR\n\n\n@dataclass\nclass RawPage:\n    \"\"\"All extracted elements from a single page.\"\"\"\n\n    page_number: int     # 1-based\n    width: float         # Page width in points\n    height: float        # Page height in points\n    elements: list[RawTextElement] = field(default_factory=list)\n\n    def word_boxes(self) -> list[dict]:\n        \"\"\"Word positions in top-left coordinates for legacy parser geometry.\n\n        This is a view of RawDocument data, not a second extraction route.\n        \"\"\"\n        return [{\"text\": e.text, \"x0\": e.x0, \"x1\": e.x1,\n                 \"top\": self.height - e.y1, \"bottom\": self.height - e.y0}\n                for e in self.elements]\n\n    def text_lines(self) -> list[str]:\n        \"\"\"Return element texts joined as lines (sorted by vertical position).\"\"\"\n        sorted_elements = sorted(self.elements, key=lambda e: (-e.y1, e.x0))\n        return [e.text for e in sorted_elements]\n\n\n@dataclass\nclass RawDocument:\n    \"\"\"The complete extraction output for a source document.\n\n    Created by an extractor; consumed by a parser.  The parser must not\n    open the original file \u2014 it works exclusively from this model.\n    \"\"\"\n\n    source_file: str\n    source_hash: str          # SHA-256 hex digest of the original file\n    extraction_method: ExtractionMethod\n    pages: list[RawPage] = field(default_factory=list)\n    metadata: dict[str, str] = field(default_factory=dict)  # PDF metadata etc.\n\n    @property\n    def page_count(self) -> int:\n        return len(self.pages)\n\n    def all_elements(self) -> list[RawTextElement]:\n        \"\"\"All elements across all pages, in page/position order.\"\"\"\n        result = []\n        for page in self.pages:\n            result.extend(\n                sorted(page.elements, key=lambda e: (-e.y1, e.x0))\n            )\n        return result\n", "bankbridge/models/__init__.py": "", "bankbridge/models/audit.py": "\"\"\"Minimal audit trail structures.\"\"\"\n\nfrom __future__ import annotations\n\nimport uuid\nfrom dataclasses import dataclass, field\nfrom datetime import UTC, datetime\nfrom typing import Optional\n\n\n@dataclass\nclass AuditEvent:\n    \"\"\"A single recorded event in a conversion's audit trail.\"\"\"\n\n    timestamp: datetime = field(default_factory=lambda: datetime.now(UTC))\n    event_type: str = \"\"      # e.g. \"FIELD_TRUNCATED\", \"MANUAL_CORRECTION\"\n    description: str = \"\"\n    transaction_id: Optional[str] = None\n    field_name: Optional[str] = None\n    original_value: Optional[str] = None\n    new_value: Optional[str] = None\n\n\n@dataclass\nclass ConversionAudit:\n    \"\"\"Audit record for a complete BankBridge conversion.\n\n    Created once per conversion and linked to the statement via\n    ``conversion_id``.  Must be retained internally even when not exported\n    to the user.\n    \"\"\"\n\n    conversion_id: str = field(default_factory=lambda: str(uuid.uuid4()))\n    timestamp: datetime = field(default_factory=lambda: datetime.now(UTC))\n\n    # Source provenance\n    source_file: str = \"\"\n    source_hash: str = \"\"\n\n    # Processing metadata\n    bankbridge_version: str = \"\"\n    parser_name: str = \"\"\n    parser_version: str = \"\"\n    layout_profile: Optional[str] = None  # e.g. \"RABO_PDF_V1\", \"ABN_PDF_V1\"\n\n    # Export metadata (filled in when an export is produced)\n    export_profile: Optional[str] = None\n    export_profile_version: Optional[str] = None\n    validation_rules_version: str = \"0.1.0\"\n\n    # Events (field losses, manual corrections, etc.)\n    events: list[AuditEvent] = field(default_factory=list)\n\n    def record(self, event: AuditEvent) -> None:\n        \"\"\"Append an audit event.\"\"\"\n        self.events.append(event)\n", "bankbridge/models/balance.py": "\"\"\"Balance model \u2014 represents a point-in-time account balance.\"\"\"\n\nfrom dataclasses import dataclass\nfrom datetime import date\nfrom decimal import Decimal\n\nfrom .enums import BalanceType, CreditDebitIndicator\n\n\n@dataclass(frozen=True)\nclass Balance:\n    \"\"\"An account balance at a specific point in time.\n\n    ``amount`` is always >= 0.  Direction is carried by ``credit_debit``:\n    - CREDIT: positive balance (typical credit account)\n    - DEBIT:  negative/overdrawn balance\n\n    This mirrors the CAMT.053 / MT940 convention and avoids signed-zero\n    ambiguity.\n    \"\"\"\n\n    amount: Decimal\n    credit_debit: CreditDebitIndicator\n    date: date\n    balance_type: BalanceType\n    currency: str  # ISO 4217, e.g. \"EUR\"\n\n    def __post_init__(self) -> None:\n        if self.amount \u003c Decimal(\"0\"):\n            raise ValueError(\n                f\"Balance.amount must be >= 0 (got {self.amount!r}). \"\n                \"Use credit_debit=DEBIT for overdrawn balances.\"\n            )\n        if not self.currency or len(self.currency) != 3:\n            raise ValueError(\n                f\"currency must be a 3-letter ISO 4217 code (got {self.currency!r})\"\n            )\n\n    def signed_value(self) -> Decimal:\n        \"\"\"Return a signed Decimal: positive for CREDIT, negative for DEBIT.\n\n        Use only for arithmetic (e.g. balance checks).  Do not store or\n        export this value directly \u2014 always reconstruct from amount +\n        credit_debit for clarity.\n        \"\"\"\n        if self.credit_debit == CreditDebitIndicator.CREDIT:\n            return self.amount\n        return -self.amount\n", "bankbridge/models/enums.py": "\"\"\"Core enumerations for the BankBridge canonical model.\"\"\"\n\nfrom enum import Enum\n\n\nclass CreditDebitIndicator(Enum):\n    \"\"\"Direction of a transaction or balance amount.\n\n    CREDIT = money in (bijschrijving)\n    DEBIT  = money out (afschrijving)\n\n    Amounts are always stored as positive Decimal values; this indicator\n    carries the sign semantics.\n    \"\"\"\n\n    CREDIT = \"CRDT\"\n    DEBIT = \"DBIT\"\n\n\nclass BalanceType(Enum):\n    \"\"\"Type of a balance entry, aligned with ISO 20022 / CAMT.053 codes.\"\"\"\n\n    OPENING_BOOKED = \"OPBD\"    # Beginsaldo (booked)\n    CLOSING_BOOKED = \"CLBD\"    # Eindsaldo (booked)\n    INTERIM_BOOKED = \"ITBD\"    # Tussentijds saldo (booked)\n    OPENING_AVAILABLE = \"OPAV\"\n    CLOSING_AVAILABLE = \"CLAV\"\n\n\nclass ValidationStatus(Enum):\n    \"\"\"Export readiness after validation.\n\n    GREEN  \u2014 export allowed.\n    ORANGE \u2014 export allowed after explicit user review.\n    RED    \u2014 normal financial export blocked; user must correct and re-validate.\n    \"\"\"\n\n    GREEN = \"GREEN\"\n    ORANGE = \"ORANGE\"\n    RED = \"RED\"\n\n\nclass ValidationSeverity(Enum):\n    \"\"\"Severity of a single validation issue.\"\"\"\n\n    ERROR = \"ERROR\"      # Causes RED status\n    WARNING = \"WARNING\"  # Causes ORANGE status (if not already RED)\n    INFO = \"INFO\"        # Informational only; no status change\n\n\nclass ExtractionMethod(Enum):\n    \"\"\"How the source data was extracted.\"\"\"\n\n    PDF_DIGITAL = \"pdf_digital\"   # pdfplumber \u2014 native text layer\n    PDF_OCR = \"pdf_ocr\"           # Tesseract \u2014 scanned page\n    PDF_HYBRID = \"pdf_hybrid\"     # Mix of digital and OCR pages\n    CSV = \"csv\"\n    EXCEL = \"excel\"\n    MT940_INPUT = \"mt940_input\"   # MT940 / .swi / .sta used as input\n    CAMT_INPUT = \"camt_input\"     # CAMT.053 used as input\n    MANUAL = \"manual\"\n    UNKNOWN = \"unknown\"\n", "bankbridge/models/statement.py": "\"\"\"BankBridge canonical statement model.\"\"\"\n\nfrom __future__ import annotations\n\nimport uuid\nfrom dataclasses import dataclass, field\nfrom datetime import UTC, date, datetime\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom .balance import Balance\nfrom .enums import ExtractionMethod, ValidationStatus\nfrom .transaction import BankBridgeTransaction\n\n\n@dataclass\nclass BankBridgeStatement:\n    \"\"\"A complete bank statement in the BankBridge canonical model.\n\n    This is the central artefact: created by a parser, validated by the\n    validation pipeline, and consumed by exporters.  No exporter may read\n    the source file; no extractor may touch this model.\n    \"\"\"\n\n    # --- Conversion identity --------------------------------------------\n    conversion_id: str = field(default_factory=lambda: str(uuid.uuid4()))\n    bankbridge_version: str = \"0.1.0\"\n\n    # --- Source ----------------------------------------------------------\n    source_file: str = \"\"\n    source_hash: str = \"\"      # SHA-256 hex digest of the source file\n    processed_at: datetime = field(default_factory=lambda: datetime.now(UTC))\n    extraction_method: ExtractionMethod = ExtractionMethod.UNKNOWN\n    parser_name: str = \"\"\n    parser_version: str = \"\"\n    layout_profile: Optional[str] = None  # e.g. \"RABO_PDF_V1\", \"ABN_PDF_V1\"\n\n    # --- Bank and account ------------------------------------------------\n    bank: Optional[str] = None\n    account_holder: Optional[str] = None\n    iban: Optional[str] = None            # Normalised (no spaces, uppercase)\n    account_number: Optional[str] = None  # Raw account number when IBAN not available\n    bic: Optional[str] = None\n    currency: str = \"EUR\"\n\n    # --- Statement metadata ----------------------------------------------\n    statement_number: Optional[str] = None\n    period_start: Optional[date] = None\n    period_end: Optional[date] = None\n    opening_balance: Optional[Balance] = None\n    closing_balance: Optional[Balance] = None\n\n    # --- Validation results (populated by the validation pipeline) -------\n    validation_status: ValidationStatus = ValidationStatus.GREEN\n    validation_issues: list = field(default_factory=list)  # list[ValidationIssue]\n\n    # --- Transactions ----------------------------------------------------\n    transactions: list[BankBridgeTransaction] = field(default_factory=list)\n\n    # --- Deduplication ---------------------------------------------------\n    statement_fingerprint: Optional[str] = None\n\n    # ------------------------------------------------------------------\n    # Convenience properties \u2014 do not use in export code\n    # ------------------------------------------------------------------\n\n    @property\n    def is_exportable(self) -> bool:\n        \"\"\"True when the validation status permits export.\"\"\"\n        return self.validation_status in (\n            ValidationStatus.GREEN,\n            ValidationStatus.ORANGE,\n        )\n\n    @property\n    def total_credits(self) -> Decimal:\n        from .enums import CreditDebitIndicator\n        return sum(\n            (t.amount for t in self.transactions\n             if t.debit_credit == CreditDebitIndicator.CREDIT),\n            Decimal(\"0\"),\n        )\n\n    @property\n    def total_debits(self) -> Decimal:\n        from .enums import CreditDebitIndicator\n        return sum(\n            (t.amount for t in self.transactions\n             if t.debit_credit == CreditDebitIndicator.DEBIT),\n            Decimal(\"0\"),\n        )\n", "bankbridge/models/transaction.py": "\"\"\"BankBridge canonical transaction model.\"\"\"\n\nfrom __future__ import annotations\n\nimport uuid\nfrom dataclasses import dataclass, field\nfrom datetime import date\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom .enums import CreditDebitIndicator, ExtractionMethod\n\n\n@dataclass\nclass TransactionCodes:\n    \"\"\"Raw and normalised transaction type codes.\n\n    Always preserve what the source document provided.  Never discard the\n    source code during normalisation \u2014 it must remain in the audit trail.\n    \"\"\"\n\n    # Exactly as found in the source (e.g. \"N654\", \"00100\", \"DDT\")\n    source_raw_code: Optional[str] = None\n    # Single-character indicator from MT940 :61: ('N', 'S', 'F')\n    source_indicator: Optional[str] = None\n    # Normalised SWIFT 3-char code if unambiguously derivable (e.g. \"DDT\")\n    normalized_type: Optional[str] = None\n    # Human-readable description of the normalised type\n    normalized_description: Optional[str] = None\n\n\n@dataclass\nclass BankBridgeTransaction:\n    \"\"\"A single financial transaction in the BankBridge canonical model.\n\n    Design decisions:\n    - ``amount`` is always >= 0.  Direction is in ``debit_credit``.\n    - All source text is preserved in ``original_text`` for audit purposes.\n    - Fields reserved for CAMT-rich data are present but default to None;\n      they will not be populated by PDF parsers in MVP 1.\n    \"\"\"\n\n    # --- Identity --------------------------------------------------------\n    transaction_id: str = field(default_factory=lambda: str(uuid.uuid4()))\n\n    # --- Audit trail / source reference ----------------------------------\n    source_document: str = \"\"\n    source_page: Optional[int] = None\n    source_line_start: Optional[int] = None\n    source_line_end: Optional[int] = None\n    # Original lines from the source document, unmodified\n    original_text: list[str] = field(default_factory=list)\n    extraction_method: ExtractionMethod = ExtractionMethod.UNKNOWN\n    parser_name: str = \"\"\n    parser_version: str = \"\"\n\n    # --- Core financial data --------------------------------------------\n    booking_date: Optional[date] = None\n    value_date: Optional[date] = None\n    amount: Decimal = Decimal(\"0\")       # Always >= 0\n    currency: str = \"EUR\"\n    debit_credit: CreditDebitIndicator = CreditDebitIndicator.CREDIT\n\n    # --- Counterparty ----------------------------------------------------\n    counterparty_name: Optional[str] = None\n    counterparty_iban: Optional[str] = None  # Normalised\n    counterparty_bic: Optional[str] = None\n\n    # --- Description and references --------------------------------------\n    description: Optional[str] = None\n    payment_reference: Optional[str] = None   # Betalingskenmerk\n    end_to_end_id: Optional[str] = None       # /EREF/\n    mandate_reference: Optional[str] = None   # /MARF/\n    batch_reference: Optional[str] = None     # /PREF/\n    creditor_id: Optional[str] = None         # /CSID/\n\n    # --- Bank references -------------------------------------------------\n    bank_reference: Optional[str] = None\n    transaction_codes: TransactionCodes = field(default_factory=TransactionCodes)\n\n    # --- CAMT-rich fields (reserved for future use) ---------------------\n    ultimate_creditor_name: Optional[str] = None\n    ultimate_debtor_name: Optional[str] = None\n    debtor_account: Optional[str] = None    # IBAN\n    creditor_account: Optional[str] = None  # IBAN\n    proprietary_bank_code: Optional[str] = None\n\n    # --- Deduplication --------------------------------------------------\n    # Computed fingerprint \u2014 see deduplication strategy\n    fingerprint: Optional[str] = None\n\n    def __post_init__(self) -> None:\n        if self.amount \u003c Decimal(\"0\"):\n            raise ValueError(\n                f\"Transaction.amount must be >= 0 (got {self.amount!r}). \"\n                \"Use debit_credit=DEBIT for outgoing transactions.\"\n            )\n\n    @property\n    def signed_amount(self) -> Decimal:\n        \"\"\"Signed convenience property: positive for CREDIT, negative for DEBIT.\n\n        Use only for arithmetic.  Export code must use amount + debit_credit.\n        \"\"\"\n        if self.debit_credit == CreditDebitIndicator.CREDIT:\n            return self.amount\n        return -self.amount\n", "bankbridge/parsers/__init__.py": "", "bankbridge/parsers/abnamro/__init__.py": "", "bankbridge/parsers/abnamro/mt940_parser.py": "\"\"\"ABN-AMRO MT940 (.STA) parser.\n\nABN-AMRO MT940 differs from Rabobank in several ways:\n- Each day-block is preceded by a 3-line proprietary header: ABNANL2A / 940 / ABNANL2A\n- :25: contains only the account number (e.g. 900000005), no IBAN, no currency\n- :61: has a single line only (no second line with counterparty IBAN)\n- :86: uses three distinct formats:\n    1. Structured /TRTP/ format: /TRTP/.../IBAN/.../BIC/.../NAME/.../REMI/.../EREF/...\n    2. Unstructured column-aligned: NAAM: ... IBAN: ... BIC: ... OMSCHRIJVING: ...\n    3. BEA card payment: BEA, BETAALPAS [merchant] / NR: [ref]\n    4. Free-form text: bank notices with no key-value structure\n- Currency is derived from the :60F: balance field, not from :25:\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"abnamro_mt940\"\nPARSER_VERSION = \"1.0.0\"\n\n# ---------------------------------------------------------------------------\n# Compiled regexes\n# ---------------------------------------------------------------------------\n\n_TAG_LINE_RE = re.compile(r'^:([A-Z0-9]{2,4}):(.*)', re.DOTALL)\n\n# :60F: / :62F: balance: C/D + YYMMDD + 3-char currency + amount-with-comma\n_BALANCE_RE = re.compile(r'^([CD])(\\d{6})([A-Z]{3})([\\d,]+)$')\n\n# :61: \u2014 ABN-AMRO is always a single line\n_ENTRY_RE = re.compile(\n    r'^(\\d{6})'             # value_date YYMMDD\n    r'(\\d{4})?'             # entry_date MMDD (booking date) \u2014 optional\n    r'([CD])'               # credit / debit\n    r'([\\d,]{1,15})'        # amount (comma = decimal separator)\n    r'([FNS])'              # transaction type\n    r'([A-Z0-9]{3})'        # bank transaction code (e.g. 247, 658)\n    r'([A-Z][A-Z0-9]{0,15})'  # customer reference (usually NONREF)\n    r'(?://(.*))?$'         # optional bank reference after //\n)\n\n# :25: \u2014 plain account number (may also carry currency suffix; handle both)\n_ACCOUNT_RE = re.compile(r'^(\\d+)(?:\\s+([A-Z]{3}))?$')\n\n# Proprietary ABN-AMRO block header that precedes each :20: block\n_ABN_HEADER_RE = re.compile(r'ABNANL2A\\r?\\n940\\s*\\r?\\nABNANL2A\\r?\\n', re.MULTILINE)\n\n# Structured :86: keys (slash-delimited)\n_STRUCT_KEYS = frozenset(['TRTP', 'IBAN', 'BIC', 'NAME', 'REMI', 'EREF', 'CSID', 'MARF'])\n_STRUCT_RE = re.compile(\n    r'/(' + '|'.join(sorted(_STRUCT_KEYS, key=len, reverse=True)) + r')/'\n)\n\n# Unstructured :86: keys (colon-delimited)\n_UNSTRUCT_KEYS = ('OMSCHRIJVING', 'MACHTIGING', 'INCASSANT', 'KENMERK', 'NAAM', 'IBAN', 'BIC')\n_UNSTRUCT_RE = re.compile(\n    r'(?\u003c!\\w)(' + '|'.join(_UNSTRUCT_KEYS) + r'):\\s*'\n)\n\n\n# ---------------------------------------------------------------------------\n# Low-level helpers\n# ---------------------------------------------------------------------------\n\ndef _parse_yymmdd(s: str) -> Optional[date]:\n    if len(s) != 6 or not s.isdigit():\n        return None\n    try:\n        return date(2000 + int(s[:2]), int(s[2:4]), int(s[4:]))\n    except ValueError:\n        return None\n\n\ndef _parse_amount(s: str) -> Optional[Decimal]:\n    try:\n        return Decimal(s.replace(',', '.'))\n    except InvalidOperation:\n        return None\n\n\ndef _parse_balance(raw: str, btype: BalanceType) -> Optional[Balance]:\n    m = _BALANCE_RE.match(raw.strip())\n    if not m:\n        return None\n    cd, date_str, currency, amount_str = m.groups()\n    d = _parse_yymmdd(date_str)\n    amount = _parse_amount(amount_str)\n    if d is None or amount is None:\n        return None\n    indicator = CreditDebitIndicator.CREDIT if cd == 'C' else CreditDebitIndicator.DEBIT\n    try:\n        return Balance(amount=amount, credit_debit=indicator,\n                       date=d, balance_type=btype, currency=currency)\n    except ValueError:\n        return None\n\n\ndef _derive_booking_date(value_date: date, entry_mmdd: Optional[str]) -> date:\n    \"\"\"Compute booking date from value_date year + entry_date MMDD.\"\"\"\n    if not entry_mmdd or len(entry_mmdd) != 4 or not entry_mmdd.isdigit():\n        return value_date\n    try:\n        return date(value_date.year, int(entry_mmdd[:2]), int(entry_mmdd[2:]))\n    except ValueError:\n        return value_date\n\n\ndef _extract_tags(block: str) -> list[tuple[str, str]]:\n    \"\"\"Return ordered list of (tag_id, tag_value) for one statement block.\"\"\"\n    tags: list[tuple[str, str]] = []\n    current_tag: Optional[str] = None\n    current_lines: list[str] = []\n\n    for line in block.splitlines():\n        m = _TAG_LINE_RE.match(line)\n        if m:\n            if current_tag is not None:\n                tags.append((current_tag, '\\n'.join(current_lines)))\n            current_tag = m.group(1)\n            current_lines = [m.group(2)]\n        else:\n            if current_tag is not None:\n                current_lines.append(line)\n\n    if current_tag is not None:\n        tags.append((current_tag, '\\n'.join(current_lines)))\n\n    return tags\n\n\n# ---------------------------------------------------------------------------\n# :86: field parsing \u2014 three distinct formats\n# ---------------------------------------------------------------------------\n\ndef _detect_86_format(text: str) -> str:\n    \"\"\"Classify the :86: format: structured | unstructured | bea | freeform.\"\"\"\n    stripped = text.lstrip()\n    if stripped.startswith('/TRTP/'):\n        return 'structured'\n    if re.match(r'BEA[,\\s]', stripped, re.IGNORECASE):\n        return 'bea'\n    if _UNSTRUCT_RE.search(text):\n        return 'unstructured'\n    return 'freeform'\n\n\ndef _parse_86_structured(text: str) -> dict[str, str]:\n    \"\"\"Parse /TRTP/SEPA.../IBAN/NL.../BIC/.../NAME/.../REMI/.../EREF/... format.\n\n    Lines are joined WITHOUT spaces because ABN-AMRO wraps at the character\n    level \u2014 a token may split exactly at the line boundary.\n    \"\"\"\n    normalized = ''.join(text.splitlines())\n    result: dict[str, str] = {}\n\n    matches = list(_STRUCT_RE.finditer(normalized))\n    for i, m in enumerate(matches):\n        key = m.group(1)\n        value_start = m.end()\n        value_end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(normalized)\n        result[key] = normalized[value_start:value_end].strip()\n    return result\n\n\ndef _parse_86_unstructured(text: str) -> dict[str, str]:\n    \"\"\"Parse column-aligned NAAM: / IBAN: / OMSCHRIJVING: ... format.\n\n    Lines are joined WITH spaces because column-aligned keys start fresh on\n    each line and values may continue past the right margin on the next line.\n    \"\"\"\n    # Join all lines, collapsing the column-aligned whitespace\n    joined = ' '.join(text.split('\\n'))\n\n    result: dict[str, str] = {}\n    # Extract the description prefix (text before the first KEY:)\n    first_match = _UNSTRUCT_RE.search(joined)\n    if first_match:\n        prefix = joined[:first_match.start()].strip()\n        if prefix:\n            result['_description_prefix'] = prefix\n\n    matches = list(_UNSTRUCT_RE.finditer(joined))\n    for i, m in enumerate(matches):\n        key = m.group(1)\n        value_start = m.end()\n        value_end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(joined)\n        result[key] = joined[value_start:value_end].strip()\n    return result\n\n\ndef _parse_86_bea(text: str) -> dict[str, str]:\n    \"\"\"Parse BEA card payment format.\n\n    Line 1: BEA, BETAALPAS    \u003cmerchant-name>,\u003cPAS-info>\n    Line 2: NR:\u003cref>, \u003cdate>/\u003ctime>    \u003ccity>\n    \"\"\"\n    lines = text.splitlines()\n    result: dict[str, str] = {}\n    if lines:\n        # Merchant info is everything after \"BEA, BETAALPAS\" on line 1\n        first = lines[0]\n        m = re.match(r'BEA,?\\s+\\S+\\s*(.*)', first, re.IGNORECASE)\n        if m:\n            result['_merchant'] = m.group(1).strip()\n    if len(lines) > 1:\n        result['_bea_detail'] = ' '.join(lines[1:])\n    return result\n\n\ndef _parse_86(text: str) -> tuple[str, dict[str, str]]:\n    \"\"\"Return (format_name, parsed_fields) for a :86: field value.\"\"\"\n    fmt = _detect_86_format(text)\n    if fmt == 'structured':\n        return fmt, _parse_86_structured(text)\n    if fmt == 'unstructured':\n        return fmt, _parse_86_unstructured(text)\n    if fmt == 'bea':\n        return fmt, _parse_86_bea(text)\n    # freeform \u2014 join as description\n    return fmt, {'_freeform': ' '.join(text.split())}\n\n\n# ---------------------------------------------------------------------------\n# Transaction parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_entry(\n    f61_value: str,\n    f86_value: str,\n    currency: str,\n    source_file: str,\n) -> Optional[BankBridgeTransaction]:\n    \"\"\"Parse one :61: + :86: pair into a BankBridgeTransaction.\"\"\"\n    # ABN-AMRO :61: is always a single line\n    line = f61_value.splitlines()[0].strip() if f61_value else ''\n    m = _ENTRY_RE.match(line)\n    if not m:\n        return None\n\n    (value_date_str, entry_date_str, cd, amount_str,\n     txn_type, txn_code, cust_ref, bank_ref) = m.groups()\n\n    v_date = _parse_yymmdd(value_date_str)\n    amount = _parse_amount(amount_str)\n    if v_date is None or amount is None:\n        return None\n\n    booking_date = _derive_booking_date(v_date, entry_date_str)\n    indicator = CreditDebitIndicator.CREDIT if cd == 'C' else CreditDebitIndicator.DEBIT\n\n    # Parse :86: field\n    fmt, fields = _parse_86(f86_value) if f86_value else ('', {})\n\n    # Map parsed fields to canonical model fields\n    counterparty_name: Optional[str] = None\n    counterparty_iban: Optional[str] = None\n    counterparty_bic: Optional[str] = None\n    description: Optional[str] = None\n    payment_reference: Optional[str] = None\n    end_to_end_id: Optional[str] = None\n    mandate_reference: Optional[str] = None\n    creditor_id: Optional[str] = None\n\n    if fmt == 'structured':\n        counterparty_name = fields.get('NAME')\n        counterparty_iban = fields.get('IBAN')\n        counterparty_bic = fields.get('BIC')\n        description = fields.get('REMI')\n        end_to_end_id = fields.get('EREF')\n        payment_reference = fields.get('EREF')\n        mandate_reference = fields.get('MARF')\n        creditor_id = fields.get('CSID')\n    elif fmt == 'unstructured':\n        counterparty_name = fields.get('NAAM')\n        counterparty_iban = fields.get('IBAN')\n        counterparty_bic = fields.get('BIC')\n        description = fields.get('OMSCHRIJVING') or fields.get('_description_prefix')\n        mandate_reference = fields.get('MACHTIGING')\n        creditor_id = fields.get('INCASSANT')\n        kenmerk = fields.get('KENMERK')\n        if kenmerk and kenmerk.upper() != 'NOTPROVIDED':\n            payment_reference = kenmerk\n    elif fmt == 'bea':\n        counterparty_name = fields.get('_merchant')\n        description = fields.get('_bea_detail')\n    else:  # freeform\n        description = fields.get('_freeform')\n\n    # Strip empty strings to None\n    def _clean(v: Optional[str]) -> Optional[str]:\n        return v.strip() if v and v.strip() else None\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        booking_date=booking_date,\n        value_date=v_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=indicator,\n        counterparty_name=_clean(counterparty_name),\n        counterparty_iban=_clean(counterparty_iban),\n        counterparty_bic=_clean(counterparty_bic),\n        description=_clean(description),\n        payment_reference=_clean(payment_reference),\n        end_to_end_id=_clean(end_to_end_id),\n        mandate_reference=_clean(mandate_reference),\n        creditor_id=_clean(creditor_id),\n        bank_reference=_clean(bank_ref),\n        original_text=[f61_value] + ([f86_value] if f86_value else []),\n        extraction_method=ExtractionMethod.MT940_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(\n            source_raw_code=txn_code,\n            source_indicator=cust_ref,\n        ),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Block parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_block(block: str, source_file: str) -> Optional[BankBridgeStatement]:\n    \"\"\"Parse one MT940 day-block into a BankBridgeStatement.\"\"\"\n    tags = _extract_tags(block)\n    if not tags:\n        return None\n\n    tag_dict: dict[str, str] = {tid: val for tid, val in tags}\n\n    # :25: \u2014 account number only (no IBAN, no currency for ABN-AMRO)\n    account_number: Optional[str] = None\n    currency = 'EUR'\n    raw_25 = tag_dict.get('25', '').strip()\n    m25 = _ACCOUNT_RE.match(raw_25)\n    if m25:\n        account_number = m25.group(1)\n        if m25.group(2):\n            currency = m25.group(2)\n\n    opening_balance = _parse_balance(tag_dict.get('60F', ''), BalanceType.OPENING_BOOKED)\n    closing_balance = _parse_balance(tag_dict.get('62F', ''), BalanceType.CLOSING_BOOKED)\n\n    # Derive currency from balance if not in :25:\n    if opening_balance and currency == 'EUR':\n        currency = opening_balance.currency\n\n    period_date: Optional[date] = closing_balance.date if closing_balance else None\n\n    # Pair :61: with immediately following :86:\n    transactions: list[BankBridgeTransaction] = []\n    pending_61: Optional[str] = None\n\n    for tag_id, value in tags:\n        if tag_id == '61':\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n            pending_61 = value\n        elif tag_id == '86':\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, value, currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n        elif tag_id not in ('64', '65'):\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n\n    if pending_61 is not None:\n        txn = _parse_entry(pending_61, '', currency, source_file)\n        if txn:\n            transactions.append(txn)\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.MT940_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        bank='ABN AMRO',\n        account_number=account_number,\n        currency=currency,\n        statement_number=tag_dict.get('28', '') or None,\n        period_start=period_date,\n        period_end=period_date,\n        opening_balance=opening_balance,\n        closing_balance=closing_balance,\n        transactions=transactions,\n    )\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(content: str, source_file: str = \"\") -> list[BankBridgeStatement]:\n    \"\"\"Parse an ABN-AMRO MT940 file.\n\n    Returns one BankBridgeStatement per day-block.  The caller may aggregate\n    these into a period statement if needed.\n\n    Args:\n        content:     Raw file content (str, any line ending).\n        source_file: Original file path, stored on each statement for audit.\n    \"\"\"\n    # Strip the repeating proprietary ABN-AMRO block header\n    content = _ABN_HEADER_RE.sub('', content).strip()\n\n    # Split on block terminator (-) which appears on its own line\n    raw_blocks = re.split(r'\\n-(?:\\n|$)', content)\n\n    statements: list[BankBridgeStatement] = []\n    for block in raw_blocks:\n        block = block.strip()\n        if not block:\n            continue\n        stmt = _parse_block(block, source_file)\n        if stmt is not None:\n            statements.append(stmt)\n\n    return statements\n", "bankbridge/parsers/abnamro/pdf_parser.py": "\"\"\"ABN-AMRO PDF bank statement parser.\n\nParses the PDF produced by ABN-AMRO online banking using pdfplumber's native\ntext-extraction layer.  No information is sourced from the MT940/STA file.\n\nLayout (all pages):\n    - Page header (y0 \u003c col_header_y0): account info, period, balances (page 1)\n    - Column header row: \"Datum | Omschrijving | Bedrag af | Bedrag bij\"\n    - Transaction rows: date at x0 \u2248 30, description at x0 \u2248 99-320, amounts right\n    - Last-page footer (y0 > last-txn-y0): totals summary (skipped)\n\n:86:-style description formats seen in the PDF:\n    1. Structured /TRTP/ \u2014 /KEY/value/ slash-delimited, same as MT940\n    2. Unstructured \u2014 NAAM:, Naam:, IBAN:, BIC:, Omschrijving:, Kenmerk: (mixed case)\n    3. BEA card payment \u2014 \"BEA, Betaalpas [merchant] NR:[ref]\"\n    4. Free-form text \u2014 bank notices, no key-value pairs\n\nLine wrapping: description words are space-joined (pdfplumber already splits on\nwhitespace).  For identifier fields (IBAN, BIC, EREF, CSID, MARF), internal\nspaces are stripped after extraction to handle character-level PDF wrapping.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.extractors.raw_document import RawDocument\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"abnamro_pdf\"\nPARSER_VERSION = \"1.0.0\"\n\n# ---------------------------------------------------------------------------\n# Column thresholds (points)\n# ---------------------------------------------------------------------------\n\n_DATE_X0_MAX: float = 42.0     # transaction dates: x0 \u003c 42\n_DESC_X0_MIN: float = 90.0     # description: x0 \u2265 90\n_DESC_X0_MAX: float = 350.0    # description: x0 \u003c 350\n_DEBIT_X0_MIN: float = 370.0   # debit amount column\n_DEBIT_X0_MAX: float = 450.0\n_CREDIT_X0_MIN: float = 490.0  # credit amount column\n\n# ---------------------------------------------------------------------------\n# Patterns\n# ---------------------------------------------------------------------------\n\n_DATE_RE = re.compile(r'^\\d{2}-\\d{2}-\\d{4}$')\n_DOTTED_ACCOUNT_RE = re.compile(r'^\\d{2}\\.\\d{2}\\.\\d{2}\\.\\d{3}$')\n_DUTCH_AMOUNT_RE = re.compile(r'^\\d{1,3}(?:\\.\\d{3})*,\\d{2}$')\n\n# Structured /KEY/ format\n_STRUCT_KEYS = frozenset(['TRTP', 'ULTD', 'IBAN', 'BIC', 'NAME', 'REMI', 'EREF', 'CSID', 'MARF'])\n_STRUCT_RE = re.compile(\n    r'/(' + '|'.join(sorted(_STRUCT_KEYS, key=len, reverse=True)) + r')/'\n)\n# These identifier fields have internal spaces stripped after extraction\n_SPACE_STRIP_KEYS = frozenset(['IBAN', 'BIC', 'EREF', 'CSID', 'MARF'])\n\n# Normalise line-break artifacts where a /KEY/ separator has spaces inserted\n# inside the key name (e.g. '/B IC/' or '/N AME/').  The regex allows \\s*\n# between every character of every known key; the substitution removes them.\n_KEY_SPLIT_RE = re.compile(\n    r'/(' + '|'.join(\n        r'\\s*'.join(re.escape(c) for c in k)\n        for k in sorted(_STRUCT_KEYS, key=len, reverse=True)\n    ) + r')\\s*/',\n)\n\n# Unstructured KEY: format (case-insensitive; longest first to avoid prefix matches)\n_UNSTRUCT_KEYS = ('OMSCHRIJVING', 'MACHTIGING', 'INCASSANT', 'KENMERK', 'NAAM', 'IBAN', 'BIC')\n_UNSTRUCT_RE = re.compile(\n    r'(?\u003c!\\w)(' + '|'.join(_UNSTRUCT_KEYS) + r'):\\s*',\n    re.IGNORECASE,\n)\n\n\n# ---------------------------------------------------------------------------\n# Low-level helpers\n# ---------------------------------------------------------------------------\n\ndef _parse_date_dmy(text: str) -> Optional[date]:\n    \"\"\"Parse DD-MM-YYYY into a date.\"\"\"\n    try:\n        d, m, y = text.split('-')\n        return date(int(y), int(m), int(d))\n    except (ValueError, AttributeError):\n        return None\n\n\ndef _parse_dutch_amount(text: str) -> Optional[Decimal]:\n    \"\"\"Parse Dutch amount format: '1.234,56' \u2192 Decimal('1234.56').\"\"\"\n    try:\n        return Decimal(text.replace('.', '').replace(',', '.'))\n    except InvalidOperation:\n        return None\n\n\ndef _is_txn_date(w: dict) -> bool:\n    return w['x0'] \u003c _DATE_X0_MAX and bool(_DATE_RE.match(w['text']))\n\n\ndef _is_desc(w: dict) -> bool:\n    return _DESC_X0_MIN \u003c= w['x0'] \u003c _DESC_X0_MAX\n\n\ndef _is_debit(w: dict) -> bool:\n    return _DEBIT_X0_MIN \u003c= w['x0'] \u003c= _DEBIT_X0_MAX and bool(_DUTCH_AMOUNT_RE.match(w['text']))\n\n\ndef _is_credit(w: dict) -> bool:\n    return w['x0'] >= _CREDIT_X0_MIN and bool(_DUTCH_AMOUNT_RE.match(w['text']))\n\n\n# ---------------------------------------------------------------------------\n# Description format detection and parsing\n# ---------------------------------------------------------------------------\n\ndef _detect_format(text: str) -> str:\n    if '/TRTP/' in text[:20]:\n        return 'structured'\n    if re.match(r'BEA[,\\s]', text, re.IGNORECASE):\n        return 'bea'\n    if _UNSTRUCT_RE.search(text):\n        return 'unstructured'\n    return 'freeform'\n\n\ndef _parse_structured(text: str) -> dict[str, str]:\n    \"\"\"Parse /TRTP/.../KEY/value/... from space-joined PDF description.\n\n    Identifier fields (IBAN, BIC, EREF, CSID, MARF) have internal spaces\n    stripped because PDF character-level line wrapping may insert a space\n    mid-token (e.g. 'NL65ABNA011985191 1' \u2192 'NL62ABNA0900000073').\n\n    A second artifact: a PDF line-break may fall inside a key name, producing\n    e.g. '/B IC/' or '/N AME/' after space-join.  _KEY_SPLIT_RE normalises\n    these back to '/BIC/' or '/NAME/' before key matching.\n    \"\"\"\n    text = _KEY_SPLIT_RE.sub(lambda m: '/' + m.group(1).replace(' ', '') + '/', text)\n    result: dict[str, str] = {}\n    matches = list(_STRUCT_RE.finditer(text))\n    for i, m in enumerate(matches):\n        key = m.group(1)\n        start = m.end()\n        end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(text)\n        value = text[start:end].strip()\n        if key in _SPACE_STRIP_KEYS:\n            value = value.replace(' ', '')\n        result[key] = value\n\n    # ULTD //NAME/ sub-structure: value is '//NAME/\u003cultimate-debtor-name>'\n    if 'ULTD' in result:\n        v = result['ULTD'].lstrip('/')\n        if v.startswith('NAME/'):\n            result['ULTD_NAME'] = v[5:].strip()\n            result['ULTD'] = ''\n\n    return result\n\n\ndef _parse_unstructured(text: str) -> dict[str, str]:\n    \"\"\"Parse NAAM:/Naam:/IBAN:/BIC:/OMSCHRIJVING:/Omschrijving:/KENMERK:... format.\"\"\"\n    result: dict[str, str] = {}\n    first = _UNSTRUCT_RE.search(text)\n    if first:\n        prefix = text[:first.start()].strip()\n        if prefix:\n            result['_prefix'] = prefix\n\n    matches = list(_UNSTRUCT_RE.finditer(text))\n    for i, m in enumerate(matches):\n        key = m.group(1).upper()\n        start = m.end()\n        end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(text)\n        result[key] = text[start:end].strip()\n\n    return result\n\n\ndef _parse_bea(text: str) -> dict[str, str]:\n    \"\"\"Parse BEA, Betaalpas [merchant] NR:[ref] format.\"\"\"\n    result: dict[str, str] = {}\n    m = re.match(r'BEA,?\\s+\\S+\\s*(.*)', text, re.IGNORECASE | re.DOTALL)\n    if m:\n        rest = m.group(1)\n        nr_pos = re.search(r'\\s+NR:', rest)\n        if nr_pos:\n            result['_merchant'] = rest[:nr_pos.start()].strip()\n            result['_detail'] = rest[nr_pos.start():].strip()\n        else:\n            result['_merchant'] = rest.strip()\n    return result\n\n\ndef _clean(v: Optional[str]) -> Optional[str]:\n    return v.strip() if v and v.strip() else None\n\n\ndef _build_transaction(\n    booking_date: date,\n    amount: Decimal,\n    debit_credit: CreditDebitIndicator,\n    desc_text: str,\n    source_file: str,\n) -> BankBridgeTransaction:\n    fmt = _detect_format(desc_text)\n\n    if fmt == 'structured':\n        fields = _parse_structured(desc_text)\n        counterparty_name = _clean(fields.get('NAME'))\n        counterparty_iban = _clean(fields.get('IBAN'))\n        counterparty_bic = _clean(fields.get('BIC'))\n        description = _clean(fields.get('REMI'))\n        end_to_end_id = _clean(fields.get('EREF'))\n        payment_reference = end_to_end_id\n        mandate_reference = _clean(fields.get('MARF'))\n        creditor_id = _clean(fields.get('CSID'))\n        ultimate_debtor_name = _clean(fields.get('ULTD_NAME'))\n\n    elif fmt == 'unstructured':\n        fields = _parse_unstructured(desc_text)\n        counterparty_name = _clean(fields.get('NAAM'))\n        counterparty_iban = _clean(fields.get('IBAN'))\n        counterparty_bic = _clean(fields.get('BIC'))\n        description = _clean(fields.get('OMSCHRIJVING') or fields.get('_prefix'))\n        mandate_reference = _clean(fields.get('MACHTIGING'))\n        creditor_id = _clean(fields.get('INCASSANT'))\n        kenmerk = fields.get('KENMERK', '')\n        payment_reference = _clean(kenmerk) if kenmerk.upper() != 'NOTPROVIDED' else None\n        end_to_end_id = None\n        ultimate_debtor_name = None\n\n    elif fmt == 'bea':\n        fields = _parse_bea(desc_text)\n        counterparty_name = _clean(fields.get('_merchant'))\n        counterparty_iban = None\n        counterparty_bic = None\n        description = _clean(fields.get('_detail'))\n        payment_reference = None\n        end_to_end_id = None\n        mandate_reference = None\n        creditor_id = None\n        ultimate_debtor_name = None\n\n    else:  # freeform\n        counterparty_name = None\n        counterparty_iban = None\n        counterparty_bic = None\n        description = _clean(desc_text)\n        payment_reference = None\n        end_to_end_id = None\n        mandate_reference = None\n        creditor_id = None\n        ultimate_debtor_name = None\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        booking_date=booking_date,\n        value_date=booking_date,   # PDF does not show value date separately\n        amount=amount,\n        currency='EUR',\n        debit_credit=debit_credit,\n        counterparty_name=counterparty_name,\n        counterparty_iban=counterparty_iban,\n        counterparty_bic=counterparty_bic,\n        description=description,\n        payment_reference=payment_reference,\n        end_to_end_id=end_to_end_id,\n        mandate_reference=mandate_reference,\n        creditor_id=creditor_id,\n        ultimate_debtor_name=ultimate_debtor_name,\n        original_text=[desc_text],\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Header extraction (page 1 only)\n# ---------------------------------------------------------------------------\n\ndef _group_by_y0(words: list[dict]) -> dict[float, list[dict]]:\n    rows: dict[float, list[dict]] = {}\n    for w in words:\n        y = round(w['top'], 1)\n        rows.setdefault(y, []).append(w)\n    return rows\n\n\ndef _parse_header(words: list[dict]) -> dict:\n    \"\"\"Extract account number, period, and balances from page 1 words.\"\"\"\n    info: dict = {}\n    rows = _group_by_y0(words)\n\n    for y0, row in sorted(rows.items()):\n        row_s = sorted(row, key=lambda w: w['x0'])\n\n        # Account holder: row containing \"Rekeninghouder\" at x0 \u003c 40\n        if any(w['text'] == 'Rekeninghouder' and w['x0'] \u003c 40 for w in row_s):\n            name_words = [w['text'] for w in row_s if w['x0'] > 100]\n            if name_words:\n                info['account_holder'] = ' '.join(name_words)\n\n        # Account number: dotted format \"12.34.56.789\"\n        for w in row_s:\n            if _DOTTED_ACCOUNT_RE.match(w['text']):\n                info['account_number'] = w['text'].replace('.', '')\n\n        # Period: row containing \"Periode\" at x0 \u003c 40\n        if any(w['text'] == 'Periode' and w['x0'] \u003c 40 for w in row_s):\n            date_words = [w for w in row_s if _DATE_RE.match(w['text'])]\n            if len(date_words) >= 2:\n                info['period_start'] = _parse_date_dmy(date_words[0]['text'])\n                info['period_end'] = _parse_date_dmy(date_words[1]['text'])\n            elif len(date_words) == 1:\n                info['period_start'] = _parse_date_dmy(date_words[0]['text'])\n\n        # Saldo rows: \"Saldo\" at x0 \u003c 40\n        if any(w['text'] == 'Saldo' and w['x0'] \u003c 40 for w in row_s):\n            date_words = [w for w in row_s if _DATE_RE.match(w['text'])]\n            amount_words = [w for w in row_s if _DUTCH_AMOUNT_RE.match(w['text'])]\n            if date_words and amount_words:\n                d = _parse_date_dmy(date_words[0]['text'])\n                amt = _parse_dutch_amount(amount_words[0]['text'])\n                if d and amt:\n                    info.setdefault('_saldo', []).append({'date': d, 'amount': amt})\n\n    # Build opening/closing balance from Saldo rows (first = opening, second = closing)\n    saldo_rows = info.pop('_saldo', [])\n    if len(saldo_rows) >= 1:\n        s = saldo_rows[0]\n        info['opening_balance'] = Balance(\n            amount=s['amount'],\n            credit_debit=CreditDebitIndicator.CREDIT,\n            date=s['date'],\n            balance_type=BalanceType.OPENING_BOOKED,\n            currency='EUR',\n        )\n    if len(saldo_rows) >= 2:\n        s = saldo_rows[1]\n        info['closing_balance'] = Balance(\n            amount=s['amount'],\n            credit_debit=CreditDebitIndicator.CREDIT,\n            date=s['date'],\n            balance_type=BalanceType.CLOSING_BOOKED,\n            currency='EUR',\n        )\n\n    return info\n\n\n# ---------------------------------------------------------------------------\n# Transaction extraction\n# ---------------------------------------------------------------------------\n\ndef _find_col_header_y0(words: list[dict]) -> float:\n    \"\"\"Return y0 of the column header row ('Datum' at x0 \u003c 40), or 0.0.\"\"\"\n    for w in words:\n        if w['text'] == 'Datum' and w['x0'] \u003c 40:\n            return w['top']\n    return 0.0\n\n\ndef _extract_transactions(all_page_words: list[tuple[int, list[dict]]], source_file: str) -> list[BankBridgeTransaction]:\n    \"\"\"Walk through all pages' transaction-area words and build transactions.\n\n    All_page_words: list of (page_num, words_below_col_header).\n    Pages are processed in order; description rows are accumulated across rows\n    (and optionally across page boundaries if a description continues).\n    \"\"\"\n    transactions: list[BankBridgeTransaction] = []\n    current_date: Optional[date] = None\n    current_amount: Optional[Decimal] = None\n    current_dc: Optional[CreditDebitIndicator] = None\n    current_desc: list[str] = []\n\n    def _flush():\n        if current_date and current_amount is not None:\n            desc_text = ' '.join(current_desc)\n            transactions.append(\n                _build_transaction(current_date, current_amount, current_dc, desc_text, source_file)\n            )\n\n    for _page_num, words in all_page_words:\n        rows = _group_by_y0(words)\n        for _y0, row in sorted(rows.items()):\n            row_s = sorted(row, key=lambda w: w['x0'])\n\n            # Skip footer rows (totals area on last page)\n            if any(w['x0'] > 300 and w['text'] in ('Aantal', 'Totaal') for w in row_s):\n                continue\n\n            date_word = next((w for w in row_s if _is_txn_date(w)), None)\n\n            if date_word:\n                _flush()\n                current_date = _parse_date_dmy(date_word['text'])\n                # Amount is on the same row as the date\n                debit_w = next((w for w in row_s if _is_debit(w)), None)\n                credit_w = next((w for w in row_s if _is_credit(w)), None)\n                if debit_w:\n                    current_amount = _parse_dutch_amount(debit_w['text'])\n                    current_dc = CreditDebitIndicator.DEBIT\n                elif credit_w:\n                    current_amount = _parse_dutch_amount(credit_w['text'])\n                    current_dc = CreditDebitIndicator.CREDIT\n                else:\n                    current_amount = None\n                    current_dc = None\n                current_desc = [w['text'] for w in row_s if _is_desc(w)]\n            else:\n                # Continuation description row\n                desc_words = [w['text'] for w in row_s if _is_desc(w)]\n                current_desc.extend(desc_words)\n\n    _flush()\n    return transactions\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(path: str, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse an ABN-AMRO PDF bank statement.\n\n    Args:\n        path:        Path to the PDF file.\n        source_file: File path stored on the statement and each transaction for\n                     audit.  Defaults to ``path`` if not provided.\n\n    Returns:\n        A single BankBridgeStatement covering the entire PDF period.\n    \"\"\"\n    from bankbridge.extractors.pdf.pdfminer_extractor import extract\n    doc = path if isinstance(path, RawDocument) else extract(path)\n    return parse(doc, source_file)\n\n\ndef parse(doc: RawDocument, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse only positioned RawDocument data (ADR-005).\"\"\"\n    source_file = source_file or doc.source_file\n    if not doc.pages:\n        raise ValueError(\"PDF contains no pages\")\n    header = _parse_header(doc.pages[0].word_boxes())\n    all_page_words: list[tuple[int, list[dict]]] = []\n    for page in doc.pages:\n        words = page.word_boxes()\n        col_hdr_y0 = _find_col_header_y0(words)\n        txn_words = [w for w in words if w['top'] > col_hdr_y0 + 5]\n        all_page_words.append((page.page_number, txn_words))\n\n    transactions = _extract_transactions(all_page_words, source_file)\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        layout_profile=\"ABN_PDF_V1\",\n        bank='ABN AMRO',\n        account_number=header.get('account_number'),\n        account_holder=header.get('account_holder'),\n        currency='EUR',\n        period_start=header.get('period_start'),\n        period_end=header.get('period_end'),\n        opening_balance=header.get('opening_balance'),\n        closing_balance=header.get('closing_balance'),\n        transactions=transactions,\n    )\n", "bankbridge/parsers/asn/__init__.py": "\"\"\"ASN Bank parsers.\"\"\"\n", "bankbridge/parsers/asn/pdf_parser.py": "\"\"\"ASN Bank (RegioBank) PDF parser \u2014 layout profile ASN_PDF_V1.\n\nParses a RawDocument (pdfminer_extractor output) into a BankBridgeStatement.\n\nObserved layout (A4 595.2 \u00d7 841.7 pts, PDF bottom-left origin):\n\nHeader area  \u2014 y1 > 668  (pdfplumber top \u003c 174 pts)\n  \"Rekeningafschrift\"          \u2014 document title, top-left\n  \"Plus Betalen\" / account type \u2014 top-left below title\n  IBAN chunks NL14 RBRB ...   \u2014 x0 \u2248 57, y1 \u2248 759\n  \"Beginsaldo op DD-MM-YYYY\"  \u2014 x0 \u2248 425, y1 \u2248 735; amount at x0 > 490, y1 \u2248 724\n  \"Rekeninghouder\"             \u2014 x0 \u2248 57, y1 \u2248 724\n  Account holder name          \u2014 x0 \u2248 57\u2013275, y1 \u2248 714 (same row as \"Eindsaldo op...\")\n  \"Eindsaldo op DD-MM-YYYY\"   \u2014 x0 \u2248 430, y1 \u2248 714; amount at x0 > 490, y1 \u2248 704\n  Column header row            \u2014 y1 \u2248 677: \"Datum Bij/Af Bedrag (\u20ac) Omschrijving\"\n\nTransaction area \u2014 y1 \u2264 668\n  Transaction row: Date(x0\u224862) Bij/Af(x0\u2248114) Amount(x0 140-211) Omschrijving(x0\u2265208)\n  Continuation rows: only words at x0 \u2265 208\n\nDescription format:\n  First line: [IBAN chunks] [Counterparty name] [start of description]\n  Continuation lines: additional description text\n  Incasso: \"Incassant ID: \u003ccreditor_id>\" and \"Kenmerk Machtiging: \u003cmandate_ref>\"\n\nMetadata availability:\n  AVAILABLE:     booking_date, amount, debit_credit, counterparty_iban,\n                 counterparty_name, description, creditor_id, mandate_reference\n  NOT AVAILABLE: value_date, counterparty_bic, end_to_end_id, bank_reference,\n                 bank transaction codes\n  LIMITED:       balance direction (assumed CREDIT; Kredietlimiet=0 confirms this)\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom pathlib import Path\nfrom typing import Optional\n\nfrom bankbridge.extractors.raw_document import RawDocument, RawPage, RawTextElement\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"asn_pdf\"\nPARSER_VERSION = \"1.0.0\"\n\n# ---------------------------------------------------------------------------\n# Column layout (x in points, left edge)\n# ---------------------------------------------------------------------------\n\n_X_DATE_LEFT = 55.0\n_X_DATE_RIGHT = 115.0\n_X_BIJAF_LEFT = 105.0\n_X_BIJAF_RIGHT = 145.0\n_X_AMOUNT_LEFT = 140.0\n_X_AMOUNT_RIGHT = 212.0\n_X_DESC_LEFT = 207.0\n_X_BALANCE_RIGHT_AREA = 485.0  # balances appear at x0 > this\n\n# Header area: rows with y1 > this are in the header (above column headers).\n# Column header row \"Datum Bij/Af ...\" is at PDF y1 \u2248 677.\n_Y_TXAREA_MAX = 668.0\n\n# ---------------------------------------------------------------------------\n# Patterns\n# ---------------------------------------------------------------------------\n\n_DATE_FULL_RE = re.compile(r\"^\\d{1,2}-\\d{1,2}-\\d{4}$\")   # DD-MM-YYYY or D-M-YYYY\n_DATE_STRICT_RE = re.compile(r\"^\\d{2}-\\d{2}-\\d{4}$\")      # DD-MM-YYYY only\n_AMOUNT_RE = re.compile(r\"^\\d[\\d.]*,\\d{2}$\")\n_IBAN_START_RE = re.compile(r\"^[A-Z]{2}\\d{2}$\")\n_IBAN_CONT_RE = re.compile(r\"^[A-Z0-9]{2,6}$\")\n\n# Standard NL IBAN = 18 chars; fallback table for others\n_IBAN_LENGTHS: dict[str, int] = {\n    \"NL\": 18, \"BE\": 16, \"DE\": 22, \"GB\": 22, \"FR\": 27, \"AT\": 20,\n    \"CH\": 21, \"LU\": 20, \"ES\": 24, \"IT\": 27, \"NO\": 15, \"SE\": 24,\n}\n\n_INCASSANT_ID_RE = re.compile(r'Incassant\\s+ID:\\s*([A-Za-z0-9]+)')\n_MACHTIGING_RE = re.compile(\n    r'Kenmerk\\s+Machtiging:\\s*([A-Za-z0-9]+(?:[-/][A-Za-z0-9]+)*)'\n)\n\n\n# ---------------------------------------------------------------------------\n# Low-level helpers\n# ---------------------------------------------------------------------------\n\ndef _parse_amount(text: str) -> Optional[Decimal]:\n    try:\n        return Decimal(text.replace(\".\", \"\").replace(\",\", \".\"))\n    except InvalidOperation:\n        return None\n\n\ndef _parse_date(text: str) -> Optional[date]:\n    \"\"\"Parse DD-MM-YYYY or D-M-YYYY date string.\"\"\"\n    if not _DATE_FULL_RE.match(text):\n        return None\n    try:\n        parts = text.split(\"-\")\n        return date(int(parts[2]), int(parts[1]), int(parts[0]))\n    except (ValueError, IndexError):\n        return None\n\n\n# ---------------------------------------------------------------------------\n# Row grouping (reuses the same pattern as rabobank/pdf_parser.py)\n# ---------------------------------------------------------------------------\n\nclass _Row:\n    __slots__ = (\"elems\", \"y\", \"page\")\n\n    def __init__(self, elems: list[RawTextElement]) -> None:\n        self.elems: list[RawTextElement] = sorted(elems, key=lambda e: e.x0)\n        self.y: float = elems[0].y1 if elems else 0.0\n        self.page: int = elems[0].page if elems else 0\n\n    def texts(self) -> list[str]:\n        return [e.text for e in self.elems]\n\n    def joined(self) -> str:\n        return \" \".join(e.text for e in self.elems)\n\n    def elems_in_x(self, x0: float, x1: float) -> list[RawTextElement]:\n        return [e for e in self.elems if e.x0 >= x0 and e.x0 \u003c x1]\n\n    def first_text_in_x(self, x0: float, x1: float) -> Optional[str]:\n        for e in self.elems:\n            if e.x0 >= x0 and e.x0 \u003c x1:\n                return e.text\n        return None\n\n\ndef _group_rows(elements: list[RawTextElement], y_tol: float = 3.0) -> list[_Row]:\n    \"\"\"Group elements into visual rows by y1 proximity (top edge, bottom-left coords).\"\"\"\n    if not elements:\n        return []\n    by_y = sorted(elements, key=lambda e: -e.y1)\n    groups: list[list[RawTextElement]] = [[by_y[0]]]\n    for elem in by_y[1:]:\n        if abs(elem.y1 - groups[-1][0].y1) \u003c= y_tol:\n            groups[-1].append(elem)\n        else:\n            groups.append([elem])\n    return [_Row(g) for g in groups]\n\n\n# ---------------------------------------------------------------------------\n# IBAN + name extraction from description words\n# ---------------------------------------------------------------------------\n\ndef _collect_iban_name(\n    desc_words: list[str],\n) -> tuple[Optional[str], Optional[str], list[str]]:\n    \"\"\"Extract counterparty IBAN and name from leading description words.\n\n    Returns (iban, name, remaining_words).\n    \"\"\"\n    if not desc_words:\n        return None, None, []\n\n    # Check if the first word starts an IBAN\n    if not _IBAN_START_RE.match(desc_words[0]):\n        return None, None, desc_words\n\n    country = desc_words[0][:2]\n    target_len = _IBAN_LENGTHS.get(country, 18)\n\n    iban_parts: list[str] = []\n    remaining = list(desc_words)\n\n    while remaining:\n        chunk = remaining[0]\n        current_len = sum(len(p) for p in iban_parts)\n        if current_len >= target_len:\n            break\n        if not iban_parts:\n            # First chunk: must be IBAN start\n            if _IBAN_START_RE.match(chunk):\n                iban_parts.append(chunk)\n                remaining.pop(0)\n            else:\n                break\n        else:\n            if _IBAN_CONT_RE.match(chunk) and current_len + len(chunk) \u003c= target_len:\n                iban_parts.append(chunk)\n                remaining.pop(0)\n            else:\n                break\n\n    iban = \"\".join(iban_parts) if len(\"\".join(iban_parts)) >= 8 else None\n\n    # Remaining words: name then more description\n    # Name ends when we hit something that looks like a description continuation\n    # Heuristic: name = first 1\u20135 words that are not pure-lowercase common words\n    # In practice: take all words on the same row after the IBAN\n    # The split between name and description is ambiguous from structure alone;\n    # we concatenate everything as description and keep name as counterparty_name.\n    name_parts: list[str] = []\n    desc_remaining: list[str] = []\n    # Name = words before any incasso marker or until we run out of same-row words\n    # We'll put everything in name since we'll also store the full description\n    for word in remaining:\n        name_parts.append(word)\n\n    name = \" \".join(name_parts) if name_parts else None\n    return iban, name, []\n\n\n# ---------------------------------------------------------------------------\n# Incasso metadata extraction\n# ---------------------------------------------------------------------------\n\ndef _extract_incasso_meta(full_desc: str) -> tuple[Optional[str], Optional[str]]:\n    \"\"\"Extract creditor_id and mandate_reference from full description text.\"\"\"\n    creditor_id: Optional[str] = None\n    mandate_ref: Optional[str] = None\n\n    m = _INCASSANT_ID_RE.search(full_desc)\n    if m:\n        creditor_id = m.group(1)\n\n    m = _MACHTIGING_RE.search(full_desc)\n    if m:\n        mandate_ref = m.group(1)\n\n    return creditor_id, mandate_ref\n\n\n# ---------------------------------------------------------------------------\n# Transaction row detect
