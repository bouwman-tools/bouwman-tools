   # Criterion 4: ABN AMRO has \"Datum\" at x0 \u2248 30; Rabobank never does\n    if any(t == \"Datum\" and x \u003c 50 for t, x in texts_with_x):\n        return False\n    # Criterion 5: Rabobank transaction dates are DD-MM at x0 \u003c 68\n    if not any(_DD_MM_RE.match(t) and x \u003c 68 for t, x in texts_with_x):\n        return False\n    return True\n\n\ndef _check_abn_pdf_v1(\n    texts: set[str],\n    texts_with_x: list[tuple[str, float]],\n) -> bool:\n    \"\"\"Return True iff all ABN_PDF_V1 structural criteria are satisfied.\n\n    Criteria (all must hold):\n    1. \"ABN\" and \"AMRO\" present                  \u2014 bank identity\n    2. \"Rekeninghouder\" at x0 \u003c 50               \u2014 left-margin account-holder label\n    3. \"Datum\" at x0 \u003c 42                        \u2014 left-margin transaction column header\n    4. \"Periode\" at x0 \u003c 50                      \u2014 left-margin period label\n    5. Dotted account number (DD.DD.DD.DDD)       \u2014 ABN AMRO account format\n    \"\"\"\n    if \"ABN\" not in texts or \"AMRO\" not in texts:\n        return False\n    if not any(t == \"Rekeninghouder\" and x \u003c 50 for t, x in texts_with_x):\n        return False\n    if not any(t == \"Datum\" and x \u003c 42 for t, x in texts_with_x):\n        return False\n    if not any(t == \"Periode\" and x \u003c 50 for t, x in texts_with_x):\n        return False\n    if not any(_DOTTED_ACCT_RE.match(t) for t, _ in texts_with_x):\n        return False\n    return True\n\n\n# ---------------------------------------------------------------------------\n# Bank identification (for targeted error messages)\n# ---------------------------------------------------------------------------\n\ndef _check_ing_pdf_v1(\n    texts: set[str],\n    texts_with_x: list[tuple[str, float]],\n) -> bool:\n    \"\"\"Return True iff all ING_PDF_V1 structural criteria are satisfied.\n\n    Criteria (all must hold):\n    1. \"Afschrift\" and \"Zakelijke\" and \"rekening\" present  \u2014 ING business statement header\n    2. \"Geboekt\" at x0 \u003c 70                               \u2014 \"Geboekt op\" column header\n    3. \"10SPYAP-A\" present                                 \u2014 ING-specific page print code\n    \"\"\"\n    if \"Afschrift\" not in texts or \"Zakelijke\" not in texts:\n        return False\n    if \"rekening\" not in texts:\n        return False\n    if not any(t == \"Geboekt\" and x \u003c 70 for t, x in texts_with_x):\n        return False\n    if _ING_PRINT_CODE not in texts:\n        return False\n    return True\n\n\ndef _check_asn_pdf_v1(\n    texts: set[str],\n    texts_with_x: list[tuple[str, float]],\n) -> bool:\n    \"\"\"Return True iff all ASN_PDF_V1 structural criteria are satisfied.\n\n    Criteria (all must hold):\n    1. \"Rekeningafschrift\" at x0 \u003c 70     \u2014 document type label, left-aligned\n    2. \"Rekeninghouder\" at x0 \u003c 70        \u2014 account holder label, left-aligned\n    3. \"Beginsaldo\" at x0 > 390           \u2014 opening balance label, right-aligned\n    4. \"Bij/Af\" at x0 between 105\u2013130     \u2014 transaction column header (unique to this layout)\n    \"\"\"\n    if not any(t == \"Rekeningafschrift\" and x \u003c 70 for t, x in texts_with_x):\n        return False\n    if not any(t == \"Rekeninghouder\" and x \u003c 70 for t, x in texts_with_x):\n        return False\n    if not any(t == \"Beginsaldo\" and x > 390 for t, x in texts_with_x):\n        return False\n    if not any(t == \"Bij/Af\" and 100 \u003c x \u003c 135 for t, x in texts_with_x):\n        return False\n    return True\n\n\ndef _detect_bank(texts: set[str]) -> Optional[str]:\n    \"\"\"Return the bank name if a bank-identity signal is found, else None.\"\"\"\n    if \"Rabobank\" in texts:\n        return \"Rabobank\"\n    if \"ABN\" in texts and \"AMRO\" in texts:\n        return \"ABN AMRO\"\n    if \"Afschrift\" in texts and \"Zakelijke\" in texts:\n        return \"ING\"\n    if \"Rekeninghouder\" in texts and \"Beginsaldo\" in texts and \"Bij/Af\" in texts:\n        return \"ASN Bank\"\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef detect(path: str | Path) -> LayoutProfile:\n    \"\"\"Detect which supported layout profile matches the PDF at *path*.\n\n    Returns\n    -------\n    LayoutProfile\n        The matched profile (RABO_PDF_V1 or ABN_PDF_V1).\n\n    Raises\n    ------\n    UnknownLayoutError\n        Always raised when no profile matches.  ``exc.bank`` is set when\n        the bank could be identified but its layout is not yet supported.\n    FileNotFoundError\n        When *path* does not exist (propagated from the extractor).\n    \"\"\"\n    texts, texts_with_x = _extract_page1_features(path)\n\n    if _check_rabo_pdf_v1(texts, texts_with_x):\n        return RABO_PDF_V1\n    if _check_abn_pdf_v1(texts, texts_with_x):\n        return ABN_PDF_V1\n    if _check_ing_pdf_v1(texts, texts_with_x):\n        return ING_PDF_V1\n    if _check_asn_pdf_v1(texts, texts_with_x):\n        return ASN_PDF_V1\n\n    # No profile matched \u2014 provide a targeted error message\n    bank = _detect_bank(texts)\n    if bank == \"Rabobank\":\n        raise UnknownLayoutError(\n            \"Rabobank PDF detected but layout does not match RABO_PDF_V1 \u2014 \"\n            \"the PDF may use a newer or different layout version\",\n            bank=\"Rabobank\",\n        )\n    if bank == \"ABN AMRO\":\n        raise UnknownLayoutError(\n            \"ABN AMRO PDF detected but layout does not match ABN_PDF_V1 \u2014 \"\n            \"the PDF may use a newer or different layout version\",\n            bank=\"ABN AMRO\",\n        )\n    if bank == \"ING\":\n        raise UnknownLayoutError(\n            \"ING PDF detected but layout does not match ING_PDF_V1 \u2014 \"\n            \"the PDF may use a newer or different layout version\",\n            bank=\"ING\",\n        )\n    if bank == \"ASN Bank\":\n        raise UnknownLayoutError(\n            \"ASN Bank PDF detected but layout does not match ASN_PDF_V1 \u2014 \"\n            \"the PDF may use a newer or different layout version\",\n            bank=\"ASN Bank\",\n        )\n    raise UnknownLayoutError(\n        \"PDF bank not recognised \u2014 no supported layout profile matches. \"\n        f\"Supported profiles: {[p.profile_id for p in _ALL_PROFILES]}\",\n        bank=None,\n    )\n\n\ndef get_parser(profile: LayoutProfile) -> Callable:\n    \"\"\"Return the ``parse_file(path) -> BankBridgeStatement`` callable for *profile*.\n\n    Raises\n    ------\n    ValueError\n        When *profile* has no registered parser (e.g. a profile defined\n        in tests but not yet implemented).\n    \"\"\"\n    # Imports are deferred to avoid circular dependencies at module load time\n    from bankbridge.parsers.rabobank.pdf_parser import parse_file as _rabo\n    from bankbridge.parsers.abnamro.pdf_parser import parse_file as _abn\n    from bankbridge.parsers.ing.pdf_parser import parse_file as _ing\n    from bankbridge.parsers.asn.pdf_parser import parse_file as _asn\n\n    _PARSER_REGISTRY: dict[str, Callable] = {\n        \"RABO_PDF_V1\": _rabo,\n        \"ABN_PDF_V1\": _abn,\n        \"ING_PDF_V1\": _ing,\n        \"ASN_PDF_V1\": _asn,\n    }\n\n    parser = _PARSER_REGISTRY.get(profile.profile_id)\n    if parser is None:\n        raise ValueError(\n            f\"No parser registered for layout profile {profile.profile_id!r}. \"\n            f\"Registered profiles: {list(_PARSER_REGISTRY)}\"\n        )\n    return parser\n", "bankbridge/parsers/rabobank/__init__.py": "", "bankbridge/parsers/rabobank/mt940_parser.py": "\"\"\"Rabobank MT940 (.swi / .sta) parser.\n\nParses Rabobank Structured MT940 files.  Each calendar-day block in the file\nbecomes one BankBridgeStatement.  The caller is responsible for deciding\nwhether to merge day-blocks into a monthly statement.\n\nRabobank MT940 deviates from SWIFT MT940 in several ways:\n- Starts with a proprietary :940: header (not a standard SWIFT block).\n- :25: contains IBAN + space + currency (not just account number).\n- :28C: uses YYMMNN format (not the standard NNNNN/NN).\n- :86: subfields use /KEY/ delimiters; BENM and ORDP are always empty\n  (the counterparty name follows as //NAME/\u003cname>).\n- Lines may exceed 65 characters in some fields.\n- The second line of :61: holds the counterparty account number.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"rabobank_mt940\"\nPARSER_VERSION = \"1.0.0\"\n\n# Matches the start of a tag line: :XX: (2-4 uppercase/digit chars)\n_TAG_LINE_RE = re.compile(r'^:([A-Z0-9]{2,4}):(.*)', re.DOTALL)\n\n# :60F: / :62F: balance: C/D + YYMMDD + 3-char currency + amount-with-comma\n_BALANCE_RE = re.compile(r'^([CD])(\\d{6})([A-Z]{3})([\\d,]+)$')\n\n# :61: first line\n_ENTRY_RE = re.compile(\n    r'^(\\d{6})'                   # value_date (YYMMDD)\n    r'(\\d{4})?'                   # entry_date (MMDD) \u2014 optional, rarely used\n    r'([CD])'                     # credit / debit indicator\n    r'([\\d,]{1,15})'              # amount (comma = decimal separator)\n    r'([FNS])'                    # transaction type (N = non-bank)\n    r'([A-Z0-9]{3})'              # bank transaction code (e.g. 544, 064)\n    r'([A-Z][A-Z0-9]{0,15})'     # customer reference type (EREF/NONREF/MARF)\n    r'(?://(.*))?$'               # optional bank reference after //\n)\n\n# :25: IBAN + currency\n_ACCOUNT_RE = re.compile(r'^([A-Z]{2}[A-Z0-9]{10,30})\\s+([A-Z]{3})$')\n\n# Top-level Rabobank :86: subfield keys.\n# Deliberately excludes NAME, CD, ISSR, CUR \u2014 those are sub-subfields of\n# BENM/ORDP/ULTD/ULTB (NAME) and PURP (CD), or appear inside ISO 20022\n# structured REMI values.\n_SUBFIELD_KEYS = frozenset([\n    'EREF', 'PREF', 'TRCD', 'BENM', 'ORDP', 'REMI', 'ISDT',\n    'MARF', 'CSID', 'RTRN', 'PURP', 'ULTD', 'ULTB',\n])\n\n_SUBFIELD_RE = re.compile(\n    r'/(' + '|'.join(sorted(_SUBFIELD_KEYS, key=len, reverse=True)) + r')/'\n)\n\n\n# ---------------------------------------------------------------------------\n# Low-level helpers\n# ---------------------------------------------------------------------------\n\ndef _parse_yymmdd(s: str) -> Optional[date]:\n    if len(s) != 6 or not s.isdigit():\n        return None\n    try:\n        return date(2000 + int(s[:2]), int(s[2:4]), int(s[4:]))\n    except ValueError:\n        return None\n\n\ndef _parse_amount(s: str) -> Optional[Decimal]:\n    try:\n        return Decimal(s.replace(',', '.'))\n    except InvalidOperation:\n        return None\n\n\ndef _parse_balance(raw: str, btype: BalanceType) -> Optional[Balance]:\n    m = _BALANCE_RE.match(raw.strip())\n    if not m:\n        return None\n    cd, date_str, currency, amount_str = m.groups()\n    d = _parse_yymmdd(date_str)\n    amount = _parse_amount(amount_str)\n    if d is None or amount is None:\n        return None\n    indicator = CreditDebitIndicator.CREDIT if cd == 'C' else CreditDebitIndicator.DEBIT\n    try:\n        return Balance(amount=amount, credit_debit=indicator,\n                       date=d, balance_type=btype, currency=currency)\n    except ValueError:\n        return None\n\n\n# ---------------------------------------------------------------------------\n# Tag extraction\n# ---------------------------------------------------------------------------\n\ndef _extract_tags(block: str) -> list[tuple[str, str]]:\n    \"\"\"Return ordered list of (tag_id, tag_value) from one statement block.\"\"\"\n    tags: list[tuple[str, str]] = []\n    current_tag: Optional[str] = None\n    current_lines: list[str] = []\n\n    for line in block.splitlines():\n        m = _TAG_LINE_RE.match(line)\n        if m:\n            if current_tag is not None:\n                tags.append((current_tag, '\\n'.join(current_lines)))\n            current_tag = m.group(1)\n            current_lines = [m.group(2)]\n        else:\n            if current_tag is not None:\n                current_lines.append(line)\n\n    if current_tag is not None:\n        tags.append((current_tag, '\\n'.join(current_lines)))\n\n    return tags\n\n\n# ---------------------------------------------------------------------------\n# :86: subfield parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_86_subfields(text: str) -> dict[str, str]:\n    \"\"\"Parse Rabobank :86: slash-delimited subfields.\n\n    Lines are concatenated directly (no separator) because Rabobank wraps\n    at the character level \u2014 continuation lines start exactly where the\n    previous line ended, sometimes mid-token.\n    \"\"\"\n    normalized = ''.join(text.splitlines())\n    result: dict[str, str] = {}\n\n    matches = list(_SUBFIELD_RE.finditer(normalized))\n    for i, m in enumerate(matches):\n        key = m.group(1)\n        value_start = m.end()\n        value_end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(normalized)\n        result[key] = normalized[value_start:value_end]\n\n    # BENM, ORDP, ULTD, ULTB: value is empty; counterparty name follows as\n    # //NAME/\u003cname> within the value slice.\n    for key in ('BENM', 'ORDP', 'ULTD', 'ULTB'):\n        if key in result:\n            stripped = result[key].lstrip('/')\n            if stripped.startswith('NAME/'):\n                result[key + '_NAME'] = stripped[5:]\n                result[key] = ''\n\n    # PURP: value may be empty; purpose code follows as //CD/\u003ccode>.\n    if 'PURP' in result:\n        stripped = result['PURP'].lstrip('/')\n        if stripped.startswith('CD/'):\n            result['PURP_CD'] = stripped[3:]\n            result['PURP'] = ''\n\n    return result\n\n\n# ---------------------------------------------------------------------------\n# Transaction parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_entry(\n    f61_value: str,\n    f86_value: str,\n    currency: str,\n    source_file: str,\n) -> Optional[BankBridgeTransaction]:\n    \"\"\"Parse one :61: + :86: pair into a BankBridgeTransaction.\"\"\"\n    lines = f61_value.splitlines()\n    if not lines:\n        return None\n\n    m = _ENTRY_RE.match(lines[0].strip())\n    if not m:\n        return None\n\n    (value_date_str, _entry_date_str, cd, amount_str,\n     txn_type, txn_code, cust_ref, bank_ref) = m.groups()\n\n    v_date = _parse_yymmdd(value_date_str)\n    amount = _parse_amount(amount_str)\n    if v_date is None or amount is None:\n        return None\n\n    indicator = CreditDebitIndicator.CREDIT if cd == 'C' else CreditDebitIndicator.DEBIT\n\n    # Line 2 of :61: = counterparty account (IBAN or \"9000000001\")\n    counterparty_iban: Optional[str] = None\n    if len(lines) > 1:\n        raw_account = lines[1].strip()\n        if raw_account and raw_account != '9000000001' and raw_account[:2].isalpha():\n            counterparty_iban = raw_account\n\n    sub = _parse_86_subfields(f86_value) if f86_value else {}\n\n    # Counterparty name: BENM_NAME for outgoing (debit), ORDP_NAME for incoming\n    counterparty_name = sub.get('BENM_NAME') or sub.get('ORDP_NAME')\n\n    # Mandate reference\n    mandate_ref = sub.get('MARF') or (bank_ref if cust_ref == 'MARF' else None)\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        booking_date=v_date,\n        value_date=v_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=indicator,\n        counterparty_name=counterparty_name,\n        counterparty_iban=counterparty_iban,\n        description=sub.get('REMI') or None,\n        payment_reference=sub.get('PREF') or sub.get('EREF') or None,\n        end_to_end_id=sub.get('EREF') or None,\n        mandate_reference=mandate_ref,\n        bank_reference=bank_ref or None,\n        original_text=[f61_value] + ([f86_value] if f86_value else []),\n        extraction_method=ExtractionMethod.MT940_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(\n            source_raw_code=txn_code,\n            source_indicator=cust_ref,\n        ),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Block parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_block(block: str, source_file: str) -> Optional[BankBridgeStatement]:\n    \"\"\"Parse one MT940 statement block (one day) into a BankBridgeStatement.\"\"\"\n    tags = _extract_tags(block)\n    if not tags:\n        return None\n\n    # Build lookup dict (last value wins for duplicate tags)\n    tag_dict: dict[str, str] = {tid: val for tid, val in tags}\n\n    # :25: IBAN + currency\n    iban: Optional[str] = None\n    currency = 'EUR'\n    m = _ACCOUNT_RE.match(tag_dict.get('25', '').strip())\n    if m:\n        iban, currency = m.group(1), m.group(2)\n\n    opening_balance = _parse_balance(tag_dict.get('60F', ''), BalanceType.OPENING_BOOKED)\n    closing_balance = _parse_balance(tag_dict.get('62F', ''), BalanceType.CLOSING_BOOKED)\n\n    period_date: Optional[date] = closing_balance.date if closing_balance else None\n\n    # Walk tags in order; pair :61: with the immediately following :86:\n    transactions: list[BankBridgeTransaction] = []\n    pending_61: Optional[str] = None\n\n    for tag_id, value in tags:\n        if tag_id == '61':\n            if pending_61 is not None:\n                # :61: without :86: \u2014 create transaction with empty details\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n            pending_61 = value\n        elif tag_id == '86':\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, value, currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n        elif tag_id not in ('64', '65'):\n            # Any structural tag (60F, 62F, 20, 25, 28C) flushes a lone :61:\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n\n    # Flush any trailing lone :61:\n    if pending_61 is not None:\n        txn = _parse_entry(pending_61, '', currency, source_file)\n        if txn:\n            transactions.append(txn)\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.MT940_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        bank='Rabobank',\n        iban=iban,\n        currency=currency,\n        statement_number=tag_dict.get('28C', '') or None,\n        period_start=period_date,\n        period_end=period_date,\n        opening_balance=opening_balance,\n        closing_balance=closing_balance,\n        transactions=transactions,\n    )\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(content: str, source_file: str = \"\") -> list[BankBridgeStatement]:\n    \"\"\"Parse a Rabobank MT940 file.\n\n    Returns one BankBridgeStatement per day-block found in the file.\n    The caller may aggregate these into a monthly statement if needed.\n\n    Args:\n        content:     Raw file content (str, any line ending).\n        source_file: Original file path, stored on each statement for audit.\n    \"\"\"\n    content = content.strip()\n\n    # Strip Rabobank's proprietary :940: file-type header\n    if content.startswith(':940:'):\n        content = content[5:].lstrip('\\r\\n')\n\n    # Split into blocks at each :20: tag at line start\n    raw_blocks = re.split(r'(?m)(?=^:20:)', content)\n\n    statements: list[BankBridgeStatement] = []\n    for block in raw_blocks:\n        block = block.strip()\n        if not block:\n            continue\n        stmt = _parse_block(block, source_file)\n        if stmt is not None:\n            statements.append(stmt)\n\n    return statements\n", "bankbridge/parsers/rabobank/pdf_parser.py": "\"\"\"Rabobank Rekeningafschrift PDF parser.\n\nParses a RawDocument (produced by pdfminer_extractor) into a\nBankBridgeStatement.  Relies on fixed column x-positions that are stable\nacross Rabobank Rekeningafschrift PDFs.\n\nColumn layout (in points, from left edge):\n    Date      : x0  30\u201368\n    Type      : x0  68\u201390\n    IBAN      : x0  88\u2013~230  (long IBANs overflow into desc column)\n    Name/desc : x0 205\u2013415\n    Debet     : x0 415\u2013480\n    Credit    : x0 480\u2013580\n\nPage structure:\n    Page 1: header section (y1_bl > PAGE_H-258) + transactions\n    Pages 2+: repeated mini-header (y1_bl > PAGE_H-264) + transactions\n    Transactions: any row with DD-MM date at x0\u003c68 AND type code at 65\u003cx0\u003c90\n\nThe transaction rows of all pages are read as one continuous stream: a\ntransaction that starts near the foot of a page carries its description and\nVerwerkingsdatum onto the next one.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom pathlib import Path\nfrom typing import Optional\n\nfrom bankbridge.extractors.raw_document import RawDocument, RawPage, RawTextElement\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"rabobank_pdf\"\nPARSER_VERSION = \"1.2.0\"\n\n# \u2500\u2500 Column x boundaries \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n_X_TYPE_RIGHT = 90\n_X_DEBET_LEFT = 415\n_X_DEBET_RIGHT = 480\n_X_CREDIT_LEFT = 480\n_X_CREDIT_RIGHT = 585\n\n# y1_bl (bottom-left) threshold: rows with y1 > PAGE_H - 264 are page header\n_Y_HEADER_TOP_FROM_TOP = 264   # pts from page top\n\n# \u2500\u2500 Patterns \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n_IBAN_START_RE = re.compile(r\"^[A-Z]{2}\\d{2}$\")        # e.g. NL21, DE19\n_IBAN_CONT_RE = re.compile(r\"^[A-Z0-9]{2,6}$\")         # e.g. RABO, 0379, 25\n_BIC_RE = re.compile(r\"^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$\")\n_DATE_DD_MM_RE = re.compile(r\"^\\d{2}-\\d{2}$\")\n_DATE_FULL_RE = re.compile(r\"^\\d{2}-\\d{2}-\\d{4}$\")\n_AMOUNT_RE = re.compile(r\"^\\d[\\d.]*,\\d{2}$\")\n\n# Saldo-tekens zoals de PDF ze zelf in de voettekst verklaart:\n#   \"CR = tegoed\"  (positief saldo)   \"D = tekort\"  (negatief saldo)\n# Geen andere symbolen toevoegen zonder een afschrift dat ze aantoont.\n_BALANCE_CREDIT_SYMBOLS = frozenset([\"CR\"])\n_BALANCE_DEBIT_SYMBOLS = frozenset([\"D\"])\n\n_CURRENCY_CODES = frozenset(\n    [\"EUR\", \"USD\", \"GBP\", \"CHF\", \"JPY\", \"AUD\", \"CAD\", \"SEK\", \"NOK\", \"DKK\", \"PLN\"]\n)\n\n# Standard IBAN lengths by country code (ISO 13616)\n_IBAN_LENGTHS: dict[str, int] = {\n    \"AL\": 28, \"AD\": 24, \"AT\": 20, \"AZ\": 28, \"BE\": 16, \"BH\": 22,\n    \"BY\": 28, \"BA\": 20, \"BR\": 29, \"BG\": 22, \"CR\": 22, \"HR\": 21,\n    \"CY\": 28, \"CZ\": 24, \"DK\": 18, \"DO\": 28, \"EE\": 20, \"EG\": 29,\n    \"FO\": 18, \"FI\": 18, \"FR\": 27, \"GE\": 22, \"DE\": 22, \"GI\": 23,\n    \"GR\": 27, \"GL\": 18, \"GT\": 28, \"HU\": 28, \"IS\": 26, \"IQ\": 23,\n    \"IE\": 22, \"IL\": 23, \"IT\": 27, \"JO\": 30, \"KZ\": 20, \"XK\": 20,\n    \"KW\": 30, \"LV\": 21, \"LB\": 28, \"LI\": 21, \"LT\": 20, \"LU\": 20,\n    \"MT\": 31, \"MR\": 27, \"MU\": 30, \"MD\": 24, \"MC\": 27, \"ME\": 22,\n    \"NL\": 18, \"MK\": 19, \"NO\": 15, \"PK\": 24, \"PS\": 29, \"PL\": 28,\n    \"PT\": 25, \"QA\": 29, \"RO\": 24, \"SM\": 27, \"SA\": 24, \"RS\": 22,\n    \"SK\": 24, \"SI\": 19, \"ES\": 24, \"SE\": 24, \"CH\": 21, \"TL\": 23,\n    \"TN\": 24, \"TR\": 26, \"UA\": 29, \"AE\": 23, \"GB\": 22, \"VA\": 22,\n    \"VG\": 24,\n}\n\n# Transaction type codes, taken verbatim from the legend Rabobank prints at the\n# foot of the last page of every Rekeningafschrift (\"ba = betaalautomaat  \u2026\").\n# That legend is the authoritative list; do not add a code without a statement\n# that shows it.  A code that is missing here makes the row fail _is_txn_row, so\n# the transaction is dropped and BALANCE_MISMATCH turns the statement RED \u2014\n# loud, but only after the fact.\n_TYPE_CODES = frozenset(\n    [\n        \"ba\",  # betaalautomaat\n        \"bc\",  # betalen contactloos\n        \"bg\",  # betaalopdracht\n        \"bv\",  # Betaalverzoek\n        \"cb\",  # crediteurenbetaling\n        \"cc\",  # creditcard\n        \"cp\",  # Cash Pooling\n        \"db\",  # diverse boekingen\n        \"eb\",  # bedrijven Euro-incasso\n        \"ec\",  # E-commerce\n        \"ei\",  # Euro-incasso\n        \"ga\",  # geldautomaat Euro\n        \"gb\",  # geldautomaat VV\n        \"id\",  # iDEAL\n        \"kh\",  # kashandeling\n        \"ok\",  # OmniKassa\n        \"sb\",  # salarisbetaling\n        \"sp\",  # Spoedbetaling\n        \"st\",  # storno Euro-incasso\n        \"tb\",  # eigen rekening\n        \"te\",  # terugboeking Eurobetaling\n        \"wb\",  # wereldbetaling\n        \"we\",  # Wero (co branded)\n        \"wr\",  # Wero\n    ]\n)\n\n# Document legend rows contain only SYMBOL = word pairs (e.g. \"CR = tegoed D = tekort\").\n# These are layout annotations explaining column labels, not transaction data.\n# Limit code segment to \u22642 uppercase chars to avoid matching business abbreviations.\n_LEGEND_ROW_RE = re.compile(\n    r\"^[A-Z]{1,2}\\s*=\\s*\\w+(?:\\s+[A-Z]{1,2}\\s*=\\s*\\w+)*$\"\n)\n\n# Suffix pattern: removes trailing legend annotations from a mixed content row\n# (e.g. \"Debetrente CR = tegoed D = tekort\" -> \"Debetrente\").\n_LEGEND_SUFFIX_RE = re.compile(\n    r\"\\s+(?:[A-Z]{1,2}\\s*=\\s*\\w+\\s*)+\"\n    r\"$\"\n)\n\n# The transaction type-code legend printed at the foot of the last page\n# (\"ba = betaalautomaat  cp = Cash Pooling  gb = geldautomaat VV  \u2026\").  On a\n# long statement it sits above the header threshold and is filtered out with\n# the page header; on a short one it lands inside the transaction area, where\n# it would otherwise be appended to the description of the last transaction.\n# The block is laid out in four columns, so requiring three code=value pairs\n# on a row that also starts with one keeps real description text out.\n_TYPE_LEGEND_START_RE = re.compile(r\"^[a-z]{2}\\s*=\\s*\\S\")\n_TYPE_LEGEND_PAIR_RE = re.compile(r\"(?:^|\\s)[a-z]{2}\\s*=\\s*\\S\")\n_TYPE_LEGEND_MIN_PAIRS = 3\n\n\n# Leading-period artifact: a lone \".\" at the start of a description line is a\n# PDF document separator element (e.g. a rule or bullet) that the extractor\n# picks up as text.  It is never legitimate description content.\n_LEADING_PERIOD_RE = re.compile(r\"^\\.\\s+\")\n\n\n# \u2500\u2500 Low-level helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _parse_amount(text: str) -> Optional[Decimal]:\n    try:\n        return Decimal(text.replace(\".\", \"\").replace(\",\", \".\"))\n    except InvalidOperation:\n        return None\n\n\ndef _parse_date_full(text: str) -> Optional[date]:\n    try:\n        d, m, y = text.split(\"-\")\n        return date(int(y), int(m), int(d))\n    except (ValueError, TypeError):\n        return None\n\n\ndef _parse_date_dm(text: str, year: int) -> Optional[date]:\n    try:\n        d, m = text.split(\"-\")\n        return date(year, int(m), int(d))\n    except (ValueError, TypeError):\n        return None\n\n\n# \u2500\u2500 Row grouping \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nclass _Row:\n    \"\"\"Elements grouped by y1 proximity \u2014 represents one visual line.\"\"\"\n\n    __slots__ = (\"elems\", \"y\", \"page\")\n\n    def __init__(self, elems: list[RawTextElement]) -> None:\n        self.elems: list[RawTextElement] = sorted(elems, key=lambda e: e.x0)\n        self.y: float = elems[0].y1 if elems else 0.0\n        self.page: int = elems[0].page if elems else 0\n\n    def texts(self) -> list[str]:\n        return [e.text for e in self.elems]\n\n    def joined(self) -> str:\n        return \" \".join(e.text for e in self.elems)\n\n    def words_in(self, x0: float, x1: float) -> list[str]:\n        # Use x0 only: a word belongs to a column when it starts there.\n        return [e.text for e in self.elems if e.x0 >= x0 and e.x0 \u003c= x1]\n\n    def elems_left_of(self, x: float) -> list[RawTextElement]:\n        return [e for e in self.elems if e.x0 \u003c x]\n\n    def elems_between(self, x0: float, x1: float) -> list[RawTextElement]:\n        return [e for e in self.elems if e.x0 >= x0 and e.x0 \u003c x1]\n\n    def has_text(self, text: str) -> bool:\n        return any(text in e.text for e in self.elems)\n\n\ndef _group_rows(\n    elements: list[RawTextElement], y_tolerance: float = 3.0\n) -> list[_Row]:\n    \"\"\"Group elements into visual rows by y1 proximity (top edge, bottom-left).\"\"\"\n    if not elements:\n        return []\n    by_y = sorted(elements, key=lambda e: -e.y1)  # highest y1 first\n    groups: list[list[RawTextElement]] = [[by_y[0]]]\n    for elem in by_y[1:]:\n        if abs(elem.y1 - groups[-1][0].y1) \u003c= y_tolerance:\n            groups[-1].append(elem)\n        else:\n            groups.append([elem])\n    return [_Row(g) for g in groups]\n\n\n# \u2500\u2500 Legend row detection \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _is_legend_row(row: _Row) -> bool:\n    \"\"\"True when a row consists entirely of SYMBOL = word pairs.\n\n    Catches whole-row legend elements (e.g. a continuation row that is only\n    \"CR = tegoed D = tekort\").  Rows that start with real content but end with\n    a legend suffix are handled by ``_strip_legend_suffix``.\n    \"\"\"\n    return bool(_LEGEND_ROW_RE.match(row.joined().strip()))\n\n\ndef _is_type_legend_row(row: _Row) -> bool:\n    \"\"\"True when a row is part of the printed transaction type-code legend.\"\"\"\n    text = row.joined().strip()\n    if not _TYPE_LEGEND_START_RE.match(text):\n        return False\n    return len(_TYPE_LEGEND_PAIR_RE.findall(text)) >= _TYPE_LEGEND_MIN_PAIRS\n\n\ndef _strip_legend_suffix(text: str) -> str:\n    \"\"\"Remove trailing legend annotation from a description string.\n\n    Handles the case where the legend appears on the same visual line as real\n    content (e.g. \"Debetrente CR = tegoed D = tekort\" -> \"Debetrente\").\n    When the entire text is a legend (no real description before it),\n    returns empty string so callers can safely apply ``or None``.\n    \"\"\"\n    if _LEGEND_ROW_RE.match(text.strip()):\n        return \"\"\n    return _LEGEND_SUFFIX_RE.sub(\"\", text).strip()\n\n\n# \u2500\u2500 IBAN / name extraction \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _extract_iban_name(row: _Row) -> tuple[Optional[str], Optional[str]]:\n    \"\"\"Extract counterparty IBAN and name from a transaction header row.\n\n    Uses country-specific IBAN length to stop collecting groups at the right\n    boundary \u2014 prevents company abbreviations (RDW, KLM, BCA \u2026) from being\n    absorbed into the IBAN when they happen to look like alphanumeric groups.\n    \"\"\"\n    # IBAN groups start at x0\u224888.72; type codes end at x0\u226479. Use 82 as safe boundary.\n    candidates = [\n        e for e in row.elems if e.x0 >= 82 and e.x0 \u003c _X_DEBET_LEFT\n    ]\n\n    iban_parts: list[str] = []\n    name_parts: list[str] = []\n    iban_started = False\n    iban_ended = False\n    expected_len: Optional[int] = None\n\n    for e in candidates:\n        t = e.text\n        if not iban_started:\n            if _IBAN_START_RE.match(t):\n                iban_started = True\n                iban_parts.append(t)\n                expected_len = _IBAN_LENGTHS.get(t[:2])\n            else:\n                name_parts.append(t)\n        elif not iban_ended:\n            current_len = sum(len(p) for p in iban_parts)\n            # Stop if the IBAN is already complete for this country\n            if expected_len and current_len >= expected_len:\n                iban_ended = True\n                name_parts.append(t)\n            elif t in _CURRENCY_CODES:\n                iban_ended = True\n            elif _IBAN_CONT_RE.match(t):\n                if expected_len:\n                    new_len = current_len + len(t)\n                    if new_len \u003c= expected_len:\n                        iban_parts.append(t)\n                    else:\n                        iban_ended = True\n                        name_parts.append(t)\n                else:\n                    iban_parts.append(t)\n            else:\n                iban_ended = True\n                name_parts.append(t)\n        else:\n            name_parts.append(t)\n\n    iban = \"\".join(iban_parts) if iban_parts else None\n    name = \" \".join(name_parts) if name_parts else None\n    return iban, name\n\n\ndef _extract_header_iban_bic(row: _Row) -> tuple[Optional[str], Optional[str]]:\n    \"\"\"Extract own-account IBAN and BIC from the statement header row.\"\"\"\n    iban_parts: list[str] = []\n    iban_started = False\n    iban_ended = False\n    bic: Optional[str] = None\n\n    for e in row.elems:\n        t = e.text\n        if not iban_started:\n            if _IBAN_START_RE.match(t):\n                iban_started = True\n                iban_parts.append(t)\n        elif not iban_ended:\n            if t in _CURRENCY_CODES:\n                iban_ended = True\n            elif _IBAN_CONT_RE.match(t):\n                iban_parts.append(t)\n            else:\n                iban_ended = True\n        else:\n            if _BIC_RE.match(t) and len(t) in (8, 11):\n                bic = t\n                break\n\n    iban = \"\".join(iban_parts) if iban_parts else None\n    return iban, bic\n\n\n# \u2500\u2500 Amount extraction \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _get_amount(row: _Row) -> tuple[Optional[Decimal], Optional[CreditDebitIndicator]]:\n    debet = row.words_in(_X_DEBET_LEFT, _X_DEBET_RIGHT)\n    credit = row.words_in(_X_CREDIT_LEFT, _X_CREDIT_RIGHT)\n    if debet:\n        amt = _parse_amount(\" \".join(debet))\n        if amt is not None:\n            return amt, CreditDebitIndicator.DEBIT\n    if credit:\n        amt = _parse_amount(\" \".join(credit))\n        if amt is not None:\n            return amt, CreditDebitIndicator.CREDIT\n    return None, None\n\n\n# \u2500\u2500 Transaction detection \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _is_txn_row(row: _Row) -> bool:\n    date_ok = any(\n        _DATE_DD_MM_RE.match(e.text) and e.x0 \u003c 68 for e in row.elems\n    )\n    type_ok = any(\n        e.text.lower() in _TYPE_CODES and 65 \u003c e.x0 \u003c 90 for e in row.elems\n    )\n    return date_ok and type_ok\n\n\n# \u2500\u2500 Balance extraction from a row \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _row_to_balance(row: _Row, btype: BalanceType) -> Optional[Balance]:\n    \"\"\"Read one begin- or eindsaldo row: date, amount and sign symbol.\n\n    The sign symbols come from the legend the document prints itself in the\n    page footer: \"CR = tegoed\" and \"D = tekort\".  Rabobank never prints a bare\n    \"C\" for a credit balance, so a statement that closes in the black used to\n    yield no balance at all and, through the missing period, a fallback year\n    for every transaction date.\n    \"\"\"\n    words = row.texts()\n    bal_date = next((_parse_date_full(w) for w in words if _DATE_FULL_RE.match(w)), None)\n    amount = next((_parse_amount(w) for w in words if _AMOUNT_RE.match(w)), None)\n    indicator: Optional[CreditDebitIndicator] = None\n    for w in words:\n        if w in _BALANCE_CREDIT_SYMBOLS:\n            indicator = CreditDebitIndicator.CREDIT\n            break\n        if w in _BALANCE_DEBIT_SYMBOLS:\n            indicator = CreditDebitIndicator.DEBIT\n            break\n    if bal_date and amount is not None and indicator:\n        return Balance(\n            amount=amount,\n            credit_debit=indicator,\n            date=bal_date,\n            balance_type=btype,\n            currency=\"EUR\",\n        )\n    return None\n\n\n# \u2500\u2500 Header page parsing \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _parse_header(page: RawPage) -> dict:\n    \"\"\"Extract statement metadata from the first page header section.\"\"\"\n    page_h = page.height\n    header_y1_min = page_h - _Y_HEADER_TOP_FROM_TOP\n\n    # Only elements in the header section (top of page)\n    header_elems = [e for e in page.elements if e.y1 > header_y1_min]\n    rows = _group_rows(header_elems)\n    rows_top_down = sorted(rows, key=lambda r: -r.y)\n\n    result: dict = {\n        \"account_holder\": None,\n        \"iban\": None,\n        \"bic\": None,\n        \"period_start\": None,\n        \"period_end\": None,\n        \"opening_balance\": None,\n        \"closing_balance\": None,\n    }\n\n    name_label_passed = False\n    opening_label_passed = False\n    closing_label_passed = False\n    iban_label_passed = False\n\n    for row in rows_top_down:\n        texts = row.texts()\n        joined = \" \".join(texts)\n\n        # Account holder name: first left-side row after \"Ten name van\" label\n        if not name_label_passed and \"Ten\" in texts and \"name\" in texts and \"van\" in texts:\n            name_label_passed = True\n            continue\n        if name_label_passed and result[\"account_holder\"] is None:\n            left_words = [e.text for e in row.elems if e.x0 \u003c 200]\n            if left_words:\n                result[\"account_holder\"] = \" \".join(left_words)\n\n        # Opening balance: row with \"Beginsaldo\" label\n        if not opening_label_passed and \"Beginsaldo\" in texts:\n            opening_label_passed = True\n            # Value might be on same row or next\n            bal = _row_to_balance(row, BalanceType.OPENING_BOOKED)\n            if bal:\n                result[\"opening_balance\"] = bal\n                result[\"period_start\"] = bal.date\n            continue\n        if opening_label_passed and result[\"opening_balance\"] is None:\n            bal = _row_to_balance(row, BalanceType.OPENING_BOOKED)\n            if bal:\n                result[\"opening_balance\"] = bal\n                result[\"period_start\"] = bal.date\n\n        # Closing balance: row with \"Eindsaldo\" label\n        if not closing_label_passed and \"Eindsaldo\" in texts:\n            closing_label_passed = True\n            bal = _row_to_balance(row, BalanceType.CLOSING_BOOKED)\n            if bal:\n                result[\"closing_balance\"] = bal\n                result[\"period_end\"] = bal.date\n            continue\n        if closing_label_passed and result[\"closing_balance\"] is None:\n            bal = _row_to_balance(row, BalanceType.CLOSING_BOOKED)\n            if bal:\n                result[\"closing_balance\"] = bal\n                result[\"period_end\"] = bal.date\n\n        # IBAN + BIC: row after \"Rekeningnummer\" label that contains an IBAN_START pattern\n        if not iban_label_passed and \"Rekeningnummer\" in joined:\n            iban_label_passed = True\n            continue\n        if iban_label_passed and result[\"iban\"] is None:\n            if any(_IBAN_START_RE.match(t) for t in texts):\n                ib, bic = _extract_header_iban_bic(row)\n                result[\"iban\"] = ib\n                result[\"bic\"] = bic\n\n    return result\n\n\n# \u2500\u2500 Transaction parsing \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef _build_transaction(\n    header_row: _Row,\n    cont_rows: list[_Row],\n    year: int,\n    source_file: str,\n    currency: str,\n) -> Optional[BankBridgeTransaction]:\n    # Date\n    date_word = next(\n        (e.text for e in header_row.elems if _DATE_DD_MM_RE.match(e.text) and e.x0 \u003c 68),\n        None,\n    )\n    if not date_word:\n        return None\n    booking_date = _parse_date_dm(date_word, year)\n    if not booking_date:\n        return None\n\n    # Type code\n    type_word = next(\n        (e.text.lower() for e in header_row.elems if e.text.lower() in _TYPE_CODES and 65 \u003c e.x0 \u003c 90),\n        None,\n    )\n\n    # Amount + direction\n    amount, debit_credit = _get_amount(header_row)\n    if amount is None:\n        return None\n\n    # IBAN + name on header row\n    counterparty_iban, name_on_header = _extract_iban_name(header_row)\n\n    # Continuation rows: split into name line (if needed) + description + processing date\n    value_date = booking_date\n    desc_lines: list[str] = []\n    name_from_cont: Optional[str] = None\n\n    for cont_row in cont_rows:\n        words = cont_row.texts()\n        row_text = \" \".join(words)\n\n        if \"Verwerkingsdatum:\" in row_text:\n            for w in words:\n                if _DATE_FULL_RE.match(w):\n                    vd = _parse_date_full(w)\n                    if vd:\n                        value_date = vd\n                    break\n        elif _is_legend_row(cont_row) or _is_type_legend_row(cont_row):\n            pass  # document legend element \u2014 not transaction data\n        elif row_text.strip():\n            desc_lines.append(row_text.strip())\n\n    counterparty_name = name_on_header\n    if not counterparty_name and desc_lines:\n        counterparty_name = desc_lines.pop(0)\n\n    description_raw = \" \".join(desc_lines) if desc_lines else None\n    if description_raw:\n        description_raw = _LEADING_PERIOD_RE.sub(\"\", description_raw).strip()\n    description = _strip_legend_suffix(description_raw) if description_raw else None\n\n    original = [header_row.joined()] + [r.joined() for r in cont_rows]\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        source_page=header_row.page,\n        original_text=original,\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        booking_date=booking_date,\n        value_date=value_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=debit_credit,\n        counterparty_name=counterparty_name,\n        counterparty_iban=counterparty_iban,\n        description=description,\n        transaction_codes=TransactionCodes(\n            source_raw_code=type_word,\n            source_indicator=None,\n        ),\n    )\n\n\ndef _transaction_rows(page: RawPage) -> list[_Row]:\n    \"\"\"Rows of one page that sit below the header zone, in reading order.\"\"\"\n    txn_y1_max = page.height - _Y_HEADER_TOP_FROM_TOP\n    txn_elems = [e for e in page.elements if e.y1 \u003c= txn_y1_max]\n    return sorted(_group_rows(txn_elems), key=lambda r: -r.y)\n\n\ndef _parse_transactions(\n    pages: list[RawPage], year: int, source_file: str, currency: str\n) -> list[BankBridgeTransaction]:\n    \"\"\"Parse transactions from all pages as one continuous stream of rows.\n\n    A transaction that starts near the foot of a page keeps its description and\n    Verwerkingsdatum on the next page, above that page's first transaction.\n    Parsing each page in isolation left those rows behind the first transaction\n    of the page, where the loop skipped them and the text was lost.\n    \"\"\"\n    rows_top_down: list[_Row] = []\n    for page in pages:\n        rows_top_down.extend(_transaction_rows(page))\n\n    transactions: list[BankBridgeTransaction] = []\n    i = 0\n\n    while i \u003c len(rows_top_down):\n        row = rows_top_down[i]\n        if _is_txn_row(row):\n            # Collect continuation rows until next transaction or end\n            cont: list[_Row] = []\n            j = i + 1\n            while j \u003c len(rows_top_down) and not _is_txn_row(rows_top_down[j]):\n                cont.append(rows_top_down[j])\n                j += 1\n\n            txn = _build_transaction(row, cont, year, source_file, currency)\n            if txn:\n                transactions.append(txn)\n            i = j\n        else:\n            i += 1\n\n    return transactions\n\n\n# \u2500\u2500 Public API \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\ndef parse(doc: RawDocument, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse a Rabobank PDF RawDocument into a BankBridgeStatement.\"\"\"\n    if not doc.pages:\n        return BankBridgeStatement(\n            extraction_method=ExtractionMethod.PDF_DIGITAL,\n            parser_name=PARSER_NAME,\n            parser_version=PARSER_VERSION,\n            layout_profile=\"RABO_PDF_V1\",\n            bank=\"Rabobank\",\n            source_file=source_file,\n        )\n\n    header = _parse_header(doc.pages[0])\n    year = (header[\"period_start\"] or header[\"period_end\"] or date.today()).year\n    currency = \"EUR\"\n\n    transactions = _parse_transactions(doc.pages, year, source_file, currency)\n\n    return BankBridgeStatement(\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        layout_profile=\"RABO_PDF_V1\",\n        bank=\"Rabobank\",\n        source_file=source_file,\n        source_hash=doc.source_hash,\n        account_holder=header[\"account_holder\"],\n        iban=header[\"iban\"],\n        bic=header[\"bic\"],\n        currency=currency,\n        period_start=header[\"period_start\"],\n        period_end=header[\"period_end\"],\n        opening_balance=header[\"opening_balance\"],\n        closing_balance=header[\"closing_balance\"],\n        transactions=transactions,\n    )\n\n\ndef parse_file(path: str | Path) -> BankBridgeStatement:\n    \"\"\"Parse a Rabobank PDF Rekeningafschrift directly (convenience wrapper).\"\"\"\n    from bankbridge.extractors.pdf.pdfminer_extractor import extract\n\n    doc = path if isinstance(path, RawDocument) else extract(path)\n    return parse(doc, source_file=doc.source_file)\n", "bankbridge/utils/__init__.py": "", "bankbridge/utils/amounts.py": "\"\"\"Amount parsing and formatting utilities.\n\nAll financial amounts in BankBridge are represented as ``Decimal``.\nThis module handles conversion from the various notations found in\nsource documents.\n\nSupported source notations\n---------------------------\nDutch/European:\n  1.234,56   period=thousands, comma=decimal\n  1234,56    no thousands separator\n  1 234,56   space=thousands, comma=decimal\n\nEnglish/SWIFT:\n  1,234.56   comma=thousands, period=decimal\n  1234.56    no thousands separator\n\nSigned:\n  -123,45    explicit minus\n  +123,45    explicit plus\n\nThe parsed ``amount`` is always ``Decimal >= 0``.  The raw sign character\nis returned separately so the caller can map it to a\n``CreditDebitIndicator`` using bank-specific conventions \u2014 BankBridge\ndoes not assume that a minus sign means DEBIT.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\n\n# Matches an optional sign, then the amount body, then trailing whitespace\n_SIGN_RE = re.compile(r'^\\s*(?P\u003csign>[+\\-])?\\s*(?P\u003cbody>.+?)\\s*$', re.DOTALL)\n# Currency symbol prefix (strip before parsing)\n_CURRENCY_RE = re.compile(r'^[\u20ac$\u00a3\u00a5\u20b9]')\n\n\ndef parse_amount(text: str) -> tuple[Decimal, Optional[str]]:\n    \"\"\"Parse an amount string into ``(Decimal, sign)``.\n\n    Parameters\n    ----------\n    text:\n        Raw amount string from a source document.\n\n    Returns\n    -------\n    amount:\n        Always ``>= 0``.\n    sign:\n        ``'+'``, ``'-'``, or ``None`` when no explicit sign was present.\n\n    Raises\n    ------\n    ValueError\n        When the string cannot be parsed as a numeric amount.\n\n    Notes\n    -----\n    An explicit sign in the source document does NOT automatically map to\n    a ``CreditDebitIndicator``.  The caller must apply bank-specific\n    conventions to determine whether a minus means DEBIT.\n    \"\"\"\n    if not text or not text.strip():\n        raise ValueError(\"Empty amount string\")\n\n    m = _SIGN_RE.match(text)\n    if not m:\n        raise ValueError(f\"Cannot parse amount: {text!r}\")\n\n    sign: Optional[str] = m.group(\"sign\")  # '+', '-', or None\n    body = m.group(\"body\")\n\n    # Strip currency symbol if present\n    body = _CURRENCY_RE.sub(\"\", body).strip()\n\n    if not body:\n        raise ValueError(f\"Amount body is empty after stripping sign/currency: {text!r}\")\n\n    # --- Determine decimal and thousands separators ----------------------\n    has_comma = \",\" in body\n    has_period = \".\" in body\n    has_space = \" \" in body\n\n    if has_comma and has_period:\n        # Both present \u2014 the one that appears last is the decimal separator\n        last_comma = body.rfind(\",\")\n        last_period = body.rfind(\".\")\n        if last_comma > last_period:\n            # e.g. 1.234,56 \u2192 decimal is comma\n            cleaned = body.replace(\".\", \"\").replace(\",\", \".\")\n        else:\n            # e.g. 1,234.56 \u2192 decimal is period\n            cleaned = body.replace(\",\", \"\")\n\n    elif has_comma:\n        # Only comma \u2014 treat as decimal separator\n        # e.g. 1234,56 or 1 234,56\n        cleaned = body.replace(\" \", \"\").replace(\",\", \".\")\n\n    elif has_period:\n        # Only period \u2014 ambiguous; resolve by position\n        parts = body.replace(\" \", \"\").split(\".\")\n        if len(parts) == 2 and len(parts[1]) == 3 and parts[0].isdigit():\n            # e.g. \"1.234\" \u2014 3 digits after sole period: likely thousands separator\n            # In a financial context this is the most common ambiguous case.\n            # We treat it as an integer (no decimal part).\n            cleaned = body.replace(\" \", \"\").replace(\".\", \"\")\n        else:\n            # e.g. \"1234.56\", \"42.5\" \u2014 treat period as decimal separator\n            cleaned = body.replace(\" \", \"\")\n\n    else:\n        # No separators \u2014 plain integer or space-separated integer\n        cleaned = body.replace(\" \", \"\")\n\n    try:\n        amount = Decimal(cleaned)\n    except InvalidOperation as exc:\n        raise ValueError(f\"Cannot convert to Decimal: {cleaned!r} (from {text!r})\") from exc\n\n    if amount \u003c 0:\n        # Shouldn't happen since we extracted the sign above, but be safe\n        if sign is None:\n            sign = \"-\"\n        amount = -amount\n\n    return amount, sign\n\n\ndef signed_amount(amount: Decimal, indicator) -> Decimal:\n    \"\"\"Return a signed ``Decimal`` for arithmetic purposes.\n\n    Parameters\n    ----------\n    amount:\n        A positive ``Decimal``.\n    indicator:\n        A ``CreditDebitIndicator``.\n\n    Returns\n    -------\n    Positive for CREDIT, negative for DEBIT.\n    \"\"\"\n    from ..models.enums import CreditDebitIndicator\n    if indicator == CreditDebitIndicator.CREDIT:\n        return amount\n    return -amount\n", "bankbridge/utils/dates.py": "\"\"\"Date parsing utilities for bank statement source documents.\n\nDesign principles\n-----------------\n- Never guess a missing year \u2014 only derive it when unambiguous from context.\n- Year-boundary transitions (December \u2192 January) must be handled explicitly.\n- Return ``None`` on failure; never raise silently and return a wrong date.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom typing import Optional\n\n\n# Common Dutch/European date patterns (day first)\n_PATTERNS: list[tuple[re.Pattern, str]] = [\n    # 12-08-2026, 12/08/2026, 12.08.2026\n    (re.compile(r'^(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{4})$'), \"dmy4\"),\n    # 12-08-26 (2-digit year \u2014 ambiguous; treated as 20xx)\n    (re.compile(r'^(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{2})$'), \"dmy2\"),\n    # 2026-08-12 (ISO 8601)\n    (re.compile(r'^(\\d{4})-(\\d{2})-(\\d{2})$'), \"iso\"),\n    # MT940 date YYMMDD (6 digits)\n    (re.compile(r'^(\\d{2})(\\d{2})(\\d{2})$'), \"yymmdd\"),\n    # MT940 entry date MMDD (4 digits \u2014 requires year from context)\n    (re.compile(r'^(\\d{2})(\\d{2})$'), \"mmdd\"),\n]\n\n_NL_MONTHS = {\n    \"jan\": 1, \"feb\": 2, \"mrt\": 3, \"apr\": 4, \"mei\": 5, \"jun\": 6,\n    \"jul\": 7, \"aug\": 8, \"sep\": 9, \"okt\": 10, \"nov\": 11, \"dec\": 12,\n    \"maart\": 3, \"oktober\": 10,\n}\n\n\ndef parse_date(text: str, reference_year: Optional[int] = None) -> Optional[date]:\n    \"\"\"Parse a date string from a bank statement source document.\n\n    Parameters\n    ----------\n    text:\n        Raw date string.\n    reference_year:\n        Fallback year when the string contains only MMDD.  Must be provided\n        explicitly; never assumed.\n\n    Returns\n    -------\n    Parsed ``date``, or ``None`` if parsing fails.\n    \"\"\"\n    text = text.strip()\n    if not text:\n        return None\n\n    for pattern, fmt in _PATTERNS:\n        m = pattern.match(text)\n        if not m:\n            continue\n        try:\n            if fmt == \"dmy4\":\n                return date(int(m.group(3)), int(m.group(2)), int(m.group(1)))\n            elif fmt == \"dmy2\":\n                year = 2000 + int(m.group(3))\n                return date(year, int(m.group(2)), int(m.group(1)))\n            elif fmt == \"iso\":\n                return date(int(m.group(1)), int(m.group(2)), int(m.group(3)))\n            elif fmt == \"yymmdd\":\n                year = 2000 + int(m.group(1))\n                return date(year, int(m.group(2)), int(m.group(3)))\n            elif fmt == \"mmdd\":\n                if reference_year is None:\n                    return None  # Cannot safely derive year without context\n                return date(reference_year, int(m.group(1)), int(m.group(2)))\n        except ValueError:\n            continue  # Invalid calendar date \u2014 try next pattern\n\n    return None\n\n\ndef resolve_year_from_period(\n    month: int,\n    day: int,\n    period_start: date,\n    period_end: date,\n) -> Optional[int]:\n    \"\"\"Determine the year for an MMDD date given a statement period.\n\n    Only returns a year when unambiguous.  Returns ``None`` when the date\n    could belong to more than one year within the period.\n\n    Handles year-boundary transitions (e.g. December 31 / January 1).\n    \"\"\"\n    candidates: list[int] = []\n    for year in {period_start.year, period_end.year}:\n        try:\n            candidate = date(year, month, day)\n        except ValueError:\n            continue\n        if period_start \u003c= candidate \u003c= period_end:\n            candidates.append(year)\n\n    if len(candidates) == 1:\n        return candidates[0]\n    return None  # Ambiguous or not found \u2014 do not guess\n", "bankbridge/validation/__init__.py": "", "bankbridge/validation/balance_check.py": "\"\"\"Balance validation \u2014 verifies that transactions reconcile with stated balances.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom ..models.balance import Balance\nfrom ..models.enums import CreditDebitIndicator, ValidationSeverity\nfrom ..models.transaction import BankBridgeTransaction\nfrom .results import ValidationIssue\n\n\n@dataclass\nclass BalanceCheckResult:\n    \"\"\"Detailed output of a balance reconciliation check.\n\n    Expose all components so the UI can display the full breakdown:\n\n        Opening balance\n        + Total credits\n        - Total debits\n        = Calculated closing balance\n        vs. Stated closing balance\n        Difference\n    \"\"\"\n\n    opening_signed: Decimal\n    total_credits: Decimal\n    total_debits: Decimal\n    calculated_closing_signed: Decimal\n    stated_closing_signed: Optional[Decimal]\n    difference: Optional[Decimal]\n    is_valid: bool\n    issues: list[ValidationIssue]\n\n\ndef check_balance(\n    opening: Balance,\n    closing: Optional[Balance],\n    transactions: list[BankBridgeTransaction],\n) -> BalanceCheckResult:\n    \"\"\"Reconcile opening balance + transactions against the stated closing balance.\n\n    All arithmetic uses ``Decimal`` \u2014 no floating point.\n\n    The check formula is:\n        opening.signed_value()\n        + sum(credit amounts)\n        - sum(debit amounts)\n        == closing.signed_value()\n    \"\"\"\n    opening_signed = opening.signed_value()\n\n    total_credits = sum(\n        (t.amount for t in transactions\n         if t.debit_credit == CreditDebitIndicator.CREDIT),\n        Decimal(\"0\"),\n    )\n    total_debits = sum(\n        (t.amount for t in transactions\n         if t.debit_credit == CreditDebitIndicator.DEBIT),\n        Decimal(\"0\"),\n    )\n\n    calculated_closing = opening_signed + total_credits - total_debits\n    issues: list[ValidationIssue] = []\n\n    if closing is None:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.WARNING,\n            code=\"CLOSING_BALANCE_MISSING\",\n            message=\"No closing balance present \u2014 cannot verify reconciliation\",\n        ))\n        return BalanceCheckResult(\n            opening_signed=opening_signed,\n            total_credits=total_credits,\n            total_debits=total_debits,\n            calculated_closing_signed=calculated_closing,\n            stated_closing_signed=None,\n            difference=None,\n            is_valid=False,\n            issues=issues,\n        )\n\n    stated_closing = closing.signed_value()\n    difference = calculated_closing - stated_closing  # signed; zero = match\n\n    if difference != Decimal(\"0\"):\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.ERROR,\n            code=\"BALANCE_MISMATCH\",\n            message=(\n                f\"Balance mismatch: \"\n                f\"opening={opening_signed}, \"\n                f\"credits={total_credits}, \"\n                f\"debits={total_debits}, \"\n                f\"calculated={calculated_closing}, \"\n                f\"stated={stated_closing}, \"\n                f\"difference={difference}\"\n            ),\n        ))\n\n    return BalanceCheckResult(\n        opening_signed=opening_signed,\n        total_credits=total_credits,\n        total_debits=total_debits,\n        calculated_closing_signed=calculated_closing,\n        stated_closing_signed=stated_closing,\n        difference=difference,\n        is_valid=(difference == Decimal(\"0\")),\n        issues=issues,\n    )\n", "bankbridge/validation/dates.py": "\"\"\"Date validation utilities.\"\"\"\n\nfrom __future__ import annotations\n\nfrom datetime import date\nfrom typing import Optional\n\nfrom ..models.enums import ValidationSeverity\nfrom .results import ValidationIssue\n\n\ndef validate_booking_date(\n    booking_date: Optional[date],\n    period_start: Optional[date],\n    period_end: Optional[date],\n    transaction_id: Optional[str] = None,\n) -> list[ValidationIssue]:\n    \"\"\"Check that a booking date is a plausible calendar date within the statement period.\n\n    Returns a (possibly empty) list of issues.\n    \"\"\"\n    issues: list[ValidationIssue] = []\n\n    if booking_date is None:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.WARNING,\n            code=\"BOOKING_DATE_MISSING\",\n            message=\"Transaction has no booking date\",\n            transaction_id=transaction_id,\n            field_name=\"booking_date\",\n        ))\n        return issues\n\n    # Range check against statement period when available\n    if period_start is not None and booking_date \u003c period_start:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.WARNING,\n            code=\"BOOKING_DATE_BEFORE_PERIOD\",\n            message=(\n                f\"Booking date {booking_date} is before statement period start \"\n                f\"{period_start}\"\n            ),\n            transaction_id=transaction_id,\n            field_name=\"booking_date\",\n        ))\n\n    if period_end is not None and booking_date > period_end:\n        # Treated as INFO, not WARNING: statement membership is determined by\n        # the source document (PDF), not by booking_date alone.  Cross-month\n        # settlements (e.g. SEPA direct debit processed on the last business\n        # day of the month, booked T+N in the next month) legitimately appear\n        # in the statement they were initiated in.\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.INFO,\n            code=\"BOOKING_DATE_AFTER_PERIOD\",\n            message=(\n                f\"Booking date {booking_date} is after statement period end \"\n                f\"{period_end} (cross-period settlement; statement membership \"\n                f\"is determined by the source document)\"\n            ),\n            transaction_id=transaction_id,\n            field_name=\"booking_date\",\n        ))\n\n    return issues\n\n\ndef validate_statement_period(\n    period_start: Optional[date],\n    period_end: Optional[date],\n) -> list[ValidationIssue]:\n    \"\"\"Check that the statement period is internally consistent.\"\"\"\n    issues: list[ValidationIssue] = []\n\n    if period_start is None and period_end is None:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.WARNING,\n            code=\"PERIOD_MISSING\",\n            message=\"Statement period (start and end) is not set\",\n        ))\n        return issues\n\n    if period_start is not None and period_end is not None:\n        if period_start > period_end:\n            issues.append(ValidationIssue(\n                severity=ValidationSeverity.ERROR,\n                code=\"PERIOD_INVERTED\",\n                message=(\n                    f\"Statement period start {period_start} is after \"\n                    f\"end {period_end}\"\n                ),\n            ))\n\n    return issues\n", "bankbridge/validation/iban.py": "\"\"\"IBAN normalisation and mod-97 checksum validation.\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom typing import Optional\n\nfrom ..models.enums import ValidationSeverity\nfrom .results import ValidationIssue\n\n# Expected IBAN lengths per country (ISO 13616)\n_IBAN_LENGTHS: dict[str, int] = {\n    \"AD\": 24, \"AE\": 23, \"AL\": 28, \"AT\": 20, \"AZ\": 28,\n    \"BA\": 20, \"BE\": 16, \"BG\": 22, \"BH\": 22, \"BR\": 29,\n    \"BY\": 28, \"CH\": 21, \"CR\": 22, \"CY\": 28, \"CZ\": 24,\n    \"DE\": 22, \"DK\": 18, \"DO\": 28, \"EE\": 20, \"EG\": 29,\n    \"ES\": 24, \"FI\": 18, \"FK\": 18, \"FO\": 18, \"FR\": 27,\n    \"GB\": 22, \"GE\": 22, \"GI\": 23, \"GL\": 18, \"GR\": 27,\n    \"GT\": 28, \"HR\": 21, \"HU\": 28, \"IE\": 22, \"IL\": 23,\n    \"IQ\": 23, \"IS\": 26, \"IT\": 27, \"JO\": 30, \"KW\": 30,\n    \"KZ\": 20, \"LB\": 28, \"LC\": 32, \"LI\": 21, \"LT\": 20,\n    \"LU\": 20, \"LV\": 21, \"LY\": 25, \"MC\": 27, \"MD\": 24,\n    \"ME\": 22, \"MK\": 19, \"MR\": 27, \"MT\": 31, \"MU\": 30,\n    \"NL\": 18, \"NO\": 15, \"PK\": 24, \"PL\": 28, \"PS\": 29,\n    \"PT\": 25, \"QA\": 29, \"RO\": 24, \"RS\": 22, \"SA\": 24,\n    \"SC\": 31, \"SD\": 18, \"SE\": 24, \"SI\": 19, \"SK\": 24,\n    \"SM\": 27, \"ST\": 25, \"SV\": 28, \"TL\": 23, \"TN\": 24,\n    \"TR\": 26, \"UA\": 29, \"VA\": 22, \"VG\": 24, \"XK\": 20,\n}\n\n_VALID_CHARS = re.compile(r'^[A-Z0-9]+$')\n\n\ndef normalize_iban(iban: str) -> str:\n    \"\"\"Remove spaces and convert to uppercase.\"\"\"\n    return iban.replace(\" \", \"\").replace(\"\\t\", \"\").upper()\n\n\ndef validate_iban(iban: Optional[str]) -> tuple[str, list[ValidationIssue]]:\n    \"\"\"Validate an IBAN string.\n\n    Returns ``(normalized_iban, issues)`` where an empty ``issues`` list\n    means the IBAN is valid.  ``normalized_iban`` may be an empty string\n    if the input was empty or unparseable.\n    \"\"\"\n    issues: list[ValidationIssue] = []\n\n    if not iban or not iban.strip():\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.ERROR,\n            code=\"IBAN_EMPTY\",\n            message=\"IBAN is empty or missing\",\n            field_name=\"iban\",\n        ))\n        return \"\", issues\n\n    normalized = normalize_iban(iban)\n\n    # Must start with 2 letters + 2 digits\n    if len(normalized) \u003c 4 or not normalized[:2].isalpha() or not normalized[2:4].isdigit():\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.ERROR,\n            code=\"IBAN_INVALID_FORMAT\",\n            message=f\"IBAN does not start with country code + 2 check digits: {normalized!r}\",\n            field_name=\"iban\",\n        ))\n        return normalized, issues\n\n    # Only valid IBAN characters after normalisation\n    if not _VALID_CHARS.match(normalized):\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.ERROR,\n            code=\"IBAN_INVALID_CHARS\",\n            message=f\"IBAN contains invalid characters after normalisation: {normalized!r}\",\n            field_name=\"iban\",\n        ))\n        return normalized, issues\n\n    country_code = normalized[:2]\n\n    # Length check\n    expected = _IBAN_LENGTHS.get(country_code)\n    if expected is None:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.WARNING,\n            code=\"IBAN_UNKNOWN_COUNTRY\",\n            message=f\"Unknown country code '{country_code}' \u2014 length not verified\",\n            field_name=\"iban\",\n        ))\n    elif len(normalized) != expected:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.ERROR,\n            code=\"IBAN_INVALID_LENGTH\",\n            message=(\n                f\"IBAN for {country_code} must be {expected} characters, \"\n                f\"got {len(normalized)}: {normalized!r}\"\n            ),\n            field_name=\"iban\",\n        ))\n        return normalized, issues\n\n    # Mod-97 checksum: move first 4 chars to end, expand letters to digits\n    rearranged = normalized[4:] + normalized[:4]\n    numeric_str = \"\".join(\n        str(ord(c) - ord(\"A\") + 10) if c.isalpha() else c\n        for c in rearranged\n    )\n\n    if int(numeric_str) % 97 != 1:\n        issues.append(ValidationIssue(\n            severity=ValidationSeverity.ERROR,\n            code=\"IBAN_CHECKSUM_INVALID\",\n            message=f\"IBAN mod-97 checksum failed: {normalized!r}\",\n            field_name=\"iban\",\n        ))\n\n    return normalized, issues\n", "bankbridge/validation/pipeline.py": "\"\"\"Validation pipeline \u2014 orchestrates all validators for a BankBridgeStatement.\"\"\"\n\nfrom __future__ import annotations\n\nfrom ..models.enums import ValidationSeverity\nfrom ..models.statement import BankBridgeStatement\nfrom .balance_check import check_balance\nfrom .dates import validate_booking_date, validate_statement_period\nfrom .iban import validate_iban\nfrom .results import ValidationIssue, ValidationResult\n\n# Profiles whose source format structurally does not include opening/closing\n# balances.  For these profiles, absent balances are informational (INFO),\n# not a validation error \u2014 the exported MT940/CAMT.053 will simply carry no\n# balance tags.  Add new profile IDs here when a source format is confirmed\n# to never carry balance information.\n_PROFILES_WITHOUT_BALANCES: frozenset[str] = frozenset({\n    \"ING_CSV_V1\",   # ING CSV export does not include opening/closing balances\n})\n\n\ndef validate_statement(statement: BankBridgeStatement) -> ValidationResult:\n    \"\"\"Run all validators in order and return an aggregated ValidationResult.\n\n    Validation order (issues are additive \u2014 all checks always run):\n    1. Statement period consistency\n    2. IBAN validity\n    3. Per-transaction booking dates\n    4. Balance reconciliation\n\n    The result is also written back to ``statement.validation_status`` and\n    ``statement.validation_issues`` so the statement carries its own status.\n    \"\"\"\n    result = ValidationResult.green()\n\n    # 1. Statement period\n    for issue in validate_statement_period(statement.period_start, statement.period_end):\n        result.add_issue(issue)\n\n    # 2. IBAN\n    if statement.iban is not None:\n        _normalized, iban_issues = validate_iban(statement.iban)\n        for issue in iban_issues:\n            result.add_issue(issue)\n    elif statement.account_number is not None:\n        # Account number present but no IBAN (e.g. ABN-AMRO pre-IBAN format) \u2014 informational only\n        result.add_issue(ValidationIssue(\n            severity=ValidationSeverity.INFO,\n            code=\"IBAN_NOT_SET\",\n            message=\"Statement IBAN not set; account_number present \u2014 skipping IBAN check\",\n            field_name=\"iban\",\n        ))\n    else:\n        result.add_issue(ValidationIssue(\n            severity=ValidationSeverity.WARNING,\n            code=\"IBAN_NOT_SET\",\n            message=\"Statement IBAN is not set \u2014 account cannot be verified\",\n            field_name=\"iban\",\n        ))\n\n    # 3. Per-transaction booking dates\n    for txn in statement.transactions:\n        for issue in validate_booking_date(\n            txn.booking_date,\n            statement.period_start,\n            statement.period_end,\n            transaction_id=txn.transaction_id,\n        ):\n            result.add_issue(issue)\n\n    # 4. Balance reconciliation\n    if statement.opening_balance is not None:\n        balance_result = check_balance(\n            opening=statement.opening_balance,\n            closing=statement.closing_balance,\n            transactions=statement.transactions,\n        )\n        for issue in balance_result.issues:\n            result.add_issue(issue)\n    else:\n        # Source formats that structurally omit balances get INFO, not ERROR \u2014\n        # absence of balance information is expected and does not block export.\n        balance_absent_severity = (\n            ValidationSeverity.INFO\n            if statement.layout_profile in _PROFILES_WITHOUT_BALANCES\n            else ValidationSeverity.ERROR\n        )\n        balance_absent_message = (\n            \"No opening balance \u2014 balance reconciliation not applicable for \"\n            f\"source profile '{statement.layout_profile}'.\"\n            if balance_absent_severity == ValidationSeverity.INFO\n            else \"No opening balance \u2014 cannot validate statement reconciliation\"\n        )\n        result.add_issue(ValidationIssue(\n            severity=balance_absent_severity,\n            code=\"OPENING_BALANCE_MISSING\",\n            message=balance_absent_message,\n        ))\n\n    # Write results back to statement\n    statement.validation_status = result.status\n    statement.validation_issues = result.issues\n\n    return result\n", "bankbridge/validation/results.py": "\"\"\"Validation result types.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Optional\n\nfrom ..models.enums import ValidationSeverity, ValidationStatus\n\n\n@dataclass\nclass ValidationIssue:\n    \"\"\"A single finding from the validation pipeline.\"\"\"\n\n    severity: ValidationSeverity\n    code: str          # Machine-readable identifier, e.g. \"BALANCE_MISMATCH\"\n    message: str       # Human-readable description\n    transaction_id: Optional[str] = None\n    field_name: Optional[str] = None\n\n    @property\n    def is_error(self) -> bool:\n        return self.severity == ValidationSeverity.ERROR\n\n    @property\n    def is_warning(self) -> bool:\n        return self.severity == ValidationSeverity.WARNING\n\n\n@dataclass\nclass ValidationResult:\n    \"\"\"Aggregated result of running the validation pipeline.\"\"\"\n\n    status: ValidationStatus = ValidationStatus.GREEN\n    issues: list[ValidationIssue] = field(default_factory=list)\n\n    @classmethod\n    def green(cls) -> ValidationResult:\n        return cls(status=ValidationStatus.GREEN, issues=[])\n\n    def add_issue(self, issue: ValidationIssue) -> None:\n        \"\"\"Add an issue, updating status according to severity.\"\"\"\n        self.issues.append(issue)\n        if issue.severity == ValidationSeverity.ERROR:\n            self.status = ValidationStatus.RED\n        elif (\n            issue.severity == ValidationSeverity.WARNING\n            and self.status == ValidationStatus.GREEN\n        ):\n            self.status = ValidationStatus.ORANGE\n\n    @property\n    def is_exportable(self) -> bool:\n        \"\"\"RED blocks normal financial export; GREEN and ORANGE do not.\"\"\"\n        return self.status in (ValidationStatus.GREEN, ValidationStatus.ORANGE)\n\n    @property\n    def errors(self) -> list[ValidationIssue]:\n        return [i for i in self.issues if i.is_error]\n\n    @property\n    def warnings(self) -> list[ValidationIssue]:\n        return [i for i in self.issues if i.is_warning]\n"}, "sharedWorker": false, "streamlitConfig": {"browser.gatherUsageStats": false, "client.toolbarMode": "viewer", "client.showErrorDetails": false}}</script>
