ion\n# ---------------------------------------------------------------------------\n\ndef _is_txn_row(row: _Row) -> bool:\n    \"\"\"True when the row has a full-date in the date column and Bij/Af in the indicator column.\"\"\"\n    has_date = any(\n        _DATE_FULL_RE.match(e.text) and _X_DATE_LEFT \u003c= e.x0 \u003c _X_DATE_RIGHT\n        for e in row.elems\n    )\n    has_bijaf = any(\n        e.text in (\"Bij\", \"Af\") and _X_BIJAF_LEFT \u003c= e.x0 \u003c _X_BIJAF_RIGHT\n        for e in row.elems\n    )\n    return has_date and has_bijaf\n\n\n# ---------------------------------------------------------------------------\n# Balance extraction from header rows\n# ---------------------------------------------------------------------------\n\ndef _find_balance_amount(\n    rows: list[_Row],\n    label: str,\n) -> tuple[Optional[date], Optional[Decimal]]:\n    \"\"\"Find the date from a row containing label, and the amount from the right side.\n\n    Label and amount are on DIFFERENT rows in this layout:\n    - Label row (higher y): \"Beginsaldo op 01-04-2026\"\n    - Amount row (lower y, 10-15 pts below): \"141,95\" at x0 > 485\n\n    We search for the CLOSEST row BELOW the label that contains an amount at x0 > 485.\n    This correctly distinguishes opening vs closing balance even though both amounts\n    are within 30 pts of each other vertically.\n    \"\"\"\n    label_y: Optional[float] = None\n    bal_date: Optional[date] = None\n\n    for row in rows:\n        if any(e.text == label for e in row.elems):\n            label_y = row.y\n            for e in row.elems:\n                if _DATE_STRICT_RE.match(e.text):\n                    bal_date = _parse_date(e.text)\n                    break\n            break\n\n    if label_y is None:\n        return None, None\n\n    # Collect all rows BELOW the label (lower y = further down page in PDF bottom-left)\n    # within a 30-point window, then pick the closest one with a right-side amount.\n    candidates: list[tuple[float, Decimal]] = []\n    for row in rows:\n        gap = label_y - row.y  # positive = row is below the label\n        if 2.0 \u003c gap \u003c 30.0:\n            for e in row.elems:\n                if e.x0 > _X_BALANCE_RIGHT_AREA and _AMOUNT_RE.match(e.text):\n                    amt = _parse_amount(e.text)\n                    if amt is not None:\n                        candidates.append((gap, amt))\n                    break\n\n    if candidates:\n        candidates.sort(key=lambda x: x[0])\n        return bal_date, candidates[0][1]\n\n    return bal_date, None\n\n\n# ---------------------------------------------------------------------------\n# Header parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_header(page: RawPage) -> dict:\n    \"\"\"Extract statement metadata from the header area of the first page.\"\"\"\n    header_elems = [e for e in page.elements if e.y1 > _Y_TXAREA_MAX]\n    rows = _group_rows(header_elems)\n    rows_top_down = sorted(rows, key=lambda r: -r.y)\n\n    result: dict = {\n        \"iban\": None,\n        \"account_holder\": None,\n        \"period_start\": None,\n        \"period_end\": None,\n        \"opening_balance\": None,\n        \"closing_balance\": None,\n    }\n\n    # --- Own IBAN: chunks starting with NL14 (or other country code) at x0 \u2248 57\n    for row in rows_top_down:\n        if any(_IBAN_START_RE.match(e.text) and e.x0 \u003c 80 for e in row.elems):\n            iban_parts: list[str] = []\n            country = None\n            for e in sorted(row.elems, key=lambda x: x.x0):\n                if not iban_parts:\n                    if _IBAN_START_RE.match(e.text) and e.x0 \u003c 80:\n                        iban_parts.append(e.text)\n                        country = e.text[:2]\n                else:\n                    target = _IBAN_LENGTHS.get(country or \"NL\", 18)\n                    current = sum(len(p) for p in iban_parts)\n                    if current >= target:\n                        break\n                    if _IBAN_CONT_RE.match(e.text) and current + len(e.text) \u003c= target:\n                        iban_parts.append(e.text)\n                    else:\n                        break\n            if iban_parts:\n                result[\"iban\"] = \"\".join(iban_parts)\n            break\n\n    # --- Account holder: left-side words on the row that also has \"Eindsaldo\"\n    for row in rows_top_down:\n        if any(e.text == \"Eindsaldo\" and e.x0 > 400 for e in row.elems):\n            # Left-side words (x0 \u003c 300) form the account holder name\n            left_words = [e.text for e in row.elems if e.x0 \u003c 300]\n            if left_words:\n                result[\"account_holder\"] = \" \".join(left_words)\n            break\n\n    # --- Balances: opening (Beginsaldo) and closing (Eindsaldo)\n    open_date, open_amount = _find_balance_amount(rows_top_down, \"Beginsaldo\")\n    close_date, close_amount = _find_balance_amount(rows_top_down, \"Eindsaldo\")\n\n    if open_date and open_amount is not None:\n        result[\"period_start\"] = open_date\n        result[\"opening_balance\"] = Balance(\n            amount=open_amount,\n            credit_debit=CreditDebitIndicator.CREDIT,\n            date=open_date,\n            balance_type=BalanceType.OPENING_BOOKED,\n            currency=\"EUR\",\n        )\n\n    if close_date and close_amount is not None:\n        result[\"period_end\"] = close_date\n        result[\"closing_balance\"] = Balance(\n            amount=close_amount,\n            credit_debit=CreditDebitIndicator.CREDIT,\n            date=close_date,\n            balance_type=BalanceType.CLOSING_BOOKED,\n            currency=\"EUR\",\n        )\n\n    return result\n\n\n# ---------------------------------------------------------------------------\n# Transaction building\n# ---------------------------------------------------------------------------\n\ndef _build_transaction(\n    header_row: _Row,\n    cont_rows: list[_Row],\n    source_file: str,\n) -> Optional[BankBridgeTransaction]:\n    # Booking date\n    date_text = header_row.first_text_in_x(_X_DATE_LEFT, _X_DATE_RIGHT)\n    if not date_text:\n        return None\n    booking_date = _parse_date(date_text)\n    if not booking_date:\n        return None\n\n    # Debit/credit indicator\n    bijaf = header_row.first_text_in_x(_X_BIJAF_LEFT, _X_BIJAF_RIGHT)\n    if bijaf == \"Bij\":\n        debit_credit = CreditDebitIndicator.CREDIT\n    elif bijaf == \"Af\":\n        debit_credit = CreditDebitIndicator.DEBIT\n    else:\n        return None\n\n    # Amount\n    amount_elems = header_row.elems_in_x(_X_AMOUNT_LEFT, _X_AMOUNT_RIGHT)\n    amount: Optional[Decimal] = None\n    for e in amount_elems:\n        if _AMOUNT_RE.match(e.text):\n            amount = _parse_amount(e.text)\n            break\n    if amount is None:\n        return None\n\n    # Description words on the header row (x0 >= _X_DESC_LEFT)\n    desc_header_words = [\n        e.text for e in header_row.elems if e.x0 >= _X_DESC_LEFT\n    ]\n\n    # Counterparty IBAN and name from first desc-row words\n    counterparty_iban, counterparty_name_raw, _ = _collect_iban_name(desc_header_words)\n\n    # If no IBAN was found, all desc words form the name/description start\n    if counterparty_iban is None:\n        counterparty_name_raw = \" \".join(desc_header_words) if desc_header_words else None\n\n    # Continuation rows \u2014 collect all description text\n    cont_texts: list[str] = []\n    for cont_row in cont_rows:\n        desc_words = [e.text for e in cont_row.elems if e.x0 >= _X_DESC_LEFT]\n        if desc_words:\n            cont_texts.append(\" \".join(desc_words))\n\n    # Full description = all words after IBAN+name on header row (none) + continuation\n    # For counterparty_name: use the raw name we already found\n    # Description: all continuation text joined\n    description = \" \".join(cont_texts) if cont_texts else None\n\n    # Extract incasso metadata from the full raw text\n    full_raw = (counterparty_name_raw or \"\") + \" \" + (description or \"\")\n    creditor_id, mandate_reference = _extract_incasso_meta(full_raw)\n\n    original = [header_row.joined()] + [r.joined() for r in cont_rows]\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        source_page=header_row.page,\n        original_text=original,\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        booking_date=booking_date,\n        value_date=None,\n        amount=amount,\n        currency=\"EUR\",\n        debit_credit=debit_credit,\n        counterparty_name=counterparty_name_raw or None,\n        counterparty_iban=counterparty_iban,\n        counterparty_bic=None,\n        description=description,\n        creditor_id=creditor_id,\n        mandate_reference=mandate_reference,\n        transaction_codes=TransactionCodes(source_raw_code=None),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Transaction area parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_transactions(\n    page: RawPage,\n    source_file: str,\n) -> list[BankBridgeTransaction]:\n    txn_elems = [e for e in page.elements if e.y1 \u003c= _Y_TXAREA_MAX]\n    rows = _group_rows(txn_elems)\n    rows_top_down = sorted(rows, key=lambda r: -r.y)\n\n    transactions: list[BankBridgeTransaction] = []\n    i = 0\n    while i \u003c len(rows_top_down):\n        row = rows_top_down[i]\n        if _is_txn_row(row):\n            cont: list[_Row] = []\n            j = i + 1\n            while j \u003c len(rows_top_down) and not _is_txn_row(rows_top_down[j]):\n                cont.append(rows_top_down[j])\n                j += 1\n            txn = _build_transaction(row, cont, source_file)\n            if txn:\n                transactions.append(txn)\n            i = j\n        else:\n            i += 1\n\n    return transactions\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse(doc: RawDocument, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse an ASN Bank (RegioBank) PDF RawDocument into a BankBridgeStatement.\"\"\"\n    if not doc.pages:\n        return BankBridgeStatement(\n            extraction_method=ExtractionMethod.PDF_DIGITAL,\n            parser_name=PARSER_NAME,\n            parser_version=PARSER_VERSION,\n            layout_profile=\"ASN_PDF_V1\",\n            bank=\"ASN Bank\",\n            source_file=source_file,\n        )\n\n    header = _parse_header(doc.pages[0])\n\n    transactions: list[BankBridgeTransaction] = []\n    for page in doc.pages:\n        transactions.extend(_parse_transactions(page, source_file))\n\n    return BankBridgeStatement(\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        layout_profile=\"ASN_PDF_V1\",\n        bank=\"ASN Bank\",\n        source_file=source_file,\n        source_hash=doc.source_hash,\n        account_holder=header[\"account_holder\"],\n        iban=header[\"iban\"],\n        bic=None,\n        currency=\"EUR\",\n        period_start=header[\"period_start\"],\n        period_end=header[\"period_end\"],\n        opening_balance=header[\"opening_balance\"],\n        closing_balance=header[\"closing_balance\"],\n        transactions=transactions,\n    )\n\n\ndef parse_file(path: str | Path) -> BankBridgeStatement:\n    \"\"\"Parse an ASN Bank PDF directly (convenience wrapper).\"\"\"\n    from bankbridge.extractors.pdf.pdfminer_extractor import extract\n    doc = path if isinstance(path, RawDocument) else extract(path)\n    return parse(doc, source_file=doc.source_file)\n", "bankbridge/parsers/camt053/__init__.py": "\"\"\"Generic CAMT.053 parser.\"\"\"\n", "bankbridge/parsers/camt053/parser.py": "\"\"\"Generic CAMT.053.001.02 parser.\n\nParses any CAMT.053.001.02 bank statement file into a BankBridgeStatement.\n\nCAMT.053.001.02 characteristics:\n- Namespace: urn:iso:std:iso:20022:tech:xsd:camt.053.001.02\n- Balance types supported: OPBD, CLBD (PRCD treated as opening; others ignored)\n- Per transaction: booking date, value date, amount, D/C indicator\n- Transaction codes: domain/family/subfamily (PMNT/RCDT/ESCT etc.)\n  plus optional proprietary code (Prtry/Cd)\n- Counterparty role depends on CdtDbtInd: DBIT\u2192Cdtr, CRDT\u2192Dbtr\n- EREF from NtryDtls/TxDtls/Refs/EndToEndId\n- MARF from NtryDtls/TxDtls/Refs/MndtId\n- CSID from NtryDtls/TxDtls/RltdPties/Cdtr/Id/OrgId/Othr/Id (DBIT only)\n- Remittance from NtryDtls/TxDtls/RmtInf/Ustrd (unstructured only; repeated\n  occurrences are joined with a space \u2014 Ustrd is Max140Text and repeats)\n- Account: IBAN preferred; Othr/Id used when IBAN absent\n- Bank: derived from servicer BIC prefix; None for unknown or missing BIC\n\"\"\"\n\nfrom __future__ import annotations\n\nimport xml.etree.ElementTree as ET\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"camt053\"\nPARSER_VERSION = \"1.0.0\"\n\n_NS_URI = \"urn:iso:std:iso:20022:tech:xsd:camt.053.001.02\"\n_NS = {\"ns\": _NS_URI}\n_P = f\"{{{_NS_URI}}}\"\n\n# BIC prefix \u2192 bank name, limited to banks with implemented parsers and golden baselines.\n_BIC_TO_BANK: dict[str, str] = {\n    'INGB': 'ING',\n    'RABO': 'Rabobank',\n    'ABNA': 'ABN AMRO',\n}\n\n\n# ---------------------------------------------------------------------------\n# Helpers\n# ---------------------------------------------------------------------------\n\ndef _text(el: Optional[ET.Element], path: str) -> Optional[str]:\n    if el is None:\n        return None\n    found = el.find(path, _NS)\n    if found is None or found.text is None:\n        return None\n    v = found.text.strip()\n    return v if v else None\n\n\ndef _joined_text(el: Optional[ET.Element], path: str) -> Optional[str]:\n    \"\"\"Return all occurrences of *path* joined with a space, or None.\n\n    RmtInf/Ustrd is Max140Text and repeats for longer remittance information,\n    so reading only the first occurrence would drop the tail.\n    \"\"\"\n    if el is None:\n        return None\n    values = [\n        found.text.strip()\n        for found in el.findall(path, _NS)\n        if found.text and found.text.strip()\n    ]\n    return ' '.join(values) if values else None\n\n\ndef _bank_from_bic(bic: Optional[str]) -> Optional[str]:\n    \"\"\"Derive bank name from first 4 characters of BIC; None for unknown/absent.\"\"\"\n    if not bic:\n        return None\n    return _BIC_TO_BANK.get(bic[:4].upper())\n\n\ndef _parse_date(s: Optional[str]) -> Optional[date]:\n    if not s:\n        return None\n    try:\n        return date.fromisoformat(s[:10])\n    except ValueError:\n        return None\n\n\ndef _parse_decimal(s: Optional[str]) -> Optional[Decimal]:\n    if not s:\n        return None\n    try:\n        return Decimal(s.strip())\n    except InvalidOperation:\n        return None\n\n\ndef _balance_type(code: Optional[str]) -> Optional[BalanceType]:\n    _MAP = {\n        'OPBD': BalanceType.OPENING_BOOKED,\n        'CLBD': BalanceType.CLOSING_BOOKED,\n        'PRCD': BalanceType.CLOSING_BOOKED,\n        'CLAV': BalanceType.CLOSING_AVAILABLE,\n        'FWAV': BalanceType.CLOSING_AVAILABLE,\n    }\n    return _MAP.get(code or '')\n\n\n# ---------------------------------------------------------------------------\n# Balance parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_balances(stmt_el: ET.Element) -> tuple[Optional[Balance], Optional[Balance]]:\n    opening: Optional[Balance] = None\n    closing: Optional[Balance] = None\n\n    for bal_el in stmt_el.findall('ns:Bal', _NS):\n        code = _text(bal_el, 'ns:Tp/ns:CdOrPrtry/ns:Cd')\n        if code not in ('OPBD', 'CLBD'):\n            continue\n        amount_str = _text(bal_el, 'ns:Amt')\n        cd_str = _text(bal_el, 'ns:CdtDbtInd')\n        date_str = _text(bal_el, 'ns:Dt/ns:Dt')\n        ccy = None\n        amt_el = bal_el.find('ns:Amt', _NS)\n        if amt_el is not None:\n            ccy = amt_el.get('Ccy', 'EUR')\n\n        amount = _parse_decimal(amount_str)\n        bal_date = _parse_date(date_str)\n        btype = _balance_type(code)\n\n        if amount is None or bal_date is None or btype is None:\n            continue\n\n        indicator = CreditDebitIndicator.CREDIT if cd_str == 'CRDT' else CreditDebitIndicator.DEBIT\n        try:\n            bal = Balance(amount=amount, credit_debit=indicator,\n                          date=bal_date, balance_type=btype, currency=ccy or 'EUR')\n        except ValueError:\n            continue\n\n        if code == 'OPBD':\n            opening = bal\n        elif code == 'CLBD':\n            closing = bal\n\n    return opening, closing\n\n\n# ---------------------------------------------------------------------------\n# Transaction parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_ntry(ntry_el: ET.Element, currency: str, source_file: str) -> Optional[BankBridgeTransaction]:\n    cd_str = _text(ntry_el, 'ns:CdtDbtInd')\n    if not cd_str:\n        return None\n\n    amount_str = _text(ntry_el, 'ns:Amt')\n    booking_date_str = _text(ntry_el, 'ns:BookgDt/ns:Dt')\n    value_date_str = _text(ntry_el, 'ns:ValDt/ns:Dt')\n\n    amount = _parse_decimal(amount_str)\n    booking_date = _parse_date(booking_date_str)\n    value_date = _parse_date(value_date_str)\n\n    if amount is None or booking_date is None:\n        return None\n\n    amt_el = ntry_el.find('ns:Amt', _NS)\n    if amt_el is not None:\n        currency = amt_el.get('Ccy', currency)\n\n    indicator = CreditDebitIndicator.CREDIT if cd_str == 'CRDT' else CreditDebitIndicator.DEBIT\n\n    bank_reference = _text(ntry_el, 'ns:NtryRef')\n    acct_svcr_ref = _text(ntry_el, 'ns:AcctSvcrRef')\n\n    domn_cd = _text(ntry_el, 'ns:BkTxCd/ns:Domn/ns:Cd')\n    fmly_cd = _text(ntry_el, 'ns:BkTxCd/ns:Domn/ns:Fmly/ns:Cd')\n    subfmly_cd = _text(ntry_el, 'ns:BkTxCd/ns:Domn/ns:Fmly/ns:SubFmlyCd')\n    prtry_cd = _text(ntry_el, 'ns:BkTxCd/ns:Prtry/ns:Cd')\n\n    tx_el = ntry_el.find('ns:NtryDtls/ns:TxDtls', _NS)\n\n    end_to_end_id: Optional[str] = None\n    mandate_reference: Optional[str] = None\n    creditor_id: Optional[str] = None\n    counterparty_name: Optional[str] = None\n    counterparty_iban: Optional[str] = None\n    counterparty_bic: Optional[str] = None\n    description: Optional[str] = None\n\n    if tx_el is not None:\n        end_to_end_id = _text(tx_el, 'ns:Refs/ns:EndToEndId')\n        if end_to_end_id and end_to_end_id.upper() in ('NOTPROVIDED', 'NONREF'):\n            end_to_end_id = None\n        mandate_reference = _text(tx_el, 'ns:Refs/ns:MndtId')\n\n        if indicator == CreditDebitIndicator.DEBIT:\n            counterparty_name = _text(tx_el, 'ns:RltdPties/ns:Cdtr/ns:Nm')\n            counterparty_iban = _text(tx_el, 'ns:RltdPties/ns:CdtrAcct/ns:Id/ns:IBAN')\n            counterparty_bic = _text(tx_el, 'ns:RltdAgts/ns:CdtrAgt/ns:FinInstnId/ns:BIC')\n            creditor_id = _text(tx_el, 'ns:RltdPties/ns:Cdtr/ns:Id/ns:OrgId/ns:Othr/ns:Id')\n        else:\n            counterparty_name = _text(tx_el, 'ns:RltdPties/ns:Dbtr/ns:Nm')\n            counterparty_iban = _text(tx_el, 'ns:RltdPties/ns:DbtrAcct/ns:Id/ns:IBAN')\n            counterparty_bic = _text(tx_el, 'ns:RltdAgts/ns:DbtrAgt/ns:FinInstnId/ns:BIC')\n\n        description = _joined_text(tx_el, 'ns:RmtInf/ns:Ustrd')\n\n    def _c(v: Optional[str]) -> Optional[str]:\n        return v.strip() if v and v.strip() else None\n\n    src_code = '/'.join(filter(None, [domn_cd, fmly_cd, subfmly_cd, prtry_cd]))\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        booking_date=booking_date,\n        value_date=value_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=indicator,\n        counterparty_name=_c(counterparty_name),\n        counterparty_iban=_c(counterparty_iban),\n        counterparty_bic=_c(counterparty_bic),\n        description=_c(description),\n        end_to_end_id=_c(end_to_end_id),\n        payment_reference=_c(end_to_end_id),\n        mandate_reference=_c(mandate_reference),\n        creditor_id=_c(creditor_id),\n        bank_reference=_c(bank_reference or acct_svcr_ref),\n        proprietary_bank_code=prtry_cd,\n        original_text=[],\n        extraction_method=ExtractionMethod.CAMT_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(\n            source_raw_code=src_code or None,\n            normalized_type=fmly_cd,\n        ),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(content: str, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse a CAMT.053.001.02 XML document into a BankBridgeStatement.\n\n    Args:\n        content:     Raw XML content (str).\n        source_file: Original file path for audit trail.\n    \"\"\"\n    root = ET.fromstring(content)\n\n    stmt_el = root.find('ns:BkToCstmrStmt/ns:Stmt', _NS)\n    if stmt_el is None:\n        raise ValueError(f\"No BkToCstmrStmt/Stmt element in {source_file!r}\")\n\n    iban = _text(stmt_el, 'ns:Acct/ns:Id/ns:IBAN')\n    account_number = _text(stmt_el, 'ns:Acct/ns:Id/ns:Othr/ns:Id') if not iban else None\n    bic = _text(stmt_el, 'ns:Acct/ns:Svcr/ns:FinInstnId/ns:BIC')\n    currency = _text(stmt_el, 'ns:Acct/ns:Ccy') or 'EUR'\n\n    period_start = _parse_date(_text(stmt_el, 'ns:FrToDt/ns:FrDtTm'))\n    period_end = _parse_date(_text(stmt_el, 'ns:FrToDt/ns:ToDtTm'))\n\n    opening_balance, closing_balance = _parse_balances(stmt_el)\n\n    transactions: list[BankBridgeTransaction] = []\n    for ntry_el in stmt_el.findall('ns:Ntry', _NS):\n        txn = _parse_ntry(ntry_el, currency, source_file)\n        if txn is not None:\n            transactions.append(txn)\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.CAMT_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        bank=_bank_from_bic(bic),\n        iban=iban,\n        account_number=account_number,\n        bic=bic,\n        currency=currency,\n        period_start=period_start,\n        period_end=period_end,\n        opening_balance=opening_balance,\n        closing_balance=closing_balance,\n        transactions=transactions,\n    )\n", "bankbridge/parsers/csv_layout_detector.py": "\"\"\"CSV layout detection \u2014 identifies bank and CSV layout profile before parsing.\n\nFlow\n----\n    CSV  \u2192  _extract_headers()  \u2192  _check_*()  \u2192  CsvLayoutProfile\n                                                         \u2193\n                                                   get_parser()\n                                                         \u2193\n                                             parse_file(content) \u2192 BankBridgeStatement\n\nDesign constraints\n------------------\n- Detection is deterministic: headers are compared exactly.\n- Fail-safe: raises UnknownCsvLayoutError when no profile matches.\n- Bank-aware errors: if the bank is recognised but the layout is not, the\n  exception carries the bank name.\n\nAdding a new profile\n--------------------\n1. Define a ``_check_\u003cname>()`` function with deterministic criteria.\n2. Add a ``CsvLayoutProfile`` constant and register in ``_ALL_CSV_PROFILES``.\n3. Add the check to the detection sequence in ``detect_csv()``.\n4. Register the parser in ``_CSV_PARSER_REGISTRY`` inside ``get_csv_parser()``.\n5. Add tests in ``tests/test_csv_layout_detector.py``.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom typing import Callable, Optional\n\n\n# ---------------------------------------------------------------------------\n# Profile model\n# ---------------------------------------------------------------------------\n\n@dataclass(frozen=True)\nclass CsvLayoutProfile:\n    \"\"\"Immutable descriptor for a supported bank CSV layout.\"\"\"\n\n    bank: str\n    profile_id: str\n    description: str\n\n\n# ---------------------------------------------------------------------------\n# Supported profiles\n# ---------------------------------------------------------------------------\n\nING_CSV_V1 = CsvLayoutProfile(\n    bank=\"ING\",\n    profile_id=\"ING_CSV_V1\",\n    description=\"ING bank statement CSV export, layout version 1 (9-column format)\",\n)\n\n_ALL_CSV_PROFILES: tuple[CsvLayoutProfile, ...] = (ING_CSV_V1,)\n\n\n# ---------------------------------------------------------------------------\n# Error\n# ---------------------------------------------------------------------------\n\nclass UnknownCsvLayoutError(Exception):\n    \"\"\"Raised when the CSV does not match any supported layout profile.\n\n    Attributes\n    ----------\n    bank : str | None\n        Set to the recognised bank name when the bank could be identified\n        but no supported layout matched.  ``None`` when the bank is not\n        recognised.\n    \"\"\"\n\n    def __init__(self, message: str, *, bank: Optional[str] = None) -> None:\n        super().__init__(message)\n        self.bank: Optional[str] = bank\n\n\n# ---------------------------------------------------------------------------\n# Header extraction\n# ---------------------------------------------------------------------------\n\ndef _extract_headers(content: str) -> tuple[str, ...]:\n    \"\"\"Return column headers from the first row of a CSV string.\n\n    Handles double-quoted fields and comma delimiter.\n    \"\"\"\n    first_line = content.lstrip().split('\\n')[0].strip()\n    # Simple parsing: strip quotes from each field\n    fields = []\n    for field in first_line.split(','):\n        f = field.strip().strip('\"')\n        fields.append(f)\n    return tuple(fields)\n\n\n# ---------------------------------------------------------------------------\n# Layout-specific criteria\n# ---------------------------------------------------------------------------\n\n# ING CSV V1 column headers \u2014 exact match required\n_ING_CSV_V1_HEADERS = (\n    \"Datum\",\n    \"Naam / Omschrijving\",\n    \"Rekening\",\n    \"Tegenrekening\",\n    \"Code\",\n    \"Af Bij\",\n    \"Bedrag (EUR)\",\n    \"Mutatiesoort\",\n    \"Mededelingen\",\n)\n\n\ndef _check_ing_csv_v1(headers: tuple[str, ...]) -> bool:\n    \"\"\"Return True iff all ING_CSV_V1 structural criteria are satisfied.\n\n    Criterion: column headers must exactly match the 9-column ING CSV format.\n    This ensures that a reordered, renamed, or versioned CSV is never silently\n    parsed as ING_CSV_V1.\n    \"\"\"\n    return headers == _ING_CSV_V1_HEADERS\n\n\n# ---------------------------------------------------------------------------\n# Bank identification (for targeted error messages)\n# ---------------------------------------------------------------------------\n\ndef _detect_bank_from_headers(headers: tuple[str, ...]) -> Optional[str]:\n    \"\"\"Heuristically identify the bank from CSV headers when exact match fails.\"\"\"\n    # ING-specific columns: \"Af Bij\", \"Mutatiesoort\", \"Mededelingen\"\n    if \"Af Bij\" in headers or \"Mutatiesoort\" in headers:\n        return \"ING\"\n    return None\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef detect_csv(content: str) -> CsvLayoutProfile:\n    \"\"\"Detect which CSV layout profile matches the CSV content.\n\n    Returns\n    -------\n    CsvLayoutProfile\n        The matched profile (e.g. ING_CSV_V1).\n\n    Raises\n    ------\n    UnknownCsvLayoutError\n        Always raised when no profile matches.  ``exc.bank`` is set when\n        the bank could be identified but its layout is not yet supported.\n    \"\"\"\n    headers = _extract_headers(content)\n\n    if _check_ing_csv_v1(headers):\n        return ING_CSV_V1\n\n    bank = _detect_bank_from_headers(headers)\n    if bank == \"ING\":\n        raise UnknownCsvLayoutError(\n            f\"ING CSV detected but headers do not match ING_CSV_V1 \u2014 \"\n            f\"the CSV may use a newer or different layout version.\\n\"\n            f\"Expected: {_ING_CSV_V1_HEADERS}\\n\"\n            f\"Got: {headers}\",\n            bank=\"ING\",\n        )\n    raise UnknownCsvLayoutError(\n        f\"CSV bank not recognised \u2014 no supported layout profile matches. \"\n        f\"Supported profiles: {[p.profile_id for p in _ALL_CSV_PROFILES]}\\n\"\n        f\"Headers found: {headers}\",\n        bank=None,\n    )\n\n\ndef get_csv_parser(profile: CsvLayoutProfile) -> Callable:\n    \"\"\"Return the ``parse_file(content, source_file) -> BankBridgeStatement``\n    callable for *profile*.\n\n    Raises\n    ------\n    ValueError\n        When *profile* has no registered parser.\n    \"\"\"\n    from bankbridge.parsers.ing.csv_parser import parse_file as _ing_csv\n\n    _CSV_PARSER_REGISTRY: dict[str, Callable] = {\n        \"ING_CSV_V1\": _ing_csv,\n    }\n\n    parser = _CSV_PARSER_REGISTRY.get(profile.profile_id)\n    if parser is None:\n        raise ValueError(\n            f\"No parser registered for CSV layout profile {profile.profile_id!r}. \"\n            f\"Registered profiles: {list(_CSV_PARSER_REGISTRY)}\"\n        )\n    return parser\n", "bankbridge/parsers/ing/__init__.py": "\"\"\"ING bank statement parsers.\"\"\"\n", "bankbridge/parsers/ing/camt053_parser.py": "# Backward-compatibility shim \u2014 parser moved to bankbridge.parsers.camt053.parser\nfrom bankbridge.parsers.camt053.parser import *  # noqa: F401,F403\nfrom bankbridge.parsers.camt053.parser import PARSER_NAME, PARSER_VERSION, parse_file, _bank_from_bic  # noqa: F401\n", "bankbridge/parsers/ing/csv_parser.py": "\"\"\"ING CSV bank statement parser.\n\nParses the CSV file exported by ING online banking (zakelijk/particulier).\n\nCSV format:\n    Delimiter: comma; all fields double-quoted; UTF-8 encoding.\n    Columns: Datum, Naam / Omschrijving, Rekening, Tegenrekening,\n             Code, Af Bij, Bedrag (EUR), Mutatiesoort, Mededelingen\n\nKey characteristics:\n- Datum format: YYYYMMDD (no separator)\n- Af Bij: \"Af\" = debit, \"Bij\" = credit\n- Amount always positive; direction from Af Bij\n- Tegenrekening is full IBAN (may be empty for charges)\n- Mededelingen contains embedded key-value pairs with structured data\n- Valutadatum embedded in Mededelingen (format: DD-MM-YYYY)\n- File is in reverse-chronological order\n\"\"\"\n\nfrom __future__ import annotations\n\nimport csv\nimport io\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.models.enums import CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"ing_csv\"\nPARSER_VERSION = \"1.0.0\"\n\n# Expected column headers (exact match required for ING_CSV_V1)\nEXPECTED_HEADERS = (\n    \"Datum\",\n    \"Naam / Omschrijving\",\n    \"Rekening\",\n    \"Tegenrekening\",\n    \"Code\",\n    \"Af Bij\",\n    \"Bedrag (EUR)\",\n    \"Mutatiesoort\",\n    \"Mededelingen\",\n)\n\n# ---------------------------------------------------------------------------\n# Mededelingen parser\n# ---------------------------------------------------------------------------\n\n# Labels in Mededelingen \u2014 longest first to prevent prefix collisions\n_MEDED_LABELS = [\n    'Machtiging ID', 'Incassant ID', 'Betreft IBAN',\n    'Datum/Tijd', 'Valutadatum', 'Omschrijving',\n    'Kenmerk', 'Naam', 'IBAN', 'Periode',\n    'Overige partij',\n]\n_MEDED_RE = re.compile(\n    r'(?:^|\\s)(' + '|'.join(re.escape(k) for k in _MEDED_LABELS) + r'):\\s*'\n)\n# Free-text markers in Mededelingen that have no value (no colon) \u2014 strip before parsing\n_MEDED_MARKERS_RE = re.compile(r'\\b(?:Doorlopende incasso|Eenmalige incasso)\\b\\s*')\n\n_DATE_DMY_RE = re.compile(r'^(\\d{2})-(\\d{2})-(\\d{4})$')\n_DATE_YMD_RE = re.compile(r'^(\\d{4})-(\\d{2})-(\\d{2})$')\n\n# CSV transaction type codes \u2192 canonical names\n_CODE_NAMES: dict[str, str] = {\n    'IC': 'SEPA INCASSO',\n    'OV': 'SEPA OVERBOEKING',\n    'GT': 'ONLINE BANKIEREN',\n    'VZ': 'VERZAMELBETALING',\n    'IW': 'IDEAL',\n    'DV': 'DIVERSEN',\n}\n\n\ndef _parse_meded(text: str) -> dict[str, str]:\n    \"\"\"Extract key-value pairs from ING Mededelingen column.\"\"\"\n    text = _MEDED_MARKERS_RE.sub('', text)\n    result: dict[str, str] = {}\n    matches = list(_MEDED_RE.finditer(text))\n    for i, m in enumerate(matches):\n        key = m.group(1)\n        value_start = m.end()\n        value_end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(text)\n        result[key] = text[value_start:value_end].strip()\n    return result\n\n\ndef _parse_date_yyyymmdd(s: str) -> Optional[date]:\n    if len(s) != 8 or not s.isdigit():\n        return None\n    try:\n        return date(int(s[:4]), int(s[4:6]), int(s[6:]))\n    except ValueError:\n        return None\n\n\ndef _parse_date_dmy(s: str) -> Optional[date]:\n    \"\"\"Parse DD-MM-YYYY date string.\"\"\"\n    m = _DATE_DMY_RE.match(s.strip())\n    if m:\n        try:\n            return date(int(m.group(3)), int(m.group(2)), int(m.group(1)))\n        except ValueError:\n            pass\n    return None\n\n\ndef _parse_amount(s: str) -> Optional[Decimal]:\n    \"\"\"Parse Dutch comma-decimal amount string.\"\"\"\n    try:\n        return Decimal(s.strip().replace('.', '').replace(',', '.'))\n    except InvalidOperation:\n        return None\n\n\ndef _parse_row(\n    row: dict[str, str],\n    own_iban: str,\n    currency: str,\n    source_file: str,\n) -> Optional[BankBridgeTransaction]:\n    booking_date = _parse_date_yyyymmdd(row.get('Datum', '').strip())\n    if booking_date is None:\n        return None\n\n    af_bij = row.get('Af Bij', '').strip()\n    if af_bij == 'Af':\n        indicator = CreditDebitIndicator.DEBIT\n    elif af_bij == 'Bij':\n        indicator = CreditDebitIndicator.CREDIT\n    else:\n        return None\n\n    amount = _parse_amount(row.get('Bedrag (EUR)', ''))\n    if amount is None:\n        return None\n\n    code = row.get('Code', '').strip()\n    naam = row.get('Naam / Omschrijving', '').strip()\n    tegenrekening = row.get('Tegenrekening', '').strip() or None\n    mutatiesoort = row.get('Mutatiesoort', '').strip()\n    mededelingen = row.get('Mededelingen', '').strip()\n\n    meded = _parse_meded(mededelingen)\n\n    counterparty_iban = tegenrekening  # already IBAN from Tegenrekening column\n    counterparty_name = meded.get('Naam') or (naam if naam else None)\n    description = meded.get('Omschrijving')\n    kenmerk = meded.get('Kenmerk')\n    end_to_end_id = kenmerk if kenmerk and kenmerk.upper() != 'NOTPROVIDED' else None\n    mandate_reference = meded.get('Machtiging ID')\n    creditor_id = meded.get('Incassant ID')\n    value_date = _parse_date_dmy(meded.get('Valutadatum', ''))\n\n    # For DV (charges): no counterparty IBAN; description from raw Mededelingen\n    if code == 'DV' and not description:\n        description = mededelingen if mededelingen else mutatiesoort\n\n    def _c(v: Optional[str]) -> Optional[str]:\n        return v.strip() if v and v.strip() else None\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        booking_date=booking_date,\n        value_date=value_date or booking_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=indicator,\n        counterparty_name=_c(counterparty_name),\n        counterparty_iban=_c(counterparty_iban),\n        description=_c(description),\n        end_to_end_id=_c(end_to_end_id),\n        payment_reference=_c(end_to_end_id),\n        mandate_reference=_c(mandate_reference),\n        creditor_id=_c(creditor_id),\n        original_text=[str(row)],\n        extraction_method=ExtractionMethod.CSV,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(\n            source_raw_code=code,\n            normalized_type=_CODE_NAMES.get(code, code),\n        ),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(content: str, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse an ING CSV bank statement file into a BankBridgeStatement.\n\n    Args:\n        content:     Raw CSV file content (str, UTF-8).\n        source_file: Original file path for audit trail.\n    \"\"\"\n    reader = csv.DictReader(io.StringIO(content))\n    headers = tuple(reader.fieldnames or [])\n\n    if headers != EXPECTED_HEADERS:\n        raise ValueError(\n            f\"CSV headers do not match ING_CSV_V1 profile.\\n\"\n            f\"Expected: {EXPECTED_HEADERS}\\n\"\n            f\"Got:      {headers}\"\n        )\n\n    rows = list(reader)\n    if not rows:\n        raise ValueError(\"ING CSV file contains no data rows\")\n\n    # Own account IBAN from first row's Rekening column\n    own_iban = rows[0].get('Rekening', '').strip()\n    currency = 'EUR'\n\n    transactions: list[BankBridgeTransaction] = []\n    for row in rows:\n        txn = _parse_row(row, own_iban, currency, source_file)\n        if txn is not None:\n            transactions.append(txn)\n\n    # Determine period from transaction dates (CSV is reverse-chronological)\n    dates = [t.booking_date for t in transactions if t.booking_date]\n    period_start = min(dates) if dates else None\n    period_end = max(dates) if dates else None\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.CSV,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        bank='ING',\n        iban=own_iban or None,\n        currency=currency,\n        layout_profile='ING_CSV_V1',\n        period_start=period_start,\n        period_end=period_end,\n        transactions=transactions,\n    )\n", "bankbridge/parsers/ing/mt940_parser.py": "\"\"\"ING MT940 (.940) parser.\n\nING MT940 differs from Rabobank and ABN-AMRO in several ways:\n- Wrapped in a SWIFT FIN envelope: {1:...}{2:...}{4:\\\\n...-}\n- :25: contains IBAN + currency concatenated (e.g. NL05INGB0900000074EUR), no separator\n- :28C: single 5-digit sequence number (e.g. 00000)\n- :61: always has a /TRCD/NNNNN/ line as continuation (ING proprietary code)\n- Customer reference in :61: is 'EREF' (label) or 'NONREF' \u2014 not the actual reference\n- :86: structured with keys separated by // delimiters:\n    EREF, MARF, CSID, CNTP (IBAN/BIC/Name combined), REMI (USTD// prefix), PURP, ULTC\n- After :62F: there are :64:, :65: (forward balance) and a summary :86:/SUM/... \u2014 all skipped\n- A single block covers the whole statement period\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date, timedelta\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"ing_mt940\"\nPARSER_VERSION = \"1.0.0\"\n\n# ---------------------------------------------------------------------------\n# Regexes\n# ---------------------------------------------------------------------------\n\n_TAG_LINE_RE = re.compile(r'^:([A-Z0-9]{2,4}):(.*)', re.DOTALL)\n_BALANCE_RE = re.compile(r'^([CD])(\\d{6})([A-Z]{3})([\\d,]+)$')\n\n# :61: \u2014 value date YYMMDD + entry date MMDD + D/C + amount + N + 3-char code + cust_ref + //bank_ref\n_ENTRY_RE = re.compile(\n    r'^(\\d{6})'              # value_date YYMMDD\n    r'(\\d{4})?'              # entry_date MMDD (optional)\n    r'([CD]R?)'              # credit/debit (with optional reversal R)\n    r'([\\d,]{1,15})'         # amount (comma decimal)\n    r'([FNS])'               # type indicator\n    r'([A-Z]{3})'            # 3-char type code (TRF, DDT, CHG, \u2026)\n    r'([A-Z0-9]{1,16})'      # customer reference (EREF or NONREF)\n    r'(?://(.*))?$'          # optional bank reference after //\n)\n\n# :25: \u2014 IBAN (up to 34 chars) + currency (3 chars) concatenated\n_ACCOUNT_RE = re.compile(r'^([A-Z]{2}[A-Z0-9]{13,32})([A-Z]{3})$')\n\n# SWIFT FIN envelope\n_SWIFT_FIN_RE = re.compile(r'\\{4:\\r?\\n(.*?)\\r?\\n-\\}', re.DOTALL)\n\n# ING :86: structured keys (longer first to avoid prefix collisions)\n_ING_86_KEYS = ['CNTP', 'EREF', 'MARF', 'CSID', 'REMI', 'PURP', 'ULTC']\n_ING_86_KEY_RE = re.compile(\n    r'/(' + '|'.join(re.escape(k) for k in _ING_86_KEYS) + r')/'\n)\n\n# /TRCD/ proprietary code continuation in :61:\n_TRCD_RE = re.compile(r'/TRCD/(\\w+)/')\n\n\n# ---------------------------------------------------------------------------\n# Low-level helpers\n# ---------------------------------------------------------------------------\n\ndef _parse_yymmdd(s: str) -> Optional[date]:\n    if len(s) != 6 or not s.isdigit():\n        return None\n    try:\n        return date(2000 + int(s[:2]), int(s[2:4]), int(s[4:]))\n    except ValueError:\n        return None\n\n\ndef _parse_amount(s: str) -> Optional[Decimal]:\n    try:\n        return Decimal(s.replace(',', '.'))\n    except InvalidOperation:\n        return None\n\n\ndef _parse_balance(raw: str, btype: BalanceType) -> Optional[Balance]:\n    m = _BALANCE_RE.match(raw.strip())\n    if not m:\n        return None\n    cd, date_str, currency, amount_str = m.groups()\n    d = _parse_yymmdd(date_str)\n    amount = _parse_amount(amount_str)\n    if d is None or amount is None:\n        return None\n    indicator = CreditDebitIndicator.CREDIT if cd == 'C' else CreditDebitIndicator.DEBIT\n    try:\n        return Balance(amount=amount, credit_debit=indicator,\n                       date=d, balance_type=btype, currency=currency)\n    except ValueError:\n        return None\n\n\ndef _strip_swift_fin(content: str) -> str:\n    \"\"\"Extract MT940 body from SWIFT FIN envelope, or return as-is.\"\"\"\n    m = _SWIFT_FIN_RE.search(content)\n    return m.group(1) if m else content\n\n\ndef _extract_tags(block: str) -> list[tuple[str, str]]:\n    \"\"\"Return ordered (tag_id, tag_value) pairs from a block of MT940 text.\"\"\"\n    tags: list[tuple[str, str]] = []\n    current_tag: Optional[str] = None\n    current_lines: list[str] = []\n\n    for line in block.splitlines():\n        m = _TAG_LINE_RE.match(line)\n        if m:\n            if current_tag is not None:\n                tags.append((current_tag, '\\n'.join(current_lines)))\n            current_tag = m.group(1)\n            current_lines = [m.group(2)]\n        else:\n            if current_tag is not None:\n                current_lines.append(line)\n\n    if current_tag is not None:\n        tags.append((current_tag, '\\n'.join(current_lines)))\n    return tags\n\n\n# ---------------------------------------------------------------------------\n# :86: parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_86(text: str) -> dict[str, str]:\n    \"\"\"Parse ING :86: structured format.\n\n    Format: /KEY1/value1//KEY2/value2//...//KEYn/valuen/\n    Lines are joined without spaces (structured field may split across lines).\n    Special handling:\n    - /CNTP/ value contains IBAN/BIC/Name separated by /\n    - /REMI/ value starts with USTD// or STRD// type indicator\n    \"\"\"\n    normalized = ''.join(text.splitlines())\n    result: dict[str, str] = {}\n\n    matches = list(_ING_86_KEY_RE.finditer(normalized))\n    for i, m in enumerate(matches):\n        key = m.group(1)\n        value_start = m.end()\n        value_end = matches[i + 1].start() if i + 1 \u003c len(matches) else len(normalized)\n        raw = normalized[value_start:value_end]\n\n        if key == 'CNTP':\n            # Format: IBAN/BIC/Name// \u2014 split on / to get parts\n            v = raw.rstrip('/')\n            parts = v.split('/', 2)\n            if len(parts) >= 1 and parts[0]:\n                result['CNTP_IBAN'] = parts[0]\n            if len(parts) >= 2 and parts[1]:\n                result['CNTP_BIC'] = parts[1]\n            if len(parts) >= 3 and parts[2]:\n                result['CNTP_NAME'] = parts[2].rstrip('/')\n        elif key == 'REMI':\n            # Format: USTD//free text/  \u2014 strip type indicator prefix\n            v = raw.rstrip('/')\n            if v.startswith('USTD//'):\n                result[key] = v[6:]\n            elif v.startswith('STRD//'):\n                result[key] = v[6:]\n            else:\n                result[key] = v\n        else:\n            # Simple value: strip trailing // separators and /\n            result[key] = raw.rstrip('/').rstrip('/')\n\n    return result\n\n\n# ---------------------------------------------------------------------------\n# Transaction parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_entry(\n    f61_value: str,\n    f86_value: str,\n    currency: str,\n    source_file: str,\n) -> Optional[BankBridgeTransaction]:\n    \"\"\"Parse one :61: + :86: pair into a BankBridgeTransaction.\"\"\"\n    lines = f61_value.splitlines()\n    first_line = lines[0].strip() if lines else ''\n\n    # Extract /TRCD/ from continuation line(s)\n    trcd_code: Optional[str] = None\n    for line in lines[1:]:\n        mt = _TRCD_RE.search(line)\n        if mt:\n            trcd_code = mt.group(1)\n\n    m = _ENTRY_RE.match(first_line)\n    if not m:\n        return None\n\n    (value_date_str, entry_date_str, cd, amount_str,\n     type_ind, type_code, cust_ref, bank_ref) = m.groups()\n\n    v_date = _parse_yymmdd(value_date_str)\n    amount = _parse_amount(amount_str)\n    if v_date is None or amount is None:\n        return None\n\n    # Entry date is MMDD \u2014 reconstruct using value_date year\n    if entry_date_str and len(entry_date_str) == 4 and entry_date_str.isdigit():\n        try:\n            booking_date: date = date(v_date.year, int(entry_date_str[:2]), int(entry_date_str[2:]))\n        except ValueError:\n            booking_date = v_date\n    else:\n        booking_date = v_date\n\n    indicator = CreditDebitIndicator.CREDIT if cd[0] == 'C' else CreditDebitIndicator.DEBIT\n    fields = _parse_86(f86_value) if f86_value else {}\n\n    end_to_end_id: Optional[str] = fields.get('EREF') or None\n    if end_to_end_id and end_to_end_id.upper() == 'NONREF':\n        end_to_end_id = None\n\n    def _c(v: Optional[str]) -> Optional[str]:\n        return v.strip() if v and v.strip() else None\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        booking_date=booking_date,\n        value_date=v_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=indicator,\n        counterparty_name=_c(fields.get('CNTP_NAME')),\n        counterparty_iban=_c(fields.get('CNTP_IBAN')),\n        counterparty_bic=_c(fields.get('CNTP_BIC')),\n        description=_c(fields.get('REMI')),\n        end_to_end_id=_c(end_to_end_id),\n        payment_reference=_c(end_to_end_id),\n        mandate_reference=_c(fields.get('MARF')),\n        creditor_id=_c(fields.get('CSID')),\n        bank_reference=_c(bank_ref),\n        original_text=[f61_value] + ([f86_value] if f86_value else []),\n        extraction_method=ExtractionMethod.MT940_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(\n            source_raw_code=trcd_code or type_code,\n            source_indicator=type_ind,\n            normalized_type=type_code,\n        ),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Block parsing\n# ---------------------------------------------------------------------------\n\ndef _parse_block(block: str, source_file: str) -> Optional[BankBridgeStatement]:\n    tags = _extract_tags(block)\n    if not tags:\n        return None\n\n    tag_dict: dict[str, str] = {}\n    for tid, val in tags:\n        if tid not in tag_dict:\n            tag_dict[tid] = val\n\n    # :25: \u2014 IBAN + currency concatenated\n    iban: Optional[str] = None\n    currency = 'EUR'\n    raw_25 = tag_dict.get('25', '').strip()\n    m25 = _ACCOUNT_RE.match(raw_25)\n    if m25:\n        iban = m25.group(1)\n        currency = m25.group(2)\n    elif raw_25:\n        iban = raw_25\n\n    opening_balance = _parse_balance(tag_dict.get('60F', ''), BalanceType.OPENING_BOOKED)\n    closing_balance = _parse_balance(tag_dict.get('62F', ''), BalanceType.CLOSING_BOOKED)\n\n    if opening_balance:\n        currency = opening_balance.currency\n\n    # Period: opening_balance.date is the day before the period (previous close).\n    # period_start = opening_balance.date + 1 day; period_end = closing_balance.date.\n    period_start: Optional[date] = None\n    period_end: Optional[date] = None\n    if opening_balance:\n        period_start = opening_balance.date + timedelta(days=1)\n    if closing_balance:\n        period_end = closing_balance.date\n\n    # Pair :61: with following :86:, stop at :62F:\n    transactions: list[BankBridgeTransaction] = []\n    pending_61: Optional[str] = None\n    after_closing = False\n\n    for tag_id, value in tags:\n        if tag_id == '62F':\n            after_closing = True\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n            continue\n        if after_closing:\n            continue  # skip :64:, :65:, summary :86:/SUM/\n\n        if tag_id == '61':\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n            pending_61 = value\n        elif tag_id == '86':\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, value, currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n        else:\n            if pending_61 is not None:\n                txn = _parse_entry(pending_61, '', currency, source_file)\n                if txn:\n                    transactions.append(txn)\n                pending_61 = None\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.MT940_INPUT,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        bank='ING',\n        iban=iban,\n        currency=currency,\n        statement_number=tag_dict.get('28C', '') or None,\n        period_start=period_start,\n        period_end=period_end,\n        opening_balance=opening_balance,\n        closing_balance=closing_balance,\n        transactions=transactions,\n    )\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(content: str, source_file: str = \"\") -> BankBridgeStatement:\n    \"\"\"Parse an ING MT940 (.940) file into a BankBridgeStatement.\n\n    Handles both plain MT940 and SWIFT FIN-wrapped formats.\n    Returns a single statement covering the full period.\n    \"\"\"\n    content = _strip_swift_fin(content)\n    stmt = _parse_block(content.strip(), source_file)\n    if stmt is None:\n        raise ValueError(f\"Could not parse ING MT940 from {source_file!r}\")\n    return stmt\n", "bankbridge/parsers/ing/pdf_parser.py": "\"\"\"ING PDF bank statement parser (Zakelijke rekening).\n\nLayout \u2014 all pages:\n    Header area (y \u003c column_header_y):\n        - Page 1 only: account holder, Rekeningnummer, Beginsaldo, Eindsaldo, Periode\n        - Every page: \"Afschrift Zakelijke rekening\" (top right), Pagina N van N (bottom)\n    Column header row: \"Geboekt op | Naam / Omschrijving / Mededeling | Type | Bedrag (EUR)\"\n    Transaction rows (y > column_header_y):\n        - Header line: Date(x0\u224850) | Name(x0\u2248107) | Type(x0\u2248368) | Amount(x0>500, \u00b1prefix)\n        - Sub-lines (x0\u2248107): Omschrijving, IBAN, Kenmerk, Machtiging ID,\n          Incassant ID, Doorlopende incasso (flag), Valutadatum, Datum/Tijd,\n          Factuurnr., Betreft IBAN, Periode, Overige partij\n        - A long sub-line value wraps across several rows; only the first row\n          carries the label.  Unlabelled rows are continuations of the value\n          above them and must be appended to it (ING's own MT940/CAMT export\n          contains the full, joined text).\n\nDate format: DD-MM-YYYY.\nAmount format: \u00b1NNN,NN (e.g. -29,50 = debit, +94,38 = credit).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom datetime import date\nfrom decimal import Decimal, InvalidOperation\nfrom typing import Optional\n\nfrom bankbridge.extractors.raw_document import RawDocument\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator, ExtractionMethod\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction, TransactionCodes\n\nPARSER_NAME = \"ing_pdf\"\nPARSER_VERSION = \"1.0.0\"\n\n# ---------------------------------------------------------------------------\n# Column thresholds (points)\n# ---------------------------------------------------------------------------\n\n_DATE_X0_MIN: float = 45.0\n_DATE_X0_MAX: float = 65.0\n_NAME_X0_MIN: float = 100.0\n_NAME_X0_MAX: float = 360.0\n_TYPE_X0_MIN: float = 350.0\n_TYPE_X0_MAX: float = 420.0\n_AMOUNT_X0_MIN: float = 500.0\n_PAGE_FOOTER_Y: float = 780.0\n\n# ---------------------------------------------------------------------------\n# Patterns\n# ---------------------------------------------------------------------------\n\n_TXN_DATE_RE = re.compile(r'^\\d{2}-\\d{2}-\\d{4}$')\n_DUTCH_AMOUNT_RE = re.compile(r'^\\d{1,3}(?:\\.\\d{3})*,\\d{2}$')\n_SIGNED_AMOUNT_RE = re.compile(r'^([+-])(\\d{1,3}(?:\\.\\d{3})*,\\d{2})$')\n_IBAN_RE = re.compile(r'^[A-Z]{2}\\d{2}[A-Z0-9]{10,30}$')\n\n# Known sub-line labels (longest first to avoid prefix collisions)\n_SUBLINE_LABELS = [\n    'Doorlopende incasso',\n    'Machtiging ID',\n    'Overige partij',\n    'Incassant ID',\n    'Betreft IBAN',\n    'Omschrijving',\n    'Valutadatum',\n    'Datum/Tijd',\n    'Factuurnr.',\n    'Kenmerk',\n    'Periode',\n    'IBAN',\n]\n\n# Sub-line label that is a standalone flag, not a label/value pair.\n_RECURRING_FLAG = 'Doorlopende incasso'\n\n# Sub-lines that carry free-text remittance information, in the form ING itself\n# uses in its MT940 /REMI/USTD// and CAMT \u003cRmtInf>\u003cUstrd> output:\n#   - 'Omschrijving' contributes its value without the label\n#   - the other labels are reproduced with their label text\n# Sub-lines that map to a dedicated canonical field (IBAN, Kenmerk, Machtiging\n# ID, Incassant ID, Valutadatum, Datum/Tijd, Overige partij) are deliberately\n# absent here \u2014 they are exported through their own field, not the description.\n_DESCRIPTION_LABELS: dict[str, Optional[str]] = {\n    '': None,                        # text before any label\n    'Omschrijving': None,\n    'Factuurnr.': 'Factuurnr.',\n    'Betreft IBAN': 'Betreft IBAN:',\n    'Periode': 'Periode:',\n}\n\n\n# ---------------------------------------------------------------------------\n# Low-level helpers\n# ---------------------------------------------------------------------------\n\ndef _parse_date_dmy(text: str) -> Optional[date]:\n    \"\"\"Parse DD-MM-YYYY into a date object.\"\"\"\n    try:\n        d, m, y = text.split('-')\n        return date(int(y), int(m), int(d))\n    except (ValueError, AttributeError):\n        return None\n\n\ndef _parse_dutch_amount(text: str) -> Optional[Decimal]:\n    \"\"\"Parse Dutch amount: '1.234,56' or '186,01' \u2192 Decimal.\"\"\"\n    try:\n        clean = text.strip().replace('.', '').replace(',', '.')\n        return Decimal(clean)\n    except InvalidOperation:\n        return None\n\n\ndef _parse_signed_amount(text: str) -> tuple[Optional[Decimal], Optional[CreditDebitIndicator]]:\n    \"\"\"Parse \u00b1NNN,NN amount with explicit sign prefix.\"\"\"\n    m = _SIGNED_AMOUNT_RE.match(text.strip())\n    if not m:\n        return None, None\n    sign, digits = m.group(1), m.group(2)\n    amount = _parse_dutch_amount(digits)\n    if amount is None:\n        return None, None\n    indicator = CreditDebitIndicator.CREDIT if sign == '+' else CreditDebitIndicator.DEBIT\n    return amount, indicator\n\n\ndef _group_into_lines(words: list[dict]) -> list[list[dict]]:\n    \"\"\"Group words into lines by y-coordinate (tolerance 2 pt).\"\"\"\n    if not words:\n        return []\n    sorted_words = sorted(words, key=lambda w: (round(w['top'] / 2) * 2, w['x0']))\n    lines: list[list[dict]] = []\n    current: list[dict] = [sorted_words[0]]\n    current_y = sorted_words[0]['top']\n\n    for word in sorted_words[1:]:\n        if abs(word['top'] - current_y) \u003c= 2.5:\n            current.append(word)\n        else:\n            lines.append(sorted(current, key=lambda w: w['x0']))\n            current = [word]\n            current_y = word['top']\n    lines.append(sorted(current, key=lambda w: w['x0']))\n    return lines\n\n\ndef _find_column_header_y(lines: list[list[dict]]) -> Optional[float]:\n    \"\"\"Find y-coordinate of the 'Geboekt op' column header line.\"\"\"\n    for line in lines:\n        for w in line:\n            if w['text'] == 'Geboekt' and _DATE_X0_MIN - 10 \u003c w['x0'] \u003c _DATE_X0_MAX + 10:\n                return line[0]['top']\n    return None\n\n\ndef _is_transaction_header(line: list[dict]) -> bool:\n    \"\"\"Return True iff this line has a date word in the date column.\"\"\"\n    return any(\n        _TXN_DATE_RE.match(w['text']) and _DATE_X0_MIN \u003c= w['x0'] \u003c= _DATE_X0_MAX\n        for w in line\n    )\n\n\ndef _parse_subline(text: str) -> tuple[str, str]:\n    \"\"\"Return (label, value) for a sub-line, or ('', text) if no label matched.\"\"\"\n    for label in _SUBLINE_LABELS:\n        if text.startswith(label):\n            rest = text[len(label):]\n            if not rest or rest[0] in (':', ' '):\n                value = rest.lstrip(':').strip()\n                return label, value\n    return '', text\n\n\ndef _extract_transaction_fields(\n    header_words: list[dict],\n    sub_lines: list[str],\n) -> Optional[dict]:\n    \"\"\"Extract raw fields from a transaction's header words and sub-lines.\"\"\"\n    # Date\n    date_word = next(\n        (w for w in header_words\n         if _TXN_DATE_RE.match(w['text']) and _DATE_X0_MIN \u003c= w['x0'] \u003c= _DATE_X0_MAX),\n        None\n    )\n    if date_word is None:\n        return None\n\n    booking_date = _parse_date_dmy(date_word['text'])\n    if booking_date is None:\n        return None\n\n    # Name: words at 100 \u003c x0 \u003c 360\n    name_words = sorted(\n        [w for w in header_words if _NAME_X0_MIN \u003c= w['x0'] \u003c= _NAME_X0_MAX],\n        key=lambda w: w['x0'],\n    )\n    counterparty_name = ' '.join(w['text'] for w in name_words) if name_words else None\n\n    # Transaction type\n    type_words = sorted(\n        [w for w in header_words if _TYPE_X0_MIN \u003c= w['x0'] \u003c= _TYPE_X0_MAX],\n        key=lambda w: w['x0'],\n    )\n    txn_type = ' '.join(w['text'] for w in type_words) if type_words else None\n\n    # Amount (signed, x0 > 500)\n    amount_words = [w for w in header_words if w['x0'] >= _AMOUNT_X0_MIN]\n    amount: Optional[Decimal] = None\n    indicator: Optional[CreditDebitIndicator] = None\n    for aw in sorted(amount_words, key=lambda w: w['x0']):\n        amount, indicator = _parse_signed_amount(aw['text'])\n        if amount is not None:\n            break\n\n    if amount is None or indicator is None:\n        return None\n\n    # Parse sub-lines into ordered (label, value) pairs.  ING wraps a long\n    # value over several rows and only labels the first one, so an unlabelled\n    # row continues the value above it instead of being discarded.\n    pairs: list[list[str]] = []\n    is_recurring = False\n    for sl in sub_lines:\n        label, value = _parse_subline(sl)\n        if label == _RECURRING_FLAG:\n            is_recurring = True\n            # A standalone flag ends the previous value; nothing can continue it.\n            pairs.append([_RECURRING_FLAG, ''])\n        elif label:\n            pairs.append([label, value])\n        elif pairs and pairs[-1][0] != _RECURRING_FLAG:\n            prev = pairs[-1][1]\n            pairs[-1][1] = f\"{prev} {value}\".strip() if prev else value.strip()\n        else:\n            pairs.append(['', value.strip()])\n\n    fields: dict[str, str] = {}\n    for label, value in pairs:\n        if label and label != _RECURRING_FLAG and label not in fields:\n            fields[label] = value\n\n    return {\n        'booking_date': booking_date,\n        'counterparty_name': counterparty_name,\n        'txn_type': txn_type,\n        'amount': amount,\n        'indicator': indicator,\n        'iban': fields.get('IBAN'),\n        'kenmerk': fields.get('Kenmerk'),\n        'omschrijving': fields.get('Omschrijving'),\n        'factuurnr': fields.get('Factuurnr.'),\n        'betreft_iban': fields.get('Betreft IBAN'),\n        'periode': fields.get('Periode'),\n        'overige_partij': fields.get('Overige partij'),\n        'machtiging_id': fields.get('Machtiging ID'),\n        'incassant_id': fields.get('Incassant ID'),\n        'valutadatum_str': fields.get('Valutadatum'),\n        'is_recurring': is_recurring,\n        'description_parts': _description_parts(pairs),\n        'raw_sub_lines': sub_lines,\n    }\n\n\ndef _description_parts(pairs: list[list[str]]) -> list[str]:\n    \"\"\"Return the remittance-information parts of *pairs*, in source order.\n\n    Mirrors what ING itself puts in /REMI/USTD// (MT940) and \u003cRmtInf>\u003cUstrd>\n    (CAMT.053): the free-text sub-lines, each rendered with the label text ING\n    keeps in its own exports.  See ``_DESCRIPTION_LABELS``.\n    \"\"\"\n    parts: list[str] = []\n    for label, value in pairs:\n        if label not in _DESCRIPTION_LABELS:\n            continue\n        value = value.strip()\n        if not value:\n            continue\n        prefix = _DESCRIPTION_LABELS[label]\n        parts.append(f\"{prefix} {value}\" if prefix else value)\n    return parts\n\n\n# ---------------------------------------------------------------------------\n# Page 1 metadata extraction\n# ---------------------------------------------------------------------------\n\ndef _extract_page1_metadata(words: list[dict]) -> dict:\n    \"\"\"Extract account info and balances from page 1 header words.\"\"\"\n    meta: dict = {}\n\n    # Period: find \"t/m\" word, take adjacent date words on same line\n    tm_words = [w for w in words if w['text'] == 't/m']\n    if tm_words:\n        tm_y = tm_words[0]['top']\n        date_words = sorted(\n            [w for w in words\n             if abs(w['top'] - tm_y) \u003c 3 and _TXN_DATE_RE.match(w['text'])],\n            key=lambda w: w['x0'],\n        )\n        if len(date_words) >= 2:\n            meta['period_start'] = _parse_date_dmy(date_words[0]['text'])\n            meta['period_end'] = _parse_date_dmy(date_words[1]['text'])\n\n    # IBAN: look near \"Rekeningnummer\" label (right side, y\u2248142)\n    rek_words = [w for w in words if w['text'] == 'Rekeningnummer' and w['x0'] > 400]\n    if rek_words:\n        rn_y = rek_words[0]['top']\n        iban_parts = sorted(\n            [w for w in words\n             if w['top'] > rn_y and w['top'] \u003c rn_y + 25 and w['x0'] > 400],\n            key=lambda w: w['x0'],\n        )\n        joined = ''.join(p['text'] for p in iban_parts)\n        if _IBAN_RE.match(joined):\n            meta['iban'] = joined\n\n    # Account holder: words at y\u2248130, x0 \u003c 200 (left side, after header)\n    holder_candidates = sorted(\n        [w for w in words if 125 \u003c w['top'] \u003c 150 and w['x0'] \u003c 200],\n        key=lambda w: w['x0'],\n    )\n    if holder_candidates:\n        meta['account_holder'] = ' '.join(w['text'] for w in holder_candidates)\n\n    # Opening balance: find \"Beginsaldo\" label, then amount on next line at x0 \u2208 [380, 490]\n    beg_words = [w for w in words if w['text'] == 'Beginsaldo']\n    if beg_words:\n        beg_y = beg_words[0]['top']\n        bal_candidates = sorted(\n            [w for w in words\n             if w['top'] > beg_y and w['top'] \u003c beg_y + 25 and 380 \u003c w['x0'] \u003c 490\n             and _DUTCH_AMOUNT_RE.match(w['text'])],\n            key=lambda w: w['x0'],\n        )\n        if bal_candidates:\n            meta['opening_balance_str'] = bal_candidates[0]['text']\n            meta['opening_balance_y'] = bal_candidates[0]['top']\n\n    # Closing balance: find \"Eindsaldo\" label\n    end_words = [w for w in words if w['text'] == 'Eindsaldo']\n    if end_words:\n        end_y = end_words[0]['top']\n        bal_candidates = sorted(\n            [w for w in words\n             if w['top'] > end_y and w['top'] \u003c end_y + 25 and 380 \u003c w['x0'] \u003c 490\n             and _DUTCH_AMOUNT_RE.match(w['text'])],\n            key=lambda w: w['x0'],\n        )\n        if bal_candidates:\n            meta['closing_balance_str'] = bal_candidates[0]['text']\n            meta['closing_balance_y'] = bal_candidates[0]['top']\n\n    return meta\n\n\n# ---------------------------------------------------------------------------\n# Transaction parsing\n# ---------------------------------------------------------------------------\n\ndef _compose_description(fields: dict) -> Optional[str]:\n    \"\"\"Join the remittance-information parts of *fields* into one description.\n\n    Uses the ordered ``description_parts`` captured from the source sub-lines\n    when available.  Field dicts built without sub-line ordering fall back to\n    the individually named free-text fields, in the order ING prints them.\n    \"\"\"\n    parts = fields.get('description_parts')\n    if parts is None:\n        parts = _description_parts([\n            ['Omschrijving', fields.get('omschrijving') or ''],\n            ['Factuurnr.', fields.get('factuurnr') or ''],\n            ['Betreft IBAN', fields.get('betreft_iban') or ''],\n            ['Periode', fields.get('periode') or ''],\n        ])\n    parts = [p.strip() for p in parts if p and p.strip()]\n    return ' '.join(parts) if parts else None\n\n\ndef _build_transaction(\n    fields: dict,\n    currency: str,\n    source_file: str,\n    page_num: int,\n) -> Optional[BankBridgeTransaction]:\n    booking_date: date = fields['booking_date']\n    amount: Decimal = fields['amount']\n    indicator: CreditDebitIndicator = fields['indicator']\n\n    kenmerk = fields.get('kenmerk')\n    end_to_end_id = kenmerk if kenmerk and kenmerk.upper() != 'NOTPROVIDED' else None\n    value_date = _parse_date_dmy((fields.get('valutadatum_str') or '').split(' ')[0]) or booking_date\n\n    def _c(v: Optional[str]) -> Optional[str]:\n        return v.strip() if v and v.strip() else None\n\n    description = _compose_description(fields)\n\n    # 'Overige partij' is ING's ultimate party; it maps to /ULTC/ (MT940) and\n    # UltmtCdtr/UltmtDbtr (CAMT.053) \u2014 never into the description.\n    overige_partij = _c(fields.get('overige_partij'))\n    is_debit = indicator == CreditDebitIndicator.DEBIT\n\n    return BankBridgeTransaction(\n        source_document=source_file,\n        source_page=page_num,\n        booking_date=booking_date,\n        value_date=value_date,\n        amount=amount,\n        currency=currency,\n        debit_credit=indicator,\n        counterparty_name=_c(fields.get('counterparty_name')),\n        counterparty_iban=_c(fields.get('iban')),\n        description=description,\n        end_to_end_id=_c(end_to_end_id),\n        payment_reference=_c(end_to_end_id),\n        mandate_reference=_c(fields.get('machtiging_id')),\n        creditor_id=_c(fields.get('incassant_id')),\n        ultimate_creditor_name=overige_partij if is_debit else None,\n        ultimate_debtor_name=None if is_debit else overige_partij,\n        original_text=fields.get('raw_sub_lines', []),\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        transaction_codes=TransactionCodes(\n            source_raw_code=fields.get('txn_type'),\n        ),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef parse_file(path) -> BankBridgeStatement:\n    \"\"\"Parse an ING Zakelijke rekening PDF into a BankBridgeStatement.\n\n    Args:\n        path: Path to the PDF file (str or pathlib.Path).\n    \"\"\"\n    from bankbridge.extractors.pdf.pdfminer_extractor import extract\n    doc = path if isinstance(path, RawDocument) else extract(path)\n    return parse(doc)\n\n\ndef parse(doc: RawDocument) -> BankBridgeStatement:\n    \"\"\"Parse only positioned RawDocument data (ADR-005).\"\"\"\n    source_file = doc.source_file\n\n    transactions: list[BankBridgeTransaction] = []\n    page1_meta: dict = {}\n    currency = 'EUR'\n\n    for page_idx, page in enumerate(doc.pages):\n        words = page.word_boxes()\n        if not words:\n            continue\n\n        lines = _group_into_lines(words)\n\n        # Extract page 1 metadata\n        if page_idx == 0:\n            page1_meta = _extract_page1_metadata(words)\n\n        # Find column header line y-position\n        col_header_y = _find_column_header_y(lines)\n        if col_header_y is None:\n            continue\n\n        # Parse transaction lines\n        current_header: Optional[list[dict]] = None\n        current_sub_lines: list[str] = []\n\n        for line in lines:\n            y = line[0]['top'] if line else 0\n\n            if y \u003c= col_header_y:\n                continue\n            if y >= _PAGE_FOOTER_Y:\n                continue\n\n            if _is_transaction_header(line):\n                # Finalize previous transaction\n                if current_header is not None:\n                    fields = _extract_transaction_fields(current_header, current_sub_lines)\n                    if fields:\n                        txn = _build_transaction(fields, currency, source_file, page_idx + 1)\n                        if txn:\n                            transactions.append(txn)\n                current_header = line\n                current_sub_lines = []\n            elif current_header is not None:\n                # Sub-line: join words as text\n                sub_text = ' '.join(w['text'] for w in line)\n                current_sub_lines.append(sub_text)\n\n        # Finalize last transaction on page\n        if current_header is not None:\n            fields = _extract_transaction_fields(current_header, current_sub_lines)\n            if fields:\n                txn = _build_transaction(fields, currency, source_file, page_idx + 1)\n                if txn:\n                    transactions.append(txn)\n\n\n    # Build balances from page 1 metadata\n    opening_balance: Optional[Balance] = None\n    closing_balance: Optional[Balance] = None\n    period_start = page1_meta.get('period_start')\n    period_end = page1_meta.get('period_end')\n\n    if period_start and 'opening_balance_str' in page1_meta:\n        amount = _parse_dutch_amount(page1_meta['opening_balance_str'])\n        if amount is not None:\n            opening_balance = Balance(\n                amount=amount,\n                credit_debit=CreditDebitIndicator.CREDIT,\n                date=period_start,\n                balance_type=BalanceType.OPENING_BOOKED,\n                currency=currency,\n            )\n\n    if period_end and 'closing_balance_str' in page1_meta:\n        amount = _parse_dutch_amount(page1_meta['closing_balance_str'])\n        if amount is not None:\n            closing_balance = Balance(\n                amount=amount,\n                credit_debit=CreditDebitIndicator.CREDIT,\n                date=period_end,\n                balance_type=BalanceType.CLOSING_BOOKED,\n                currency=currency,\n            )\n\n    return BankBridgeStatement(\n        source_file=source_file,\n        extraction_method=ExtractionMethod.PDF_DIGITAL,\n        parser_name=PARSER_NAME,\n        parser_version=PARSER_VERSION,\n        bank='ING',\n        iban=page1_meta.get('iban'),\n        account_holder=page1_meta.get('account_holder'),\n        currency=currency,\n        layout_profile='ING_PDF_V1',\n        period_start=period_start,\n        period_end=period_end,\n        opening_balance=opening_balance,\n        closing_balance=closing_balance,\n        transactions=transactions,\n    )\n", "bankbridge/parsers/pdf_layout_detector.py": "\"\"\"PDF layout detection \u2014 identifies bank and layout profile before parsing.\n\nFlow\n----\n    PDF  \u2192  _extract_page1_features()  \u2192  _check_*()  \u2192  LayoutProfile\n                                                                \u2193\n                                                          get_parser()\n                                                                \u2193\n                                                      parse_file(path) \u2192 BankBridgeStatement\n\nDesign constraints\n------------------\n- Detection is deterministic: each criterion is a boolean structural test.\n- No AI, no fuzzy matching, no confidence scores.\n- Fail-safe: raises UnknownLayoutError when no profile matches, so callers\n  never inadvertently run a parser against an unsupported layout.\n- Bank-aware errors: if the bank is recognised but the layout is not, the\n  exception carries the bank name so callers can produce a targeted message.\n\nAdding a new profile\n--------------------\n1. Define a ``_check_\u003cname>()`` function with deterministic criteria.\n2. Add a ``LayoutProfile`` constant.\n3. Add the check to the detection sequence in ``detect()``.\n4. Register the parser in ``_PARSER_REGISTRY`` inside ``get_parser()``.\n5. Add tests in ``tests/test_pdf_layout_detector.py``.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Callable, Optional\n\nfrom bankbridge.extractors.raw_document import RawDocument\n\n\n# ---------------------------------------------------------------------------\n# Profile model\n# ---------------------------------------------------------------------------\n\n@dataclass(frozen=True)\nclass LayoutProfile:\n    \"\"\"Immutable descriptor for a supported bank PDF layout.\"\"\"\n\n    bank: str          # Human-readable bank name, e.g. \"Rabobank\"\n    profile_id: str    # Unique machine key,  e.g. \"RABO_PDF_V1\"\n    description: str   # One-line description for logs and error messages\n\n\n# ---------------------------------------------------------------------------\n# Supported profiles\n# ---------------------------------------------------------------------------\n\nRABO_PDF_V1 = LayoutProfile(\n    bank=\"Rabobank\",\n    profile_id=\"RABO_PDF_V1\",\n    description=\"Rabobank Rekeningafschrift PDF, layout version 1\",\n)\n\nABN_PDF_V1 = LayoutProfile(\n    bank=\"ABN AMRO\",\n    profile_id=\"ABN_PDF_V1\",\n    description=\"ABN AMRO Bankafschrift PDF, layout version 1\",\n)\n\nING_PDF_V1 = LayoutProfile(\n    bank=\"ING\",\n    profile_id=\"ING_PDF_V1\",\n    description=\"ING Afschrift Zakelijke rekening PDF, layout version 1\",\n)\n\nASN_PDF_V1 = LayoutProfile(\n    bank=\"ASN Bank\",\n    profile_id=\"ASN_PDF_V1\",\n    description=\"ASN Bank (RegioBank Plus Betalen) Rekeningafschrift PDF, layout version 1\",\n)\n\n_ALL_PROFILES: tuple[LayoutProfile, ...] = (RABO_PDF_V1, ABN_PDF_V1, ING_PDF_V1, ASN_PDF_V1)\n\n\n# ---------------------------------------------------------------------------\n# Error\n# ---------------------------------------------------------------------------\n\nclass UnknownLayoutError(Exception):\n    \"\"\"Raised when the PDF does not match any supported layout profile.\n\n    Attributes\n    ----------\n    bank : str | None\n        Set to the recognised bank name when the bank could be identified\n        but no supported layout matched.  ``None`` when the bank itself is\n        not recognised.\n    \"\"\"\n\n    def __init__(self, message: str, *, bank: Optional[str] = None) -> None:\n        super().__init__(message)\n        self.bank: Optional[str] = bank\n\n\n# ---------------------------------------------------------------------------\n# Feature extraction (page 1 only)\n# ---------------------------------------------------------------------------\n\ndef _extract_page1_features(\n    path: str | Path,\n) -> tuple[set[str], list[tuple[str, float]]]:\n    \"\"\"Return (texts, texts_with_x0) from page 1 of the PDF.\n\n    ``texts``        \u2014 set of all word tokens on page 1 (fast membership tests)\n    ``texts_with_x0``\u2014 list of (token, x0) tuples for positional checks\n    \"\"\"\n    from bankbridge.extractors.pdf.pdfminer_extractor import extract\n    doc = path if isinstance(path, RawDocument) else extract(path)\n    elements = doc.pages[0].elements if doc.pages else []\n    texts = {e.text for e in elements}\n    texts_with_x = [(e.text, e.x0) for e in elements]\n    return texts, texts_with_x\n\n\n# ---------------------------------------------------------------------------\n# Layout-specific criteria\n# ---------------------------------------------------------------------------\n\n_DD_MM_RE = re.compile(r\"^\\d{2}-\\d{2}$\")\n_DOTTED_ACCT_RE = re.compile(r\"^\\d{2}\\.\\d{2}\\.\\d{2}\\.\\d{3}$\")\n_ING_PRINT_CODE = \"10SPYAP-A\"  # printed bottom-left on every ING PDF page\n\n\ndef _check_rabo_pdf_v1(\n    texts: set[str],\n    texts_with_x: list[tuple[str, float]],\n) -> bool:\n    \"\"\"Return True iff all RABO_PDF_V1 structural criteria are satisfied.\n\n    Criteria (all must hold):\n    1. \"Rekeningafschrift\" present  \u2014 Rabobank document type label\n    2. \"Rabobank\" present           \u2014 bank identity\n    3. \"Ten\" and \"name\" present     \u2014 account-holder label fragment\n    4. \"Datum\" NOT at x0 \u003c 50      \u2014 rules out ABN AMRO column header\n    5. DD-MM date at x0 \u003c 68       \u2014 Rabobank uses DD-MM (no year) for transactions\n    \"\"\"\n    if \"Rekeningafschrift\" not in texts:\n        return False\n    if \"Rabobank\" not in texts:\n        return False\n    if \"Ten\" not in texts or \"name\" not in texts:\n        return False\n
