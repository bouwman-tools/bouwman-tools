<script id="bankbridge-config" type="application/json">{"entrypoint": "app.py", "requirements": ["pdfminer.six==20260107", "pandas==2.2.3"], "files": {"app.py": "\"\"\"BankBridge \u2014 lokale webinterface.\n\nStart: streamlit run app.py\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom html import escape\nimport logging\n\n# PDF diagnostics must never echo source text into browser/server logs.\n_pdf_log = logging.getLogger(\"pdfminer\")\n_pdf_log.addHandler(logging.NullHandler())\n_pdf_log.propagate = False\n\nimport hashlib\nimport json\nfrom decimal import Decimal\nfrom typing import Optional\n\nimport streamlit as st\n\nfrom bankbridge.app.service import (\n    ConversionResult,\n    UnknownLayoutDiagnostic,\n    _detect_source_type,\n    build_diagnostic,\n    convert_file,\n    export_camt053,\n    export_mt940,\n    generate_filename,\n)\nfrom bankbridge.models.enums import CreditDebitIndicator, ValidationStatus\nfrom bankbridge.parsers.csv_layout_detector import UnknownCsvLayoutError\nfrom bankbridge.parsers.pdf_layout_detector import UnknownLayoutError\n\n# ---------------------------------------------------------------------------\n# Pagina-configuratie\n# ---------------------------------------------------------------------------\n\nst.set_page_config(\n    page_title=\"BankBridge\",\n    layout=\"centered\",\n    initial_sidebar_state=\"collapsed\",\n)\n\n# Minimale CSS voor een professionele uitstraling\nst.markdown(\n    \"\"\"\n    \u003cstyle>\n    .bb-header { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }\n    .bb-sub    { color: #555; margin-bottom: 1.5rem; }\n    .bb-label  { font-size: 0.78rem; font-weight: 600; color: #666;\n                 text-transform: uppercase; letter-spacing: 0.5px; }\n    .bb-value  { font-size: 1rem; margin-bottom: 0.25rem; }\n    .bb-privacy { font-size: 0.8rem; color: #888; background: #f5f5f5;\n                  padding: 0.4rem 0.7rem; border-radius: 4px;\n                  display: inline-block; margin-bottom: 1rem; }\n    .bb-section { margin-top: 1.5rem; }\n    \u003c/style>\n    \"\"\",\n    unsafe_allow_html=True,\n)\n\n\n# ---------------------------------------------------------------------------\n# Hulpfuncties \u2014 opmaak (presentatielaag; geen wijzigingen in core)\n# ---------------------------------------------------------------------------\n\ndef _fmt_amount(amount: Optional[Decimal]) -> str:\n    \"\"\"Formatteer als Nederlandse valuta: \u20ac 1.234,56\"\"\"\n    if amount is None:\n        return \"niet beschikbaar\"\n    s = f\"{amount:,.2f}\"           # US: \"1,234.56\"\n    s = s.replace(\",\", \"\\x00\").replace(\".\", \",\").replace(\"\\x00\", \".\")\n    return f\"\u20ac\u00a0{s}\"\n\n\ndef _fmt_date(d) -> str:\n    \"\"\"Formatteer als DD-MM-YYYY.\"\"\"\n    if d is None:\n        return \"\u2014\"\n    return d.strftime(\"%d-%m-%Y\")\n\n\ndef _fmt_cd(ind: CreditDebitIndicator) -> str:\n    return \"Bij\" if ind == CreditDebitIndicator.CREDIT else \"Af\"\n\n\n# ---------------------------------------------------------------------------\n# Sessie-initialisatie\n# ---------------------------------------------------------------------------\n\ndef _reset_state() -> None:\n    for key in [\"result\", \"error_msg\", \"diagnostic\", \"source_type\"]:\n        st.session_state.pop(key, None)\n\n\n# ---------------------------------------------------------------------------\n# Weergavefuncties\n# ---------------------------------------------------------------------------\n\ndef _show_detection(result: ConversionResult) -> None:\n    st.markdown(\"#### Bestand herkend\")\n    c1, c2, c3 = st.columns(3)\n    c1.metric(\"Bank\", result.bank)\n    c2.metric(\"Bron\", result.source_type)\n    c3.metric(\"Profiel\", result.profile_id)\n\n\ndef _show_validation(result: ConversionResult) -> None:\n    st.markdown(\"#### Financi\u00eble controle\")\n    status = result.validation.status\n\n    if status == ValidationStatus.GREEN:\n        st.success(\"Geslaagd \u2014 alle controles doorstaan.\")\n    elif status == ValidationStatus.ORANGE:\n        st.warning(\"Verwerkt met waarschuwingen \u2014 export mogelijk, controleer de meldingen.\")\n    else:\n        st.error(\"Conversie geblokkeerd \u2014 los de fouten op voor export.\")\n\n    errors = result.validation.errors\n    warnings = result.validation.warnings\n    infos = [i for i in result.validation.issues\n             if not i.is_error and not i.is_warning]\n\n    for issue in errors:\n        st.text(f\"Fout \u2014 {issue.message} [{issue.code}]\")\n    for issue in warnings:\n        st.text(f\"Waarschuwing \u2014 {issue.message} [{issue.code}]\")\n    for issue in infos:\n        st.text(f\"Info: {issue.message}\")\n\n\ndef _show_summary(result: ConversionResult) -> None:\n    stmt = result.statement\n\n    st.markdown(\"#### Rekening\")\n    c1, c2 = st.columns(2)\n    with c1:\n        st.markdown('\u003cp class=\"bb-label\">IBAN\u003c/p>', unsafe_allow_html=True)\n        st.markdown(f'\u003cp class=\"bb-value\">{escape(stmt.iban or stmt.account_number or \"\u2014\")}\u003c/p>',\n                    unsafe_allow_html=True)\n    with c2:\n        st.markdown('\u003cp class=\"bb-label\">Periode\u003c/p>', unsafe_allow_html=True)\n        if stmt.period_start and stmt.period_end:\n            st.markdown(\n                f'\u003cp class=\"bb-value\">{_fmt_date(stmt.period_start)}'\n                f' t/m {_fmt_date(stmt.period_end)}\u003c/p>',\n                unsafe_allow_html=True,\n            )\n        else:\n            st.markdown('\u003cp class=\"bb-value\">\u2014\u003c/p>', unsafe_allow_html=True)\n\n    st.markdown(\"#### Financieel overzicht\")\n    ob = stmt.opening_balance\n    cb = stmt.closing_balance\n\n    c1, c2, c3, c4 = st.columns(4)\n    c1.metric(\n        \"Beginsaldo\",\n        _fmt_amount(ob.amount if ob else None) if ob else \"niet beschikbaar\",\n    )\n    c2.metric(\"Totaal bij\", _fmt_amount(stmt.total_credits))\n    c3.metric(\"Totaal af\", _fmt_amount(stmt.total_debits))\n    c4.metric(\n        \"Eindsaldo\",\n        _fmt_amount(cb.amount if cb else None) if cb else \"niet beschikbaar\",\n    )\n\n    st.markdown(\n        f\"**{len(stmt.transactions)} transacties** verwerkt.\",\n        help=\"Aantal geparste boekingen in het afschrift.\",\n    )\n\n\ndef _show_source_info(result: ConversionResult) -> None:\n    \"\"\"Compact overzicht van beschikbare bronvelden (geen financi\u00eble waarden).\"\"\"\n    stmt = result.statement\n    txns = stmt.transactions\n    if not txns:\n        return\n\n    def _availability(field_name: str) -> str:\n        filled = sum(1 for t in txns if getattr(t, field_name) is not None)\n        pct = filled / len(txns)\n        if pct == 1.0:\n            return \"Beschikbaar\"\n        elif pct == 0.0:\n            return \"Niet beschikbaar in bron\"\n        else:\n            return f\"Deels beschikbaar ({filled}/{len(txns)})\"\n\n    with st.expander(\"Broninformatie\", expanded=False):\n        st.caption(\n            f\"Parser: {stmt.parser_name} v{stmt.parser_version}  |  \"\n            f\"Extractiemethode: {stmt.extraction_method.value}\"\n        )\n        data = {\n            \"Tegenpartijrekening (IBAN)\": _availability(\"counterparty_iban\"),\n            \"Tegenpartijnaam\": _availability(\"counterparty_name\"),\n            \"Omschrijving\": _availability(\"description\"),\n            \"Valutadatum\": _availability(\"value_date\"),\n            \"Incassant-ID\": _availability(\"creditor_id\"),\n            \"Machtigingskenmerk\": _availability(\"mandate_reference\"),\n            \"Tegenpartij-BIC\": _availability(\"counterparty_bic\"),\n        }\n        for label, val in data.items():\n            icon = \"\u2713\" if val == \"Beschikbaar\" else (\"\u2013\" if \"Niet\" in val else \"~\")\n            st.markdown(f\"{icon} **{label}**: {val}\")\n\n\ndef _show_transaction_preview(result: ConversionResult) -> None:\n    stmt = result.statement\n    if not stmt.transactions:\n        st.info(\"Geen transacties gevonden in het afschrift.\")\n        return\n\n    st.markdown(\"#### Transactieoverzicht\")\n\n    sorted_txns = sorted(\n        stmt.transactions,\n        key=lambda t: (t.booking_date or __import__(\"datetime\").date(2000, 1, 1),),\n    )\n\n    show_all = st.checkbox(\n        f\"Toon alle {len(sorted_txns)} transacties\",\n        value=False,\n        key=\"show_all_txns\",\n    )\n    display_txns = sorted_txns if show_all else sorted_txns[:20]\n\n    rows = []\n    for t in display_txns:\n        rows.append({\n            \"Datum\": _fmt_date(t.booking_date),\n            \"Bij/Af\": _fmt_cd(t.debit_credit),\n            \"Bedrag\": _fmt_amount(t.amount),\n            \"Tegenpartij\": (t.counterparty_name or t.counterparty_iban or \"\")[:50],\n            \"Omschrijving\": (t.description or \"\")[:80],\n        })\n\n    import pandas as pd\n    df = pd.DataFrame(rows)\n    st.dataframe(df, use_container_width=True, hide_index=True)\n\n    if not show_all and len(sorted_txns) > 20:\n        st.caption(f\"Eerste 20 van {len(sorted_txns)} transacties getoond.\")\n\n\ndef _show_export(result: ConversionResult) -> None:\n    if not result.validation.is_exportable:\n        st.error(\n            \"Export is geblokkeerd vanwege validatiefouten. \"\n            \"Los de bovenstaande fouten op.\"\n        )\n        return\n\n    st.markdown(\"#### Exporteren\")\n\n    stmt = result.statement\n    profile_id = result.profile_id\n\n    try:\n        mt940_content = export_mt940(stmt, profile_id)\n        mt940_filename = generate_filename(stmt, profile_id, \"MT940\")\n    except Exception as e:\n        mt940_content = None\n        st.text(f\"MT940-export niet beschikbaar: {e}\")\n\n    try:\n        camt_content = export_camt053(stmt)\n        camt_filename = generate_filename(stmt, profile_id, \"CAMT053\")\n    except Exception as e:\n        camt_content = None\n        st.text(f\"CAMT.053-export niet beschikbaar: {e}\")\n\n    c1, c2 = st.columns(2)\n    if mt940_content:\n        c1.download_button(\n            label=\"Download MT940\",\n            data=mt940_content.encode(\"utf-8\"),\n            file_name=mt940_filename,\n            mime=\"text/plain\",\n            use_container_width=True,\n        )\n    if camt_content:\n        c2.download_button(\n            label=\"Download CAMT.053\",\n            data=camt_content.encode(\"utf-8\"),\n            file_name=camt_filename,\n            mime=\"application/xml\",\n            use_container_width=True,\n        )\n\n    if mt940_content or camt_content:\n        st.caption(\"Export gedownload en opgeslagen? Verwijder daarna het ge\u00fcploade bestand met het kruisje (\u00d7) rechts naast de bestandsnaam bovenaan. Het verwerkingsresultaat wordt dan ook gewist.\")\n\n\ndef _show_unknown_layout_error(\n    diag: UnknownLayoutDiagnostic,\n    source_type: str,\n) -> None:\n    \"\"\"Toon een fail-safe melding en privacy-veilige diagnose.\"\"\"\n    if diag.bank:\n        st.error(\n            f\"**Bank herkend: {diag.bank}**  \\n\"\n            f\"Deze {source_type}-layout wordt nog niet ondersteund.\"\n        )\n    else:\n        st.error(\"Dit bankbestand wordt nog niet ondersteund.\")\n\n    with st.expander(\"Technische diagnose\", expanded=True):\n        diag_data = {\n            \"bestandsnaam\": diag.filename,\n            \"bestandstype\": diag.source_type,\n            \"herkende_bank\": diag.bank or \"niet herkend\",\n            \"fouttype\": type(\n                UnknownLayoutError(\"\") if diag.source_type == \"PDF\"\n                else UnknownCsvLayoutError(\"\")\n            ).__name__,\n            \"foutmelding\": diag.error_message,\n        }\n        if diag.page_count is not None:\n            diag_data[\"pagina_aantal\"] = diag.page_count\n        if diag.csv_headers is not None:\n            diag_data[\"csv_kolomkoppen\"] = diag.csv_headers\n\n        diag_json = json.dumps(diag_data, ensure_ascii=False, indent=2)\n        st.code(diag_json, language=\"json\")\n\n        st.download_button(\n            label=\"Diagnose downloaden\",\n            data=diag_json.encode(\"utf-8\"),\n            file_name=f\"bankbridge_diagnose_{diag.filename}.json\",\n            mime=\"application/json\",\n        )\n\n\n# ---------------------------------------------------------------------------\n# Hoofdpagina\n# ---------------------------------------------------------------------------\n\nst.markdown('\u003cp class=\"bb-header\">BankBridge\u003c/p>', unsafe_allow_html=True)\nst.markdown(\n    '\u003cp class=\"bb-sub\">Zet bankafschriften om naar MT940 of CAMT.053.\u003c/p>',\n    unsafe_allow_html=True,\n)\nst.markdown(\n    '\u003cspan class=\"bb-privacy\">Bestanden worden lokaal verwerkt en niet extern verzonden.\u003c/span>',\n    unsafe_allow_html=True,\n)\n\nwith st.expander(\"Ondersteunde formaten\", expanded=False):\n    c1, c2 = st.columns(2)\n    with c1:\n        st.markdown(\n            \"**PDF**\\n\"\n            \"- Rabobank\\n\"\n            \"- ABN AMRO\\n\"\n            \"- ING\\n\"\n            \"- ASN Bank / RegioBank\"\n        )\n    with c2:\n        st.markdown(\"**CSV**\\n- ING\")\n        st.markdown(\"**Output**\\n- MT940\\n- CAMT.053\")\n\nst.divider()\n\nuploaded_file = st.file_uploader(\n    \"Upload bankafschrift\",\n    type=[\"pdf\", \"csv\"],\n    help=\"Ondersteund: .pdf, .csv\",\n    label_visibility=\"collapsed\",\n)\n\n# ---------------------------------------------------------------------------\n# Verwerking \u2014 alleen bij nieuw bestand\n# ---------------------------------------------------------------------------\n\nif uploaded_file is not None:\n    file_bytes = uploaded_file.getvalue()\n    file_hash = hashlib.md5(file_bytes).hexdigest()\n\n    if st.session_state.get(\"current_file_hash\") != file_hash:\n        _reset_state()\n        st.session_state[\"current_file_hash\"] = file_hash\n\n        source_type = \"Onbekend\"\n        try:\n            source_type = _detect_source_type(uploaded_file.name, file_bytes)\n            st.session_state[\"source_type\"] = source_type\n\n            result = convert_file(file_bytes, uploaded_file.name)\n            st.session_state[\"result\"] = result\n\n        except (UnknownLayoutError, UnknownCsvLayoutError) as exc:\n            diag = build_diagnostic(\n                uploaded_file.name, file_bytes, source_type, exc\n            )\n            st.session_state[\"diagnostic\"] = diag\n            st.session_state[\"source_type\"] = source_type\n\n        except ValueError as exc:\n            st.session_state[\"error_msg\"] = str(exc)\n\n        except Exception as exc:\n            st.session_state[\"error_msg\"] = (\n                \"Er is een onverwachte fout opgetreden. \"\n                \"Controleer of het bestand geldig is.\"\n            )\n\nelse:\n    _reset_state()\n    st.session_state.pop(\"current_file_hash\", None)\n\n# ---------------------------------------------------------------------------\n# Resultaat weergeven\n# ---------------------------------------------------------------------------\n\nif st.session_state.get(\"error_msg\"):\n    st.error(\"Het bestand kon niet worden verwerkt.\")\n    st.text(st.session_state[\"error_msg\"])\n\nelif st.session_state.get(\"diagnostic\"):\n    diag = st.session_state[\"diagnostic\"]\n    src = st.session_state.get(\"source_type\", \"Onbekend\")\n    _show_unknown_layout_error(diag, src)\n\nelif st.session_state.get(\"result\"):\n    result: ConversionResult = st.session_state[\"result\"]\n\n    st.divider()\n    _show_detection(result)\n    st.divider()\n    _show_validation(result)\n    st.divider()\n    _show_summary(result)\n    _show_source_info(result)\n    st.divider()\n    _show_transaction_preview(result)\n    st.divider()\n    _show_export(result)\n", "bankbridge/__init__.py": "\"\"\"BankBridge \u2014 financial transaction data conversion.\"\"\"\n\n__version__ = \"0.1.0\"\n", "bankbridge/app/__init__.py": "\"\"\"BankBridge application layer \u2014 thin orchestrator between UI and core.\"\"\"\n", "bankbridge/app/service.py": "\"\"\"Application/service layer \u2014 thin orchestrator between UI and BankBridge core.\n\nRouting logic:\n    PDF \u2192 detect() \u2192 get_parser() \u2192 parse_file(path) \u2192 validate \u2192 ConversionResult\n    CSV \u2192 detect_csv() \u2192 get_csv_parser() \u2192 parse_file(content) \u2192 validate \u2192 ConversionResult\n\nDesign constraints:\n- No financial data in logs or intermediate outputs.\n- PDF temp files are always deleted after parsing.\n- No new conversion logic \u2014 delegates entirely to the existing core.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport importlib\nimport os\nimport re\nimport tempfile\nfrom dataclasses import dataclass, field\nfrom pathlib import Path\nfrom typing import Optional\n\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.validation.pipeline import validate_statement\nfrom bankbridge.validation.results import ValidationResult\n\n\n# ---------------------------------------------------------------------------\n# Result types\n# ---------------------------------------------------------------------------\n\n@dataclass\nclass ConversionResult:\n    \"\"\"Result of a successful file conversion.\"\"\"\n\n    statement: BankBridgeStatement\n    source_type: str        # \"PDF\" or \"CSV\"\n    profile_id: str         # e.g. \"RABO_PDF_V1\"\n    bank: str               # e.g. \"Rabobank\"\n    validation: ValidationResult\n\n\n@dataclass\nclass UnknownLayoutDiagnostic:\n    \"\"\"Privacy-safe technical diagnostic for files that could not be parsed.\n\n    Contains only structural/technical metadata \u2014 no financial data, no\n    transaction content, no names, IBANs, or amounts.\n    \"\"\"\n\n    filename: str\n    source_type: str                    # \"PDF\", \"CSV\", or \"Onbekend\"\n    bank: Optional[str]                 # Detected bank, or None\n    error_message: str\n    page_count: Optional[int] = None\n    csv_headers: Optional[list] = None\n\n\n# ---------------------------------------------------------------------------\n# Source type detection\n# ---------------------------------------------------------------------------\n\ndef _detect_source_type(filename: str, file_bytes: bytes) -> str:\n    \"\"\"Return \"PDF\" or \"CSV\" based on extension and, for PDF, magic bytes.\n\n    Raises\n    ------\n    ValueError\n        For unsupported extensions or an invalid PDF magic bytes.\n    \"\"\"\n    ext = Path(filename).suffix.lower()\n    if ext == \".pdf\":\n        # Some PDF generators emit a few binary bytes before the %PDF marker;\n        # search within the first 16 bytes rather than requiring position 0.\n        if b\"%PDF\" not in file_bytes[:16]:\n            raise ValueError(\n                \"Bestand heeft extensie .pdf maar is geen geldig PDF-bestand \"\n                \"(ongeldige bestandsheader).\"\n            )\n        return \"PDF\"\n    elif ext == \".csv\":\n        return \"CSV\"\n    else:\n        raise ValueError(\n            f\"Bestandstype '{ext}' wordt niet ondersteund. \"\n            \"Ondersteunde typen: .pdf, .csv\"\n        )\n\n\n# ---------------------------------------------------------------------------\n# PDF page count (for diagnostics only \u2014 no text extraction)\n# ---------------------------------------------------------------------------\n\ndef _get_pdf_page_count(file_bytes: bytes) -> Optional[int]:\n    \"\"\"Return the PDF page count without extracting any text content.\"\"\"\n    try:\n        from bankbridge.extractors.pdf.pdfminer_extractor import page_count\n        return page_count(file_bytes)\n    except Exception:\n        return None\n\n\n# ---------------------------------------------------------------------------\n# Core conversion\n# ---------------------------------------------------------------------------\n\ndef convert_file(file_bytes: bytes, filename: str) -> ConversionResult:\n    \"\"\"Parse a bank statement file and run the validation pipeline.\n\n    Parameters\n    ----------\n    file_bytes : bytes\n        Raw file content.\n    filename : str\n        Original filename (extension determines routing; used as source_file\n        metadata in the resulting BankBridgeStatement).\n\n    Returns\n    -------\n    ConversionResult\n\n    Raises\n    ------\n    ValueError\n        For unsupported file types or parse failures.\n    bankbridge.parsers.pdf_layout_detector.UnknownLayoutError\n        When a PDF bank is recognised but the layout is not supported.\n    bankbridge.parsers.csv_layout_detector.UnknownCsvLayoutError\n        When a CSV bank is recognised but the layout is not supported.\n    \"\"\"\n    source_type = _detect_source_type(filename, file_bytes)\n    if source_type == \"PDF\":\n        return _convert_pdf(file_bytes, filename)\n    return _convert_csv(file_bytes, filename)\n\n\ndef _convert_pdf(file_bytes: bytes, filename: str) -> ConversionResult:\n    from bankbridge.parsers.pdf_layout_detector import detect, get_parser\n\n    tmp_path: Optional[Path] = None\n    try:\n        fd, tmp_str = tempfile.mkstemp(suffix=\".pdf\")\n        os.close(fd)\n        tmp_path = Path(tmp_str)\n        tmp_path.write_bytes(file_bytes)\n\n        from bankbridge.extractors.pdf.pdfminer_extractor import extract\n        doc = extract(tmp_path)\n        profile = detect(doc)\n        parser = get_parser(profile)\n        stmt = parser(doc)\n    finally:\n        if tmp_path is not None:\n            try:\n                tmp_path.unlink()\n            except OSError:\n                pass\n\n    validation = validate_statement(stmt)\n    return ConversionResult(\n        statement=stmt,\n        source_type=\"PDF\",\n        profile_id=profile.profile_id,\n        bank=profile.bank,\n        validation=validation,\n    )\n\n\ndef _convert_csv(file_bytes: bytes, filename: str) -> ConversionResult:\n    from bankbridge.parsers.csv_layout_detector import detect_csv, get_csv_parser\n\n    try:\n        content = file_bytes.decode(\"utf-8-sig\")\n    except UnicodeDecodeError:\n        content = file_bytes.decode(\"latin-1\")\n\n    profile = detect_csv(content)\n    parser = get_csv_parser(profile)\n    stmt = parser(content, source_file=filename)\n\n    validation = validate_statement(stmt)\n    return ConversionResult(\n        statement=stmt,\n        source_type=\"CSV\",\n        profile_id=profile.profile_id,\n        bank=profile.bank,\n        validation=validation,\n    )\n\n\n# ---------------------------------------------------------------------------\n# Diagnostic builder (for unknown layout errors)\n# ---------------------------------------------------------------------------\n\ndef build_diagnostic(\n    filename: str,\n    file_bytes: bytes,\n    source_type: str,\n    exc: Exception,\n) -> UnknownLayoutDiagnostic:\n    \"\"\"Build a privacy-safe diagnostic from a failed layout detection.\n\n    Includes only structural/technical metadata. No transaction data, no\n    financial figures, no names or IBANs.\n    \"\"\"\n    bank: Optional[str] = getattr(exc, \"bank\", None)\n    page_count: Optional[int] = None\n    csv_headers: Optional[list] = None\n\n    if source_type == \"PDF\":\n        page_count = _get_pdf_page_count(file_bytes)\n    elif source_type == \"CSV\":\n        try:\n            try:\n                content = file_bytes.decode(\"utf-8-sig\")\n            except UnicodeDecodeError:\n                content = file_bytes.decode(\"latin-1\")\n            first_line = content.lstrip().split(\"\\n\")[0].strip()\n            csv_headers = [f.strip().strip('\"') for f in first_line.split(\",\")]\n        except Exception:\n            pass\n\n    return UnknownLayoutDiagnostic(\n        filename=filename,\n        source_type=source_type,\n        bank=bank,\n        error_message=str(exc),\n        page_count=page_count,\n        csv_headers=csv_headers,\n    )\n\n\n# ---------------------------------------------------------------------------\n# Export functions\n# ---------------------------------------------------------------------------\n\n_MT940_WRITER_MODULES: dict[str, str] = {\n    \"RABO_PDF_V1\": \"bankbridge.exporters.mt940.rabobank_writer\",\n    \"ABN_PDF_V1\":  \"bankbridge.exporters.mt940.abnamro_writer\",\n    \"ING_PDF_V1\":  \"bankbridge.exporters.mt940.ing_writer\",\n    \"ING_CSV_V1\":  \"bankbridge.exporters.mt940.ing_writer\",\n    \"ASN_PDF_V1\":  \"bankbridge.exporters.mt940.asn_writer\",\n}\n\n\ndef export_mt940(stmt: BankBridgeStatement, profile_id: str) -> str:\n    \"\"\"Generate MT940 output using the bank-specific writer for *profile_id*.\n\n    Raises\n    ------\n    ValueError\n        When no writer is registered for the given profile_id.\n    \"\"\"\n    module_path = _MT940_WRITER_MODULES.get(profile_id)\n    if module_path is None:\n        raise ValueError(\n            f\"Geen MT940-exporter beschikbaar voor profiel '{profile_id}'. \"\n            f\"Ondersteund: {list(_MT940_WRITER_MODULES)}\"\n        )\n    writer_module = importlib.import_module(module_path)\n    return writer_module.write(stmt)\n\n\ndef export_camt053(stmt: BankBridgeStatement) -> str:\n    \"\"\"Generate CAMT.053 XML output for the parsed statement.\"\"\"\n    from bankbridge.exporters.camt053.writer import write\n    return write(stmt)\n\n\n# ---------------------------------------------------------------------------\n# Filename generation\n# ---------------------------------------------------------------------------\n\n# Output formats: {format key: (filename token, file extension)}\n# The format token is part of the filename so an export is always identifiable\n# as MT940 or CAMT.053 without opening it.\nOUTPUT_FORMATS: dict[str, tuple[str, str]] = {\n    \"MT940\": (\"MT940\", \"mt940\"),\n    \"CAMT053\": (\"CAMT053\", \"xml\"),\n}\n\n\ndef generate_filename(\n    stmt: BankBridgeStatement,\n    profile_id: str,\n    output_format: str,\n) -> str:\n    \"\"\"Generate a clean, sanitized output filename for downloads.\n\n    Format: bankbridge_{bank}_{iban}_{start}_{end}_{FORMAT}.{ext}\n    Falls back to bankbridge_{bank_or_profile}_{conversion_id[:8]}_{FORMAT}.{ext}\n    when IBAN or period is unavailable.\n\n    Parameters\n    ----------\n    output_format : str\n        Key from :data:`OUTPUT_FORMATS` (\"MT940\" or \"CAMT053\"); case-insensitive.\n        Determines both the format token in the name and the file extension.\n\n    Raises\n    ------\n    ValueError\n        For an unknown output format.\n    \"\"\"\n    key = (output_format or \"\").strip().upper().replace(\".\", \"\").replace(\"_\", \"\")\n    if key not in OUTPUT_FORMATS:\n        raise ValueError(\n            f\"Onbekend exportformaat '{output_format}'. \"\n            f\"Ondersteund: {list(OUTPUT_FORMATS)}\"\n        )\n    format_token, ext = OUTPUT_FORMATS[key]\n\n    bank_slug = re.sub(r\"[^a-zA-Z0-9]\", \"\", (stmt.bank or profile_id))\n\n    iban_part = \"\"\n    if stmt.iban:\n        iban_part = \"_\" + re.sub(r\"[^A-Z0-9]\", \"\", stmt.iban.upper())\n\n    period_part = \"\"\n    if stmt.period_start and stmt.period_end:\n        period_part = (\n            f\"_{stmt.period_start.isoformat()}\"\n            f\"_{stmt.period_end.isoformat()}\"\n        )\n\n    if not iban_part and not period_part:\n        short_id = stmt.conversion_id.replace(\"-\", \"\")[:8]\n        return f\"bankbridge_{bank_slug}_{short_id}_{format_token}.{ext}\"\n\n    return (\n        f\"bankbridge_{bank_slug}{iban_part}{period_part}\"\n        f\"_{format_token}.{ext}\"\n    )\n", "bankbridge/exporters/__init__.py": "", "bankbridge/exporters/camt053/__init__.py": "\"\"\"CAMT.053 exporter.\"\"\"\n", "bankbridge/exporters/camt053/writer.py": "\"\"\"Generic CAMT.053.001.02 exporter.\n\nConverts a BankBridgeStatement to a CAMT.053 XML document.\n\nDesign principles:\n  - Bank-neutral: uses whatever canonical fields are available.\n  - No fabrication: missing optional fields are omitted, not invented.\n  - Source-faithful: data from the canonical model is preserved as-is.\n  - Deterministic identifiers: MsgId, Stmt/Id, NtryRef are derived\n    from the statement's conversion_id and transaction UUIDs (BankBridge\n    audit IDs, not original bank references).\n\nCAMT.053 element mapping:\n  GrpHdr/MsgId            \u2190 stmt.conversion_id (UUID, dashes stripped, 32 chars)\n  Stmt/Id                 \u2190 stmt.statement_number or conversion_id\n  Stmt/FrToDt             \u2190 stmt.period_start / period_end\n  Stmt/Acct/Id/IBAN       \u2190 stmt.iban\n  Stmt/Acct/Id/Othr/Id    \u2190 stmt.account_number (when no IBAN)\n  Stmt/Acct/Ccy           \u2190 stmt.currency\n  Stmt/Acct/Svcr/BIC      \u2190 stmt.bic (when available)\n  Bal OPBD                \u2190 stmt.opening_balance (omitted when None)\n  Bal CLBD                \u2190 stmt.closing_balance (omitted when None)\n  Ntry/NtryRef            \u2190 txn.transaction_id (UUID, dashes stripped, 32 chars)\n  Ntry/Amt                \u2190 txn.amount + txn.currency\n  Ntry/CdtDbtInd          \u2190 txn.debit_credit\n  Ntry/Sts                \u2190 \"BOOK\" (all exported transactions are booked)\n  Ntry/BookgDt/Dt         \u2190 txn.booking_date\n  Ntry/ValDt/Dt           \u2190 txn.value_date (omitted when None)\n  BkTxCd/Domn             \u2190 txn.transaction_codes.source_raw_code (parsed)\n  BkTxCd/Prtry/Cd         \u2190 txn.proprietary_bank_code (when available)\n  TxDtls/Refs/EndToEndId  \u2190 txn.end_to_end_id or \"NOTPROVIDED\"\n  TxDtls/Refs/MndtId      \u2190 txn.mandate_reference (when available)\n  DBIT: TxDtls/RltdPties/UltmtCdtr/Nm     \u2190 ultimate_creditor_name\n  CRDT: TxDtls/RltdPties/UltmtDbtr/Nm     \u2190 ultimate_debtor_name\n  DBIT: TxDtls/RltdPties/Cdtr  \u2190 counterparty_name, creditor_id\n  DBIT: TxDtls/RltdPties/CdtrAcct/Id/IBAN \u2190 counterparty_iban\n  DBIT: TxDtls/RltdAgts/CdtrAgt/BIC       \u2190 counterparty_bic\n  CRDT: TxDtls/RltdPties/Dbtr/Nm          \u2190 counterparty_name\n  CRDT: TxDtls/RltdPties/DbtrAcct/Id/IBAN \u2190 counterparty_iban\n  CRDT: TxDtls/RltdAgts/DbtrAgt/BIC       \u2190 counterparty_bic\n  TxDtls/RmtInf/Ustrd     \u2190 readable remittance text built from\n                            counterparty_name + description (references only\n                            when neither is present) \u2014 see\n                            bankbridge.exporters.remittance.  Repeated over\n                            several Ustrd when longer than Max140Text.\n\nKnown round-trip gaps (not parser bugs):\n  - BkTxCd codes are only reproduced when source_raw_code contains\n    ISO 20022 domain/family codes; CSV/PDF sources carry bank-specific\n    codes that have no direct CAMT mapping.\n  - EndToEndId round-trips as None when source had None (via NOTPROVIDED sentinel).\n  - Bank field is hardcoded in the ING CAMT parser; non-ING sources will\n    round-trip with bank='ING' \u2014 this is a SOURCE_LAYOUT_DIFFERENCE.\n  - Ustrd is the human presentation of the remittance, so a CAMT round-trip\n    reads back the presented text (which may lead with the counterparty name)\n    as the description.  No source information is lost; the structured\n    counterparty and reference elements are unchanged.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport xml.etree.ElementTree as ET\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import CreditDebitIndicator, ValidationStatus\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction\n\nfrom ..remittance import build_remittance_text, split_remittance_text\n\n_NS_URI = \"urn:iso:std:iso:20022:tech:xsd:camt.053.001.02\"\n_P = f\"{{{_NS_URI}}}\"\n\nWRITER_NAME = \"camt053_writer\"\nWRITER_VERSION = \"1.0.0\"\n\n# Register as default namespace so serialisation omits the prefix\nET.register_namespace(\"\", _NS_URI)\n\n\n# ---------------------------------------------------------------------------\n# XML helpers\n# ---------------------------------------------------------------------------\n\ndef _e(parent: ET.Element, tag: str, text: Optional[str] = None,\n       **attribs: str) -> ET.Element:\n    \"\"\"Append a namespaced child element.\"\"\"\n    el = ET.SubElement(parent, _P + tag, **attribs)\n    if text is not None:\n        el.text = text\n    return el\n\n\ndef _safe(s: str) -> str:\n    \"\"\"Remove XML-illegal control characters (ElementTree escapes & \u003c > automatically).\"\"\"\n    return \"\".join(c for c in s if ord(c) >= 0x20 or c in \"\\t\\n\\r\")\n\n\ndef _msg_id(uid: str) -> str:\n    \"\"\"Convert a UUID string to a 32-char hex identifier (fits CAMT maxLength=35).\"\"\"\n    return uid.replace(\"-\", \"\")[:32]\n\n\n# ---------------------------------------------------------------------------\n# Balance writer\n# ---------------------------------------------------------------------------\n\ndef _write_balance(stmt_el: ET.Element, bal: Balance, code: str) -> None:\n    bal_el = _e(stmt_el, \"Bal\")\n    tp = _e(bal_el, \"Tp\")\n    cop = _e(tp, \"CdOrPrtry\")\n    _e(cop, \"Cd\", code)\n\n    amt_el = _e(bal_el, \"Amt\", f\"{bal.amount:.2f}\")\n    amt_el.set(\"Ccy\", bal.currency)\n\n    _e(bal_el, \"CdtDbtInd\", bal.credit_debit.value)\n\n    dt_el = _e(bal_el, \"Dt\")\n    _e(dt_el, \"Dt\", bal.date.isoformat())\n\n\n# ---------------------------------------------------------------------------\n# Transaction code writer\n# ---------------------------------------------------------------------------\n\ndef _is_domain_code(s: str) -> bool:\n    \"\"\"True when s looks like an ISO 20022 domain/family code (3-6 uppercase letters).\n\n    ISO 20022 domain, family and subfamily codes are 4-char uppercase strings\n    (PMNT, RCDT, RDDT, ESCT, \u2026).  Requiring \u22653 chars rejects bank-specific\n    2-char codes like 'IC', 'OV', 'DV' (ING CSV) and 'GT', 'VZ' etc.\n    \"\"\"\n    return bool(s) and s.isalpha() and s.isupper() and 3 \u003c= len(s) \u003c= 6\n\n\ndef _write_bktxcd(ntry: ET.Element, txn: BankBridgeTransaction) -> None:\n    bktxcd = _e(ntry, \"BkTxCd\")\n    domn_written = False\n\n    raw = txn.transaction_codes.source_raw_code or \"\"\n    parts = [p.strip() for p in raw.split(\"/\") if p.strip()]\n\n    if len(parts) >= 2 and _is_domain_code(parts[0]) and _is_domain_code(parts[1]):\n        # source_raw_code looks like \"PMNT/RCDT/ESCT\" \u2014 reproduce faithfully\n        domn_el = _e(bktxcd, \"Domn\")\n        _e(domn_el, \"Cd\", parts[0])\n        fmly_el = _e(domn_el, \"Fmly\")\n        _e(fmly_el, \"Cd\", parts[1])\n        subfmly = next((p for p in parts[2:] if _is_domain_code(p)), None)\n        if subfmly:\n            _e(fmly_el, \"SubFmlyCd\", subfmly)\n        domn_written = True\n    elif (txn.transaction_codes.normalized_type\n          and _is_domain_code(txn.transaction_codes.normalized_type)):\n        # Normalised family code available (e.g. \"RCDT\") but no full path\n        domn_el = _e(bktxcd, \"Domn\")\n        _e(domn_el, \"Cd\", \"PMNT\")\n        fmly_el = _e(domn_el, \"Fmly\")\n        _e(fmly_el, \"Cd\", txn.transaction_codes.normalized_type)\n        _e(fmly_el, \"SubFmlyCd\", \"OTHR\")\n        domn_written = True\n\n    prtry_written = False\n    if txn.proprietary_bank_code:\n        prtry = _e(bktxcd, \"Prtry\")\n        _e(prtry, \"Cd\", _safe(txn.proprietary_bank_code))\n        prtry_written = True\n\n    if not domn_written and not prtry_written:\n        # CAMT.053 requires Domn OR Prtry; use a generic sentinel\n        prtry = _e(bktxcd, \"Prtry\")\n        _e(prtry, \"Cd\", \"NOTPROVIDED\")\n\n\n# ---------------------------------------------------------------------------\n# Transaction writer\n# ---------------------------------------------------------------------------\n\ndef _write_ntry(stmt_el: ET.Element, txn: BankBridgeTransaction,\n                default_currency: str) -> None:\n    ntry = _e(stmt_el, \"Ntry\")\n\n    _e(ntry, \"NtryRef\", _msg_id(txn.transaction_id))\n\n    amt_el = _e(ntry, \"Amt\", f\"{txn.amount:.2f}\")\n    amt_el.set(\"Ccy\", txn.currency or default_currency)\n\n    _e(ntry, \"CdtDbtInd\", txn.debit_credit.value)\n    _e(ntry, \"Sts\", \"BOOK\")\n\n    if txn.booking_date:\n        bdt = _e(ntry, \"BookgDt\")\n        _e(bdt, \"Dt\", txn.booking_date.isoformat())\n\n    if txn.value_date:\n        vdt = _e(ntry, \"ValDt\")\n        _e(vdt, \"Dt\", txn.value_date.isoformat())\n\n    _write_bktxcd(ntry, txn)\n\n    # TxDtls \u2014 only written when there is meaningful payload\n    has_payload = any([\n        txn.end_to_end_id,\n        txn.mandate_reference,\n        txn.creditor_id,\n        txn.counterparty_name,\n        txn.counterparty_iban,\n        txn.counterparty_bic,\n        txn.description,\n        txn.ultimate_creditor_name,\n        txn.ultimate_debtor_name,\n    ])\n    if not has_payload:\n        return\n\n    dtls_el = _e(ntry, \"NtryDtls\")\n    tx_el = _e(dtls_el, \"TxDtls\")\n\n    # Refs \u2014 EndToEndId required when TxDtls present (ISO 20022 \u00a74.4)\n    refs = _e(tx_el, \"Refs\")\n    _e(refs, \"EndToEndId\", txn.end_to_end_id or \"NOTPROVIDED\")\n    if txn.mandate_reference:\n        _e(refs, \"MndtId\", txn.mandate_reference)\n\n    # Related parties and agents \u2014 role depends on debit/credit direction\n    is_debit = txn.debit_credit == CreditDebitIndicator.DEBIT\n\n    ultimate = txn.ultimate_creditor_name if is_debit else txn.ultimate_debtor_name\n    has_party = any([txn.counterparty_name, txn.creditor_id,\n                     txn.counterparty_iban, ultimate])\n    if has_party:\n        rltd = _e(tx_el, \"RltdPties\")\n        if is_debit:\n            cdtr = _e(rltd, \"Cdtr\")\n            if txn.counterparty_name:\n                _e(cdtr, \"Nm\", _safe(txn.counterparty_name))\n            if txn.creditor_id:\n                cdtr_id = _e(cdtr, \"Id\")\n                org = _e(cdtr_id, \"OrgId\")\n                othr = _e(org, \"Othr\")\n                _e(othr, \"Id\", txn.creditor_id)\n            if txn.counterparty_iban:\n                cdtr_acct = _e(rltd, \"CdtrAcct\")\n                acct_id = _e(cdtr_acct, \"Id\")\n                _e(acct_id, \"IBAN\", txn.counterparty_iban)\n            # UltmtCdtr follows CdtrAcct in the ISO 20022 RltdPties sequence\n            if ultimate:\n                ultmt = _e(rltd, \"UltmtCdtr\")\n                _e(ultmt, \"Nm\", _safe(ultimate))\n        else:  # CRDT\n            dbtr = _e(rltd, \"Dbtr\")\n            if txn.counterparty_name:\n                _e(dbtr, \"Nm\", _safe(txn.counterparty_name))\n            if txn.counterparty_iban:\n                dbtr_acct = _e(rltd, \"DbtrAcct\")\n                acct_id = _e(dbtr_acct, \"Id\")\n                _e(acct_id, \"IBAN\", txn.counterparty_iban)\n            # UltmtDbtr follows DbtrAcct in the ISO 20022 RltdPties sequence\n            if ultimate:\n                ultmt = _e(rltd, \"UltmtDbtr\")\n                _e(ultmt, \"Nm\", _safe(ultimate))\n\n    if txn.counterparty_bic:\n        agts = _e(tx_el, \"RltdAgts\")\n        if is_debit:\n            agt = _e(agts, \"CdtrAgt\")\n        else:\n            agt = _e(agts, \"DbtrAgt\")\n        fin = _e(agt, \"FinInstnId\")\n        _e(fin, \"BIC\", txn.counterparty_bic)\n\n    # RmtInf/Ustrd \u2014 readable remittance text; the structured elements above\n    # stay authoritative.  Split over repeated Ustrd when over Max140Text.\n    remittance = build_remittance_text(txn)\n    if remittance:\n        rmt = _e(tx_el, \"RmtInf\")\n        for chunk in split_remittance_text(_safe(remittance)):\n            _e(rmt, \"Ustrd\", chunk)\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef write(stmt: BankBridgeStatement) -> str:\n    \"\"\"Write a BankBridgeStatement to a CAMT.053.001.02 XML string.\n\n    Args:\n        stmt: A validated or at-least-GREEN BankBridgeStatement.\n\n    Returns:\n        UTF-8 XML string (with XML declaration).\n\n    Raises:\n        ValueError: When the statement is RED (financially inconsistent).\n    \"\"\"\n    if stmt.validation_status == ValidationStatus.RED:\n        raise ValueError(\n            f\"Statement {stmt.conversion_id!r} has validation status RED \"\n            \"and cannot be exported to CAMT.053. Fix validation issues first.\"\n        )\n\n    root = ET.Element(_P + \"Document\")\n\n    bkstmt = _e(root, \"BkToCstmrStmt\")\n\n    # \u2500\u2500 Group header \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    grp = _e(bkstmt, \"GrpHdr\")\n    _e(grp, \"MsgId\", _msg_id(stmt.conversion_id))\n    _e(grp, \"CreDtTm\", stmt.processed_at.isoformat()[:19])\n    pgntn = _e(grp, \"MsgPgntn\")\n    _e(pgntn, \"PgNb\", \"1\")\n    _e(pgntn, \"LastPgInd\", \"true\")\n\n    # \u2500\u2500 Statement \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    stmt_el = _e(bkstmt, \"Stmt\")\n    _e(stmt_el, \"Id\", stmt.statement_number or _msg_id(stmt.conversion_id))\n    _e(stmt_el, \"CreDtTm\", stmt.processed_at.isoformat()[:19])\n\n    if stmt.period_start or stmt.period_end:\n        fr_to = _e(stmt_el, \"FrToDt\")\n        if stmt.period_start:\n            _e(fr_to, \"FrDtTm\", f\"{stmt.period_start}T00:00:00\")\n        if stmt.period_end:\n            _e(fr_to, \"ToDtTm\", f\"{stmt.period_end}T23:59:59\")\n\n    # \u2500\u2500 Account \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    acct = _e(stmt_el, \"Acct\")\n    acct_id = _e(acct, \"Id\")\n    if stmt.iban:\n        _e(acct_id, \"IBAN\", stmt.iban)\n    elif stmt.account_number:\n        othr = _e(acct_id, \"Othr\")\n        _e(othr, \"Id\", stmt.account_number)\n    _e(acct, \"Ccy\", stmt.currency)\n    if stmt.bic:\n        svcr = _e(acct, \"Svcr\")\n        fin = _e(svcr, \"FinInstnId\")\n        _e(fin, \"BIC\", stmt.bic)\n\n    # \u2500\u2500 Balances \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    if stmt.opening_balance is not None:\n        _write_balance(stmt_el, stmt.opening_balance, \"OPBD\")\n    if stmt.closing_balance is not None:\n        _write_balance(stmt_el, stmt.closing_balance, \"CLBD\")\n\n    # \u2500\u2500 Transactions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    for txn in stmt.transactions:\n        _write_ntry(stmt_el, txn, stmt.currency)\n\n    # \u2500\u2500 Serialise \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    ET.indent(root, space=\"  \")\n    xml_body = ET.tostring(root, encoding=\"unicode\", xml_declaration=False)\n    return '\u003c?xml version=\"1.0\" encoding=\"UTF-8\"?>\\n' + xml_body\n", "bankbridge/exporters/mt940/__init__.py": "", "bankbridge/exporters/mt940/abnamro_writer.py": "\"\"\"ABN-AMRO MT940 exporter.\n\nConverts a BankBridgeStatement (typically PDF-derived) to an\nABN-AMRO-compatible MT940 file.\n\nEach unique booking date becomes a separate :20: block, preceded by the\nproprietary ABN-AMRO header (ABNANL2A / 940 / ABNANL2A) and terminated\nwith a '-' line.  Running balances are computed from the statement's opening\nbalance so that each block has consistent :60F: / :62F: values.\n\nExpected differences from an original ABN-AMRO MT940 file\n----------------------------------------------------------\nThe following fields are absent because the PDF source does not provide them:\n\n- Value date may equal booking date (PDF shows only one date per transaction)\n- :86: TRTP is derived from original PDF description where available; for\n  unstructured / BEA / freeform transactions a generic description is used\n- Bank transaction code in :61: is always '000' (cannot be derived from PDF)\n- Customer reference in :61: is always 'NONREF' (PDF does not carry end-to-end\n  refs in the :61: line)\n\nThese are structural gaps \u2014 not parser bugs.  The generated file contains\nthe same transactions with identical amounts, dates, IBANs, and directions.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom collections import defaultdict\nfrom datetime import date\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction\n\nfrom .formatter import (\n    format_mt940_amount,\n    format_mt940_date,\n    mt940_opening_balance_date,\n    sanitize_swift_x,\n    split_into_lines,\n)\n\n_MT940_GENERIC_CODE = \"000\"\n\n# Regex to extract /TRTP/ value from an original PDF structured description\n_TRTP_RE = re.compile(r'^/TRTP/([^/]+)/')\n\n\n# ---------------------------------------------------------------------------\n# Internal helpers\n# ---------------------------------------------------------------------------\n\ndef _cd(ind: CreditDebitIndicator) -> str:\n    return \"C\" if ind == CreditDebitIndicator.CREDIT else \"D\"\n\n\ndef _signed(amount: Decimal, ind: CreditDebitIndicator) -> Decimal:\n    return amount if ind == CreditDebitIndicator.CREDIT else -amount\n\n\ndef _make_balance(running: Decimal, bal_date: date, currency: str, btype: BalanceType) -> Balance:\n    return Balance(\n        amount=abs(running),\n        credit_debit=CreditDebitIndicator.CREDIT if running >= 0 else CreditDebitIndicator.DEBIT,\n        date=bal_date,\n        balance_type=btype,\n        currency=currency,\n    )\n\n\ndef _format_balance_tag(tag: str, bal: Balance) -> str:\n    return (\n        f\":{tag}:{_cd(bal.credit_debit)}\"\n        f\"{format_mt940_date(bal.date)}\"\n        f\"{bal.currency}\"\n        f\"{format_mt940_amount(bal.amount)}\"\n    )\n\n\ndef _extract_trtp(txn: BankBridgeTransaction) -> Optional[str]:\n    \"\"\"Extract /TRTP/ value from original PDF description text, if present.\"\"\"\n    if not txn.original_text:\n        return None\n    m = _TRTP_RE.match(txn.original_text[0].lstrip())\n    return m.group(1) if m else None\n\n\ndef _format_61(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return the :61: line.\n\n    ABN-AMRO :61: has a SINGLE line (no second counterparty IBAN line).\n    \"\"\"\n    v_date = txn.value_date or txn.booking_date\n    b_date = txn.booking_date\n\n    val_str = format_mt940_date(v_date) if v_date else \"000101\"\n    entry_str = \"\"\n    if b_date and v_date and b_date != v_date:\n        entry_str = b_date.strftime(\"%m%d\")\n\n    dc = _cd(txn.debit_credit)\n    amount_str = format_mt940_amount(txn.amount)\n    return f\":61:{val_str}{entry_str}{dc}{amount_str}N{_MT940_GENERIC_CODE}NONREF\"\n\n\ndef _format_86(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return the :86: tag for an ABN-AMRO MT940 block.\n\n    Structured /TRTP/ format is generated when counterparty IBAN or name is\n    available.  For BEA card payments and free-form bank notices a simpler\n    description is written.\n    \"\"\"\n    trtp = _extract_trtp(txn) or _derive_trtp(txn)\n\n    if txn.counterparty_iban or txn.counterparty_name:\n        return _format_86_structured(txn, trtp)\n    elif txn.description and txn.description.startswith('BEA'):\n        return _format_86_bea(txn)\n    else:\n        return _format_86_freeform(txn)\n\n\ndef _derive_trtp(txn: BankBridgeTransaction) -> str:\n    \"\"\"Derive a TRTP value from canonical fields when not in original text.\"\"\"\n    if txn.creditor_id or txn.mandate_reference:\n        return \"SEPA INCASSO ALGEMEEN DOORLOPEND\"\n    return \"SEPA OVERBOEKING\"\n\n\ndef _format_86_structured(txn: BankBridgeTransaction, trtp: str) -> str:\n    \"\"\"Generate /TRTP/.../IBAN/.../BIC/.../NAME/.../REMI/.../EREF/... format.\"\"\"\n    parts = [f\"/TRTP/{trtp}\"]\n\n    if txn.creditor_id:\n        parts.append(f\"/CSID/{txn.creditor_id}\")\n\n    name_raw = txn.counterparty_name or \"\"\n    name, _ = sanitize_swift_x(name_raw)\n    parts.append(f\"/NAME/{name}\")\n\n    if txn.mandate_reference:\n        parts.append(f\"/MARF/{txn.mandate_reference}\")\n\n    if txn.description:\n        desc, _ = sanitize_swift_x(txn.description)\n        parts.append(f\"/REMI/{desc}\")\n\n    if txn.counterparty_iban:\n        parts.append(f\"/IBAN/{txn.counterparty_iban}\")\n\n    if txn.counterparty_bic:\n        parts.append(f\"/BIC/{txn.counterparty_bic}\")\n\n    if txn.end_to_end_id:\n        eref = txn.end_to_end_id\n    elif txn.payment_reference:\n        eref = txn.payment_reference\n    else:\n        eref = \"NOTPROVIDED\"\n    parts.append(f\"/EREF/{eref}\")\n\n    text = \"\".join(parts)\n    text, _ = sanitize_swift_x(text)\n    lines = split_into_lines(text, 65)\n    return \":86:\" + \"\\n\".join(lines)\n\n\ndef _format_86_bea(txn: BankBridgeTransaction) -> str:\n    \"\"\"Generate BEA, Betaalpas format for card payments.\"\"\"\n    desc = txn.description or \"\"\n    desc, _ = sanitize_swift_x(desc)\n    text = f\"BEA, Betaalpas {desc}\"\n    lines = split_into_lines(text, 65)\n    return \":86:\" + \"\\n\".join(lines)\n\n\ndef _format_86_freeform(txn: BankBridgeTransaction) -> str:\n    \"\"\"Generate free-form description for bank notices.\"\"\"\n    desc = txn.description or txn.counterparty_name or \"\"\n    desc, _ = sanitize_swift_x(desc)\n    lines = split_into_lines(desc, 65) if desc else [\"\"]\n    return \":86:\" + \"\\n\".join(lines)\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef write(stmt: BankBridgeStatement) -> str:\n    \"\"\"Generate an ABN-AMRO-compatible MT940 string from a BankBridgeStatement.\n\n    Returns the complete file content (LF line endings, trailing newline).\n    One :20: block is emitted per unique booking date.\n    \"\"\"\n    by_date: dict[date, list[BankBridgeTransaction]] = defaultdict(list)\n    for txn in stmt.transactions:\n        key = txn.booking_date or stmt.period_start or date(2000, 1, 1)\n        by_date[key].append(txn)\n\n    sorted_dates = sorted(by_date.keys())\n    currency = stmt.currency or \"EUR\"\n    account_number = stmt.account_number or stmt.iban or \"UNKNOWN\"\n\n    # :60F: of the first block is the previous statement's closing balance and\n    # must be dated before that block's entries \u2014 see mt940_opening_balance_date().\n    first_entry_date = sorted_dates[0] if sorted_dates else None\n    if stmt.opening_balance:\n        running = stmt.opening_balance.signed_value()\n        prev_date = mt940_opening_balance_date(stmt.opening_balance.date, first_entry_date)\n    else:\n        running = Decimal(\"0\")\n        prev_date = mt940_opening_balance_date(\n            first_entry_date or date(2000, 1, 1), first_entry_date\n        )\n\n    year_prefix = stmt.period_start.strftime(\"%y\") if stmt.period_start else \"00\"\n    output_lines: list[str] = []\n\n    for seq, day in enumerate(sorted_dates, start=1):\n        txns = by_date[day]\n\n        open_bal = _make_balance(running, prev_date, currency, BalanceType.OPENING_BOOKED)\n        for txn in txns:\n            running += _signed(txn.amount, txn.debit_credit)\n        close_bal = _make_balance(running, day, currency, BalanceType.CLOSING_BOOKED)\n        prev_date = day\n\n        # ABN-AMRO proprietary block header\n        output_lines.extend([\"ABNANL2A\", \"940\", \"ABNANL2A\"])\n        output_lines.append(\":20:ABN AMRO BANK NV\")\n        output_lines.append(f\":25:{account_number}\")\n        output_lines.append(f\":28:{year_prefix}{seq:03d}/1\")\n        output_lines.append(_format_balance_tag(\"60F\", open_bal))\n        for txn in txns:\n            output_lines.append(_format_61(txn))\n            output_lines.append(_format_86(txn))\n        output_lines.append(_format_balance_tag(\"62F\", close_bal))\n        output_lines.append(\"-\")\n\n    return \"\\n\".join(output_lines) + \"\\n\"\n", "bankbridge/exporters/mt940/asn_writer.py": "\"\"\"ASN Bank (RegioBank) MT940 exporter.\n\nConverts a BankBridgeStatement to an MT940 file using RegioBank (RBRB) format.\n\nBased on the ING MT940 format (SWIFT FIN envelope, structured :86:) since the\nsame ING MT940 parser can be used for round-trip verification.\n\nSWIFT FIN header uses RBRBNL21 (RegioBank BIC).\n\nKnown gaps (same as other PDF-derived MT940):\n- /TRCD/ code is generic (no original bank code in ASN PDF)\n- Value date = booking date (ASN PDF does not show value dates separately)\n- No EREF/MARF/CSID unless extracted from incasso description\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom datetime import date\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction\n\nfrom .formatter import (\n    format_mt940_amount,\n    format_mt940_date,\n    mt940_opening_balance_date,\n    sanitize_swift_x,\n    split_into_lines,\n)\n\n# ---------------------------------------------------------------------------\n# Helpers\n# ---------------------------------------------------------------------------\n\ndef _cd(ind: CreditDebitIndicator) -> str:\n    return \"C\" if ind == CreditDebitIndicator.CREDIT else \"D\"\n\n\ndef _signed(amount: Decimal, ind: CreditDebitIndicator) -> Decimal:\n    return amount if ind == CreditDebitIndicator.CREDIT else -amount\n\n\ndef _make_balance(running: Decimal, bal_date: date, currency: str, btype: BalanceType) -> Balance:\n    return Balance(\n        amount=abs(running),\n        credit_debit=CreditDebitIndicator.CREDIT if running >= 0 else CreditDebitIndicator.DEBIT,\n        date=bal_date,\n        balance_type=btype,\n        currency=currency,\n    )\n\n\ndef _format_balance_tag(tag: str, bal: Balance) -> str:\n    return (\n        f\":{tag}:{_cd(bal.credit_debit)}\"\n        f\"{format_mt940_date(bal.date)}\"\n        f\"{bal.currency}\"\n        f\"{format_mt940_amount(bal.amount)}\"\n    )\n\n\ndef _derive_type_code(txn: BankBridgeTransaction) -> str:\n    if txn.mandate_reference or txn.creditor_id:\n        return \"NDDT\"  # direct debit\n    if txn.debit_credit == CreditDebitIndicator.DEBIT:\n        return \"NTRF\"\n    return \"NTRF\"\n\n\ndef _format_61(txn: BankBridgeTransaction) -> list[str]:\n    v_date = txn.value_date or txn.booking_date\n    b_date = txn.booking_date\n\n    val_str = format_mt940_date(v_date) if v_date else \"000101\"\n    entry_str = b_date.strftime(\"%m%d\") if b_date else val_str[2:]\n\n    dc = _cd(txn.debit_credit)\n    amount_str = format_mt940_amount(txn.amount)\n    type_code = _derive_type_code(txn)\n\n    eref = txn.end_to_end_id or txn.payment_reference\n    cust_ref = 'NONREF'\n\n    bank_ref = txn.bank_reference or ''\n    bank_ref_part = f\"//{bank_ref}\" if bank_ref else \"//NONREF\"\n\n    return [\n        f\":61:{val_str}{entry_str}{dc}{amount_str}{type_code}{cust_ref}{bank_ref_part}\",\n    ]\n\n\ndef _format_86(txn: BankBridgeTransaction) -> str:\n    parts: list[str] = []\n\n    if txn.mandate_reference:\n        marf_clean, _ = sanitize_swift_x(txn.mandate_reference)\n        parts.append(f\"/MARF/{marf_clean}//\")\n\n    if txn.creditor_id:\n        csid_clean, _ = sanitize_swift_x(txn.creditor_id)\n        parts.append(f\"/CSID/{csid_clean}//\")\n\n    cntp_iban = txn.counterparty_iban or ''\n    cntp_bic = txn.counterparty_bic or ''\n    cntp_name = txn.counterparty_name or ''\n    if cntp_iban or cntp_name:\n        name_clean, _ = sanitize_swift_x(cntp_name)\n        parts.append(f\"/CNTP/{cntp_iban}/{cntp_bic}/{name_clean}///\")\n\n    desc = txn.description or ''\n    if desc:\n        desc_clean, _ = sanitize_swift_x(desc)\n        parts.append(f\"/REMI/USTD//{desc_clean}/\")\n\n    text = ''.join(parts)\n    if not text:\n        text = '/REMI/USTD///'\n\n    text, _ = sanitize_swift_x(text)\n    lines = split_into_lines(text, 65)\n    return \":86:\" + \"\\n\".join(lines)\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef write(stmt: BankBridgeStatement) -> str:\n    \"\"\"Generate a RegioBank-style MT940 string from an ASN Bank BankBridgeStatement.\"\"\"\n    currency = stmt.currency or 'EUR'\n    iban = stmt.iban or 'UNKNOWNIBAN'\n    account_25 = f\"{iban}{currency}\"\n\n    transactions = sorted(\n        stmt.transactions,\n        key=lambda t: (t.booking_date or date(2000, 1, 1),),\n    )\n\n    # :60F: is the previous statement's closing balance, so it must be dated\n    # before the first booked entry \u2014 see mt940_opening_balance_date().\n    first_entry_date = next(\n        (t.booking_date for t in transactions if t.booking_date), None\n    )\n    if stmt.opening_balance:\n        running = stmt.opening_balance.signed_value()\n        open_bal_date = mt940_opening_balance_date(\n            stmt.opening_balance.date, first_entry_date\n        )\n    else:\n        running = Decimal(\"0\")\n        open_bal_date = mt940_opening_balance_date(\n            first_entry_date or date(2000, 1, 1), first_entry_date\n        )\n    open_bal = _make_balance(running, open_bal_date, currency, BalanceType.OPENING_BOOKED)\n\n    for txn in transactions:\n        running += _signed(txn.amount, txn.debit_credit)\n\n    last_date = transactions[-1].booking_date if transactions else (\n        stmt.period_end or date(2000, 1, 1)\n    )\n    close_bal = stmt.closing_balance or _make_balance(running, last_date, currency, BalanceType.CLOSING_BOOKED)\n\n    n_debit = sum(1 for t in transactions if t.debit_credit == CreditDebitIndicator.DEBIT)\n    n_credit = sum(1 for t in transactions if t.debit_credit == CreditDebitIndicator.CREDIT)\n    total_debit = sum((t.amount for t in transactions if t.debit_credit == CreditDebitIndicator.DEBIT), Decimal(\"0\"))\n    total_credit = sum((t.amount for t in transactions if t.debit_credit == CreditDebitIndicator.CREDIT), Decimal(\"0\"))\n\n    body_lines: list[str] = []\n    body_lines.append(\":20:BANKBRIDGE\")\n    body_lines.append(f\":25:{account_25}\")\n    body_lines.append(\":28C:00000\")\n    body_lines.append(_format_balance_tag(\"60F\", open_bal))\n\n    for txn in transactions:\n        body_lines.extend(_format_61(txn))\n        body_lines.append(_format_86(txn))\n\n    body_lines.append(_format_balance_tag(\"62F\", close_bal))\n    body_lines.append(_format_balance_tag(\"64\", close_bal))\n\n    sum_line = (\n        f\":86:/SUM/{n_debit}/{n_credit}/\"\n        f\"{format_mt940_amount(total_debit)}/{format_mt940_amount(total_credit)}/\"\n    )\n    body_lines.append(sum_line)\n\n    body = \"\\n\".join(body_lines)\n\n    output = (\n        \"{1:F01RBRBNL21BXXX0000000000}\\n\"\n        \"{2:I940RBRBNL21XXXN}\\n\"\n        \"{4:\\n\"\n        f\"{body}\\n\"\n        \"-}\"\n    )\n    return output + \"\\n\"\n", "bankbridge/exporters/mt940/formatter.py": "\"\"\"Generic MT940 formatting utilities.\n\nThese functions are independent of any bank-specific or software-specific\nchoices.  They implement the SWIFT MT940 format rules that are fully\ndetermined by the SWIFT standard itself.\n\nWhat is NOT here (deferred until bank + target software are verified):\n- :20: reference format\n- :25: account identification format\n- :28C: statement numbering\n- :61: transaction type codes and reference conventions\n- :86: field structure and subfields\n- multi-statement file layout\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom datetime import date, timedelta\nfrom decimal import Decimal\nfrom typing import Optional\n\n\ndef format_mt940_amount(amount: Decimal) -> str:\n    \"\"\"Format a Decimal amount as an MT940 amount string.\n\n    MT940 uses a comma as the decimal separator and no thousands separator.\n    Up to 15 digits before the comma; fractional part stripped of trailing\n    zeros but always at least 2 decimal places for monetary amounts.\n\n    Examples\n    --------\n    >>> format_mt940_amount(Decimal(\"1234.56\"))\n    '1234,56'\n    >>> format_mt940_amount(Decimal(\"1000\"))\n    '1000,'\n    >>> format_mt940_amount(Decimal(\"0.10\"))\n    '0,10'\n    \"\"\"\n    if amount \u003c 0:\n        raise ValueError(\n            f\"MT940 amount must be >= 0; sign is carried by the D/C indicator \"\n            f\"(got {amount!r})\"\n        )\n\n    # Work with the absolute value string representation\n    # Quantize to exactly 2 decimal places for EUR/standard currencies\n    quantized = amount.quantize(Decimal(\"0.01\"))\n    int_part = int(quantized)\n    frac = quantized - int_part\n\n    if frac == 0:\n        # MT940 allows amounts without fractional part: \"1000,\"\n        return f\"{int_part},\"\n    else:\n        # Remove trailing zeros from fractional, but keep at least 2 places\n        frac_str = str(frac)[2:]  # \"0.56\" \u2192 \"56\"\n        frac_str = frac_str.rstrip(\"0\").ljust(2, \"0\")\n        return f\"{int_part},{frac_str}\"\n\n\ndef format_mt940_date(d: date) -> str:\n    \"\"\"Format a date as MT940 value/booking date (YYMMDD).\n\n    >>> from datetime import date\n    >>> format_mt940_date(date(2026, 8, 13))\n    '260813'\n    \"\"\"\n    return d.strftime(\"%y%m%d\")\n\n\ndef format_mt940_entry_date(d: date) -> str:\n    \"\"\"Format a date as MT940 entry date (MMDD).\n\n    Used as the optional entry date component within field :61:.\n\n    >>> from datetime import date\n    >>> format_mt940_entry_date(date(2026, 8, 13))\n    '0813'\n    \"\"\"\n    return d.strftime(\"%m%d\")\n\n\ndef mt940_opening_balance_date(\n    balance_date: date,\n    first_entry_date: Optional[date],\n) -> date:\n    \"\"\"Return the date to use for an MT940 :60F: opening balance.\n\n    In MT940 the opening balance is the *previous* statement's closing balance,\n    so its date must lie strictly before the first booked entry of the block.\n    Every bank writes it that way: ING dates :60F: 251231 for a statement that\n    starts 260101, Rabobank dates it 251231 before its 260101 entries.\n\n    The canonical model stores the opening balance with the ISO 20022 OPBD\n    semantics instead \u2014 dated the *first* day of the period (which is what\n    CAMT.053 requires, and what bank CAMT files contain).  When a statement\n    begins with transactions booked on its own first day, emitting that date\n    verbatim produces ``:60F:`` and the first ``:61:`` on the same date, and\n    importing software then treats that first entry as already included in the\n    opening balance and silently drops it.\n\n    Therefore: keep the balance date when it is already before the first entry\n    (MT940/CAMT sources, or a period that starts before the first booking), and\n    otherwise fall back to the day before the first entry.\n\n    >>> from datetime import date\n    >>> mt940_opening_balance_date(date(2025, 12, 31), date(2026, 1, 1))\n    datetime.date(2025, 12, 31)\n    >>> mt940_opening_balance_date(date(2026, 4, 1), date(2026, 4, 1))\n    datetime.date(2026, 3, 31)\n    \"\"\"\n    if first_entry_date is None or balance_date \u003c first_entry_date:\n        return balance_date\n    return first_entry_date - timedelta(days=1)\n\n\ndef sanitize_swift_x(text: str) -> tuple[str, bool]:\n    \"\"\"Restrict a string to the SWIFT X character set.\n\n    SWIFT X allows: A\u2013Z a\u2013z 0\u20139 / - ? : ( ) . , ' + space CR LF\n\n    Returns ``(sanitized_text, was_modified)``.  Callers must record any\n    modification as a ``FieldLoss`` in the audit trail \u2014 silent sanitisation\n    is not permitted.\n\n    Characters outside the set are replaced with a space.  This is\n    conservative; a future version may implement transliteration (\u00e9\u2192e).\n    \"\"\"\n    allowed = set(\n        \"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\"\n        \"0123456789\"\n        \"/-?:(). ,'+\"\n        \"\\r\\n\"\n    )\n    result = []\n    modified = False\n    for ch in text:\n        if ch in allowed:\n            result.append(ch)\n        else:\n            result.append(\" \")\n            modified = True\n    return \"\".join(result), modified\n\n\ndef split_into_lines(text: str, max_length: int) -> list[str]:\n    \"\"\"Split text into lines of at most ``max_length`` characters.\n\n    Does not split on word boundaries \u2014 preserves exact content.  Used for\n    the :86: field (max 65 chars per line).\n    \"\"\"\n    if max_length \u003c 1:\n        raise ValueError(f\"max_length must be >= 1, got {max_length}\")\n    return [text[i : i + max_length] for i in range(0, len(text), max_length)]\n", "bankbridge/exporters/mt940/ing_writer.py": "\"\"\"ING MT940 exporter.\n\nConverts a BankBridgeStatement to an ING-compatible MT940 file.\n\nOutput format matches the ING MT940 structure:\n- SWIFT FIN wrapper ({1:}/{2:}/{4:...-})\n- :25: IBAN + currency concatenated (e.g. NL05INGB0900000074EUR)\n- :28C: 00000 (single block per statement period)\n- :61: with /TRCD/ continuation line (ING proprietary code)\n- :86: structured /EREF//MARF//CSID//CNTP//REMI//ULTC/ format\n- :62F: closing balance\n- :64:/:65: forward balance entries (omitted \u2014 PDF/CSV sources have no forward value)\n- :86:/SUM/ summary (appended if transaction counts are known)\n\nKnown gaps vs. original ING MT940:\n- /TRCD/ code is derived from source_raw_code or a generic default (cannot recover original)\n- :86: EREF = 'NONREF' when no end-to-end reference is available\n- Value date = booking date (PDF shows one date; CSV derives from Valutadatum)\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import defaultdict\nfrom datetime import date\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction\n\nfrom .formatter import (\n    format_mt940_amount,\n    format_mt940_date,\n    mt940_opening_balance_date,\n    sanitize_swift_x,\n    split_into_lines,\n)\n\n# ---------------------------------------------------------------------------\n# Constants\n# ---------------------------------------------------------------------------\n\n_GENERIC_TRCD = \"00100\"   # generic ING proprietary code when source code unknown\n_DEBIT_TRCD = \"01018\"     # incasso/debit default\n_CREDIT_TRCD = \"00100\"    # credit transfer default\n_CHARGE_TRCD = \"09001\"    # charges default\n\n\n# ---------------------------------------------------------------------------\n# Helpers\n# ---------------------------------------------------------------------------\n\ndef _cd(ind: CreditDebitIndicator) -> str:\n    return \"C\" if ind == CreditDebitIndicator.CREDIT else \"D\"\n\n\ndef _signed(amount: Decimal, ind: CreditDebitIndicator) -> Decimal:\n    return amount if ind == CreditDebitIndicator.CREDIT else -amount\n\n\ndef _make_balance(running: Decimal, bal_date: date, currency: str, btype: BalanceType) -> Balance:\n    return Balance(\n        amount=abs(running),\n        credit_debit=CreditDebitIndicator.CREDIT if running >= 0 else CreditDebitIndicator.DEBIT,\n        date=bal_date,\n        balance_type=btype,\n        currency=currency,\n    )\n\n\ndef _format_balance_tag(tag: str, bal: Balance) -> str:\n    return (\n        f\":{tag}:{_cd(bal.credit_debit)}\"\n        f\"{format_mt940_date(bal.date)}\"\n        f\"{bal.currency}\"\n        f\"{format_mt940_amount(bal.amount)}\"\n    )\n\n\ndef _derive_trcd(txn: BankBridgeTransaction) -> str:\n    \"\"\"Derive ING /TRCD/ code from available information.\"\"\"\n    src = (txn.transaction_codes.source_raw_code or '').upper()\n    if src.isdigit() and len(src) == 5:\n        return src  # already ING proprietary numeric code\n    if txn.mandate_reference or txn.creditor_id:\n        return _DEBIT_TRCD  # incasso\n    if txn.debit_credit == CreditDebitIndicator.DEBIT:\n        return _DEBIT_TRCD\n    return _CREDIT_TRCD\n\n\ndef _derive_type_code(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return N + 3-char MT940 transaction type code.\"\"\"\n    raw = (txn.transaction_codes.normalized_type or '').upper()\n    _MAP = {\n        'TRF': 'TRF', 'ESCT': 'TRF', 'RCDT': 'TRF', 'IRCT': 'TRF', 'ICDT': 'TRF',\n        'DDT': 'DDT', 'RDDT': 'DDT', 'ESDD': 'DDT',\n        'CHG': 'CHG', 'CHRG': 'CHG', 'MDOP': 'CHG',\n    }\n    mapped = _MAP.get(raw, 'TRF')\n    return f\"N{mapped}\"\n\n\ndef _format_61(txn: BankBridgeTransaction) -> list[str]:\n    \"\"\"Return :61: lines including /TRCD/ continuation.\"\"\"\n    v_date = txn.value_date or txn.booking_date\n    b_date = txn.booking_date\n\n    val_str = format_mt940_date(v_date) if v_date else \"000101\"\n    entry_str = b_date.strftime(\"%m%d\") if b_date else val_str[2:]\n\n    dc = _cd(txn.debit_credit)\n    amount_str = format_mt940_amount(txn.amount)\n    type_code = _derive_type_code(txn)\n\n    eref = txn.end_to_end_id or txn.payment_reference or 'NONREF'\n    # customer ref must be max 16 chars\n    cust_ref = 'EREF' if eref != 'NONREF' else 'NONREF'\n\n    bank_ref = txn.bank_reference or ''\n    # bank ref after //\n    bank_ref_part = f\"//{bank_ref}\" if bank_ref else \"//NONREF\"\n\n    trcd = _derive_trcd(txn)\n    return [\n        f\":61:{val_str}{entry_str}{dc}{amount_str}{type_code}{cust_ref}{bank_ref_part}\",\n        f\"/TRCD/{trcd}/\",\n    ]\n\n\ndef _format_86(txn: BankBridgeTransaction) -> str:\n    \"\"\"Return :86: structured ING field.\"\"\"\n    parts: list[str] = []\n\n    eref = txn.end_to_end_id or txn.payment_reference\n    if eref:\n        eref_clean, _ = sanitize_swift_x(eref)\n        parts.append(f\"/EREF/{eref_clean}//\")\n\n    if txn.mandate_reference:\n        marf_clean, _ = sanitize_swift_x(txn.mandate_reference)\n        parts.append(f\"/MARF/{marf_clean}//\")\n\n    if txn.creditor_id:\n        csid_clean, _ = sanitize_swift_x(txn.creditor_id)\n        parts.append(f\"/CSID/{csid_clean}//\")\n\n    # /CNTP/IBAN/BIC/Name//\n    cntp_iban = txn.counterparty_iban or ''\n    cntp_bic = txn.counterparty_bic or ''\n    cntp_name = txn.counterparty_name or ''\n    if cntp_iban or cntp_bic or cntp_name:\n        name_clean, _ = sanitize_swift_x(cntp_name)\n        parts.append(f\"/CNTP/{cntp_iban}/{cntp_bic}/{name_clean}///\")\n\n    # /ULTC/ultimate party// \u2014 ING's \"Overige partij\"\n    ultimate = txn.ultimate_creditor_name or txn.ultimate_debtor_name or ''\n\n    # /REMI/USTD//description/ \u2014 closed with // when another key follows\n    desc = txn.description or ''\n    if desc:\n        desc_clean, _ = sanitize_swift_x(desc)\n        parts.append(f\"/REMI/USTD//{desc_clean}{'//' if ultimate else '/'}\")\n\n    if ultimate:\n        ultimate_clean, _ = sanitize_swift_x(ultimate)\n        parts.append(f\"/ULTC/{ultimate_clean}//\")\n\n    text = ''.join(parts)\n    if not text:\n        text = '/REMI/USTD///'\n\n    text, _ = sanitize_swift_x(text)\n    lines = split_into_lines(text, 65)\n    return \":86:\" + \"\\n\".join(lines)\n\n\n# ---------------------------------------------------------------------------\n# Public API\n# ---------------------------------------------------------------------------\n\ndef write(stmt: BankBridgeStatement) -> str:\n    \"\"\"Generate an ING-compatible MT940 string from a BankBridgeStatement.\n\n    Returns the complete file content with SWIFT FIN wrapper (LF endings).\n    All transactions are in a single :20: block matching ING's format.\n    \"\"\"\n    currency = stmt.currency or 'EUR'\n    iban = stmt.iban or 'UNKNOWNIBAN'\n    account_25 = f\"{iban}{currency}\"\n\n    transactions = sorted(\n        stmt.transactions,\n        key=lambda t: (t.booking_date or date(2000, 1, 1), t.value_date or date(2000, 1, 1)),\n    )\n\n    # :60F: is the previous statement's closing balance, so it must be dated\n    # before the first booked entry \u2014 see mt940_opening_balance_date().\n    first_entry_date = next(\n        (t.booking_date for t in transactions if t.booking_date), None\n    )\n    if stmt.opening_balance:\n        running = stmt.opening_balance.signed_value()\n        open_bal_date = mt940_opening_balance_date(\n            stmt.opening_balance.date, first_entry_date\n        )\n    else:\n        running = Decimal(\"0\")\n        open_bal_date = mt940_opening_balance_date(\n            first_entry_date or date(2000, 1, 1), first_entry_date\n        )\n    open_bal = _make_balance(running, open_bal_date, currency, BalanceType.OPENING_BOOKED)\n\n    # Compute closing balance\n    for txn in transactions:\n        running += _signed(txn.amount, txn.debit_credit)\n\n    last_date = transactions[-1].booking_date if transactions else (\n        stmt.period_end or date(2000, 1, 1)\n    )\n    close_bal = stmt.closing_balance or _make_balance(running, last_date, currency, BalanceType.CLOSING_BOOKED)\n\n    # Debit/credit counts and totals for /SUM/\n    n_debit = sum(1 for t in transactions if t.debit_credit == CreditDebitIndicator.DEBIT)\n    n_credit = sum(1 for t in transactions if t.debit_credit == CreditDebitIndicator.CREDIT)\n    total_debit = sum((t.amount for t in transactions if t.debit_credit == CreditDebitIndicator.DEBIT), Decimal(\"0\"))\n    total_credit = sum((t.amount for t in transactions if t.debit_credit == CreditDebitIndicator.CREDIT), Decimal(\"0\"))\n\n    body_lines: list[str] = []\n    body_lines.append(\":20:BANKBRIDGE\")\n    body_lines.append(f\":25:{account_25}\")\n    body_lines.append(\":28C:00000\")\n    body_lines.append(_format_balance_tag(\"60F\", open_bal))\n\n    for txn in transactions:\n        body_lines.extend(_format_61(txn))\n        body_lines.append(_format_86(txn))\n\n    body_lines.append(_format_balance_tag(\"62F\", close_bal))\n    body_lines.append(_format_balance_tag(\"64\", close_bal))\n\n    # Summary /SUM/ in final :86:\n    sum_line = (\n        f\":86:/SUM/{n_debit}/{n_credit}/\"\n        f\"{format_mt940_amount(total_debit)}/{format_mt940_amount(total_credit)}/\"\n    )\n    body_lines.append(sum_line)\n\n    body = \"\\n\".join(body_lines)\n\n    # Wrap in SWIFT FIN envelope\n    output = (\n        \"{1:F01INGBNL2ABXXX0000000000}\\n\"\n        \"{2:I940INGBNL2AXXXN}\\n\"\n        \"{4:\\n\"\n        f\"{body}\\n\"\n        \"-}\"\n    )\n    return output + \"\\n\"\n", "bankbridge/exporters/mt940/rabobank_writer.py": "\"\"\"Rabobank MT940 exporter.\n\nConverts a BankBridgeStatement (typically PDF-derived) to a\nRabobank-compatible MT940 file.\n\nStructural differences from an original Rabobank MT940 file are expected and\ndocumented in write()'s docstring.  They are not defects \u2014 they reflect\ninformation that the PDF source does not provide.\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom collections import defaultdict\nfrom datetime import date\nfrom decimal import Decimal\nfrom typing import Optional\n\nfrom bankbridge.models.balance import Balance\nfrom bankbridge.models.enums import BalanceType, CreditDebitIndicator\nfrom bankbridge.models.statement import BankBridgeStatement\nfrom bankbridge.models.transaction import BankBridgeTransaction\n\nfrom .formatter import (\n    format_mt940_amount,\n    format_mt940_date,\n    mt940_opening_balance_date,\n    sanitize_swift_x,\n    split_into_lines,\n)\n\n# Transaction type code policy\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# The PDF contains 2-char lowercase type codes (db, bg, id, bc, \u2026).\n# The original Rabobank MT940 uses 3-digit bank-specific codes (544, 541, 093, \u2026).\n#\n# Analysis of the January 2026 golden dataset shows that:\n#   - The same PDF code can map to different MT940 codes (e.g. \"bc\" \u2192 002 or 003;\n#     \"db\" \u2192 093 or 095; \"te\" \u2192 195 or 593).\n#   - The mapping is NOT 1-to-1 and cannot be reliably derived from the PDF alone.\n#\n# Therefore BankBridge uses:\n#   - \"000\" in the :61: field (required by MT940 format; generic fallback)\n#   - The original PDF 2-char code in :86:/TRCD/ (transparent, round-trip safe)\n#\n# PDF-code mapping table (derived from golden dataset, for documentation only):\n#   PDF   MT940 codes observed  Count\n#   bc    002, 003              8\n#   bg    544                   97\n#   cb    541                   42\n#   cc    074                   1\n#   db    093, 095              20\n#   ei    064                   17\n#   ga    032                   1\n#   id    102                   9\n#   te    195, 593              14\n#\n# None of these MT940 codes can be aantoonbaar derived from the PDF type code.\n# Using a synthetic mapping would be presenting bank-specific semantics that\n# BankBridge did not observe \u2014 this is explicitly not allowed.\n_MT940_GENERIC_CODE = \"000\"  # MT940-required 3-char bank code; \"no specific code\"\n\n\n# ---------------------------------------------------------------------------\n# Internal helpers\n# ---------------------------------------------------------------------------\n\ndef _cd(ind: CreditDebitIndicator) -> str:\n    return \"C\" if ind == CreditDebitIndicator.CREDIT else \"D\"\n\n\ndef _signed(amount: Decimal, ind: CreditDebitIndicator) -> Decimal:\n    return amount if ind == CreditDebitIndicator.CREDIT else -amount\n\n\ndef _make_balance(\n    running: Decimal,\n    bal_date: date,\n    currency: str,\n    btype: BalanceType,\n) -> Balance
