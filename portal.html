<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bouwman.tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #FDF6F0;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #2C1A0E;
      padding: 32px 32px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 1.4rem; font-weight: 700; color: #F5EBE0; letter-spacing: -.01em; }
    .logo span { color: #E8784F; }
    .user-bar { display: flex; align-items: center; gap: 12px; }
    .user-email { font-size: 0.78rem; color: #A07860; }
    .logout-link {
      font-size: 0.72rem; color: #A07860; text-decoration: none;
      border: 1px solid #4a2e1a; padding: 4px 12px; border-radius: 20px;
      transition: color .2s, border-color .2s;
    }
    .logout-link:hover { color: #F5EBE0; border-color: #A07860; }
    main {
      flex: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      width: 100%;
    }
    .section-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #A07860; margin-bottom: 16px; margin-top: 36px;
    }
    .section-label:first-of-type { margin-top: 0; }
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }
    .tool-card {
      display: flex; flex-direction: column; gap: 8px;
      background: #fff; border: 1px solid #E8C4A8; border-radius: 12px;
      padding: 22px 22px 20px; text-decoration: none; color: inherit;
      transition: border-color .2s, box-shadow .2s, transform .15s;
    }
    .tool-card:hover {
      border-color: #C0522A;
      box-shadow: 0 4px 16px rgba(192,82,42,.12);
      transform: translateY(-2px);
    }
    .tool-icon { font-size: 1.6rem; line-height: 1; }
    .tool-name { font-size: 1rem; font-weight: 700; color: #2C1A0E; }
    .tool-desc { font-size: 0.82rem; color: #A07860; line-height: 1.4; }
    .tool-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .tool-tag {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: .06em; color: #C0522A; background: #FDF6F0;
      border: 1px solid #E8C4A8; border-radius: 4px; padding: 2px 8px;
    }
    .tool-tag.ai { color: #7C4DBA; background: #F5F0FC; border-color: #D4B8F0; }
    .tool-tag.privacy-local {
      display: inline-flex; align-items: center; gap: 5px;
      color: #15803d; background: #f0fdf4; border-color: #bbf7d0;
      text-transform: none; letter-spacing: 0; font-weight: 500;
    }
    .tool-tag.privacy-local::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #22c55e; flex-shrink: 0;
    }
    .tool-tag.privacy-ai {
      display: inline-flex; align-items: center; gap: 5px;
      color: #92400e; background: #fffbeb; border-color: #fde68a;
      text-transform: none; letter-spacing: 0; font-weight: 500;
    }
    .tool-tag.privacy-ai::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: #f59e0b; flex-shrink: 0;
    }
    .no-tools {
      text-align: center; padding: 48px 24px; color: #A07860; font-size: 0.9rem;
    }
    footer {
      text-align: center; padding: 20px; font-size: 0.75rem;
      color: #A07860; border-top: 1px solid #E8C4A8;
    }
    .admin-panel {
      margin-top: 48px; border-top: 2px dashed #E8C4A8; padding-top: 32px;
    }
    .admin-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #C0522A; margin-bottom: 20px;
    }
    .admin-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px;
    }
    .admin-card {
      background: #fff; border: 1px solid #E8C4A8; border-radius: 12px;
      padding: 20px 20px 18px;
    }
    .admin-card h3 {
      font-size: 0.9rem; font-weight: 700; color: #2C1A0E;
      margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
    }
    .admin-card ol, .admin-card ul {
      margin: 0; padding-left: 18px; font-size: 0.82rem;
      color: #5a3e2e; line-height: 1.7;
    }
    .admin-card code {
      background: #FDF6F0; border: 1px solid #E8C4A8; border-radius: 4px;
      padding: 1px 6px; font-size: 0.78rem; color: #C0522A;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">bouwman<span>.tools</span></div>
    <div class="user-bar">
      <span class="user-email" id="user-email"></span>
      <a href="/cdn-cgi/access/logout" class="logout-link">Uitloggen</a>
    </div>
  </header>

  <main id="main-content">
    <div class="no-tools">Tools laden…</div>
  </main>

  <footer>bouwman.tools &mdash; gebouwd door Sylvain Bouwman</footer>

  <script>

    // tools.json is de enige bron van de toolportefeuille (zie AGENTS.md). Deze pagina
    // houdt daarom geen eigen toollijst meer bij: naam, beschrijving, categorie, icoon
    // en labels komen uit het register, en een tool krijgt een kaart zodra in_portal
    // true is. Zolang die lijst hier wel stond, kon een geregistreerde en afgeschermde
    // tool zonder kaart blijven en bestond hij dus niet voor collega's.
    async function laadRegister() {
      const res = await fetch('tools.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(`tools.json gaf ${res.status}`);
      const bron = await res.json();
      const rijen = (bron.tools || []).filter(t => t.in_portal === true);
      if (!rijen.length) throw new Error('tools.json bevat geen enkele tool met in_portal');

      // Een volgorde voor portaal en beheer, uit het register. Een categorie die er
      // niet in staat komt achteraan in plaats van te verdwijnen.
      const volgorde = bron.categorievolgorde || [];
      const rang = c => {
        const i = volgorde.indexOf(c);
        return i === -1 ? volgorde.length : i;
      };

      const gesorteerd = rijen.slice().sort((a, b) =>
        rang(a.categorie) - rang(b.categorie) || a.naam.localeCompare(b.naam, 'nl'));

      const secties = new Map();
      for (const t of gesorteerd) {
        const file = t.extern ? t.url : t.bestand;
        if (!file) continue;
        // De bèta-tag komt uit status en staat niet in tags: anders zou de status op
        // twee plekken in het register staan en daar weer uit elkaar kunnen lopen.
        const tags = (t.status === 'beta' ? [{ label: 'Bèta', soort: 'privacy-ai' }] : [])
          .concat(t.tags || []);
        if (!secties.has(t.categorie)) secties.set(t.categorie, []);
        secties.get(t.categorie).push({
          file, tags,
          icon: t.icon || '',
          name: t.naam,
          desc: t.beschrijving || '',
        });
      }
      return secties;
    }

    async function getEmail() {
      try {
        const res = await fetch('/cdn-cgi/access/get-identity');
        if (!res.ok) return null;
        const data = await res.json();
        return data.email || null;
      } catch { return null; }
    }

    function canSee(file, access) {
      if (!access) return true;
      if (access === 'all') return true;
      return access.includes(file);
    }

    // Faalt het register, dan komt er een melding en geen lege pagina: die zou niet te
    // onderscheiden zijn van "je hebt nergens toegang tot".
    function meldRegisterFout(e) {
      console.error('toollijst laden mislukt:', e);
      document.getElementById('main-content').innerHTML =
        '<div class="no-tools"><strong>De toollijst kon niet worden geladen.</strong><br>' +
        'Het portaal bouwt de kaarten op uit tools.json. Zonder dat register kan het niet ' +
        'tonen waar je recht op hebt. Probeer het opnieuw, of neem contact op met Sylvain ' +
        'Bouwman. De details staan in de console.</div>';
    }

    async function render() {
      const [uitkomst, email] = await Promise.all([laadRegister().catch(e => e), getEmail()]);
      if (uitkomst instanceof Error) { meldRegisterFout(uitkomst); return; }
      const secties = uitkomst;

      let access = [];
      if (email) {
        try {
          const res = await fetch('https://access-beheer.s-bouwman.workers.dev/permissions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
          });
          access = (await res.json()).access ?? [];
        } catch { access = []; }
      }

      if (email) {
        document.getElementById('user-email').textContent = email;
      }

      const main = document.getElementById('main-content');
      let html = '';
      let anyVisible = false;

      for (const [categorie, items] of secties) {
        const visible = items.filter(t => canSee(t.file, access));
        if (!visible.length) continue;
        anyVisible = true;
        html += `<div class="section-label">${categorie}</div><div class="tools-grid">`;
        for (const t of visible) {
          const tags = t.tags.map(tag =>
            `<span class="tool-tag${tag.soort ? ' '+tag.soort : ''}">${tag.label}</span>`
          ).join('');
          html += `
            <a href="${t.file}" class="tool-card"${t.file.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>
              <div class="tool-icon">${t.icon}</div>
              <div class="tool-name">${t.name}</div>
              <div class="tool-desc">${t.desc}</div>
              <div class="tool-tags">${tags}</div>
            </a>`;
        }
        html += '</div>';
      }

      if (access === 'all') {
        html += `
          <div class="admin-panel">
            <div class="admin-title">⚙️ Beheer — alleen zichtbaar voor jou</div>
            <div class="admin-grid">

              <div class="admin-card">
                <h3>👤 Nieuwe gebruiker toevoegen</h3>
                <ol>
                  <li>Open <a href="beheer.html">beheer.html</a></li>
                  <li>Vul onder <em>Nieuwe gebruiker toevoegen</em> het e-mailadres in</li>
                  <li>Kies bij <em>Toegang tot tools</em> één of meer tools, of vink
                    <em>Alle tools</em> aan</li>
                  <li>Klik <em>Opslaan</em>. De rechten gaan naar de worker; die werkt
                    Cloudflare Access automatisch bij</li>
                  <li>De gebruiker krijgt bij het eerste bezoek een OTP per mail</li>
                </ol>
              </div>

              <div class="admin-card">
                <h3>☁️ Cloudflare Access</h3>
                <ul>
                  <li>Voor <strong>gebruikers</strong> hoef je hier niets te doen: na elke
                    wijziging in beheer.html zet de worker de e-mailadressen zelf in de
                    policies van elke app</li>
                  <li>Handmatig werk is alleen nodig bij een <strong>nieuwe pagina</strong>
                    op bouwman.tools: maak in Zero Trust → Access → Applications een
                    Application aan en zet het app-id in <code>APP_IDS</code> in
                    <code>access-beheer-worker.js</code> — daarna de worker opnieuw
                    uitrollen</li>
                  <li>Externe tools op een eigen domein (Streamlit) vallen niet onder
                    Cloudflare Access; die zijn bereikbaar voor wie de URL heeft</li>
                </ul>
              </div>

              <div class="admin-card">
                <h3>🔧 Toegang tot specifieke tools</h3>
                <ul>
                  <li>Per gebruiker geldt óf <code>all</code>, óf een lijst met tools</li>
                  <li>Een tool wordt aangeduid met <code>bestand</code> uit
                    <code>tools.json</code>, of met <code>url</code> bij een externe tool</li>
                  <li>Externe tools staan er met hun volledige URL:<br>
                    <code>https://xaf.bouwman.tools/</code></li>
                  <li>Een tool is alleen toe te kennen als <code>in_beheer</code> in
                    <code>tools.json</code> op true staat</li>
                  <li>Een e-mailadres dat niet in de lijst staat ziet <strong>geen enkele</strong>
                    tool. De worker geeft dan een lege lijst terug en dit portaal toont
                    niets — nieuwe collega's moet je dus eerst toevoegen</li>
                </ul>
              </div>

              <div class="admin-card">
                <h3>🛠️ Nieuwe tool toevoegen aan portal</h3>
                <ol>
                  <li>Maak een privé-repo in de org <code>bouwman-tools</code>, zet het
                    HTML-bestand erin en push</li>
                  <li>Voeg de sync-workflow en de secret <code>BOUWMAN_TOOLS_PAT</code> toe
                    — zie de README. Een Action kopieert het bestand hierheen en binnen een
                    minuut staat het live</li>
                  <li>Neem de tool op in <code>tools.json</code>: naam, beschrijving,
                    categorie, <code>icon</code>, <code>tags</code>, <code>in_portal</code>
                    en <code>in_beheer</code>. Portaal en beheer lezen die lijst, dus in de
                    pagina's zelf hoef je niets bij te werken. Controleer met
                    <code>python tools/check_tools.py</code></li>
                  <li>Bescherm de pagina: Application aanmaken in Cloudflare Access en het
                    app-id opnemen in <code>APP_IDS</code> van de worker</li>
                  <li>Geef gebruikers toegang via <a href="beheer.html">beheer.html</a></li>
                </ol>
              </div>

            </div>
          </div>`;
      }

      main.innerHTML = anyVisible ? html
        : '<div class="no-tools">Je hebt nog geen toegang tot tools. Neem contact op met Sylvain Bouwman.</div>';
    }

    render();

  </script>

</body>
</html>
