<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gebruikersbeheer — bouwman.tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #FDF6F0;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #2C1A0E;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 1.2rem; font-weight: 700; color: #F5EBE0; }
    .logo span { color: #E8784F; }
    .back { font-size: 0.8rem; color: #A07860; text-decoration: none; border: 1px solid #4a2e1a; padding: 4px 12px; border-radius: 20px; }
    .back:hover { color: #F5EBE0; border-color: #A07860; }
    main { max-width: 860px; margin: 0 auto; padding: 36px 24px; }
    h2 { font-size: 1.1rem; font-weight: 700; color: #2C1A0E; margin: 0 0 20px; }
    .card {
      background: #fff;
      border: 1px solid #E8C4A8;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }

    /* Gebruikerslijst */
    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #F0E0D0;
    }
    .user-row:last-child { border-bottom: none; }
    .user-email { flex: 1; font-size: 0.9rem; color: #2C1A0E; font-weight: 600; }
    .user-access { font-size: 0.78rem; color: #A07860; flex: 2; }
    .btn-edit {
      font-size: 0.75rem; padding: 5px 12px; border-radius: 6px;
      border: 1px solid #E8C4A8; background: #FDF6F0; color: #C0522A;
      cursor: pointer; font-weight: 600;
    }
    .btn-edit:hover { background: #F5EBE0; }
    .btn-del {
      font-size: 0.75rem; padding: 5px 10px; border-radius: 6px;
      border: 1px solid #fca5a5; background: #fff5f5; color: #dc2626;
      cursor: pointer; font-weight: 600;
    }
    .btn-del:hover { background: #fee2e2; }

    /* Formulier */
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #5a3e2e; margin-bottom: 5px; }
    input[type="email"] {
      width: 100%; padding: 9px 12px; border: 1px solid #E8C4A8;
      border-radius: 8px; font-size: 0.9rem; color: #2C1A0E; outline: none;
      margin-bottom: 16px;
    }
    input[type="email"]:focus { border-color: #C0522A; }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }
    .tool-check {
      display: flex; align-items: center; gap: 8px;
      background: #FDF6F0; border: 1px solid #E8C4A8; border-radius: 8px;
      padding: 8px 12px; cursor: pointer; user-select: none;
      font-size: 0.82rem; color: #2C1A0E;
    }
    .tool-check input { width: 15px; height: 15px; accent-color: #C0522A; cursor: pointer; }
    .tool-check.checked { border-color: #C0522A; background: #fff5f0; }

    .all-toggle {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      font-size: 0.85rem; font-weight: 600; color: #2C1A0E; cursor: pointer;
    }
    .all-toggle input { width: 16px; height: 16px; accent-color: #C0522A; cursor: pointer; }

    .form-actions { display: flex; gap: 10px; }
    .btn-save {
      padding: 10px 22px; font-size: 0.9rem; font-weight: 700;
      background: #C0522A; color: white; border: none; border-radius: 8px;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-cancel {
      padding: 10px 18px; font-size: 0.9rem; font-weight: 600;
      background: transparent; color: #A07860; border: 1px solid #E8C4A8;
      border-radius: 8px; cursor: pointer;
    }
    .btn-cancel:hover { background: #F5EBE0; }

    /* Melding over de laatste synchronisatie of controle van de toegang.
       Zonder deze balk kan het bijwerken van de Access-policies stil mislukken. */
    .statusbalk {
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.88rem;
      line-height: 1.5;
      border: 1px solid;
    }
    .statusbalk.fout { background: #FBEAEA; border-color: #D99; color: #8A1B1B; }
    .statusbalk.goed { background: #EDF7F0; border-color: #A8CBB4; color: #1D6B3F; }
    /* Niet groen en niet rood: er is geen recente uitslag, dus de stand is onbekend. */
    .statusbalk.onbekend { background: #FFF6E5; border-color: #E0C08A; color: #7A5210; }
    .statusbalk b { font-weight: 700; }
    .statusbalk ul { margin: 8px 0 0; padding-left: 20px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #2C1A0E; color: white; padding: 10px 22px;
      border-radius: 20px; font-size: 0.85rem; opacity: 0;
      pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    .loading { color: #A07860; font-size: 0.9rem; padding: 12px 0; }
    .section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #A07860; margin-bottom: 14px; }
    #token-screen {
      max-width: 420px; margin: 80px auto; background: #fff;
      border: 1px solid #E8C4A8; border-radius: 14px; padding: 32px;
    }
    #token-screen h2 { margin: 0 0 8px; font-size: 1rem; color: #2C1A0E; }
    #token-screen p { font-size: 0.82rem; color: #A07860; margin: 0 0 16px; }
    #token-input {
      width: 100%; padding: 9px 12px; border: 1px solid #E8C4A8;
      border-radius: 8px; font-size: 0.88rem; font-family: monospace;
      margin-bottom: 12px; outline: none;
    }
    #token-input:focus { border-color: #C0522A; }
  </style>
</head>
<body>

<header>
  <div class="logo">bouwman<span>.tools</span> — Gebruikersbeheer</div>
  <a href="/portal.html" class="back">← Terug naar portal</a>
</header>

<main id="app" style="display:none">

  <div class="statusbalk" id="statusbalk" hidden></div>

  <div class="card" id="users-card">
    <div class="section-title">Huidige gebruikers</div>
    <div id="users-list" class="loading">Laden…</div>
  </div>

  <div class="card" id="form-card">
    <div class="section-title" id="form-title">Nieuwe gebruiker toevoegen</div>

    <label for="email-input">E-mailadres</label>
    <input type="email" id="email-input" placeholder="naam@kantoor.nl" />

    <label>Toegang tot tools</label>

    <label class="all-toggle">
      <input type="checkbox" id="all-check" onchange="toggleAll(this.checked)">
      Toegang tot alle (huidige en toekomstige) tools
    </label>

    <div class="tools-grid" id="tools-grid"></div>

    <div class="form-actions">
      <button class="btn-save" onclick="saveUser()">Opslaan</button>
      <button id="sync-button" onclick="syncRechten()">Bestaande rechten synchroniseren</button>
      <button class="btn-cancel" onclick="resetForm()">Annuleren</button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
  const WORKER = '/beheer.html/api';

  // De toollijst komt uit tools.json, het register. Stond die lijst hier ook, dan zou een
  // nieuwe tool wel een Access-app kunnen hebben en toch buiten het toegangsbeheer vallen:
  // dat gebeurde op 04-09-2026 bij herziening-btw en de inventarisatiepagina.
  //
  // De sleutel is het bestand, of bij een externe tool de URL. Die waarde staat ook in de
  // opgeslagen rechten per gebruiker, dus hij mag niet veranderen zonder migratie.
  let TOOLS = [];


  async function laadTools() {
    const r = await fetch('tools.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`tools.json gaf ${r.status}`);
    const data = await r.json();
    const rijen = (data.tools || []).filter(t => t.in_beheer === true);
    if (rijen.length === 0) throw new Error('tools.json bevat geen enkele tool met in_beheer');
    // Ook de volgorde van de categorieen komt uit het register, zodat portaal en
    // beheer er niet elk een eigen lijst op nahouden.
    const volgorde = data.categorievolgorde || [];
    const rang = c => {
      const i = volgorde.indexOf(c);
      return i === -1 ? volgorde.length : i;
    };
    TOOLS = rijen
      .map(t => ({ file: t.extern ? t.url : t.bestand, name: t.naam, categorie: t.categorie }))
      .filter(t => t.file)
      .sort((a, b) => rang(a.categorie) - rang(b.categorie) || a.name.localeCompare(b.name, 'nl'));
  }

  let editingEmail = null;

  async function api(path, method = 'GET', body) {
    let r;
    try {
      r = await fetch(WORKER + path, {
        method, credentials: 'same-origin', redirect: 'error', cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new Error('Beheer niet bereikbaar. Open beheer opnieuw en probeer het nogmaals.');
    }
    if (!r.ok) throw new Error(`Beheerverzoek mislukt (HTTP ${r.status}). Open beheer opnieuw bij een verlopen sessie.`);
    if (!r.headers.get('Content-Type')?.toLowerCase().includes('application/json')) {
      throw new Error('Onverwacht beheerantwoord. Open beheer opnieuw.');
    }
    let data;
    try { data = await r.json(); } catch { throw new Error('Ongeldig beheerantwoord.'); }
    // GET /admin/users is de gebruikersmap: 'error' kan een bestaande sleutel zijn.
    // Alleen mutaties geven een bevestigings-/foutenvelop terug.
    if (!data || typeof data !== 'object' || Array.isArray(data) ||
        (method === 'POST' && (data.error || (data.ok !== true &&
          !(data.ok === false && typeof data.voortzetten === 'boolean'))))) {
      throw new Error('Het beheerverzoek is niet bevestigd.');
    }
    return data;
  }

  function accessLabel(tools) {
    if (tools === 'all') return 'Alle tools';
    if (!tools || tools.length === 0) return 'Geen tools';
    if (tools.length <= 3) return tools.map(f => TOOLS.find(t => t.file === f)?.name || f).join(', ');
    return `${tools.length} tools`;
  }

  async function loadUsers() {
    const list = document.getElementById('users-list');
    const permissions = await api('/admin/users');
    const entries = Object.entries(permissions);
    if (entries.length === 0) {
      list.innerHTML = '<div class="loading">Nog geen gebruikers.</div>';
      return;
    }
    list.replaceChildren();
    for (const [email, tools] of entries) {
      const row = document.createElement('div');
      row.className = 'user-row';
      // Bestaande sleutels zijn tekst, ook als ze quotes/HTML bevatten. De knop
      // bewaart de exacte sleutel zonder deze in inline JavaScript te interpoleren.
      const address = document.createElement('div');
      address.className = 'user-email';
      address.textContent = email;
      const access = document.createElement('div');
      access.className = 'user-access';
      access.textContent = accessLabel(tools);
      const edit = document.createElement('button');
      edit.className = 'btn-edit';
      edit.textContent = 'Bewerken';
      edit.onclick = () => editUser(email);
      const remove = document.createElement('button');
      remove.className = 'btn-del';
      remove.textContent = 'Verwijderen';
      remove.onclick = () => deleteUser(email);
      row.append(address, access, edit, remove);
      list.append(row);
    }
  }

  function buildToolsGrid(selected) {
    const all = selected === 'all';
    document.getElementById('all-check').checked = all;
    const grid = document.getElementById('tools-grid');
    grid.style.opacity = all ? '0.4' : '1';
    grid.style.pointerEvents = all ? 'none' : '';
    grid.innerHTML = TOOLS.map(t => {
      const checked = all || (Array.isArray(selected) && selected.includes(t.file));
      return `
        <label class="tool-check ${checked ? 'checked' : ''}" id="lbl-${btoa(t.file).replace(/=/g,'')}">
          <input type="checkbox" value="${t.file}" ${checked ? 'checked' : ''}
            onchange="this.closest('label').classList.toggle('checked', this.checked)">
          ${t.name}
        </label>`;
    }).join('');
  }

  function toggleAll(checked) {
    const grid = document.getElementById('tools-grid');
    grid.style.opacity = checked ? '0.4' : '1';
    grid.style.pointerEvents = checked ? 'none' : '';
    grid.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.checked = checked;
      cb.closest('label').classList.toggle('checked', checked);
    });
  }

  function getSelectedTools() {
    if (document.getElementById('all-check').checked) return 'all';
    return [...document.querySelectorAll('#tools-grid input:checked')].map(cb => cb.value);
  }

  async function editUser(email) {
    let permissions;
    try { permissions = await api('/admin/users'); }
    catch (e) { showToast(e.message); return; }
    editingEmail = email;
    document.getElementById('form-title').textContent = 'Gebruiker bewerken';
    document.getElementById('email-input').value = email;
    document.getElementById('email-input').disabled = true;
    buildToolsGrid(permissions[email] ?? []);
    document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    editingEmail = null;
    document.getElementById('form-title').textContent = 'Nieuwe gebruiker toevoegen';
    document.getElementById('email-input').value = '';
    document.getElementById('email-input').disabled = false;
    buildToolsGrid([]);
  }

  async function saveUser() {
    const email = editingEmail || document.getElementById('email-input').value.trim();
    if (!email) { showToast('Voer een e-mailadres in.'); return; }
    const tools = getSelectedTools();
    const btn = document.querySelector('.btn-save');
    btn.textContent = 'Opslaan…';
    btn.disabled = true;
    try {
      const opslagMoment = Date.now();
      const resultaat = await voltooiSynchronisatie(await api('/admin/upsert', 'POST', { email, tools }));
      await loadUsers();
      resetForm();
      document.getElementById('users-card').scrollIntoView({ behavior: 'smooth' });
      showToast(resultaat.ok ? 'Opgeslagen en toegang gecontroleerd.' :
        'Opgeslagen; synchronisatie niet volledig gelukt. Bekijk de beheerstatus.');
      // Zonder dit blijft de statusbalk de stand van vóór deze opslag tonen.
      await laadStatus(opslagMoment);
    } catch (e) {
      showToast(e.message);
    } finally {
      btn.textContent = 'Opslaan';
      btn.disabled = false;
    }
  }

  async function deleteUser(email) {
    if (!confirm(`${email} verwijderen?`)) return;
    try {
      await voltooiSynchronisatie(await api('/admin/delete', 'POST', { email }));
      await loadUsers();
      showToast(`${email} verwijderd.`);
      await laadStatus();
    } catch (e) { showToast(e.message); }
  }

  async function syncRechten() {
    const btn = document.getElementById('sync-button');
    btn.disabled = true;
    btn.textContent = 'Synchroniseren en controleren…';
    try {
      const resultaat = await voltooiSynchronisatie(await api('/admin/sync', 'POST', {}));
      await laadStatus();
      showToast(resultaat.ok ? 'Synchronisatie en nacontrole afgerond.' :
        'Synchronisatie niet volledig gelukt. Bekijk de beheerstatus.');
    } catch (e) { showToast(e.message); }
    finally {
      btn.disabled = false;
      btn.textContent = 'Bestaande rechten synchroniseren';
    }
  }

  async function voltooiSynchronisatie(resultaat) {
    // Iedere stap is een afzonderlijke worker-uitvoering onder de requestlimiet.
    // De bronhash voorkomt dat een andere wijziging of oude KV-replica ongemerkt
    // de rechten van een lopende synchronisatie vervangt.
    for (let stap = 0; resultaat.voortzetten && stap < 12; stap++) {
      resultaat = await api('/admin/sync', 'POST', { bronHash: resultaat.bronHash });
    }
    if (resultaat.voortzetten) throw new Error('Synchronisatie heeft nog open stappen. Start opnieuw.');
    return resultaat;
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Toont of het bijwerken van de Access-policies werkelijk is gelukt. De
  // synchronisatie wordt afgewacht en apart in KV opgeslagen. Faalt dit
  // ophalen, dan toont de balk een fout: afwezigheid van status is geen succes.
  // Een opgeslagen uitslag is een momentopname en geen huidige stand. Zonder
  // ouderdomstoets leest een oud resultaat als de toestand van nu: op 08-09-2026 stond
  // hier nog de controle van 04-09 08:00:39 terwijl de dagelijkse run sinds 05-09 elke
  // keer faalde vóór het opslaan. De marge is ruim boven het dagelijkse interval, zodat
  // één overgeslagen ronde nog geen alarm geeft.
  const CONTROLE_MARGE_UREN = 36;

  function ouderdom(iso) {
    if (!iso) return { bekend: false, reden: 'zonder tijdstip' };
    const d = new Date(iso);
    if (isNaN(d)) return { bekend: false, reden: 'met een onleesbaar tijdstip' };
    const uren = (Date.now() - d.getTime()) / 3600000;
    if (uren < -1) return { bekend: false, reden: 'met een tijdstip in de toekomst' };
    return { bekend: true, verouderd: uren > CONTROLE_MARGE_UREN, uren: Math.round(uren) };
  }

  // 401 betekent dat Cloudflare het token van de worker niet accepteert. Dat is iets
  // anders dan een policy die achterloopt, en het vraagt de tegenovergestelde handeling:
  // niet opnieuw opslaan, maar het token vernieuwen.
  function heeftAuthenticatieFout(fouten) {
    return (fouten || []).some(f => /(^|\D)401(\D|$)/.test(String(f && f.reden)));
  }

  // Toon alles wat past en zeg exact hoeveel er niet staat, zodat een lange lijst niet
  // stil wordt afgekapt zoals eerder bij zes afwijkingen gebeurde.
  const REGELS_MAX = 8;
  function voegRegelsToe(regels, items, tekst) {
    for (const x of items.slice(0, REGELS_MAX)) regels.push(tekst(x));
    const rest = items.length - REGELS_MAX;
    if (rest > 0) regels.push(`<b>${rest} verdere regel(s) niet getoond.</b>`);
  }

  async function laadStatus(naOpslag) {
    const balk = document.getElementById('statusbalk');
    try {
      const st = await api('/admin/status');
      if (!st || (!st.synchronisatie && !st.controle)) return;

      const regels = [];
      const sync = st.synchronisatie;
      const contr = st.controle;
      let fout = false;
      let onbekend = false;
      // Ook bij een afgebroken verbinding of achterlopende KV-replica mag een oude
      // uitslag nooit doorgaan voor het resultaat van de zojuist uitgevoerde opslag.
      if (naOpslag && (!st.synchronisatie || !st.synchronisatie.tijdstip ||
          Date.parse(st.synchronisatie.tijdstip) < naOpslag)) {
        onbekend = true;
        regels.push('<b>De synchronisatie van je laatste opslag is nog niet ' +
          'weggeschreven.</b> Wat hieronder staat is een eerdere uitslag en zegt niets ' +
          'over wat je net hebt opgeslagen. Herlaad deze pagina over een moment.');
      }
      let authFout = false;

      if (sync) {
        const fouten = sync.fouten || [];
        if (sync.mislukt || fouten.length) {
          fout = true;
          authFout = heeftAuthenticatieFout(fouten);
          regels.push(`De laatst opgeslagen synchronisatie (${tijd(sync.tijdstip)}) heeft ` +
            `de toegang <b>niet</b> volledig bijgewerkt: ${sync.mislukt} van de tools ` +
            `mislukte. Dit is de opgeslagen uitslag van die poging, niet de stand van nu.`);
          voegRegelsToe(regels, fouten, f => `${f.tool}: ${f.reden}`);
        } else {
          regels.push(`Laatst opgeslagen synchronisatie (${tijd(sync.tijdstip)}): ` +
            `${sync.gelukt} tools bijgewerkt.`);
        }
      }

      if (contr) {
        const afw = contr.afwijkingen || [];
        const hersteld = contr.hersteld || 0;
        const oud = ouderdom(contr.tijdstip);
        // Eerst de ouderdom, want die bepaalt of de rest nog iets over nu zegt.
        if (!oud.bekend) {
          onbekend = true;
          regels.push(`Er staat een controle ${oud.reden}, dus de <b>actuele toestand is ` +
            `onbekend</b>. Wat hieronder staat is niet te plaatsen in de tijd.`);
        } else if (oud.verouderd) {
          onbekend = true;
          regels.push(`De laatst opgeslagen controle is <b>${oud.uren} uur oud</b> ` +
            `(${tijd(contr.tijdstip)}), terwijl zij dagelijks hoort te lopen. De ` +
            `<b>actuele toestand is onbekend</b>: sindsdien is er geen uitslag ` +
            `weggeschreven, wat erop wijst dat de controle zelf niet doorkomt. Lees het ` +
            `onderstaande als historie, niet als de stand van nu.`);
        }
        if (afw.length) {
          fout = true;
          regels.push(`Die controle (${tijd(contr.tijdstip)}) vond ` +
            `<b>${afw.length} afwijking(en)</b> tussen de rechten hier en wat er ` +
            `werkelijk op Cloudflare staat, en kon die niet herstellen.`);
          voegRegelsToe(regels, afw, a => `${a.tool}: ${a.reden}`);
        } else if (hersteld) {
          // Geen foutmelding: de controle heeft zijn werk gedaan. Wel tonen, want een
          // afwijking die telkens terugkomt is een signaal op zichzelf.
          regels.push(`Dagelijkse controle (${tijd(contr.tijdstip)}): ` +
            `${hersteld} afwijking(en) gevonden en hersteld, ` +
            `${contr.gecontroleerd} tools nu in orde.`);
        } else {
          regels.push(`Dagelijkse controle (${tijd(contr.tijdstip)}): ` +
            `${contr.gecontroleerd} tools in orde.`);
        }
      }

      // Staan de Workers waar tools van afhangen nog op het account? Een tool kan op
      // live staan, keurig in het portaal hangen en achter Access zitten terwijl de
      // Worker eronder weg is; de policies kloppen dan gewoon. Zo bleef kvk-zoeker op
      // 04-09-2026 stuk zonder dat iemand het merkte.
      const wk = contr && contr.workers;
      if (wk && wk.reden) {
        fout = true;
        regels.push('De controle kon de Workers <b>niet</b> nakijken, en merkt het dus ' +
          'ook niet als er een verdwijnt:');
        regels.push(wk.reden);
      } else if (wk && (wk.ontbreekt || []).length) {
        fout = true;
        regels.push(`<b>${wk.ontbreekt.length} Worker(s) ontbreken op het account.</b> ` +
          'De tools die daarvan afhangen werken niet, ook al staan ze gewoon in het ' +
          'portaal. Terugzetten vraagt meestal ook het secret opnieuw en kan alleen de ' +
          'eigenaar; deze controle doet dat bewust niet zelf.');
        for (const o of wk.ontbreekt) regels.push(`${o.naam}: nodig voor ${o.waarvoor}`);
      } else if (wk) {
        regels.push(`Workers: alle ${wk.verwacht} uit het register staan op het account.`);
        if ((wk.ongebruikt || []).length) {
          regels.push('Geen tool verwijst naar: ' + wk.ongebruikt.join(', ') +
            '. Geen fout, wel iets om te weten.');
        }
      }

      // Alles hierboven is een opgeslagen meting. De pagina weet niet of er sindsdien
      // iets is veranderd, bijvoorbeeld een vervangen token, en mag dus geen actuele
      // oorzaak of handeling voorschrijven. Daarom geen advies om opnieuw op te slaan:
      // een 500, een 403 of een oude afwijking bewijst niet dat die schrijfactie nodig is.
      if (authFout) {
        regels.push('Bij die synchronisatie weigerde Cloudflare de authenticatie ' +
          '(HTTP 401). Of de toegang inmiddels is hersteld, blijkt pas uit een nieuwe ' +
          'controle. Is het token intussen vervangen, voer het dan niet opnieuw in op ' +
          'grond van deze historische melding.');
      } else if (fout) {
        regels.push('Dit is de uitslag van dat moment. Of het er nu nog zo staat, blijkt ' +
          'pas uit een nieuwe controle.');
      }

      balk.className = 'statusbalk ' + (fout ? 'fout' : onbekend ? 'onbekend' : 'goed');
      balk.innerHTML = regels.length > 1
        ? `${regels[0]}<ul>${regels.slice(1).map(r => `<li>${r}</li>`).join('')}</ul>`
        : regels[0];
      balk.hidden = false;
    } catch (e) {
      balk.className = 'statusbalk fout';
      balk.textContent = 'Beheerstatus kon niet worden geladen. ' + e.message;
      balk.hidden = false;
    }
  }

  function tijd(iso) {
    if (!iso) return 'onbekend';
    const d = new Date(iso);
    return isNaN(d) ? 'onbekend' : d.toLocaleString('nl-NL');
  }

  // Init. De app verschijnt pas als de toollijst geladen is: met een lege lijst zou het
  // scherm tonen dat een gebruiker nergens recht op heeft, en een opslagactie zou dat
  // vervolgens waarmaken.
  (async () => {
    try {
      await laadTools();
    } catch (e) {
      console.error('toollijst laden mislukt:', e);
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="margin:1rem;padding:1rem;border-left:3px solid #9b2226;background:#fdeded">' +
        '<strong>De toollijst kon niet worden geladen.</strong> Het beheerscherm blijft daarom ' +
        'dicht: met een lege lijst zou opslaan de rechten van een gebruiker wissen. ' +
        'Details staan in de console.</div>');
      return;
    }
    document.getElementById('app').style.display = '';
    buildToolsGrid([]);
    loadUsers().catch(e => {
      document.getElementById('users-list').textContent = e.message;
      showToast(e.message);
    });
    laadStatus();
  })();
</script>
</body>
</html>
