<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gebruikersbeheer — bouwman.tools</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #FDF6F0;
      margin: 0;
      min-height: 100vh;
    }
    header {
      background: #2C1A0E;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo { font-size: 1.2rem; font-weight: 700; color: #F5EBE0; }
    .logo span { color: #E8784F; }
    .back { font-size: 0.8rem; color: #A07860; text-decoration: none; border: 1px solid #4a2e1a; padding: 4px 12px; border-radius: 20px; }
    .back:hover { color: #F5EBE0; border-color: #A07860; }
    main { max-width: 860px; margin: 0 auto; padding: 36px 24px; }
    h2 { font-size: 1.1rem; font-weight: 700; color: #2C1A0E; margin: 0 0 20px; }
    .card {
      background: #fff;
      border: 1px solid #E8C4A8;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }

    /* Gebruikerslijst */
    .user-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #F0E0D0;
    }
    .user-row:last-child { border-bottom: none; }
    .user-email { flex: 1; font-size: 0.9rem; color: #2C1A0E; font-weight: 600; }
    .user-access { font-size: 0.78rem; color: #A07860; flex: 2; }
    .btn-edit {
      font-size: 0.75rem; padding: 5px 12px; border-radius: 6px;
      border: 1px solid #E8C4A8; background: #FDF6F0; color: #C0522A;
      cursor: pointer; font-weight: 600;
    }
    .btn-edit:hover { background: #F5EBE0; }
    .btn-del {
      font-size: 0.75rem; padding: 5px 10px; border-radius: 6px;
      border: 1px solid #fca5a5; background: #fff5f5; color: #dc2626;
      cursor: pointer; font-weight: 600;
    }
    .btn-del:hover { background: #fee2e2; }

    /* Formulier */
    label { display: block; font-size: 0.82rem; font-weight: 600; color: #5a3e2e; margin-bottom: 5px; }
    input[type="email"] {
      width: 100%; padding: 9px 12px; border: 1px solid #E8C4A8;
      border-radius: 8px; font-size: 0.9rem; color: #2C1A0E; outline: none;
      margin-bottom: 16px;
    }
    input[type="email"]:focus { border-color: #C0522A; }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }
    .tool-check {
      display: flex; align-items: center; gap: 8px;
      background: #FDF6F0; border: 1px solid #E8C4A8; border-radius: 8px;
      padding: 8px 12px; cursor: pointer; user-select: none;
      font-size: 0.82rem; color: #2C1A0E;
    }
    .tool-check input { width: 15px; height: 15px; accent-color: #C0522A; cursor: pointer; }
    .tool-check.checked { border-color: #C0522A; background: #fff5f0; }

    .all-toggle {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      font-size: 0.85rem; font-weight: 600; color: #2C1A0E; cursor: pointer;
    }
    .all-toggle input { width: 16px; height: 16px; accent-color: #C0522A; cursor: pointer; }

    .form-actions { display: flex; gap: 10px; }
    .btn-save {
      padding: 10px 22px; font-size: 0.9rem; font-weight: 700;
      background: #C0522A; color: white; border: none; border-radius: 8px;
      cursor: pointer; transition: opacity .15s;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-cancel {
      padding: 10px 18px; font-size: 0.9rem; font-weight: 600;
      background: transparent; color: #A07860; border: 1px solid #E8C4A8;
      border-radius: 8px; cursor: pointer;
    }
    .btn-cancel:hover { background: #F5EBE0; }

    /* Melding over de laatste synchronisatie of controle van de toegang.
       Zonder deze balk kan het bijwerken van de Access-policies stil mislukken. */
    .statusbalk {
      border-radius: 14px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.88rem;
      line-height: 1.5;
      border: 1px solid;
    }
    .statusbalk.fout { background: #FBEAEA; border-color: #D99; color: #8A1B1B; }
    .statusbalk.goed { background: #EDF7F0; border-color: #A8CBB4; color: #1D6B3F; }
    .statusbalk b { font-weight: 700; }
    .statusbalk ul { margin: 8px 0 0; padding-left: 20px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #2C1A0E; color: white; padding: 10px 22px;
      border-radius: 20px; font-size: 0.85rem; opacity: 0;
      pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    .loading { color: #A07860; font-size: 0.9rem; padding: 12px 0; }
    .section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #A07860; margin-bottom: 14px; }
    #token-screen {
      max-width: 420px; margin: 80px auto; background: #fff;
      border: 1px solid #E8C4A8; border-radius: 14px; padding: 32px;
    }
    #token-screen h2 { margin: 0 0 8px; font-size: 1rem; color: #2C1A0E; }
    #token-screen p { font-size: 0.82rem; color: #A07860; margin: 0 0 16px; }
    #token-input {
      width: 100%; padding: 9px 12px; border: 1px solid #E8C4A8;
      border-radius: 8px; font-size: 0.88rem; font-family: monospace;
      margin-bottom: 12px; outline: none;
    }
    #token-input:focus { border-color: #C0522A; }
  </style>
</head>
<body>

<header>
  <div class="logo">bouwman<span>.tools</span> — Gebruikersbeheer</div>
  <a href="/portal.html" class="back">← Terug naar portal</a>
</header>

<main id="app" style="display:none">

  <div class="statusbalk" id="statusbalk" hidden></div>

  <div class="card" id="users-card">
    <div class="section-title">Huidige gebruikers</div>
    <div id="users-list" class="loading">Laden…</div>
  </div>

  <div class="card" id="form-card">
    <div class="section-title" id="form-title">Nieuwe gebruiker toevoegen</div>

    <label for="email-input">E-mailadres</label>
    <input type="email" id="email-input" placeholder="naam@kantoor.nl" />

    <label>Toegang tot tools</label>

    <label class="all-toggle">
      <input type="checkbox" id="all-check" onchange="toggleAll(this.checked)">
      Toegang tot alle (huidige en toekomstige) tools
    </label>

    <div class="tools-grid" id="tools-grid"></div>

    <div class="form-actions">
      <button class="btn-save" onclick="saveUser()">Opslaan</button>
      <button class="btn-cancel" onclick="resetForm()">Annuleren</button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
  const WORKER = 'https://access-beheer.s-bouwman.workers.dev';

  // De toollijst komt uit tools.json, het register. Stond die lijst hier ook, dan zou een
  // nieuwe tool wel een Access-app kunnen hebben en toch buiten het toegangsbeheer vallen:
  // dat gebeurde op 04-09-2026 bij herziening-btw en de inventarisatiepagina.
  //
  // De sleutel is het bestand, of bij een externe tool de URL. Die waarde staat ook in de
  // opgeslagen rechten per gebruiker, dus hij mag niet veranderen zonder migratie.
  let TOOLS = [];


  async function laadTools() {
    const r = await fetch('tools.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`tools.json gaf ${r.status}`);
    const data = await r.json();
    const rijen = (data.tools || []).filter(t => t.in_beheer === true);
    if (rijen.length === 0) throw new Error('tools.json bevat geen enkele tool met in_beheer');
    // Ook de volgorde van de categorieen komt uit het register, zodat portaal en
    // beheer er niet elk een eigen lijst op nahouden.
    const volgorde = data.categorievolgorde || [];
    const rang = c => {
      const i = volgorde.indexOf(c);
      return i === -1 ? volgorde.length : i;
    };
    TOOLS = rijen
      .map(t => ({ file: t.extern ? t.url : t.bestand, name: t.naam, categorie: t.categorie }))
      .filter(t => t.file)
      .sort((a, b) => rang(a.categorie) - rang(b.categorie) || a.name.localeCompare(b.name, 'nl'));
  }

  let editingEmail = null;

  function api(path, method = 'GET', body) {
    return fetch(WORKER + path, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    }).then(r => r.json());
  }

  function accessLabel(tools) {
    if (tools === 'all') return 'Alle tools';
    if (!tools || tools.length === 0) return 'Geen tools';
    if (tools.length <= 3) return tools.map(f => TOOLS.find(t => t.file === f)?.name || f).join(', ');
    return `${tools.length} tools`;
  }

  async function loadUsers() {
    const list = document.getElementById('users-list');
    const permissions = await api('/admin/users');
    const entries = Object.entries(permissions);
    if (entries.length === 0) {
      list.innerHTML = '<div class="loading">Nog geen gebruikers.</div>';
      return;
    }
    list.innerHTML = entries.map(([email, tools]) => `
      <div class="user-row">
        <div class="user-email">${email}</div>
        <div class="user-access">${accessLabel(tools)}</div>
        <button class="btn-edit" onclick="editUser('${email}')">Bewerken</button>
        <button class="btn-del" onclick="deleteUser('${email}')">Verwijderen</button>
      </div>
    `).join('');
  }

  function buildToolsGrid(selected) {
    const all = selected === 'all';
    document.getElementById('all-check').checked = all;
    const grid = document.getElementById('tools-grid');
    grid.style.opacity = all ? '0.4' : '1';
    grid.style.pointerEvents = all ? 'none' : '';
    grid.innerHTML = TOOLS.map(t => {
      const checked = all || (Array.isArray(selected) && selected.includes(t.file));
      return `
        <label class="tool-check ${checked ? 'checked' : ''}" id="lbl-${btoa(t.file).replace(/=/g,'')}">
          <input type="checkbox" value="${t.file}" ${checked ? 'checked' : ''}
            onchange="this.closest('label').classList.toggle('checked', this.checked)">
          ${t.name}
        </label>`;
    }).join('');
  }

  function toggleAll(checked) {
    const grid = document.getElementById('tools-grid');
    grid.style.opacity = checked ? '0.4' : '1';
    grid.style.pointerEvents = checked ? 'none' : '';
    grid.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.checked = checked;
      cb.closest('label').classList.toggle('checked', checked);
    });
  }

  function getSelectedTools() {
    if (document.getElementById('all-check').checked) return 'all';
    return [...document.querySelectorAll('#tools-grid input:checked')].map(cb => cb.value);
  }

  function editUser(email) {
    editingEmail = email;
    document.getElementById('form-title').textContent = 'Gebruiker bewerken';
    document.getElementById('email-input').value = email;
    document.getElementById('email-input').disabled = true;
    // Fetch current permissions to prefill
    api('/admin/users').then(permissions => {
      buildToolsGrid(permissions[email] ?? 'all');
    });
    document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
  }

  function resetForm() {
    editingEmail = null;
    document.getElementById('form-title').textContent = 'Nieuwe gebruiker toevoegen';
    document.getElementById('email-input').value = '';
    document.getElementById('email-input').disabled = false;
    buildToolsGrid([]);
  }

  async function saveUser() {
    const email = editingEmail || document.getElementById('email-input').value.trim();
    if (!email) { showToast('Voer een e-mailadres in.'); return; }
    const tools = getSelectedTools();
    const btn = document.querySelector('.btn-save');
    btn.textContent = 'Opslaan…';
    btn.disabled = true;
    await api('/admin/upsert', 'POST', { email, tools });
    btn.textContent = 'Opslaan';
    btn.disabled = false;
    resetForm();
    await loadUsers();
    document.getElementById('users-card').scrollIntoView({ behavior: 'smooth' });
    showToast(`${email} opgeslagen.`);
  }

  async function deleteUser(email) {
    if (!confirm(`${email} verwijderen?`)) return;
    await api('/admin/delete', 'POST', { email });
    showToast(`${email} verwijderd.`);
    loadUsers();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Toont of het bijwerken van de Access-policies werkelijk is gelukt. De
  // synchronisatie wordt losgelaten met waitUntil, dus het opslaan zelf kan
  // niets over de uitkomst zeggen; die staat in de KV-opslag. Faalt dit
  // ophalen, dan blijft de balk weg: het is een melding, geen blokkade.
  async function laadStatus() {
    const balk = document.getElementById('statusbalk');
    try {
      const st = await api('/admin/status');
      if (!st || (!st.synchronisatie && !st.controle)) return;

      const regels = [];
      const sync = st.synchronisatie;
      const contr = st.controle;
      let fout = false;
      // Apart van 'fout': het advies om een gebruiker op te slaan helpt alleen bij een
      // policy die achterloopt, en niet bij een Worker die van het account weg is.
      let policyFout = false;

      if (sync) {
        const fouten = sync.fouten || [];
        if (sync.mislukt || fouten.length) {
          fout = true;
          policyFout = true;
          regels.push(`De laatste keer opslaan (${tijd(sync.tijdstip)}) heeft de toegang ` +
            `<b>niet</b> volledig bijgewerkt: ${sync.mislukt} van de tools mislukte.`);
          for (const f of fouten.slice(0, 5)) regels.push(`${f.tool}: ${f.reden}`);
        } else {
          regels.push(`Laatste keer opslaan (${tijd(sync.tijdstip)}): ` +
            `${sync.gelukt} tools bijgewerkt.`);
        }
      }

      if (contr) {
        const afw = contr.afwijkingen || [];
        const hersteld = contr.hersteld || 0;
        if (afw.length) {
          fout = true;
          policyFout = true;
          regels.push(`De dagelijkse controle (${tijd(contr.tijdstip)}) vond ` +
            `<b>${afw.length} afwijking(en)</b> tussen de rechten hier en wat er ` +
            `werkelijk op Cloudflare staat, en kon die niet herstellen.`);
          for (const a of afw.slice(0, 5)) regels.push(`${a.tool}: ${a.reden}`);
        } else if (hersteld) {
          // Geen foutmelding: de controle heeft zijn werk gedaan. Wel tonen, want een
          // afwijking die telkens terugkomt is een signaal op zichzelf.
          regels.push(`Dagelijkse controle (${tijd(contr.tijdstip)}): ` +
            `${hersteld} afwijking(en) gevonden en hersteld, ` +
            `${contr.gecontroleerd} tools nu in orde.`);
        } else {
          regels.push(`Dagelijkse controle (${tijd(contr.tijdstip)}): ` +
            `${contr.gecontroleerd} tools in orde.`);
        }
      }

      // Staan de Workers waar tools van afhangen nog op het account? Een tool kan op
      // live staan, keurig in het portaal hangen en achter Access zitten terwijl de
      // Worker eronder weg is; de policies kloppen dan gewoon. Zo bleef kvk-zoeker op
      // 04-09-2026 stuk zonder dat iemand het merkte.
      const wk = contr && contr.workers;
      if (wk && wk.reden) {
        fout = true;
        regels.push('De controle kon de Workers <b>niet</b> nakijken, en merkt het dus ' +
          'ook niet als er een verdwijnt:');
        regels.push(wk.reden);
      } else if (wk && (wk.ontbreekt || []).length) {
        fout = true;
        regels.push(`<b>${wk.ontbreekt.length} Worker(s) ontbreken op het account.</b> ` +
          'De tools die daarvan afhangen werken niet, ook al staan ze gewoon in het ' +
          'portaal. Terugzetten vraagt meestal ook het secret opnieuw en kan alleen de ' +
          'eigenaar; deze controle doet dat bewust niet zelf.');
        for (const o of wk.ontbreekt) regels.push(`${o.naam}: nodig voor ${o.waarvoor}`);
      } else if (wk) {
        regels.push(`Workers: alle ${wk.verwacht} uit het register staan op het account.`);
        if ((wk.ongebruikt || []).length) {
          regels.push('Geen tool verwijst naar: ' + wk.ongebruikt.join(', ') +
            '. Geen fout, wel iets om te weten.');
        }
      }

      if (policyFout) {
        regels.push('De dagelijkse controle probeert dit zelf te herstellen. Blijft het ' +
          'staan, dan lukt dat niet: sla hieronder een gebruiker op om het meteen opnieuw ' +
          'te laten schrijven, en is het token op de worker de eerste verdachte.');
      }

      balk.className = 'statusbalk ' + (fout ? 'fout' : 'goed');
      balk.innerHTML = regels.length > 1
        ? `${regels[0]}<ul>${regels.slice(1).map(r => `<li>${r}</li>`).join('')}</ul>`
        : regels[0];
      balk.hidden = false;
    } catch (e) {
      console.error('status ophalen mislukt:', e);
    }
  }

  function tijd(iso) {
    if (!iso) return 'onbekend';
    const d = new Date(iso);
    return isNaN(d) ? 'onbekend' : d.toLocaleString('nl-NL');
  }

  // Init. De app verschijnt pas als de toollijst geladen is: met een lege lijst zou het
  // scherm tonen dat een gebruiker nergens recht op heeft, en een opslagactie zou dat
  // vervolgens waarmaken.
  (async () => {
    try {
      await laadTools();
    } catch (e) {
      console.error('toollijst laden mislukt:', e);
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="margin:1rem;padding:1rem;border-left:3px solid #9b2226;background:#fdeded">' +
        '<strong>De toollijst kon niet worden geladen.</strong> Het beheerscherm blijft daarom ' +
        'dicht: met een lege lijst zou opslaan de rechten van een gebruiker wissen. ' +
        'Details staan in de console.</div>');
      return;
    }
    document.getElementById('app').style.display = '';
    buildToolsGrid([]);
    loadUsers();
    laadStatus();
  })();
</script>
</body>
</html>
