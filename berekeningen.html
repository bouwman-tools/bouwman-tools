   Werkbladschrijver. Bouwt een xlsx-bestand op zonder bibliotheek en zonder
   CDN, zodat de pagina zelfstandig blijft en offline werkt.

   DIT BLOK IS GEDEELDE CODE. Het weet niets van de onderwerpen van deze tool en
   is bedoeld om ongewijzigd in een volgende tool te worden overgenomen. Wat een
   volgende tool wél zelf schrijft, staat hieronder in het blok EXPORT: de
   vertaling van zijn eigen velden en uitkomsten naar bladen.

   Een blad is { naam, breedtes, rijen }, waarin rijen een lijst van rijen is en
   elke rij een lijst van cellen. Een cel maak je met celTekst() of celGetal(),
   of laat je maken door uitWeergave() uit de tekst die het scherm toont. Een
   lege plek in een rij mag null zijn.

   Wat een volgende tool aanpast:
   - de vier vaste secties van zijn eerste blad (kop, invoer, uitkomst,
     toelichting en vindplaatsen) - zie exportBladen hieronder als voorbeeld;
   - de tool-identificatie die hij aan uitgangBestandsnaam() meegeeft;
   - niets in dit blok zelf. Moet er hier toch iets bij, dan hoort het bij elke
     tool te passen, want anders loopt de gedeelde code alsnog uiteen.
   ============================================================ */
// WERKBLADSCHRIJVER — BEGIN

/* Een xlsx is een zipbestand met XML erin. De leden gaan er ongecomprimeerd in
   ("stored"), want dan is er geen deflate nodig; de bestanden blijven klein
   genoeg om dat te kunnen missen. */
const CRC_TABEL = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABEL[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipBytes(leden) {
  const enc = new TextEncoder();
  const nu = new Date();
  const zTijd = ((nu.getHours() << 11) | (nu.getMinutes() << 5) | (nu.getSeconds() >> 1)) & 0xFFFF;
  const zDatum = (((nu.getFullYear() - 1980) << 9) | ((nu.getMonth() + 1) << 5) | nu.getDate()) & 0xFFFF;

  const stukken = [];
  const centraal = [];
  let offset = 0;

  for (const lid of leden) {
    const naam = enc.encode(lid.naam);
    const inhoud = enc.encode(lid.tekst);
    const som = crc32(inhoud);

    const kop = new Uint8Array(30 + naam.length);
    const kv = new DataView(kop.buffer);
    kv.setUint32(0, 0x04034b50, true);
    kv.setUint16(4, 20, true);        // benodigde versie
    kv.setUint16(6, 0x0800, true);    // bestandsnaam in UTF-8
    kv.setUint16(8, 0, true);         // opgeslagen, niet gecomprimeerd
    kv.setUint16(10, zTijd, true);
    kv.setUint16(12, zDatum, true);
    kv.setUint32(14, som, true);
    kv.setUint32(18, inhoud.length, true);
    kv.setUint32(22, inhoud.length, true);
    kv.setUint16(26, naam.length, true);
    kop.set(naam, 30);
    stukken.push(kop, inhoud);

    const cd = new Uint8Array(46 + naam.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, zTijd, true);
    cv.setUint16(14, zDatum, true);
    cv.setUint32(16, som, true);
    cv.setUint32(20, inhoud.length, true);
    cv.setUint32(24, inhoud.length, true);
    cv.setUint16(28, naam.length, true);
    cv.setUint32(42, offset, true);
    cd.set(naam, 46);
    centraal.push(cd);

    offset += kop.length + inhoud.length;
  }

  const cdGrootte = centraal.reduce((s, c) => s + c.length, 0);
  const slot = new Uint8Array(22);
  const sv = new DataView(slot.buffer);
  sv.setUint32(0, 0x06054b50, true);
  sv.setUint16(8, leden.length, true);
  sv.setUint16(10, leden.length, true);
  sv.setUint32(12, cdGrootte, true);
  sv.setUint32(16, offset, true);

  const alles = [...stukken, ...centraal, slot];
  const uit = new Uint8Array(alles.reduce((s, d) => s + d.length, 0));
  let p = 0;
  for (const d of alles) { uit.set(d, p); p += d.length; }
  return uit;
}

/* --- Cellen --- */

const FMT_EURO = '"€ "#,##0.00;"€ "-#,##0.00';
const FMT_GETAL = '#,##0.00';

const xmlTekst = s => String(s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const celTekst = (tekst, vet = false) => ({ tekst: tekst ?? '', vet });

/* weergave is de tekst zoals de pagina die toont. Die gaat naar het klembord,
   terwijl het xlsx-bestand het getal met een eigen getalformaat krijgt. Geef
   haar altijd mee: hoe een bedrag eruitziet hoort bij de tool, niet hier. */
const celGetal = (waarde, formaat, vet = false, weergave = null) =>
  ({ getal: waarde, formaat, vet, weergave: weergave === null ? String(waarde) : weergave });

const celNaarTekst = c => !c ? ''
  : (c.weergave !== undefined && c.weergave !== null ? String(c.weergave) : String(c.tekst ?? ''));

const NL_GETAL = /^-?(?:\d{1,3}(?:\.\d{3})+|\d+)(?:,(\d+))?$/;

/* De onderwerpen leveren hun uitkomst als opgemaakte tekst op, want dat is wat
   de pagina toont. Voor Excel wordt die tekst hier terug gelezen naar een getal
   met een bijpassend getalformaat, zodat er in het werkblad mee te rekenen
   valt. Lukt dat niet, dan gaat de tekst ongewijzigd mee. */
function uitWeergave(tekst, vet = false) {
  const oorspronkelijk = String(tekst ?? '').replace(/ /g, ' ').trim();
  let s = oorspronkelijk;
  if (s === '' || s === '—') return celTekst('', vet);

  let formaat = null, deler = 1;
  if (s.indexOf('€') !== -1) { s = s.replace('€', '').trim(); formaat = FMT_EURO; }
  else if (s.endsWith('%')) { s = s.slice(0, -1).trim(); formaat = 'procent'; deler = 100; }

  let teken = 1;
  if (s.startsWith('-')) { teken = -1; s = s.slice(1).trim(); }

  const m = s.match(NL_GETAL);
  if (!m) return celTekst(oorspronkelijk, vet);
  const decimalen = m[1] ? m[1].length : 0;
  /* Stond er geen scheidingsteken in de tekst, dan komt het er ook in
     Excel niet bij: een termijnnummer of een jaartal blijft zo leesbaar. */
  const geheel = s.indexOf('.') === -1 ? '0' : '#,##0';
  const waarde = teken * Number(s.replace(/\./g, '').replace(',', '.')) / deler;
  if (!isFinite(waarde)) return celTekst(oorspronkelijk, vet);

  if (formaat === 'procent') {
    formaat = geheel + (decimalen ? '.' + '0'.repeat(decimalen) : '') + '%';
  } else if (formaat === null) {
    formaat = geheel + (decimalen ? '.' + '0'.repeat(decimalen) : '');
  }
  return celGetal(waarde, formaat, vet, oorspronkelijk);
}

/* --- Stijlen, bladen en het xlsx-bestand --- */

/* Een getalformaat wordt pas aangemaakt wanneer een cel erom vraagt, zodat een
   percentage met vier decimalen er ook vier houdt. */
function stijlenRegister() {
  const formaten = new Map();
  const index = new Map([['|0', 0], ['|1', 1]]);
  const xfs = [{ fmt: 0, vet: false }, { fmt: 0, vet: true }];
  return {
    voor(formaat, vet) {
      const code = formaat || '';
      const sleutel = code + '|' + (vet ? 1 : 0);
      if (index.has(sleutel)) return index.get(sleutel);
      if (code && !formaten.has(code)) formaten.set(code, 164 + formaten.size);
      const i = xfs.length;
      xfs.push({ fmt: code ? formaten.get(code) : 0, vet: !!vet });
      index.set(sleutel, i);
      return i;
    },
    xml() {
      const nf = [...formaten.entries()]
        .map(([code, id]) => '<numFmt numFmtId="' + id + '" formatCode="' +
          xmlTekst(code) + '"/>').join('');
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
        (formaten.size ? '<numFmts count="' + formaten.size + '">' + nf + '</numFmts>' : '') +
        '<fonts count="2">' +
        '<font><sz val="11"/><name val="Calibri"/></font>' +
        '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>' +
        '<fills count="2"><fill><patternFill patternType="none"/></fill>' +
        '<fill><patternFill patternType="gray125"/></fill></fills>' +
        '<borders count="1"><border/></borders>' +
        '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
        '<cellXfs count="' + xfs.length + '">' +
        xfs.map(x => '<xf numFmtId="' + x.fmt + '" fontId="' + (x.vet ? 1 : 0) + '"' +
          ' fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/>').join('') +
        '</cellXfs>' +
        '<cellStyles count="1"><cellStyle name="Standaard" xfId="0" builtinId="0"/></cellStyles>' +
        '</styleSheet>';
    }
  };
}

function kolomLetter(n) {
  let s = '', k = n + 1;
  while (k > 0) { const r = (k - 1) % 26; s = String.fromCharCode(65 + r) + s; k = (k - 1 - r) / 26; }
  return s;
}

function bladXml(blad, stijlen) {
  const d = ['<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'];
  if (blad.breedtes && blad.breedtes.length) {
    d.push('<cols>');
    blad.breedtes.forEach((b, i) => d.push('<col min="' + (i + 1) + '" max="' + (i + 1) +
      '" width="' + b + '" customWidth="1"/>'));
    d.push('</cols>');
  }
  d.push('<sheetData>');
  blad.rijen.forEach((rij, ri) => {
    d.push('<row r="' + (ri + 1) + '">');
    rij.forEach((cel, ki) => {
      if (!cel) return;
      const ref = kolomLetter(ki) + (ri + 1);
      if (typeof cel.getal === 'number' && isFinite(cel.getal)) {
        d.push('<c r="' + ref + '" s="' + stijlen.voor(cel.formaat, cel.vet) + '">' +
          '<v>' + cel.getal + '</v></c>');
      } else if (cel.tekst !== undefined && cel.tekst !== '') {
        d.push('<c r="' + ref + '" s="' + stijlen.voor('', cel.vet) + '" t="inlineStr">' +
          '<is><t xml:space="preserve">' + xmlTekst(cel.tekst) + '</t></is></c>');
      }
    });
    d.push('</row>');
  });
  d.push('</sheetData></worksheet>');
  return d.join('');
}

function xlsxBytes(bladen) {
  const stijlen = stijlenRegister();
  const bladXmls = bladen.map(b => bladXml(b, stijlen));
  const rid = i => 'rId' + (i + 1);
  const OFF = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const SS = 'application/vnd.openxmlformats-officedocument.spreadsheetml';

  const leden = [
    { naam: '[Content_Types].xml',
      tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="' + SS + '.sheet.main+xml"/>' +
        bladen.map((b, i) => '<Override PartName="/xl/worksheets/sheet' + (i + 1) +
          '.xml" ContentType="' + SS + '.worksheet+xml"/>').join('') +
        '<Override PartName="/xl/styles.xml" ContentType="' + SS + '.styles+xml"/>' +
        '</Types>' },
    { naam: '_rels/.rels',
      tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="' + OFF + '/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>' },
    { naam: 'xl/workbook.xml',
      tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"' +
        ' xmlns:r="' + OFF + '"><sheets>' +
        bladen.map((b, i) => '<sheet name="' + xmlTekst(b.naam) + '" sheetId="' + (i + 1) +
          '" r:id="' + rid(i) + '"/>').join('') +
        '</sheets></workbook>' },
    { naam: 'xl/_rels/workbook.xml.rels',
      tekst: '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        bladen.map((b, i) => '<Relationship Id="' + rid(i) + '" Type="' + OFF +
          '/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>').join('') +
        '<Relationship Id="' + rid(bladen.length) + '" Type="' + OFF +
        '/styles" Target="styles.xml"/></Relationships>' }
  ];
  bladXmls.forEach((x, i) => leden.push({ naam: 'xl/worksheets/sheet' + (i + 1) + '.xml', tekst: x }));
  leden.push({ naam: 'xl/styles.xml', tekst: stijlen.xml() });
  return zipBytes(leden);
}

/* Voor het klembord dezelfde inhoud, met tabs tussen de kolommen. Zo plakt het
   rechtstreeks in een openstaand werkblad. */
function bladenNaarTekst(bladen) {
  const uit = [];
  bladen.forEach((b, i) => {
    if (i > 0) uit.push('', b.naam);
    for (const rij of b.rijen) uit.push(rij.map(celNaarTekst).join('\t').replace(/\t+$/, ''));
  });
  return uit.join('\r\n');
}

/* --- Bestandsnamen, opslaan en klembord --- */

const isoDatum = (d = new Date()) => {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
};

/* Het kenmerk komt van de gebruiker en gaat in een bestandsnaam. Alles wat een
   pad kan breken gaat eruit; een leeg kenmerk valt terug op "dossier". */
function slugKenmerk(ruw) {
  const schoon = String(ruw ?? '')
    .replace(/[^\wÀ-ɏ -]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 60);
  return schoon ? schoon.replace(/ /g, '-') : 'dossier';
}

const uitgangBestandsnaam = (toolId, kenmerk, extensie) =>
  toolId + '-' + slugKenmerk(kenmerk) + '-' + isoDatum() + '.' + extensie;

const MIME_XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const MIME_JSON = 'application/json';

function bewaarBestand(inhoud, naam, type) {
  const blob = new Blob([inhoud], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = naam;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* Het klembord van de browser is niet in elke omgeving toegankelijk; dan volgt
   de oude weg via een verborgen tekstvak. */
function naarKlembord(tekst) {
  const terugval = () => {
    const ta = document.createElement('textarea');
    ta.value = tekst; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, tekst.length);
    const gelukt = document.execCommand('copy');
    ta.remove();
    return gelukt ? Promise.resolve()
      : Promise.reject(new Error('het klembord is niet toegankelijk'));
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(tekst).catch(terugval);
  }
  return terugval();
}

// WERKBLADSCHRIJVER — EINDE

/* ============================================================
   Export naar Excel en naar het klembord. Deze laag rekent niet: ze schrijft op
   wat de kern al heeft opgeleverd en zet dat om in de bladen die de
   werkbladschrijver hierboven verwacht. Dit is het stuk dat een volgende tool
   voor zijn eigen velden en uitkomsten opnieuw schrijft.
   ============================================================ */
// EXPORT — BEGIN

const TOOLNAAM = 'Berekeningen';
const TOOL_ID = 'berekeningen';

const meldingTekst = m => m.tekst +
  (m.bedrag === undefined ? '' : euro(m.bedrag)) + (m.staart || '');

const BRONREGEL = 'De vindplaats van elke jaargebonden waarde staat in BRONNEN.md ' +
  'en in het commentaar bij de waarde in de rekenkern van dit bestand.';

/* Het kenmerk van de gebruiker. Het staat op één plek in de pagina en wordt
   daar gelezen, zodat de afdruk, het werkblad en het dossierbestand hetzelfde
   kenmerk dragen. */
function huidigKenmerk() {
  const veld = document.getElementById('kenmerk');
  return veld && veld.value ? String(veld.value).trim() : '';
}

/* Een invoerveld naar een cel. De weergave is precies wat het invoervak toont,
   zodat het klembord en het scherm gelijk blijven. */
function celInvoer(veld, waarde) {
  if (veld.t === 'vinkje') return celTekst(waarde ? 'ja' : 'nee');
  if (veld.t === 'keuze') {
    const opt = veld.opties.find(x => String(x.w) === String(waarde));
    return celTekst(opt ? opt.l : String(waarde ?? ''));
  }
  if (veld.t === 'datum') return celTekst(waarde || '');
  if (waarde === null || waarde === undefined || !isFinite(waarde)) return celTekst('');
  if (veld.t === 'procent') return celGetal(waarde, '0.00##%', false, procent(waarde, 2));
  if (veld.t === 'geheel') {
    return Number.isInteger(waarde)
      ? celGetal(waarde, '0', false, String(waarde))
      : celGetal(waarde, FMT_GETAL, false, getal(waarde));
  }
  if (veld.t === 'euro') return celGetal(waarde, FMT_EURO, false, euro(waarde));
  return celGetal(waarde, FMT_GETAL, false, getal(waarde));
}

/* De vier vaste secties van het eerste blad: kop, invoer, uitkomst, toelichting
   en vindplaatsen. Een reeksinvoer en een uitwerking krijgen elk een eigen blad.
   Dit is de indeling die elke tool aanhoudt. */
function exportBladen(o, r) {
  const bladen = [];
  const rijen = [];

  rijen.push([celTekst(TOOLNAAM + ': ' + o.titel, true)]);
  if (o.grondslag) rijen.push([celTekst(o.grondslag)]);
  rijen.push([celTekst('Kenmerk'), celTekst(huidigKenmerk())]);
  rijen.push([celTekst('Geëxporteerd op'),
    celTekst(new Date().toLocaleString('nl-NL', { dateStyle: 'short', timeStyle: 'short' }))]);
  rijen.push([celTekst('Versie van de tool'), celTekst(VERSIE)]);
  rijen.push([]);

  if (o.velden.length) {
    rijen.push([celTekst('Invoer', true)]);
    for (const v of o.velden) rijen.push([celTekst(v.l), celInvoer(v, invoer[o.id][v.k])]);
    rijen.push([]);
  }

  rijen.push([celTekst('Berekening', true)]);
  for (const regel of o.uit(r)) {
    rijen.push([celTekst(regel[0], !!regel[2]), uitWeergave(regel[1], !!regel[2])]);
  }

  const meldingen = o.meldingen ? o.meldingen(r) : (r.meldingen || []);
  if (meldingen.length) {
    rijen.push([]);
    rijen.push([celTekst('Meldingen', true)]);
    for (const m of meldingen) rijen.push([celTekst(meldingTekst(m))]);
  }

  rijen.push([]);
  rijen.push([celTekst('Toelichting en vindplaatsen', true)]);
  for (const bron of o.vindplaatsen) rijen.push([celTekst(bron)]);
  rijen.push([celTekst(BRONREGEL)]);
  rijen.push([]);
  rijen.push([celTekst('Afbakening', true)]);
  rijen.push([celTekst(o.afbakening)]);
  bladen.push({ naam: 'Berekening', breedtes: [54, 22], rijen });

  /* De reeksinvoer gaat mee zonder de lege regels: alleen wat is ingevuld. */
  if (o.reeks) {
    const kol = o.reeks.kolommen;
    const rijenR = [[celTekst('Maand', true),
      ...kol.map(k => celTekst(k.charAt(0).toUpperCase() + k.slice(1), true))]];
    reeksen[o.id].forEach((cel, n) => {
      const waarden = kol.length === 1 ? [cel] : kol.map(k => (cel ? cel[k] : null));
      if (!waarden.some(w => typeof w === 'number' && isFinite(w))) return;
      const label = o.reeks.beginLabel + n;
      rijenR.push([celTekst(label === 0 ? 'start' : String(label)),
        ...waarden.map(w => (typeof w === 'number' && isFinite(w))
          ? celGetal(w, FMT_EURO, false, euro(w)) : celTekst(''))]);
    });
    if (rijenR.length > 1) {
      bladen.push({ naam: 'Invoerreeks', breedtes: [10, ...kol.map(() => 18)], rijen: rijenR });
    }
  }

  const schema = o.schema ? o.schema(r) : null;
  if (schema) {
    const rijenS = [schema.koppen.map(k => celTekst(k, true))];
    for (const rij of schema.rijen) rijenS.push(rij.map(c => uitWeergave(c)));
    bladen.push({ naam: 'Uitwerking', breedtes: schema.koppen.map(() => 18), rijen: rijenS });
  }

  return bladen;
}

function exportKnoppen(o, r) {
  const kn = document.createElement('div');
  kn.className = 'knoppen noprint';
  const status = document.createElement('span');
  status.className = 'exportstatus';
  status.setAttribute('aria-live', 'polite');

  const bExcel = document.createElement('button');
  bExcel.type = 'button'; bExcel.className = 'actie';
  bExcel.textContent = 'Exporteer naar Excel';
  bExcel.addEventListener('click', () => {
    try {
      bewaarBestand(xlsxBytes(exportBladen(o, r)),
        uitgangBestandsnaam(TOOL_ID, huidigKenmerk(), 'xlsx'), MIME_XLSX);
      status.textContent = 'Het bestand is aangemaakt.';
    } catch (e) {
      status.textContent = 'De export is niet gelukt: ' + e.message;
    }
  });

  const bKlem = document.createElement('button');
  bKlem.type = 'button'; bKlem.className = 'actie';
  bKlem.textContent = 'Kopieer naar klembord';
  bKlem.addEventListener('click', () => {
    let tekst;
    try { tekst = bladenNaarTekst(exportBladen(o, r)); }
    catch (e) { status.textContent = 'De export is niet gelukt: ' + e.message; return; }
    naarKlembord(tekst).then(
      () => { status.textContent = 'Gekopieerd. Plakken kan nu in een werkblad.'; },
      e => { status.textContent = 'Kopiëren is niet gelukt: ' + e.message; }
    );
  });

  kn.appendChild(bExcel); kn.appendChild(bKlem); kn.appendChild(status);
  return kn;
}

// EXPORT — EINDE

/* ============================================================
   Dossierbestand. Zodat een casus in de klantmap kan staan en later weer geopend
   kan worden. De tool bewaart zelf niets: opslaan is een handeling van de
   gebruiker naar een plek die hij kiest, en er gaat niets naar buiten. Ook geen
   localStorage - dat zit vast aan één browser op één apparaat en is voor een
   collega onvindbaar.

   In het bestand staat alleen invoer, nooit een uitkomst: die wordt bij het
   openen opnieuw berekend, met de dan geldende tool.

   Een dossier wordt gelezen als GEGEVEN, nooit als opdracht. Alleen bekende
   onderwerpen en velden worden gebruikt, elke waarde wordt op vorm getoetst, en
   een bestand van een andere tool of van een nieuwere formaatversie wordt
   geweigerd met een melding in plaats van half ingelezen. Een ontbrekende waarde
   valt terug op de standaardwaarde van de tool en wordt genoemd, want een oud
   dossier dat stil met een ander uitgangspunt opent is erger dan een dossier dat
   niet opent.
   ============================================================ */
// DOSSIERBESTAND — BEGIN

const DOSSIER_FORMAATVERSIE = 1;
const DOSSIER_MAX_KENMERK = 80;

/* De waarde zoals zij in het invoervak staat, dus een percentage als 10 en niet
   als 0,10. Daardoor is het bestand met het oog te lezen en loopt het via
   leesVeld exact terug naar dezelfde stand. */
function dossierStand() {
  const onderwerpen = {};
  for (const o of ONDERWERPEN) {
    const post = { velden: {} };
    for (const v of o.velden) post.velden[v.k] = schrijfVeld(v, invoer[o.id][v.k]);
    if (o.reeks) {
      /* Alleen de ingevulde regels, met het regelnummer als sleutel. Een reeks
         van honderdtwintig lege regels hoort niet in een dossierbestand. */
      const reeks = {};
      reeksen[o.id].forEach((cel, n) => {
        if (o.reeks.kolommen.length === 1) {
          if (typeof cel === 'number' && isFinite(cel)) reeks[n] = cel;
          return;
        }
        const rij = {};
        for (const k of o.reeks.kolommen) {
          const w = cel ? cel[k] : null;
          if (typeof w === 'number' && isFinite(w)) rij[k] = w;
        }
        if (Object.keys(rij).length) reeks[n] = rij;
      });
      post.reeks = reeks;
    }
    onderwerpen[o.id] = post;
  }
  return {
    tool: TOOL_ID,
    formaatversie: DOSSIER_FORMAATVERSIE,
    toolversie: VERSIE,
    opgeslagen: isoDatum(),
    kenmerk: huidigKenmerk().slice(0, DOSSIER_MAX_KENMERK),
    onderwerp: huidig,
    onderwerpen
  };
}

const maakDossierTekst = () => JSON.stringify(dossierStand(), null, 2);

/* Toetst één waarde op de vorm die het veld verlangt. Geeft undefined terug
   zodra de waarde niet deugt; de lezer behandelt dat als ontbrekend en meldt
   het, in plaats van iets aan te nemen. */
function dossierWaarde(veld, ruw) {
  if (ruw === undefined || ruw === null) return undefined;
  if (veld.t === 'vinkje') return typeof ruw === 'boolean' ? ruw : undefined;
  if (veld.t === 'keuze') {
    return veld.opties.some(x => String(x.w) === String(ruw)) ? ruw : undefined;
  }
  if (veld.t === 'datum') {
    if (ruw === '') return '';
    return (typeof ruw === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(ruw)) ? ruw : undefined;
  }
  if (ruw === '') return '';
  return (typeof ruw === 'number' && isFinite(ruw)) ? ruw : undefined;
}

/**
 * Leest de tekst van een dossierbestand.
 * @returns {ok:false, fouten:[...]} of {ok:true, dossier:<stand>, ontbrekend:[...]}
 */
function leesDossier(tekst) {
  let rauw;
  try { rauw = JSON.parse(tekst); }
  catch (e) {
    return { ok: false, fouten: ['Dit bestand bevat geen geldige JSON en is dus geen dossier van deze tool.'] };
  }
  if (!rauw || typeof rauw !== 'object' || Array.isArray(rauw)) {
    return { ok: false, fouten: ['Dit bestand heeft niet de vorm van een dossier.'] };
  }
  if (rauw.tool !== TOOL_ID) {
    return { ok: false, fouten: ['Dit dossier hoort niet bij de tool ' + TOOLNAAM + '.'] };
  }
  if (typeof rauw.formaatversie !== 'number' || !isFinite(rauw.formaatversie)) {
    return { ok: false, fouten: ['Dit dossier vermeldt geen geldige formaatversie.'] };
  }
  if (rauw.formaatversie > DOSSIER_FORMAATVERSIE) {
    return { ok: false, fouten: ['Dit dossier is gemaakt met een nieuwere versie van de tool ' +
      '(formaat ' + rauw.formaatversie + ', deze tool kent ' + DOSSIER_FORMAATVERSIE + ').'] };
  }
  const bron = (rauw.onderwerpen && typeof rauw.onderwerpen === 'object') ? rauw.onderwerpen : {};

  const ontbrekend = [];
  const velden = {};
  const nieuweReeksen = {};
  for (const o of ONDERWERPEN) {
    const post = (bron[o.id] && typeof bron[o.id] === 'object') ? bron[o.id] : null;
    const bronVelden = (post && post.velden && typeof post.velden === 'object') ? post.velden : {};
    velden[o.id] = {};
    for (const v of o.velden) {
      const w = dossierWaarde(v, bronVelden[v.k]);
      if (w === undefined) ontbrekend.push(o.naam + ': ' + v.l);
      else velden[o.id][v.k] = w;
    }
    if (o.reeks) {
      const bronReeks = (post && post.reeks && typeof post.reeks === 'object') ? post.reeks : {};
      nieuweReeksen[o.id] = legeReeks(o);
      for (const sleutel of Object.keys(bronReeks)) {
        const n = Number(sleutel);
        if (!Number.isInteger(n) || n < 0 || n >= o.reeks.aantal) continue;
        const cel = bronReeks[sleutel];
        if (o.reeks.kolommen.length === 1) {
          if (typeof cel === 'number' && isFinite(cel)) nieuweReeksen[o.id][n] = cel;
          continue;
        }
        if (!cel || typeof cel !== 'object') continue;
        for (const k of o.reeks.kolommen) {
          if (typeof cel[k] === 'number' && isFinite(cel[k])) nieuweReeksen[o.id][n][k] = cel[k];
        }
      }
    }
  }

  const gekozen = ONDERWERPEN.some(o => o.id === rauw.onderwerp) ? rauw.onderwerp : null;
  return {
    ok: true,
    ontbrekend,
    dossier: {
      kenmerk: typeof rauw.kenmerk === 'string' ? rauw.kenmerk.slice(0, DOSSIER_MAX_KENMERK) : '',
      onderwerp: gekozen,
      velden,
      reeksen: nieuweReeksen
    }
  };
}

/* Zet de gelezen stand in de tool. Wat in het dossier ontbrak blijft op de
   standaardwaarde staan; de lezer heeft dat al gemeld. */
function zetDossier(d) {
  for (const o of ONDERWERPEN) {
    for (const v of o.velden) {
      if (Object.prototype.hasOwnProperty.call(d.velden[o.id], v.k)) {
        invoer[o.id][v.k] = leesVeld(v, d.velden[o.id][v.k]);
      }
    }
    if (o.reeks && d.reeksen[o.id]) reeksen[o.id] = d.reeksen[o.id];
  }
  const veld = document.getElementById('kenmerk');
  if (veld) veld.value = d.kenmerk;
  if (d.onderwerp) huidig = d.onderwerp;
}

// DOSSIERBESTAND — EINDE

function toon() {
  const o = ONDERWERPEN.find(x => x.id === huidig);
  const main = document.getElementById('main');
  main.textContent = '';

  const h = document.createElement('h2'); h.textContent = o.titel; main.appendChild(h);
  const g = document.createElement('p'); g.className = 'grondslag';
  g.textContent = o.grondslag; main.appendChild(g);

  /* Invoer */
  if (o.velden.length) {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = 'Invoer'; fs.appendChild(lg);
    for (const v of o.velden) {
      const rij = document.createElement('div');
      rij.className = 'veld' + (v.t === 'vinkje' ? ' vinkje' : '');
      const lab = document.createElement('label');
      lab.htmlFor = o.id + '-' + v.k;
      lab.appendChild(document.createTextNode(v.l));
      if (v.h) { const hint = document.createElement('span');
        hint.className = 'hint'; hint.textContent = v.h; lab.appendChild(hint); }

      let inv;
      if (v.t === 'keuze') {
        inv = document.createElement('select');
        for (const opt of v.opties) {
          const oe = document.createElement('option');
          oe.value = opt.w; oe.textContent = opt.l; inv.appendChild(oe);
        }
      } else {
        inv = document.createElement('input');
        inv.type = v.t === 'vinkje' ? 'checkbox' : (v.t === 'datum' ? 'date' : 'number');
        if (v.t === 'geheel') inv.step = '1';
        else if (v.t === 'procent') inv.step = '0.01';
        else if (v.t !== 'datum' && v.t !== 'vinkje') inv.step = 'any';
      }
      inv.id = o.id + '-' + v.k;
      const waarde = schrijfVeld(v, invoer[o.id][v.k]);
      if (v.t === 'vinkje') inv.checked = waarde; else inv.value = waarde;
      inv.addEventListener('input', () => {
        invoer[o.id][v.k] = leesVeld(v, v.t === 'vinkje' ? inv.checked : inv.value);
        rekenEnToon(o);
      });
      inv.addEventListener('change', () => {
        invoer[o.id][v.k] = leesVeld(v, v.t === 'vinkje' ? inv.checked : inv.value);
        rekenEnToon(o);
      });

      if (v.t === 'vinkje') { rij.appendChild(inv); rij.appendChild(lab); }
      else { rij.appendChild(lab); rij.appendChild(inv); }
      fs.appendChild(rij);
    }
    main.appendChild(fs);
  }

  /* Reeksinvoer */
  if (o.reeks) {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend'); lg.textContent = o.reeks.l; fs.appendChild(lg);
    const wrap = document.createElement('div'); wrap.className = 'reeks-wrap';
    const tb = document.createElement('table'); tb.className = 'reeks';
    const thead = document.createElement('thead'); const trh = document.createElement('tr');
    const th0 = document.createElement('th'); th0.textContent = 'Maand'; trh.appendChild(th0);
    for (const k of o.reeks.kolommen) {
      const th = document.createElement('th');
      th.textContent = k.charAt(0).toUpperCase() + k.slice(1); trh.appendChild(th);
    }
    thead.appendChild(trh); tb.appendChild(thead);
    const tbody = document.createElement('tbody');
    /* Een regel zonder enige waarde krijgt de klasse "leeg". Op het scherm is dat
       niets, op de afdruk valt de regel eraf: honderdtwintig lege invoervakken
       zijn geen dossierstuk. */
    const merkLeeg = (tr, n) => {
      const cel = reeksen[o.id][n];
      const waarden = o.reeks.kolommen.length === 1 ? [cel] : o.reeks.kolommen.map(k => cel ? cel[k] : null);
      tr.className = waarden.some(w => typeof w === 'number' && isFinite(w)) ? '' : 'leeg';
    };
    for (let n = 0; n < o.reeks.aantal; n++) {
      const tr = document.createElement('tr');
      const td0 = document.createElement('td');
      const label = o.reeks.beginLabel + n;
      td0.textContent = label === 0 ? 'start' : label;
      tr.appendChild(td0);
      for (const k of o.reeks.kolommen) {
        const td = document.createElement('td');
        const inp = document.createElement('input');
        inp.type = 'number'; inp.step = 'any';
        const cel = reeksen[o.id][n];
        const huidigeWaarde = o.reeks.kolommen.length === 1 ? cel : (cel ? cel[k] : null);
        inp.value = huidigeWaarde ?? '';
        inp.addEventListener('input', () => {
          const w = inp.value === '' ? null : Number(inp.value);
          if (o.reeks.kolommen.length === 1) reeksen[o.id][n] = w;
          else {
            if (!reeksen[o.id][n]) reeksen[o.id][n] = {};
            reeksen[o.id][n][k] = w;
          }
          merkLeeg(tr, n);
          rekenEnToon(o);
        });
        td.appendChild(inp); tr.appendChild(td);
      }
      merkLeeg(tr, n);
      tbody.appendChild(tr);
    }
    tb.appendChild(tbody); wrap.appendChild(tb); fs.appendChild(wrap);

    const kn = document.createElement('div'); kn.className = 'knoppen noprint';
    const leeg = document.createElement('button');
    leeg.type = 'button'; leeg.className = 'actie'; leeg.textContent = 'Reeks leegmaken';
    leeg.addEventListener('click', () => {
      reeksen[o.id] = legeReeks(o);
      toon();
    });
    kn.appendChild(leeg); fs.appendChild(kn);
    main.appendChild(fs);
  }

  const uitVak = document.createElement('div'); uitVak.id = 'uitvak';
  main.appendChild(uitVak);
  rekenEnToon(o);
}

function rekenEnToon(o) {
  const vak = document.getElementById('uitvak');
  if (!vak) return;
  vak.textContent = '';

  const i = { ...invoer[o.id] };
  if (o.reeks) {
    i[o.reeks.k] = o.reeks.kolommen.length === 1
      ? reeksen[o.id].map(x => x || 0)
      : reeksen[o.id].map(x => x || {});
  }

  let r;
  try { r = o.reken(i); }
  catch (e) { r = { fout: 'De berekening kon niet worden uitgevoerd: ' + e.message }; }

  const fs = document.createElement('fieldset');
  const lg = document.createElement('legend'); lg.textContent = 'Berekening'; fs.appendChild(lg);

  if (r && r.fout) {
    const m = document.createElement('p'); m.className = 'melding fout'; m.textContent = r.fout;
    fs.appendChild(m); vak.appendChild(fs); return;
  }

  const tb = document.createElement('table'); tb.className = 'uit';
  for (const regel of o.uit(r)) {
    const tr = document.createElement('tr');
    if (regel[2]) tr.className = 'hoofd';
    const td1 = document.createElement('td'); td1.textContent = regel[0];
    const td2 = document.createElement('td'); td2.className = 'w'; td2.textContent = regel[1];
    tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
  }
  fs.appendChild(tb);

  const meldingen = o.meldingen ? o.meldingen(r) : (r.meldingen || []);
  for (const m of meldingen) {
    const p = document.createElement('p');
    p.className = 'melding ' + (m.soort === 'fout' ? 'fout' : m.soort === 'info' ? 'info' : 'let');
    p.textContent = meldingTekst(m);
    fs.appendChild(p);
  }
  vak.appendChild(fs);

  const schema = o.schema ? o.schema(r) : null;
  if (schema) {
    const fs2 = document.createElement('fieldset');
    const lg2 = document.createElement('legend'); lg2.textContent = 'Uitwerking'; fs2.appendChild(lg2);
    const wrap = document.createElement('div'); wrap.className = 'schema-wrap';
    const tb2 = document.createElement('table'); tb2.className = 'schema';
    const thead = document.createElement('thead'); const trh = document.createElement('tr');
    for (const k of schema.koppen) {
      const th = document.createElement('th'); th.textContent = k; trh.appendChild(th);
    }
    thead.appendChild(trh); tb2.appendChild(thead);
    const tbody = document.createElement('tbody');
    for (const rij of schema.rijen) {
      const tr = document.createElement('tr');
      for (const c of rij) { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }
      tbody.appendChild(tr);
    }
    tb2.appendChild(tbody); wrap.appendChild(tb2); fs2.appendChild(wrap);
    fs2.style.padding = '16px 18px';
    vak.appendChild(fs2);
  }

  vak.appendChild(exportKnoppen(o, r));
  vak.appendChild(toelichtingVak(o));
}

/* De vindplaatsen en de afbakening van dit onderwerp. Zij staan op het scherm en
   gaan daarmee vanzelf mee op de afdruk; er is geen tweede opbouw. */
function toelichtingVak(o) {
  const fs = document.createElement('fieldset');
  fs.className = 'toelichting';
  const lg = document.createElement('legend');
  lg.textContent = 'Toelichting en vindplaatsen'; fs.appendChild(lg);

  const ul = document.createElement('ul');
  for (const bron of o.vindplaatsen) {
    const li = document.createElement('li'); li.textContent = bron; ul.appendChild(li);
  }
  fs.appendChild(ul);

  const kop = document.createElement('h3'); kop.textContent = 'Afbakening';
  fs.appendChild(kop);
  const p = document.createElement('p'); p.textContent = o.afbakening;
  fs.appendChild(p);

  const bron = document.createElement('p'); bron.className = 'bron';
  bron.textContent = BRONREGEL;
  fs.appendChild(bron);
  return fs;
}

/* ============================================================
   De dossierbalk: kenmerk, datum, afdrukken en het dossierbestand.
   ============================================================ */

function dossierMelding(tekst, soort) {
  const m = document.getElementById('dossier-melding');
  if (!m) return;
  m.textContent = tekst;
  m.className = 'dossier-melding noprint' + (soort ? ' ' + soort : '');
}

/* De datum op de afdruk is de dag waarop wordt afgedrukt, niet de dag waarop de
   pagina toevallig is geopend. Daarom ook vlak voor het afdrukken opnieuw. */
function zetAfdrukdatum() {
  const veld = document.getElementById('afdrukdatum');
  if (veld) veld.textContent = new Date().toLocaleDateString('nl-NL', { dateStyle: 'long' });
}

function dossierOpslaan() {
  const naam = uitgangBestandsnaam(TOOL_ID, huidigKenmerk(), 'json');
  bewaarBestand(maakDossierTekst(), naam, MIME_JSON);
  dossierMelding('Opgeslagen als ' + naam + '. Zet het bestand in de klantmap, dan gaat ' +
    'het mee in de back-up en kan een collega het openen.', 'goed');
}

function dossierGelezen(tekst) {
  const uit = leesDossier(tekst);
  if (!uit.ok) { dossierMelding(uit.fouten.join(' '), 'fout'); return false; }
  zetDossier(uit.dossier);
  bouwNavigatie();
  toon();
  zetAfdrukdatum();
  if (uit.ontbrekend.length) {
    const eerste = uit.ontbrekend.slice(0, 5).join('; ');
    const rest = uit.ontbrekend.length > 5
      ? ' en ' + (uit.ontbrekend.length - 5) + ' andere' : '';
    dossierMelding('Dossier geopend, maar er ontbraken ' + uit.ontbrekend.length +
      ' waarden: ' + eerste + rest + '. Die staan nu op de standaardwaarde van deze ' +
      'versie van de tool; controleer ze voordat u de uitkomst gebruikt.', 'fout');
  } else {
    dossierMelding('Dossier geopend' + (uit.dossier.kenmerk ? ' (' + uit.dossier.kenmerk + ')' : '') +
      '. De uitkomst is opnieuw berekend met de nu geldende tool.', 'goed');
  }
  return true;
}

function dossierOpenen(bestand) {
  if (!bestand) return;
  const lezer = new FileReader();
  lezer.onerror = () => dossierMelding('Het bestand kon niet worden gelezen.', 'fout');
  lezer.onload = () => dossierGelezen(String(lezer.result));
  lezer.readAsText(bestand);
}

function bouwDossierbalk() {
  const knop = (id, doen) => {
    const b = document.getElementById(id);
    if (b) b.addEventListener('click', doen);
  };
  knop('afdrukken', () => { zetAfdrukdatum(); window.print(); });
  knop('dossier-opslaan', dossierOpslaan);
  knop('dossier-openen', () => {
    const kiezer = document.getElementById('dossier-bestand');
    if (kiezer) kiezer.click();
  });
  const kiezer = document.getElementById('dossier-bestand');
  if (kiezer) {
    kiezer.addEventListener('change', ev => {
      const bestanden = ev && ev.target && ev.target.files;
      if (bestanden && bestanden[0]) dossierOpenen(bestanden[0]);
      /* Leeggooien, anders opent hetzelfde bestand een tweede keer niet. */
      ev.target.value = '';
    });
  }
  /* Ook bij Ctrl+P, want dan komt er geen klik op de afdrukknop. */
  if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('beforeprint', zetAfdrukdatum);
  }
  zetAfdrukdatum();
}

bouwDossierbalk();
bouwNavigatie();
toon();
</script>
